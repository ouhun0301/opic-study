"photo","set":1,"number":7,"topic":"국내여행","q":"Describe the most memorable experience you have had while on a trip. When was it, and where were you? What happened? Why was it so unforgettable? Describe the experience in detail.","qko":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","title":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q07"},{"id":"H1_08","source":"photo","set":1,"number":8,"topic":"은행","q":"Tell me about banks in your country. Describe their locations, designs, and operating hours. Give as many details about them as possible.","qko":"국내 은행의 위치, 디자인, 운영 시간을 자세히 설명하세요.","title":"국내 은행의 위치, 디자인, 운영 시간을 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q08"},{"id":"H1_09","source":"photo","set":1,"number":9,"topic":"은행","q":"Describe the last banking experience you had. When and where did it happen? What bank did it involve? How helpful were the bank employees, and did you achieve what you went to the bank for? Please discuss the whole experience.","qko":"최근 은행 이용의 시점·장소·은행, 직원의 도움과 방문 목적 달성 여부를 포함해 전체 경험을 말하세요.","title":"최근 은행 이용의 시점·장소·은행, 직원의 도움과 방문 목적 달성 여부를 포함해 전체 경험을 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q09"},{"id":"H1_10","source":"photo","set":1,"number":10,"topic":"은행","q":"Talk about a memorable banking experience you've had. For example, you could describe a time when you encountered a problem at the bank. What happened during the situation, and how did you handle it?","qko":"기억에 남는 은행 경험을 말하세요. 은행에서 겪은 문제 등을 예로 들어 상황과 대처를 설명하세요.","title":"기억에 남는 은행 경험을 말하세요. 은행에서 겪은 문제 등을 예로 들어 상황과 대처를 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q10"},{"id":"H1_11","source":"photo","set":1,"number":11,"topic":"약속","q":"You want to invite another family over to your home for lunch. Ask your family members multiple questions in order to figure out the best day and time for their visit.","qko":"다른 가족을 집에 점심 식사로 초대하려 합니다. 방문하기 좋은 날짜와 시간을 정하도록 자신의 가족들에게 여러 질문을 하세요.","title":"다른 가족을 집에 점심 식사로 초대하려 합니다. 방문하기 좋은 날짜와 시간을 정하도록 자신의 가족들에게 여러 질문을 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q11"},{"id":"H1_12","source":"photo","set":1,"number":12,"topic":"약속","q":"Sadly, on the day you are supposed to have lunch with the other family, one of your own family members wakes up sick. Call your friend and explain the problem. Then come up with a few ideas for meeting up later.","qko":"다른 가족과 점심을 먹기로 한 날 자신의 가족 한 명이 아픕니다. 친구에게 전화해 상황을 설명하고 나중에 만날 대안을 몇 가지 제시하세요.","title":"다른 가족과 점심을 먹기로 한 날 자신의 가족 한 명이 아픕니다. 친구에게 전화해 상황을 설명하고 나중에 만날 대안을 몇 가지 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q12"},{"id":"H1_13","source":"photo","set":1,"number":13,"topic":"약속","q":"Have you ever needed to cancel or change plans you had made with a friend? Talk about what you had planned to do and the reasons that you couldn't follow through with it. Explain the situation in detail.","qko":"친구와 약속을 취소하거나 바꾼 경험이 있나요? 원래 계획과 지키지 못한 이유를 자세히 설명하세요.","title":"친구와 약속을 취소하거나 바꾼 경험이 있나요? 원래 계획과 지키지 못한 이유를 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q13"},{"id":"H1_14","source":"photo","set":1,"number":14,"topic":"음악","q":"What are two genres of music that you enjoy? How are they different or similar? Tell me how you feel when you listen to each genre in as much detail as possible.","qko":"좋아하는 음악 두 장르의 차이·공통점과 각각 들을 때의 감정을 자세히 설명하세요.","title":"좋아하는 음악 두 장르의 차이·공통점과 각각 들을 때의 감정을 자세히 설명하세요.","type":"두 대상 비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q14"},{"id":"H1_15","source":"photo","set":1,"number":15,"topic":"음악","q":"People listen to music on many different kinds of devices. Describe some of them. Which ones are the most popular in your country? Describe them in detail.","qko":"음악을 듣는 여러 기기를 설명하고, 국내에서 가장 인기 있는 기기들을 자세히 말하세요.","title":"음악을 듣는 여러 기기를 설명하고, 국내에서 가장 인기 있는 기기들을 자세히 말하세요.","type":"일반 경향","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q15"},{"id":"H2_01","source":"photo","set":2,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요.","title":"자기소개를 해주세요.","type":"자기소개","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q01"},{"id":"H2_02","source":"photo","set":2,"number":2,"topic":"영화","q":"You said that you enjoy watching movies in your background survey. What types of films do you like watching and why? Describe the kinds of movies with as many details as possible.","qko":"좋아하는 영화 종류와 그 이유를 자세히 설명하세요.","title":"좋아하는 영화 종류와 그 이유를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q02"},{"id":"H2_03","source":"photo","set":2,"number":3,"topic":"영화","q":"Describe the most recent movie you went to watch. What happened on that day before, during, and after the film? Give as many details as possible.","qko":"최근 보러 간 영화와 그날 영화 전·중·후에 있었던 일을 자세히 말하세요.","title":"최근 보러 간 영화와 그날 영화 전·중·후에 있었던 일을 자세히 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q03"},{"id":"H2_04","source":"photo","set":2,"number":4,"topic":"영화","q":"What actor do you like the most? What is a specific news story that you've heard about him or her? First, tell me about the actor, and then describe what happened in the story. What made this story so memorable for movie fans?","qko":"좋아하는 배우를 소개하고 그 배우에 관해 들은 특정 뉴스, 뉴스 속 사건, 팬들에게 기억에 남는 이유를 설명하세요.","title":"좋아하는 배우를 소개하고 그 배우에 관해 들은 특정 뉴스, 뉴스 속 사건, 팬들에게 기억에 남는 이유를 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q04"},{"id":"H2_05","source":"photo","set":2,"number":5,"topic":"가구","q":"What piece of furniture do you like the most in your home? What do you use it for? Why is it special to you? Provide as many details as you can.","qko":"집에서 가장 좋아하는 가구의 용도와 특별한 이유를 자세히 설명하세요.","title":"집에서 가장 좋아하는 가구의 용도와 특별한 이유를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q05"},{"id":"H2_06","source":"photo","set":2,"number":6,"topic":"가구","q":"Describe a piece of furniture you recently purchased. Where did you get it from? Provide as many details as you can about it.","qko":"최근 구입한 가구와 구입처를 자세히 설명하세요.","title":"최근 구입한 가구와 구입처를 자세히 설명하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q06"},{"id":"H2_07","source":"photo","set":2,"number":7,"topic":"가구","q":"Have you ever had any problem with a product that you bought for your home? What was the issue? Tell me how you resolved the issue.","qko":"집에 쓰려고 산 제품의 문제와 해결 방법을 말하세요.","title":"집에 쓰려고 산 제품의 문제와 해결 방법을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q07"},{"id":"H2_08","source":"photo","set":2,"number":8,"topic":"해외여행","q":"Think about a place you have gone to on vacation. What is it like? Where is it? What are the local people like, and what is interesting or unique about it?","qko":"휴가 때 방문한 장소의 위치와 모습, 현지 사람들, 흥미롭거나 독특한 점을 말하세요.","title":"휴가 때 방문한 장소의 위치와 모습, 현지 사람들, 흥미롭거나 독특한 점을 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q08"},{"id":"H2_09","source":"photo","set":2,"number":9,"topic":"해외여행","q":"Do you go abroad often? When you do, where do you go and with whom? What kind of things do you do there? Describe a typical trip overseas.","qko":"해외여행 빈도, 여행지, 동행, 현지 활동을 포함해 보통의 해외여행을 설명하세요.","title":"해외여행 빈도, 여행지, 동행, 현지 활동을 포함해 보통의 해외여행을 설명하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q09"},{"id":"H2_10","source":"photo","set":2,"number":10,"topic":"해외여행","q":"Tell me about your last trip overseas. When and where did you go? Who did you go with? Describe your most recent overseas trip in detail.","qko":"최근 해외여행의 시점·장소·동행을 포함해 자세히 설명하세요.","title":"최근 해외여행의 시점·장소·동행을 포함해 자세히 설명하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q10"},{"id":"H2_11","source":"photo","set":2,"number":11,"topic":"병원","q":"Please act out the following situation. You want to make an appointment with a doctor. Call the clinic, and ask the receptionist three or four questions to find out more information about seeing the doctor. Then, schedule a time to visit.","qko":"병원에 전화해 접수 직원에게 진료에 관한 질문 3~4개를 하고 방문 시간을 예약하세요.","title":"병원에 전화해 접수 직원에게 진료에 관한 질문 3~4개를 하고 방문 시간을 예약하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q11"},{"id":"H2_12","source":"photo","set":2,"number":12,"topic":"병원","q":"I'm sorry, but there is a situation that needs your attention. On the day of your doctor's appointment, something comes up that stops you from being able to go. Call the doctor, and describe the issue. Then, give two or three suggestions to resolve the issue.","qko":"진료 예약 당일 일이 생겨 갈 수 없습니다. 병원에 전화해 문제를 설명하고 해결책 2~3개를 제시하세요.","title":"진료 예약 당일 일이 생겨 갈 수 없습니다. 병원에 전화해 문제를 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q12"},{"id":"H2_13","source":"photo","set":2,"number":13,"topic":"약속","q":"This is the end of the situation. Have you ever missed or been late for an important meeting or appointment before? What caused this, and how did you handle it? Give as many details about the situation as possible.","qko":"중요한 모임이나 약속에 못 가거나 늦은 경험, 원인, 대처를 자세히 말하세요.","title":"중요한 모임이나 약속에 못 가거나 늦은 경험, 원인, 대처를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q13"},{"id":"H2_14","source":"photo","set":2,"number":14,"topic":"동네","q":"Tell me about where you live. Has the neighborhood changed since you were a child? Do the houses or apartments look different from then? Describe some changes that you have noticed in your neighborhood.","qko":"사는 동네와 어린 시절 이후의 변화를 말하세요. 집이나 아파트의 모습 등 관찰한 변화를 설명하세요.","title":"사는 동네와 어린 시절 이후의 변화를 말하세요. 집이나 아파트의 모습 등 관찰한 변화를 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q14"},{"id":"H2_15","source":"photo","set":2,"number":15,"topic":"동네","q":"What are some issues in your neighborhood? What caused them and what impact have they had on the community? Give as many details about the situation as you can.","qko":"동네의 문제들, 원인과 지역사회에 미친 영향을 자세히 설명하세요.","title":"동네의 문제들, 원인과 지역사회에 미친 영향을 자세히 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q15"},{"id":"H3_01","source":"photo","set":3,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요." :"해커스 오픽 매뉴얼 · 사진 3 · Q06"},{"id":"H3_07","source":"photo","set":3,"number":7,"topic":"해변","q":"Have you ever had a scary or memorable experience while at the beach? For example, did you get stuck in bad weather or encounter something that stopped you from having fun? Tell me about the experience from beginning to end.","qko":"해변에서 무섭거나 기억에 남는 경험이 있나요? 악천후나 방해가 된 일 등을 처음부터 끝까지 말하세요.","title":"해변에서 무섭거나 기억에 남는 경험이 있나요? 악천후나 방해가 된 일 등을 처음부터 끝까지 말하세요.","type":"처음·계기","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q07"},{"id":"H3_08","source":"photo","set":3,"number":8,"topic":"인터넷","q":"What is a website you use often? What do people use it for, and what do you do on it? What made you begin visiting this site? Give details.","qko":"자주 쓰는 웹사이트, 사람들의 이용 목적, 본인의 활동과 이용 계기를 설명하세요.","title":"자주 쓰는 웹사이트, 사람들의 이용 목적, 본인의 활동과 이용 계기를 설명하세요.","type":"습관·활동 + 처음·계기","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q08"},{"id":"H3_09","source":"photo","set":3,"number":9,"topic":"인터넷","q":"What are some changes to the Internet that you notice since you first started using it? How have websites changed? Tell me about the changes in detail.","qko":"인터넷을 처음 쓴 이후 인터넷과 웹사이트가 어떻게 달라졌는지 자세히 말하세요.","title":"인터넷을 처음 쓴 이후 인터넷과 웹사이트가 어떻게 달라졌는지 자세히 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q09"},{"id":"H3_10","source":"photo","set":3,"number":10,"topic":"인터넷","q":"Reflect on something you had to work on that required a lot of research on the Internet. What was the project? When did you work on it? How did you use the Internet to complete the project?","qko":"인터넷 조사가 많이 필요했던 작업의 내용·시점과 인터넷을 활용해 완성한 방법을 말하세요.","title":"인터넷 조사가 많이 필요했던 작업의 내용·시점과 인터넷을 활용해 완성한 방법을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q10"},{"id":"H3_11","source":"photo","set":3,"number":11,"topic":"휴대폰","q":"I'd like to give you a situation to act out. Pretend you are in a store shopping for a new cell phone. Ask the salesperson three or four questions in order to get more information about their products.","qko":"새 휴대폰을 사려는 매장 상황입니다. 판매원에게 제품 정보를 얻는 질문 3~4개를 하세요.","title":"새 휴대폰을 사려는 매장 상황입니다. 판매원에게 제품 정보를 얻는 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q11"},{"id":"H3_12","source":"photo","set":3,"number":12,"topic":"휴대폰","q":"I'm sorry, but there is a problem I'd like you to solve. You received the phone that you purchased online but it is the wrong model. Call the store, tell them about the problem, and make two or three suggestions to solve the problem.","qko":"온라인으로 산 휴대폰이 다른 모델로 배송됐습니다. 매장에 전화해 설명하고 해결책 2~3개를 제시하세요.","title":"온라인으로 산 휴대폰이 다른 모델로 배송됐습니다. 매장에 전화해 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q12"},{"id":"H3_13","source":"photo","set":3,"number":13,"topic":"구매문제","q":"That's the end of the situation. Has something similar ever happened to you? Did you ever get the wrong product delivered? How did you resolve this issue? Please describe the experience in detail.","qko":"잘못된 제품이 배송된 유사 경험과 해결 과정을 자세히 말하세요.","title":"잘못된 제품이 배송된 유사 경험과 해결 과정을 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q13"},{"id":"H3_14","source":"photo","set":3,"number":14,"topic":"영화","q":"Have movies changed from when you were younger? How are they different now? Please describe the differences in detail.","qko":"어릴 때와 비교해 영화가 어떻게 달라졌는지 자세히 설명하세요.","title":"어릴 때와 비교해 영화가 어떻게 달라졌는지 자세히 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q14"},{"id":"H3_15","source":"photo","set":3,"number":15,"topic":"영화","q":"I'd like to know about an issue or concern about the movie industry. In what ways does it impact people? What can be done about the problem?","qko":"영화 산업의 문제나 우려, 사람들에게 미치는 영향과 해결 방법을 말하세요.","title":"영화 산업의 문제나 우려, 사람들에게 미치는 영향과 해결 방법을 말하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q15"},{"id":"H4_01","source":"photo","set":4,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요.","title":"자기소개를 해주세요.","type":"자기소개","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q01"},{"id":"H4_02","source":"photo","set":4,"number":2,"topic":"집안일","q":"How are household tasks divided in your home now? What chores do you normally do? What tasks do your family members usually complete? How do you feel about this distribution? Is it fair?","qko":"현재 집안일 분담, 본인과 가족의 집안일, 분담에 대한 생각과 공정성을 말하세요.","title":"현재 집안일 분담, 본인과 가족의 집안일, 분담에 대한 생각과 공정성을 말하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q02"},{"id":"H4_03","source":"photo","set":4,"number":3,"topic":"집안일","q":"Has something interesting or special ever happened while you were doing housework? When was it? What were you doing? Describe the experience in detail.","qko":"집안일 중 흥미롭거나 특별했던 경험의 시점과 당시 활동을 자세히 설명하세요.","title":"집안일 중 흥미롭거나 특별했던 경험의 시점과 당시 활동을 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q03"},{"id":"H4_04","source":"photo","set":4,"number":4,"topic":"집안일","q":"How have your duties at home changed from when you were little? What sort of things did you have to do then? What types of chores do you do now? Are they very different? Tell me about it in detail.","qko":"어린 시절과 지금의 집안일을 비교하고 차이를 자세히 말하세요.","title":"어린 시절과 지금의 집안일을 비교하고 차이를 자세히 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q04"},{"id":"H4_05","source":"photo","set":4,"number":5,"topic":"영화","q":"Which movie theater do you go to most often? Where is it? Is there anything special about it? Why do you like going there?","qko":"자주 가는 영화관의 위치, 특별한 점, 좋아하는 이유를 말하세요.","title":"자주 가는 영화관의 위치, 특별한 점, 좋아하는 이유를 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q05"},{"id":"H4_06","source":"photo","set":4,"number":6,"topic":"영화","q":"Describe your usual routine when you go to watch a movie. What do you do before and after the film? Describe a typical day when you visit a movie theater from start to finish.","qko":"영화 전후 활동을 포함해 영화관 방문의 처음부터 끝까지 보통의 과정을 설명하세요.","title":"영화 전후 활동을 포함해 영화관 방문의 처음부터 끝까지 보통의 과정을 설명하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q06"},{"id":"H4_07","source":"photo","set":4,"number":7,"topic":"영화","q":"Tell me about something memorable that happened to you at the theater. Please describe the incident and tell me why it was special.","qko":"극장에서 겪은 기억에 남는 사건과 특별했던 이유를 말하세요.","title":"극장에서 겪은 기억에 남는 사건과 특별했던 이유를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q07"},{"id":"H4_08","source":"photo","set":4,"number":8,"topic":"국내여행","q":"You mentioned in your background survey that you like to travel domestically. What places do you enjoy visiting? Do you like going to mountains or beaches more? Tell me about a specific area you like to visit, and explain why you like going there.","qko":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","title":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","type":"묘사 + 선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q08"},{"id":"H4_09","source":"photo","set":4,"number":9,"topic":"국내여행","q":"People must prepare before they travel. What do you do to prepare for travel? Do you do research in advance or make reservations? What special things do you do? Please describe your preparations in detail.","qko":"여행 전 조사, 예약과 특별히 하는 준비를 포함해 준비 과정을 자세히 말하세요.","title":"여행 전 조사, 예약과 특별히 하는 준비를 포함해 준비 과정을 자세히 말하세요.","type":"절차·준비","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q09"},{"id":"H4_10","source":"photo","set":4,"number":10,"topic":"국내여행","q":"Describe the most memorable experience you have had while on a trip. When was it, and where were you? What happened? Why was it so unforgettable? Describe the experience in detail.","qko":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","title":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q10"},{"id":"H4_11","source":"photo","set":4,"number":11,"topic":"MP3","q":"You want to purchase an MP3 player. One of your friends knows a lot about them. Call this person and ask three or four questions in order to get more information about buying this device.","qko":"MP3 플레이어 구매를 위해 잘 아는 친구에게 전화해 질문 3~4개를 하세요.","title":"MP3 플레이어 구매를 위해 잘 아는 친구에게 전화해 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q11"},{"id":"H4_12","source":"photo","set":4,"number":12,"topic":"MP3","q":"Please suggest some solutions for a problem. You broke your friend's MP3 player by accident while borrowing it. Call this friend, and explain the situation. Then, give two or three solutions for how to solve this issue.","qko":"빌린 친구의 MP3를 실수로 고장 냈습니다. 전화해 상황을 설명하고 해결책 2~3개를 제시하세요.","title":"빌린 친구의 MP3를 실수로 고장 냈습니다. 전화해 상황을 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q12"},{"id":"H4_13","source":"photo","set":4,"number":13,"topic":"MP3","q":"Think of a time when something went wrong with an electronic device you had borrowed. What happened? What was the problem? How did you deal with this?","qko":"빌린 전자기기에 문제가 생겼던 경험과 문제, 대처를 설명하세요.","title":"빌린 전자기기에 문제가 생겼던 경험과 문제, 대처를 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q13"},{"id":"H4_14","source":"photo","set":4,"number":14,"topic":"명절","q":"Describe a major holiday or event that is celebrated in your country. Have they changed in any way since you were a child? Please tell me about it in detail.","qko":"국내 주요 명절이나 행사를 설명하고 어린 시절 이후 달라진 점을 자세히 말하세요.","title":"국내 주요 명절이나 행사를 설명하고 어린 시절 이후 달라진 점을 자세히 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q14"},{"id":"H4_15","source":"photo","set":4,"number":15,"topic":"명절","q":"Are there any problems or issues regarding holidays? How are those issues being addressed?","qko":"명절과 관련한 문제들과 그에 대한 대응을 말하세요.","title":"명절과 관련한 문제들과 그에 대한 대응을 말하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q15"},{"id":"H5_01","source":"photo","set":5,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요.","title":"자기소개를 해주세요.","type":"자기소개","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q01"},{"id":"H5_02","source":"photo","set":5,"number":2,"topic":"공원","q":"What activities do you enjoy er":2,"topic":"집","q":"Please tell me about your house. What's your favorite room? What does it look like? Why do you like that room?","qko":"집을 소개하고 가장 좋아하는 방의 모습과 좋아하는 이유를 말하세요.","title":"집을 소개하고 가장 좋아하는 방의 모습과 좋아하는 이유를 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q02"},{"id":"H6_03","source":"photo","set":6,"number":3,"topic":"집","q":"How is the home you lived in before different from the one you live in now? Compare the two places. Give as many details as possible.","qko":"이전 집과 현재 집을 자세히 비교하세요.","title":"이전 집과 현재 집을 자세히 비교하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q03"},{"id":"H6_04","source":"photo","set":6,"number":4,"topic":"집","q":"What did your house look like when you first moved in? What changes have you made to your house since then?","qko":"처음 이사 왔을 때 집의 모습과 이후 바꾼 점을 말하세요.","title":"처음 이사 왔을 때 집의 모습과 이후 바꾼 점을 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q04"},{"id":"H6_05","source":"photo","set":6,"number":5,"topic":"지형","q":"What are some of your country's geographic features? How do they compare to the geographic features of other countries? Describe them with as many details as you can.","qko":"국내 지형의 특징을 설명하고 다른 나라의 지형과 비교하세요.","title":"국내 지형의 특징을 설명하고 다른 나라의 지형과 비교하세요.","type":"묘사 + 두 대상 비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q05"},{"id":"H6_06","source":"photo","set":6,"number":6,"topic":"지형","q":"Which do you like, lakes, mountains, beaches, or something else? Is there a geographical feature that is your favorite? Describe it for me.","qko":"호수·산·해변 등 좋아하는 지형을 골라 설명하세요.","title":"호수·산·해변 등 좋아하는 지형을 골라 설명하세요.","type":"선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q06"},{"id":"H6_07","source":"photo","set":6,"number":7,"topic":"지형","q":"Describe the most memorable outdoor experience you've had. What happened? Where and when was it? Give as many details as you can.","qko":"가장 기억에 남는 야외 경험의 사건·장소·시점을 자세히 설명하세요.","title":"가장 기억에 남는 야외 경험의 사건·장소·시점을 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q07"},{"id":"H6_08","source":"photo","set":6,"number":8,"topic":"음악","q":"What kinds of music do you like? Tell me about some of your favorite musicians and artists.","qko":"좋아하는 음악 종류와 좋아하는 음악가·아티스트들을 말하세요.","title":"좋아하는 음악 종류와 좋아하는 음악가·아티스트들을 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q08"},{"id":"H6_09","source":"photo","set":6,"number":9,"topic":"음악","q":"You indicated in your background survey that you enjoy listening to music. When did you first begin listening to music? How did you listen to it at first? What was your favorite type of music in the past, and how has it changed? Describe how your tastes have evolved.","qko":"음악을 처음 들은 시점과 당시 감상 방법, 과거 음악 취향과 이후 변화를 설명하세요.","title":"음악을 처음 들은 시점과 당시 감상 방법, 과거 음악 취향과 이후 변화를 설명하세요.","type":"처음·계기 + 변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q09"},{"id":"H6_10","source":"photo","set":6,"number":10,"topic":"음악","q":"Reflect on a memorable experience when you were listening to live music. What happened? When and where was it? Were you with anyone? What band or artist was performing? Why was it so unforgettable?","qko":"라이브 음악을 들은 기억에 남는 경험의 사건·시점·장소·동행·공연자와 잊지 못하는 이유를 말하세요.","title":"라이브 음악을 들은 기억에 남는 경험의 사건·시점·장소·동행·공연자와 잊지 못하는 이유를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q10"},{"id":"H6_11","source":"photo","set":6,"number":11,"topic":"여행","q":"I'd like you to act out the following situation. You are currently planning a vacation. Call a travel agent and ask three or four questions about possible places to visit.","qko":"휴가를 계획 중입니다. 여행사에 전화해 방문 가능한 여행지에 관해 질문 3~4개를 하세요.","title":"휴가를 계획 중입니다. 여행사에 전화해 방문 가능한 여행지에 관해 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q11"},{"id":"H6_12","source":"photo","set":6,"number":12,"topic":"여행","q":"Your travel agent has explained that an activity you wanted to participate in won't be available during your trip dates. Call your friend, describe the situation, and provide two or three alternatives in a message.","qko":"여행 기간에 원하는 활동이 불가능하다는 연락을 받았습니다. 친구에게 전화해 상황과 대안 2~3개를 메시지로 남기세요.","title":"여행 기간에 원하는 활동이 불가능하다는 연락을 받았습니다. 친구에게 전화해 상황과 대안 2~3개를 메시지로 남기세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q12"},{"id":"H6_13","source":"photo","set":6,"number":13,"topic":"국내여행","q":"Describe the most memorable experience you have had while on a trip. When was it, and where were you? What happened? Why was it so unforgettable? Describe the experience in detail.","qko":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","title":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q13"},{"id":"H6_14","source":"photo","set":6,"number":14,"topic":"산업","q":"Talk about an industry or company that has changed a lot in your country. What is it like now? How has it changed? Talk about specific examples that show how the industry or company has evolved.","qko":"국내에서 많이 달라진 산업이나 기업의 현재 모습과 변화를 구체적인 예로 설명하세요.","title":"국내에서 많이 달라진 산업이나 기업의 현재 모습과 변화를 구체적인 예로 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q14"},{"id":"H6_15","source":"photo","set":6,"number":15,"topic":"산업","q":"Tell me about a time when a product failed to meet the expectations of the public. What was the problem? How did the public and the industry react to this issue? Describe the problem in detail.","qko":"제품이 대중의 기대에 미치지 못했던 사례의 문제, 대중과 업계의 반응을 자세히 설명하세요.","title":"제품이 대중의 기대에 미치지 못했던 사례의 문제, 대중과 업계의 반응을 자세히 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q15"}],"stats":{"rawQuestions":289,"pdfQuestions":199,"photoQuestions":90,"cards":279,"families":167,"answerVersions":177,"uniqueSentences":1257,"sentenceInstances":2216,"additionalSentences":19,"sharedSentences":487,"optionalCards":16}}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent), cards=D.cards, C=Object.fromEntries(cards.map(c=>[c.id,c])), raw=Object.fromEntries(D.raw.map(c=>[c.id,c]));
const KEY='opic-ih-source-note-v1';
const initial=()=>({version:1,progress:{},edits:{},notes:{},last:null,rate:.85,language:'both',marks:false,showEn:true,showKo:true,showQKo:true,tests:[],exam:null});
let S=initial(),storage=true,page='topics',current=null,filter={q:'',topic:'',type:'',scope:'설문 중심',status:''},limit=24,speechToken=0;
function validExam(x,finished=false){return x&&Number.isInteger(x.set)&&x.set>=1&&x.set<=6&&Number.isInteger(x.index)&&x.index>=0&&x.index<15&&Number.isFinite(x.started)&&Number.isFinite(x.itemStarted)&&typeof x.reveal==='boolean'&&Array.isArray(x.answers)&&x.answers.length===15&&x.answers.every(a=>a&&typeof a.note==='string'&&a.note.length<=100000&&['미평가','끝까지 말함','일부 요구 누락','다시 연습'].includes(a.rating)&&(a.seconds===undefined||(Number.isFinite(a.seconds)&&a.seconds>=0)))&&(!finished||(typeof x.complete==='boolean'&&Number.isFinite(x.ended)&&x.ended>=x.started))}
function valid(v){return v&&typeof v==='object'&&v.version===1&&validEdits(v.edits)&&v.progress&&typeof v.progress==='object'&&!Array.isArray(v.progress)&&v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes)&&Array.isArray(v.tests)&&v.tests.every(t=>validExam(t,true))&&(!v.exam||validExam(v.exam))&&['showEn','showKo','showQKo'].every(k=>v[k]===undefined||typeof v[k]==='boolean')&&Object.entries(v.notes).every(([id,t])=>Object.hasOwn(C,id)&&typeof t==='string'&&t.length<=100000)&&Object.entries(v.progress).every(([id,p])=>Object.hasOwn(C,id)&&p&&typeof p==='object'&&(!p.status||['새로','연습 중','다시 보기','익숙함'].includes(p.status))&&(p.star===undefined||typeof p.star==='boolean'))}
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(valid(v))S={...S,...v};}catch(e){storage=false}
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storage=false;toast('자동 저장이 제한됩니다. 기록 화면에서 JSON 백업을 저장하세요.')}}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
function state(id){return S.progress[id]||{star:false,status:'새로'}}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function speak(text){stopSpeech();if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('이 브라우저에서는 음성 합성을 지원하지 않습니다.');return}const token=speechToken;const synth=window.speechSynthesis;const play=()=>{if(token!==speechToken)return;const u=new SpeechSynthesisUtterance(String(text||''));u.lang='en-US';u.rate=Number(S.rate)||.85;u.pitch=1;u.volume=1;const voices=synth.getVoices();const voice=voices.find(v=>/^en-US$/i.test(v.lang)&&v.localService)||voices.find(v=>/^en-US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)u.voice=voice;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('음성을 재생할 수 없습니다. Chrome에서 열었는지와 휴대폰의 영어 TTS 음성을 확인하세요.')};synth.speak(u)};const voices=synth.getVoices();if(voices.length){play()}else{let done=false;const ready=()=>{if(done)return;done=true;synth.removeEventListener&&synth.removeEventListener('voiceschanged',ready);play()};synth.addEventListener&&synth.addEventListener('voiceschanged',ready,{once:true});setTimeout(ready,500)}}
function go(p){stopSpeech();page=p;current=null;render();window.scrollTo(0,0)}
function render(){drawNav();({learn:learn,core:core,exam:examPage,scope:scope,records:records,priority:priorityPage,topics:topics,combo:showCombo,card:()=>showCard(current),print:()=>{}}[page]||learn)()}
function drawNav(){const active=page==='card'||page==='combo'||page==='priority'?'topics':page==='print'?'learn':page;$('nav').innerHTML=[['topics','주제 모음'],['learn','전체 질문'],['core','핵심 암기'],['exam','모의 연습'],['scope','준비 범위'],['records','내 기록']].map(([p,t])=>`<button class="${p===active?'active':''}" onclick="go('${p}')" ${p===active?'aria-current="page"':''}>${t}</button>`).join('')}
function opt(values,selected,blank){return `<option value="">${blank}</option>`+values.map(x=>`<option ${x===selected?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}
function updateFilter(k,v){filter[k]=v;limit=24;listing()}
function filterUI(){return `<div class="filters"><label class="search-label" for="search">질문·답변 검색</label><input id="search" type="search" placeholder="주제, 질문, 답변에서 검색" value="${esc(filter.q)}" oninput="updateFilter('q',this.value)"><select aria-label="학습 범위" onchange="updateFilter('scope',this.value)">${opt(['설문 중심','돌발·확장','역할극','선택 외 참고','시작'],filter.scope,'모든 범위')}</select><select aria-label="주제" onchange="updateFilter('topic',this.value)">${opt([...new Set(cards.map(c=>c.topic))].sort(),filter.topic,'모든 주제')}</select><select aria-label="질문 유형" onchange="updateFilter('type',this.value)">${opt([...new Set(cards.flatMap(c=>c.type.split(' + ')))].sort(),filter.type,'모든 유형')}</select><select aria-label="복습 상태" onchange="updateFilter('status',this.value)">${opt(['북마크','새로','연습 중','다시 보기','익숙함'],filter.status,'전체 상태')}</select></div>`}
function filtered(){let text=filter.q.toLowerCase().trim();return cards.filter(c=>(!filter.scope||c.scope===filter.scope)&&(!filter.topic||c.topic===filter.topic)&&(!filter.type||c.type.split(' + ').includes(filter.type))&&(!text||[c.id,c.q,c.qko,c.topic,answerCard(c).lines.map(l=>l.en+' '+l.ko).join(' ')].join(' ').toLowerCase().includes(text))&&(!filter.status||(filter.status==='북마크'?state(c.id).star:(state(c.id).status||'새로')===filter.status)))}
function title(c){return c.title&&c.source==='pdf'?c.title:c.qko.replace(/하세요[.。]?$/,'').slice(0,75)}
function entry(c){const s=state(c.id);return `<button class="entry" onclick="openCard('${c.id}')">${priorityBadge(c.id)} <span class="badge">${esc(c.topic)}</span> <span class="badge dim">${esc(c.type)}</span>${s.star?' <span aria-label="북마크">★</span>':''}${S.edits?.[c.id]?'<span class="badge warm">내 수정본</span>':''}<span class="title">${esc(title(c))}</span><span class="excerpt" lang="${language()==='ko'?'ko':'en'}">${esc(language()==='ko'?c.qko:c.q)}</span><span class="foot"><span>${esc(c.sources[0].label)}${c.sources.length>1?' 외 '+(c.sources.length-1)+'곳':''}</span><span>${esc(s.status||'새로')}</span></span></button>`}
function learn(){const done=cards.filter(c=>state(c.id).status==='익숙함').length;$('main').innerHTML=`<section class="hero"><div class="eyebrow">Read the question. Tell your story.</div><h1>질문은 그대로,<br>외울 문장은 함께.</h1><p>제공한 두 교재의 질문을 기준으로, 완성 답변을 읽고 공통 문장을 반복하세요. 먼저 설문 주제를 익히고 돌발과 역할극으로 넓혀갑니다.</p><div class="row"><button onclick="openCard('${S.last&&C[S.last]?S.last:'M022_1'}')">${S.last?'이어서 공부하기':'집 주제부터 시작'} →</button><button onclick="go('core')">암기 묶음 보기</button></div></section><div class="stats"><div class="stat"><strong>${D.stats.cards}</strong><span>중복 통합 질문</span></div><div class="stat"><strong>${D.stats.families}</strong><span>대표 답변 묶음 · 전체 자료</span></div><div class="stat"><strong>6</strong><span>원래 순서의 모의 세트</span></div><div class="stat"><strong>${done}</strong><span>익숙해진 질문</span></div></div><div class="sectiontop"><div><div class="eyebrow">Question library</div><h2>내가 준비할 질문</h2></div><button onclick="filter={q:'',topic:'',type:'',scope:'',status:''};learn()">전체 질문 보기</button></div>${languageControls()}${filterUI()}${priorityBanner()}<div id="listing"></div><footer>질문: 오픽만수르 PDF·해커스 제공 사진 / 답변: 새로 작성한 학습용 예시. 공식 기출·공식 모범답안으로 표시하지 않습니다. 모든 가능한 출제를 보장하는 자료는 아닙니다.</footer>`;listing()}
function listing(){const list=filtered();$('listing').innerHTML=`<div class="row between" style="margin:8px 0 14px"><span class="count">${list.length}개 질문 · 현재 ${Math.min(limit,list.length)}개 표시</span><button onclick="printCards(filtered())">현재 목록 인쇄</button></div><div class="cardlist">${list.slice(0,limit).map(entry).join('')||'<div class="empty">조건에 맞는 질문이 없습니다. 검색어나 필터를 바꿔보세요.</div>'}</div>${limit<list.length?'<button style="width:100%;margin-top:14px" onclick="limit+=24;listing()">더 보기</button>':''}`}
function openCard(id){stopSpeech();id=D.aliases[id]||id;if(!C[id])return;page='card';current=id;S.last=id;save();drawNav();showCard(id);window.scrollTo(0,0)}
function setView(k,v){S[k]=v;save();showCard(current)}
function setStatus(id,value){S.progress[id]={...state(id),status:value};save()}
function toggleStar(id){S.progress[id]={...state(id),star:!state(id).star};save();showCard(id)}
function answerHTML(c,force=false){c=answerCard(c);const rep=new Set(C[c.representative].lines.map(l=>l.en));const sentence=(l,k)=>`<span class="script-line ${!l[k]?'hidden':''} ${l.shared?'shared':''} ${!c.custom&&!rep.has(l.en)?'added':''}" title="${!rep.has(l.en)?'대표 답변에 추가':l.shared?'다른 질문과 공통':'기본 문장'}">${esc(l[k])}</span>`;return `<div class="script-columns ${language()!=='both'?'single':''}">${language()!=='ko'?`<div class="script-en" lang="en"><div class="column-label">ANSWER · ENGLISH</div><p>${c.lines.map(l=>sentence(l,'en')).join(' ')}</p></div>`:''}${language()!=='en'?`<div class="script-ko" lang="ko"><div class="column-label">답변 · 한국어</div><p>${c.lines.map(l=>sentence(l,'ko')).join(' ')}</p></div>`:''}</div>`}

function showCard(id){const c=answerCard(C[id]),st=state(id);$('main').innerHTML=`<div class="sectiontop noprint"><button onclick="go('topics')">← 주제 모음</button><span class="small">${esc(c.id)} · ${c.words}단어 · 연습용 답변</span></div>${languageControls()}${studyCard(c)}<section class="panel noprint"><div class="row between"><button onclick="toggleStar('${id}')">${st.star?'★ 북마크됨':'☆ 북마크'}</button><label>복습 상태 <select aria-label="복습 상태 변경" onchange="setStatus('${id}',this.value)">${['새로','연습 중','다시 보기','익숙함'].map(v=>`<option ${v===(st.status||'새로')?'selected':''}>${v}</option>`).join('')}</select></label><button onclick="printCards([C['${id}']])">1문항 인쇄</button></div><details><summary>반드시 답할 내용</summary><ul>${c.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>${esc(c.contrast)}</p></details><details><summary>공통 문장 · 추가 문장 · 관련 질문</summary>${c.custom?'<p class="notice">현재는 내 수정본입니다. 아래 대표 답변과 문장 수는 기본 답변 기준이며, 수정본에 자동 적용되지 않습니다.</p>':''}<p>초록 밑줄: 다른 질문과 같은 문장 / 주황 배경: 대표 답변에 추가된 문장</p><p>대표 <button onclick="openCard('${c.representative}')">${c.representative}</button> · 공통 ${c.sharedCount}문장 · 추가 ${c.additional}문장</p>${c.lines.map(l=>`<div class="compare"><span class="small">${l.shared?'공유 문장':'이 답변의 문장'}</span>${language()!=='ko'?`<p lang="en">${esc(l.en)}</p>`:''}${language()!=='en'?`<p>${esc(l.ko)}</p>`:''}</div>`).join('')}${c.related.map(x=>entry(C[x])).join('')}</details><details><summary>출처·원문 메모</summary>${c.sources.map(x=>`<p class="source">${esc(x.label)}</p>`).join('')}${c.correction?`<p>${esc(c.correction)}</p>`:''}${c.note?`<p>${esc(c.note)}</p>`:''}<p class="small">질문 원문은 유지했습니다. 인물·장소·사건은 연습용 설정입니다.</p></details><details><summary>내 메모</summary><textarea id="note" oninput="S.notes['${id}']=this.value;save()">${esc(S.notes[id]||'')}</textarea></details></section><div class="row between noprint"><button onclick="moveCard(-1)">← 이전 질문</button><button onclick="moveCard(1)">다음 질문 →</button></div>`}

function moveCard(d){const pool=comboActive?comboActive.ids.map(id=>C[D.aliases[id]||id]):activeGroup?groupCards(activeGroup):cards;let i=pool.findIndex(c=>c.id===current);if(i<0)i=0;openCard(pool[(i+d+pool.length)%pool.length].id)}

function core(){const reps=cards.filter(c=>c.id===c.representative&&c.scope!=='선택 외 참고');const groups={};for(const c of reps)(groups[c.scope]??=[]).push(c);$('main').innerHTML=`<div class="eyebrow">Memory map</div><h1>같은 문장은 한 번만.</h1>${priorityBanner()}${languageControls()}<p class="quiet">소재는 공유하고 질문의 차이는 남겼습니다. 아래는 각 묶음의 대표 답변입니다. 대표 하나만 읽고 끝내지 말고, 카드 안의 관련 질문에서 달라지는 요구도 확인하세요.</p><div class="stats"><div class="stat"><strong>${D.stats.families}</strong><span>대표 묶음 · 선택 외 참고 포함</span></div><div class="stat"><strong>${D.stats.answerVersions}</strong><span>완성 답변 버전</span></div><div class="stat"><strong>${D.stats.uniqueSentences}</strong><span>중복 제거 영어 문장</span></div><div class="stat"><strong>${D.stats.additionalSentences}</strong><span>대표 대비 추가 문장 · 카드별 합</span></div></div><section class="panel"><h2>먼저 익힐 소재</h2><div class="grid">${[['M022_1','혼자 사는 작은 아파트','집·가구·집안일·재활용'],['M046_1','동네 공원과 가벼운 산책','공원·걷기·건강·갑작스러운 비'],['M066_1','창가 자리가 있는 카페','장소·습관·주문 실수'],['M101_1','June의 음악과 공연','음악·콘서트·라이브 경험'],['M088_1','작은 극장의 코미디 연극','연극·극장·기억에 남는 장면'],['M107_1','강릉 해변과 오사카 여행','국내·해외·날씨·준비·길 찾기'],['M136_3','약속 변경과 문제 해결','아픔·지각·예약 오류'],['M044_3','민과 집에서 보낸 휴가','집 휴가·요리·친구 돕기']].map(([id,t,k])=>`<button class="entry" onclick="openCard('${id}')"><b>${t}</b><div class="small">${k}</div></button>`).join('')}</div></section><p class="notice">공통 문장은 서로 다른 질문 카드에서 영어가 정확히 같은 문장입니다. 대표 대비 추가 수는 해당 묶음의 대표에 없는 문장 수이며, 고유 추가 문장 수나 ‘이것만 외우면 되는 최소량’은 아닙니다.</p>${Object.entries(groups).map(([g,items])=>`<section class="panel"><div class="sectiontop"><h2>${g} · ${items.length}묶음</h2><button onclick="printCards(cards.filter(c=>c.id===c.representative&&c.scope==='${g}'))">이 묶음 인쇄</button></div><div class="cardlist">${items.map(entry).join('')}</div></section>`).join('')}`}
const chosen=['카페','공원','해변','공연','콘서트','음악','조깅','걷기','운동을 전혀 하지 않음','국내여행','집휴가','해외여행'];
function scope(){const types=['묘사','습관·활동','최근 경험','처음·계기','문제·기억 경험','변화·비교','두 대상 비교','역할극 질문','역할극 해결','뉴스·이슈'];const topics=[...new Set(cards.map(c=>c.topic))];$('main').innerHTML=`<div class="eyebrow">Coverage & sources</div><h1>확보한 범위를 알고 공부하기.</h1><section class="panel"><h2>내 설문 · 난이도</h2><p>일 경험 없음 · 학생 아님 · 수강 후 5년 이상 · 주택 또는 아파트에 혼자 거주</p><p><b>난이도 5 → 비슷한 질문</b>을 준비 기준으로 사용합니다. 교재 질문을 국내 난이도별 확정 기출로 분류한 것은 아닙니다.</p><div class="row">${chosen.map(x=>`<span class="badge">${x}</span>`).join('')}</div></section><section class="panel"><h2>연습용 인물·사건 설정</h2><p>서울의 방 두 개 아파트에 혼자 살며, 작년에 부모님 집에서 독립했습니다. 친구 Min과 카페·산책·여행을 즐깁니다. 직장이나 현재 수강 이력은 넣지 않았습니다.</p><p>현재는 가벼운 산책 위주이며, 조깅·헬스장 경험은 과거의 시도입니다. 특정 운동 프로그램을 지금 지속한다고 말하지 않습니다.</p><p>June·Alex는 가상 음악가, Alex Kim은 가상 배우입니다. A Quiet Day·Bright Morning·The Dinner·Small Mistakes는 연습용 작품명입니다. 실제 인물·출연 이력·뉴스를 검증한 설정이 아닙니다.</p><p>근무·사원증·잡지 기자 같은 역할은 <b>해당 역할극 안에서만</b> 수행합니다. 일반 경험 답변에는 일 경험 없음 설정을 유지합니다. 오늘 날씨와 최근 뉴스 사례는 해당 카드 메모를 확인하세요.</p></section><section class="panel"><h2>확보 자료와 빈칸</h2><p>오픽만수르 PDF ${D.stats.pdfQuestions}개 + 해커스 사진 90문항 = 원문 위치 ${D.stats.rawQuestions}개. 같은 영어 질문만 통합해 <b>${cards.length}개 카드</b>로 정리했습니다. 출처는 통합 카드 안에 모두 남아 있습니다.</p><p>PDF는 설문·돌발·역할극 19세트·심화 영역을 포함합니다. 해변은 해커스 사진 3의 Q5–7로 보완했습니다. PDF의 미선택 설문 ${D.stats.optionalCards}개는 ‘선택 외 참고’로 분리했습니다.</p><div class="notice">‘운동을 전혀 하지 않음’에 직접 대응하는 독립 질문은 제공 자료에서 확보하지 못했습니다. 새로운 질문을 만들지 않았습니다. 카페·해변 등의 일부 비교·이슈 유형도 비어 있으며, 아래 0은 이 자료에서 미확보라는 뜻입니다.</div></section><section class="panel"><h2>주제 × 질문 유형</h2><p class="small">복합 유형은 해당하는 두 열에 모두 집계합니다. 숫자를 누르면 그 질문만 볼 수 있습니다. 모든 출제 가능 유형 목록은 아닙니다.</p><div class="tablebox"><table><thead><tr><th>주제</th>${types.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${topics.map(t=>`<tr><th>${t}</th>${types.map(k=>{const n=cards.filter(c=>c.topic===t&&c.type.split(' + ').includes(k)).length;return `<td>${n?`<button onclick="scopeFilter('${t}','${k}')">${n}</button>`:'<span class="quiet">0</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>읽기·소리·저장 안내</h2><p>질문·답변·기록 기능은 이 HTML 한 파일에 포함되어 있습니다. 본문에 외부 글꼴·이미지·라이브러리가 필요하지 않습니다.</p><p>음성은 브라우저의 음성 합성을 사용합니다. 기기에 설치된 영어 음성은 오프라인 사용이 가능할 수 있지만, 일부 음성은 인터넷이 필요합니다. iPhone 등의 파일 미리보기에서는 기능이 제한될 수 있으므로 브라우저에서 여세요.</p><p>기록은 이 브라우저의 저장 공간에 남습니다. 파일 위치나 기기·브라우저가 바뀌면 이어지지 않을 수 있으니 JSON 백업으로 옮기세요. 현재 자동 저장: <b>${storage?'사용 가능':'제한됨'}</b>.</p><p>답변은 IH 목표의 연결된 설명·서술·비교·문제 해결 연습용입니다. 실제 평가는 질문 이해와 발화의 자연스러움, 정확성, 일관성 등에 따라 달라집니다.</p></section>`}
function scopeFilter(t,k){filter={q:'',topic:t,type:k,scope:'',status:''};go('learn')}
function examPage(){if(S.exam)return drawExam();$('main').innerHTML=`<div class="eyebrow">Original practice sets</div><h1>한 세트의 흐름으로 말하기.</h1><p class="quiet">해커스 제공 사진의 순서 그대로, 세트당 15문항입니다. 영화처럼 선택 설문 밖의 주제도 원본 구성을 보존하기 위해 포함했습니다. 이 세트들이 실제 난이도 5 시험의 고정 구성이라는 뜻은 아닙니다.</p><div class="setgrid">${[1,2,3,4,5,6].map(n=>`<button class="setcard" onclick="startExam(${n})"><span class="eyebrow">사진 ${n}</span><strong>0${n}</strong><span class="small">${[...new Set(D.raw.filter(q=>q.set===n&&q.number!==1).map(q=>q.topic))].join(' · ')}</span><p>15문항 시작 →</p></button>`).join('')}</div><section class="panel" style="margin-top:20px"><h2>사용 방법</h2><p>질문을 듣고 답변을 말하세요. 답변 확인은 선택 사항입니다. 타이머는 연습 기록용이며 자동 종료나 등급 판정은 하지 않습니다. 중간에 다른 메뉴로 이동해도 현재 문항과 메모는 유지됩니다.</p></section>`}
function startExam(n){stopSpeech();S.exam={set:n,index:0,started:Date.now(),itemStarted:Date.now(),answers:Array.from({length:15},()=>({note:'',rating:'미평가'})),reveal:false};save();drawExam();window.scrollTo(0,0)}
function drawExam(){const x=S.exam;if(!x)return examPage();const id=`H${x.set}_${String(x.index+1).padStart(2,'0')}`,q=raw[id],c=C[D.aliases[id]],a=x.answers[x.index];$('main').innerHTML=`<div class="sectiontop"><div><div class="eyebrow">Set ${x.set} / photo ${x.set}</div><h1>질문 ${x.index+1} <span class="quiet">/ 15</span></h1></div><div><div class="timer" id="clock"></div><span class="small">세트 경과 시간</span></div></div><div class="progress"><span style="width:${x.index/15*100}%"></span></div><section class="panel"><div class="row"><span class="badge">${esc(q.topic)}</span>${['영화','쇼핑'].includes(q.topic)?'<span class="badge warm">선택 설문 밖 · 원본 유지</span>':''}<span class="small">해커스 사진 ${x.set} · Q${x.index+1}</span></div>${languageControls()}${questionHTML(q)}<div class="row"><button class="primary" onclick="speak(raw['${id}'].q)">▶ 질문 듣기</button><button onclick="S.exam.reveal=!S.exam.reveal;save();drawExam()">${x.reveal?'도움말 숨기기':'답변·해석 확인'}</button></div>${x.reveal?`${answerHTML(c,true)}`:''}</section><section class="panel"><label for="examNote">말한 내용·막힌 부분</label><textarea id="examNote" oninput="S.exam.answers[S.exam.index].note=this.value;save()">${esc(a.note)}</textarea><label>자기평가 <select aria-label="문항 자기평가" onchange="S.exam.answers[S.exam.index].rating=this.value;save()">${['미평가','끝까지 말함','일부 요구 누락','다시 연습'].map(v=>`<option ${a.rating===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="row between" style="margin-top:20px"><button ${x.index===0?'disabled':''} onclick="examMove(-1)">← 이전</button><button class="primary" onclick="examMove(1)">${x.index===14?'세트 완료':'다음 질문 →'}</button></div></section><button onclick="finishExam(false)">현재까지 기록하고 종료</button>`;tick()}
function examMove(d){stopSpeech();const x=S.exam;x.answers[x.index].seconds=(x.answers[x.index].seconds||0)+Math.round((Date.now()-x.itemStarted)/1000);if(d===1&&x.index===14){finishExam(true);return}x.index+=d;x.itemStarted=Date.now();x.reveal=false;save();drawExam();window.scrollTo(0,0)}
function finishExam(complete){const x=S.exam;if(!x)return;S.tests.unshift({...x,complete,ended:Date.now()});S.exam=null;save();go('records');toast(complete?'15문항 연습을 기록했습니다.':'현재까지의 연습을 기록했습니다.')}
function tick(){if(page==='exam'&&S.exam&&$('clock')){const sec=Math.max(0,Math.floor((Date.now()-S.exam.started)/1000));$('clock').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
}
setInterval(tick,1000);
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportData(){download('OPIc-IH-학습기록.json',{...S,exportedAt:new Date().toISOString()});toast('학습 기록을 JSON으로 내보냈습니다.')}
async function importData(file){if(!file)return;try{if(file.size>12000000)throw Error();const v=JSON.parse(await file.text());if(!valid(v))throw Error();if(v.exam){if(!Number.isInteger(v.exam.set)||v.exam.set<1||v.exam.set>6||!Number.isInteger(v.exam.index)||v.exam.index<0||v.exam.index>14||!Array.isArray(v.exam.answers)||v.exam.answers.length!==15)throw Error()}
S={...S,progress:{...S.progress,...v.progress},notes:{...S.notes,...v.notes},edits:{...(S.edits||{}),...(v.edits||{})},tests:[...S.tests,...v.tests].filter((t,i,a)=>a.findIndex(x=>x.started===t.started&&x.set===t.set)===i),last:C[v.last]?v.last:S.last,rate:[.7,.85,1,1.1].includes(v.rate)?v.rate:S.rate,exam:S.exam||v.exam||null,language:['both','en','ko'].includes(v.language)?v.language:language(),marks:typeof v.marks==='boolean'?v.marks:!!S.marks};document.body.classList.toggle('show-marks',S.marks);save();go('records');toast('백업을 병합했습니다. 현재 기록도 유지됩니다.')}catch(e){toast('이 노트의 올바른 JSON 백업인지 확인하세요. 현재 기록은 변경하지 않았습니다.')}}
function records(){const starred=cards.filter(c=>state(c.id).star),again=cards.filter(c=>state(c.id).status==='다시 보기');$('main').innerHTML=`<div class="eyebrow">Your progress</div><h1>다시 볼 것만 가볍게.</h1><section class="panel"><h2>기록 백업</h2><p class="small">자동 저장 ${storage?'사용 가능':'제한됨'} · 다른 기기에서는 HTML을 열고 이 JSON을 가져오세요. 백업에는 북마크·상태·메모·수정 대본·모의 연습 기록이 포함됩니다. 같은 문제의 수정 대본이 겹치면 가져온 백업의 대본이 적용됩니다.</p><div class="row"><button class="primary" onclick="exportData()">JSON 내보내기</button><label>가져오기 <input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label></div></section>${S.exam?`<section class="panel"><h2>진행 중인 세트 ${S.exam.set}</h2><p>질문 ${S.exam.index+1}에서 이어갈 수 있습니다.</p><button onclick="go('exam')">연습 이어가기</button></section>`:''}<section class="panel"><h2>내가 수정한 대본 · ${Object.keys(S.edits||{}).length}</h2><div class="cardlist">${Object.keys(S.edits||{}).map(id=>entry(C[id])).join('')||'<p class="quiet">각 질문의 스크립트 편집 버튼으로 답변을 바꿀 수 있습니다.</p>'}</div></section><section class="panel"><h2>북마크 · ${starred.length}</h2><div class="cardlist">${starred.map(entry).join('')||'<p class="quiet">질문 카드에서 ☆를 눌러 모아두세요.</p>'}</div></section><section class="panel"><h2>다시 연습 · ${again.length}</h2><div class="cardlist">${again.map(entry).join('')||'<p class="quiet">복습 상태를 ‘다시 보기’로 바꾼 질문이 여기에 모입니다.</p>'}</div></section><section class="panel"><h2>모의 연습 기록 · ${S.tests.length}</h2>${S.tests.map(t=>`<details><summary>세트 ${esc(t.set)} · ${new Date(t.started).toLocaleDateString('ko-KR')} · ${t.complete?'완료':'중간 종료'}</summary><p class="small">경과 ${Math.max(0,Math.round((t.ended-t.started)/60000))}분 · 기록 시간은 쉬는 시간도 포함할 수 있습니다.</p>${(t.answers||[]).map((a,i)=>`<div class="compare"><b>Q${i+1} · ${esc(a.rating||'미평가')}</b><p style="white-space:pre-wrap">${esc(a.note||'메모 없음')}</p><button onclick="openCard('H${t.set}_${String(i+1).padStart(2,'0')}')">답변 확인</button></div>`).join('')}</details>`).join('')||'<p class="quiet">모의 세트를 끝내거나 기록하고 종료하면 저장됩니다.</p>'}</section>`}

function drawPrint(){$('main').innerHTML=`<div class="noprint panel"><h2>${printList.length}문항 · ${printList.length}페이지</h2><p>A4 세로 · 배율 100% · 머리글/바닥글 끄기. 각 문항은 한 페이지입니다. 아래 언어 선택이 질문과 답변 모두에 적용됩니다.</p>${languageControls()}<div class="row"><button class="primary" id="printNow" onclick="if(fitPrint())window.print()">인쇄 / PDF 저장</button><button onclick="go('topics')">주제 모음으로</button></div></div><p id="printWarning" class="notice noprint hidden" role="alert"></p><div id="printSheets">${printList.map((c,i)=>`<article class="print-sheet"><div class="sheet-inner"><div class="sheet-heading"><b>${esc(c.topic)} · ${esc(c.type)}</b>${priorityBadge(c.id)}<span>${i+1} / ${printList.length} · ${c.id}</span></div><div class="source">${c.sources.map(x=>esc(x.label)).join(' / ')}</div>${questionHTML(c)}<hr>${answerHTML(c)}${language()!=='en'?`<div class="print-cue">기억 단서 · ${esc(c.cue)}</div>`:''}<div class="sheet-foot">학습용 답변 · 인물과 사건은 연습용 설정</div></div></article>`).join('')}</div>`;fitPrint()}
function fitPrint(){let overflow=0;document.querySelectorAll('.print-sheet').forEach(el=>{let size=12;el.style.setProperty('--sheet-font',size+'pt');const inner=el.querySelector('.sheet-inner');while(inner.scrollHeight>el.clientHeight-46&&size>8){size-=.25;el.style.setProperty('--sheet-font',size+'pt')}if(inner.scrollHeight>el.clientHeight-46)overflow++});if($('printWarning')){$('printWarning').classList.toggle('hidden',!overflow);$('printWarning').textContent=`${overflow}개 문항의 수정 대본이 한 페이지에 들어가기에는 너무 깁니다. 한 언어만 선택하거나 해당 대본을 줄여주세요. 내용은 잘라내지 않았습니다.`}if($('printNow'))$('printNow').disabled=overflow>0;return !overflow}
window.addEventListener('beforeprint',fitPrint);

function studyCard(c,n){c=answerCard(c);const column=k=>`<div class="reading-column" data-lang="${k}"><div class="column-label">${k==='en'?'QUESTION':'질문'}</div><p class="qtext ${k==='ko'?'qko':''}" lang="${k}">${questionText(k==='en'?c.q:c.qko,k)}</p><div class="answer-divider"></div><div class="column-label">${k==='en'?'ANSWER':'답변'}</div><div class="script-${k}" lang="${k}"><p>${c.lines.map(l=>`<span class="script-line ${!l[k]?'hidden':''} ${l.shared?'shared':''} ${!c.custom&&!C[c.representative].lines.some(x=>x.en===l.en)?'added':''}">${esc(l[k])}</span>`).join(' ')}</p></div></div>`;return `<article class="study-card"><div class="study-heading"><div class="row">${n?`<span class="badge warm">${n} / 3</span>`:''}<b>${esc(c.topic)} · ${esc(c.type)}</b>${priorityBadge(c.id)}</div><span class="small">${c.id}</span></div><div class="audio-row noprint"><button onclick="speak(C['${c.id}'].q)">▶ 질문</button><button onclick="answerSpeech('${c.id}')">▶ 답변</button><label class="small">속도 <select aria-label="음성 속도" onchange="S.rate=Number(this.value);save()">${[.7,.85,1,1.1].map(n=>`<option value="${n}" ${Number(S.rate)===n?'selected':''}>${n}×</option>`).join('')}</select></label><button onclick="openEditor('${c.id}')">✎ 스크립트 편집</button>${c.custom?'<span class="badge warm">내 수정본</span>':''}${n?`<button onclick="openCard('${c.id}')">상세·메모</button>`:''}</div><div class="reading-columns ${language()!=='both'?'single':''}">${language()!=='ko'?column('en'):''}${language()!=='en'?column('ko'):''}</div>${c.custom&&!c.lines.some(l=>l.ko)&&language()!=='en'?'<p class="notice">한국어 해석을 아직 작성하지 않았습니다. 스크립트 편집에서 추가할 수 있습니다.</p>':''}${language()!=='en'?`<div class="memory-cue">${esc(c.cue)}</div>`:''}<div class="source compact-source">${c.sources.map(x=>esc(x.label)).join(' / ')}</div></article>`}

for(let set=1;set<=6;set++)for(const start of [2,5,8,11]){const ids=[0,1,2].map(i=>`H${set}_${String(start+i).padStart(2,'0')}`),qs=ids.map(id=>raw[id]);if(qs.every(Boolean)){const g=topicGroups.find(g=>qs.every(q=>g.topics.includes(q.topic)));if(g&&!combos.some(c=>c.ids.join()===ids.join()))combos.push({id:`original-${set}-${start}`,group:g.name,name:`사진 ${set} · Q${start}–${start+2}${start===11?' 역할극 흐름':''}`,ids,flow:qs.map(q=>C[D.aliases[q.id]].type).join(' → '),why:start===11?'상황 속에서 직접 질문하기 → 문제를 알리고 대안 제시하기 → 관련된 자신의 경험 말하기로 이어집니다. 마지막 문항은 통화 연기가 아닌 경험 답변입니다.':'제공된 해커스 모의고사에서 실제로 연속 배치된 세 문항입니다. 각 질문의 시점·대상·행동 요구를 따로 확인하세요.',original:true})}}
function comboTile(c){return `<div class="combo-tile"><span class="badge ${c.original?'':'warm'}">${c.original?'교재 원본 연속 3문항':'대표 연습 조합 · 재구성'}</span><h3>${esc(c.name)}</h3><p class="flow">${esc(c.flow)}</p><p class="small">${esc(c.why)}</p><ol>${c.ids.map(id=>{const q=C[D.aliases[id]||id];return `<li><button onclick="openCard('${id}')">${esc(q.topic)} · ${esc(q.type)} <span class="small">${id}</span></button></li>`}).join('')}</ol><div class="row"><button class="primary" onclick="openCombo('${c.id}')">3문항 이어서 보기</button><button onclick="printCombo('${c.id}')">콤보 인쇄 · 3페이지</button></div></div>`}
function topics(){drawNav();if(!activeGroup){$('main').innerHTML=`<div class="eyebrow">Topic collections</div><h1>오늘은 한 주제씩.</h1>${priorityBanner()}<p class="quiet">주제를 고르면 관련 질문 전체와 대표 3문항 콤보를 함께 볼 수 있습니다.</p>${languageControls()}<div class="topic-grid">${topicGroups.map(g=>`<button class="topic-tile" onclick="selectGroup('${g.name}')"><span class="small">${groupCards(g.name).length}문항</span><h2>${g.name}</h2><p>${g.desc}</p><span>질문과 콤보 보기 →</span></button>`).join('')}</div>`;return}const g=topicGroups.find(g=>g.name===activeGroup),list=groupCards(g.name),sets=combos.filter(c=>c.group===g.name);$('main').innerHTML=`${priorityBanner()}<div class="sectiontop"><button onclick="activeGroup=null;topics()">← 모든 주제</button><button onclick="printCards(groupCards('${g.name}'))">${g.name} 묶음 인쇄 · ${list.length}페이지</button></div><h1>${g.name} <span class="quiet">${list.length}</span></h1><p>${g.desc}</p>${languageControls()}<section class="panel"><h2>3문항이 이어지는 방식</h2><p>같은 주제에서도 묘사·평소 활동·경험, 또는 묘사·변화·경험처럼 요구가 달라질 수 있습니다. 아래는 제공 자료의 문항으로 연습하는 흐름이며 실제 시험의 고정 순서나 출제 예측은 아닙니다.</p><p class="small">‘교재 원본’은 사진에서 연속된 순서를 유지합니다. ‘대표 연습 조합’은 원문을 바꾸지 않고 세 문항을 선정한 조합입니다.</p>${g.name==='걷기·운동'?'<p class="notice">운동을 전혀 하지 않음의 독립 질문은 미확보입니다. 별도 콤보를 창작하지 않았습니다.</p>':''}${sets.length?`<div class="combo-grid">${sets.map(comboTile).join('')}</div>`:'<p class="notice">이 주제에는 대표 콤보를 별도 선정하지 않았습니다. 확보한 질문을 아래에서 개별 연습하세요.</p>'}</section><h2>이 주제의 모든 질문</h2>${g.topics.filter(t=>list.some(c=>c.topic===t)).map(t=>`<details class="topic-section" open><summary>${t} · ${list.filter(c=>c.topic===t).length}문항</summary><div class="cardlist">${list.filter(c=>c.topic===t).map(entry).join('')}</div></details>`).join('')}`}
function selectGroup(name){activeGroup=name;comboActive=null;page='topics';topics();window.scrollTo(0,0)}
function openCombo(id){comboActive=combos.find(c=>c.id===id);activeGroup=comboActive.group;page='combo';drawNav();showCombo();window.scrollTo(0,0)}
function printCombo(id){const c=combos.find(c=>c.id===id);printCards(c.ids.map(id=>C[D.aliases[id]||id]))}
function showCombo(){const c=comboActive;if(!c)return go('topics');$('main').innerHTML=`<div class="sectiontop"><button onclick="selectGroup('${c.group}')">← ${c.group} 모음</button><button onclick="printCombo('${c.id}')">3문항 인쇄 · 3페이지</button></div><span class="badge warm">${c.original?'교재 원본 연속 3문항':'대표 연습 조합 · 재구성'}</span><h1>${c.name}</h1><p class="flow">${c.flow}</p><p>${c.why}</p>${languageControls()}${c.ids.map((id,i)=>studyCard(C[D.aliases[id]||id],i+1)).join('')}`}

document.body.classList.toggle('show-marks',!!S.marks);

function questionText(text,lang){return sentenceLines(text,lang).map(t=>`<span class="question-line">${esc(t)}</span>`).join(' ')}
function validEdits(edits){return edits===undefined||(edits&&typeof edits==='object'&&!Array.isArray(edits)&&Object.entries(edits).every(([id,e])=>Object.hasOwn(C,id)&&e&&typeof e.en==='string'&&e.en.trim().length>0&&e.en.length<=30000&&typeof e.ko==='string'&&e.ko.length<=30000&&Number.isFinite(e.updatedAt)))}
function sentenceLines(text,lang){const paras=text.trim().split(/\n+/).map(t=>t.trim()).filter(Boolean);if(paras.length!==1)return paras;if(typeof Intl.Segmenter==='function')return [...new Intl.Segmenter(lang,{granularity:'sentence'}).segment(paras[0])].map(x=>x.segment.trim()).filter(Boolean);return paras[0].match(/[^.!?]+(?:[.!?]+(?:\s|$)|$)/g)?.map(x=>x.trim())||paras}
function answerCard(c){const e=S.edits?.[c.id];if(!e)return c;const en=sentenceLines(e.en,'en'),ko=sentenceLines(e.ko,'ko');return {...c,custom:true,words:e.en.split(/\s+/).filter(Boolean).length,cue:'직접 수정한 대본 · 기억 단서는 내 메모에 적어주세요.',lines:Array.from({length:Math.max(en.length,ko.length)},(_,i)=>({en:en[i]||'',ko:ko[i]||'',shared:false})),note:'직접 수정한 학습용 답변입니다. 기본 답변의 공통 문장 집계는 적용하지 않습니다.'}}
function answerSpeech(id){speak(answerCard(C[id]).lines.map(l=>l.en).filter(Boolean).join(' '))}
function openEditor(id){id=D.aliases[id]||id;if(!C[id])return;stopSpeech();const e=S.edits?.[id],c=C[id];document.getElementById('scriptEditor')?.remove();const dialog=document.createElement('dialog');dialog.id='scriptEditor';dialog.innerHTML=`<form id="scriptForm"><div class="sectiontop"><div><h2 id="editorTitle">내 스크립트 편집</h2><span class="small">${esc(c.topic)} · ${id}</span></div><button type="button" onclick="closeEditor()" aria-label="편집 닫기">닫기</button></div><p class="small">질문 원문은 그대로 두고 이 문제의 답변만 바꿉니다. 문장마다 Enter로 줄을 나눠주세요. 한국어는 자동 번역되지 않으므로 직접 수정하거나 비워둘 수 있습니다.</p><details><summary>질문과 꼭 답할 내용 확인</summary><p>${esc(c.q)}</p><p>${esc(c.qko)}</p><ul>${c.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><div class="editor-columns"><label for="editEnglish">영어 대본<textarea id="editEnglish" lang="en" maxlength="30000" required spellcheck="true">${esc(e?e.en:c.lines.map(l=>l.en).join('\n'))}</textarea></label><label for="editKorean">한국어 해석 · 선택<textarea id="editKorean" lang="ko" maxlength="30000">${esc(e?e.ko:c.lines.map(l=>l.ko).join('\n'))}</textarea></label></div><div class="row"><button type="button" onclick="splitEditorLines()">문장별 줄 나누기</button><button type="button" ${e?'':'disabled'} onclick="restoreAnswer('${id}')">기본 답변 복원</button><button class="primary" type="submit">내 스크립트 저장</button></div><p class="small">저장은 현재 브라우저에 적용됩니다. 휴대폰이나 다른 브라우저로 옮길 때는 ‘내 기록 → JSON 내보내기 / 가져오기’를 사용하세요. 편집한 답변은 음성·콤보·인쇄에도 적용됩니다.</p><p id="editError" class="notice hidden" role="alert"></p></form>`;dialog.setAttribute('aria-labelledby','editorTitle');document.body.appendChild(dialog);dialog.querySelector('form').onsubmit=ev=>{ev.preventDefault();saveEditedAnswer(id)};dialog.addEventListener('cancel',ev=>{ev.preventDefault();closeEditor()});dialog.showModal()}
function splitEditorLines(){for(const [id,lang] of [['editEnglish','en'],['editKorean','ko']]){const field=$(id);field.value=field.value.split(/\n+/).flatMap(p=>sentenceLines(p,lang)).join('\n')}}
function closeEditor(){const d=$('scriptEditor');if(!d)return;d.close();d.remove()}
function saveEditedAnswer(id){const en=$('editEnglish').value.trim(),ko=$('editKorean').value.trim();if(!en){$('editError').textContent='영어 대본을 입력해주세요.';$('editError').classList.remove('hidden');return}S.edits={...(S.edits||{}),[id]:{en,ko,updatedAt:Date.now()}};save();closeEditor();render();toast(storage?'이 문제의 스크립트를 저장했습니다. 다른 문제의 답변은 유지됩니다.':'수정본을 적용했습니다. 자동 저장이 제한되므로 내 기록에서 JSON 백업을 저장하세요.')}
function restoreAnswer(id){if(!confirm('이 문제의 수정 대본을 지우고 기본 답변으로 복원할까요?'))return;delete S.edits[id];save();closeEditor();render();toast('기본 답변으로 복원했습니다.')}

const priorityGroups=[
 {tier:1,name:'주거',ids:['M022_1','M030_6','M028_4'],why:'집 묘사·과거와 현재 비교·문제 해결을 먼저 연습합니다.'},
 {tier:1,name:'공원',ids:['M046_1','M048_2','M050_3'],why:'장소·평소 활동·특정 경험을 구분하는 기본 연습입니다.'},
 {tier:1,name:'카페',ids:['M066_1','M068_2','M070_3'],why:'선택 설문의 장소 묘사와 주문 문제 해결을 준비합니다.'},
 {tier:1,name:'국내여행',ids:['M107_1','M111_2','M113_3'],why:'여행지·준비·경험의 기본 소재를 익히고 해외·해변으로 확장합니다.'},
 {tier:1,name:'음악',ids:['M101_1','M105_3','M105_4'],why:'취향·시작 계기와 변화·경험을 준비해 공연 관련 표현의 바탕으로 씁니다.'},
 {tier:1,name:'집에서 보내는 휴가',ids:['H3_02','H3_03','H3_04'],why:'평소 함께하는 사람·최근 휴가·기억에 남는 휴가의 차이를 익힙니다.'},
 {tier:1,name:'구매·오배송 역할극',ids:['H3_11','H3_12','H3_13'],why:'정보 질문 → 잘못 온 제품의 해결 대안 → 관련 경험의 흐름을 연습합니다. 설문 밖 상황에도 대비합니다.'},
 {tier:1,name:'예약·변경 역할극',ids:['M265_11','M266_12','M267_13'],why:'예약 문의와 변경 요청, 실제 취소 경험을 구분해서 연습합니다.'},
 {tier:2,name:'해변',ids:['H3_05','H3_06','H3_07'],why:'국내여행 소재를 활용하되 마지막 방문과 특별한 사건의 요구를 따로 확인합니다.'},
 {tier:2,name:'해외여행',ids:['M116_1','M119_2','M120_3'],why:'국내여행 답변을 그대로 대입하지 말고 도시·준비물·해외 경험의 차이를 익힙니다.'},
 {tier:2,name:'공연·연극',ids:['M090_2','M092_3','M094_4'],why:'공연장·관람 일과·기억에 남는 작품과 배우를 준비합니다.'},
 {tier:2,name:'콘서트',ids:['M097_2','M098_3','M099_4'],why:'음악 소재에 공연장·관람 전후 활동·특정 공연 경험을 더합니다.'},
 {tier:2,name:'조깅·걷기',ids:['M052_1','M056_3','M058_4'],why:'공원 소재를 활용하되 운동 시작 계기와 현재 걷기·과거 조깅 설정을 구분합니다.'},
 {tier:2,name:'돌발·의견 맛보기',ids:['M204_1','M226_2','H5_15'],why:'날씨 묘사·재활용 절차·사람들의 휴가에 대한 일반 의견을 각각 준비합니다. 세 질문은 하나의 콤보가 아닙니다.'}
];
const priorityIndex=Object.fromEntries(priorityGroups.flatMap(g=>g.ids.map(id=>[D.aliases[id]||id,{tier:g.tier,name:g.name,why:g.why}])));
function priorityBadge(id){const p=priorityIndex[D.aliases[id]||id];return p?`<span class="priority-badge tier${p.tier}" title="${esc(p.why)}">${p.tier===1?'★ 먼저 준비':'☆ 다음 준비'}</span>`:''}
function priorityCards(tier){return priorityGroups.filter(g=>g.tier===tier).flatMap(g=>g.ids.map(id=>C[D.aliases[id]||id]))}
function priorityBanner(){return `<section class="priority-banner"><div><b>전부 외우기 부담된다면, 먼저 ${priorityCards(1).length}문항부터.</b><p>주요 답변 유형을 익힌 뒤 다음 ${priorityCards(2).length}문항으로 선택 설문을 넓혀가세요.</p></div><button class="primary" onclick="go('priority')">★ 우선 준비 목록</button></section>`}
function priorityPage(){$('main').innerHTML=`<div class="eyebrow">Study priorities</div><h1>먼저 준비할 질문만.</h1><p>1순위 ${priorityCards(1).length}문항 → 2순위 ${priorityCards(2).length}문항 → 나머지 질문 순서로 연습하세요. 출제 빈도를 확인한 순위가 아니라 <b>내 설문·유형 차이·소재 재사용</b>을 기준으로 선정한 학습 순서입니다.</p><p class="notice">이 목록만 외우면 IH 또는 전체 질문 대응이 보장된다는 뜻은 아닙니다. 기존 대본은 이번에 보강하지 않았습니다. ‘운동을 전혀 하지 않음’의 독립 질문은 자료에서 미확보입니다.</p>${languageControls()}${[1,2].map(t=>`<section class="panel"><div class="sectiontop"><div><h2>${t===1?'★ 1순위 · 먼저 준비':'☆ 2순위 · 다음 준비'} ${priorityCards(t).length}문항</h2><p class="small">${t===1?'설명·습관·비교·경험·역할극의 기본 답변을 먼저 익히세요.':'나머지 선택 설문과 일부 돌발·일반 의견으로 범위를 넓히세요.'} 익숙함 ${priorityCards(t).filter(c=>state(c.id).status==='익숙함').length} / ${priorityCards(t).length}</p></div><button onclick="printCards(priorityCards(${t}))">${t}순위 묶음 인쇄</button></div>${priorityGroups.filter(g=>g.tier===t).map(g=>`<details class="priority-group" ${t===1?'open':''}><summary>${g.name} · 3문항</summary><p class="small">${g.why}</p><div class="cardlist">${g.ids.map(id=>entry(C[D.aliases[id]||id])).join('')}</div></details>`).join('')}</section>`).join('')}<p class="small">위 묶음은 공부 순서입니다. 교재의 연속 3문항과 재구성한 연습 콤보는 ‘주제 모음’에서 구분해 확인하세요. 표시 없는 문항은 이후 확장 학습용으로 그대로 남겨두었습니다.</p>`}

window.addEventListener('pagehide',()=>{stopSpeech();save()});
