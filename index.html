:8,"related":["M321_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M326_11","page":326,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to make a doctor's appointment. Call the doctor's office, explain your situation, and ask 3 or 4 questions about scheduling the appointment.","qko":"상황을 연기하세요. 진료 예약을 하려고 합니다. 병원에 전화해 상황을 설명하고 예약에 관한 질문 3~4개를 하세요.","source":"pdf","topic":"병원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.326 · M326_11","family":"rp-doctor","cue":"목 아픔 → 시간·의사·준비·비용 → 예약","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I have had a sore throat for two days, and I would like to see a doctor rather than wait longer.","ko":"이틀째 목이 아파 더 기다리지 않고 진료를 받고 싶어요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Do you have an appointment available tomorrow afternoon?","ko":"내일 오후에 예약 가능한 시간이 있나요?","shared":true},{"en":"Which doctor could I see for these symptoms?","ko":"이 증상으로 어느 선생님께 진료받을 수 있나요?","shared":true},{"en":"What documents should I bring for my first visit?","ko":"첫 방문 때 어떤 서류를 가져가야 하나요?","shared":true},{"en":"How much is the consultation before any additional tests?","ko":"추가 검사 전 진료비는 얼마인가요?","shared":true},{"en":"Tomorrow at three works for me. Please book that appointment under the name Kim. I will arrive a little early. Thank you.","ko":"내일 3시면 괜찮아요. 김이라는 이름으로 예약해 주세요. 조금 일찍 도착할게요. 감사합니다.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M326_11","label":"오픽만수르 IM2–IH · p.326 · M326_11"}],"correction":"","scope":"역할극","requirements":["상황을 연기하세요.","진료 예약을 하려고 합니다.","병원에 전화해 상황을 설명하고 예약에 관한 질문 3~4개를 하세요."],"words":95,"representative":"M265_11","additional":0,"sharedCount":8,"related":["M265_11","H2_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M327_12","page":327,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You made an appointment with your doctor, but something came up, and you can't make it. Call the doctor's office, explain the situation and ask a few questions to reschedule your appointment.","qko":"진료 예약을 했지만 일이 생겨 갈 수 없습니다. 병원에 전화해 상황을 설명하고 예약을 다시 잡기 위한 질문을 몇 개 하세요.","source":"pdf","topic":"병원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.327 · M327_12","family":"rp-reschedule","cue":"오늘 못 감 → 내일·모레 → 변경비·확인","lines":[{"en":"Hello, I have an appointment today at three under the name Kim.","ko":"안녕하세요. 오늘 3시에 김이라는 이름으로 예약돼 있어요.","shared":true},{"en":"An urgent family matter has come up, so I won't be able to arrive on time.","ko":"급한 가족 일이 생겨 제시간에 갈 수 없어요.","shared":true},{"en":"I am sorry for the short notice, and I would like to reschedule rather than miss it without calling.","ko":"갑자기 알려드려 죄송하고 연락 없이 빠지기보다 예약을 바꾸고 싶어요.","shared":true},{"en":"Could I move the appointment to tomorrow afternoon instead?","ko":"내일 오후로 옮길 수 있을까요?","shared":true},{"en":"If tomorrow is full, would the morning after that be available?","ko":"내일이 다 찼다면 모레 아침은 가능할까요?","shared":true},{"en":"Is there a fee for changing it this late?","ko":"이렇게 늦게 변경하면 수수료가 있나요?","shared":true},{"en":"Please confirm the new date and time by text once it is arranged.","ko":"정해지면 새 날짜와 시간을 문자로 확인해 주세요.","shared":true},{"en":"Thank you for helping me find another time.","ko":"다른 시간을 잡도록 도와주셔서 감사합니다.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M327_12","label":"오픽만수르 IM2–IH · p.327 · M327_12"}],"correction":"","scope":"역할극","requirements":["진료 예약을 했지만 일이 생겨 갈 수 없습니다.","병원에 전화해 상황을 설명하고 예약을 다시 잡기 위한 질문을 몇 개 하세요."],"words":97,"representative":"M266_12","additional":0,"sharedCount":8,"related":["M266_12","H2_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M329_11","page":329,"title":"","q":"I'd like to give you a situation and ask you to act it out. You need to have a new company ID card issued. Call the person responsible, explain your situation, and ask 3 or 4 questions about how to apply for the new card.","qko":"상황을 드릴 테니 대처를 보여주세요. 당신은 회사에서 발급하는 ID카드를 새로 발급받아야 합니다. 담당자에게 전화하 여 상황을 설명하고, ID카드 발급 절차에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"ID카드","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.329 · M329_11","family":"rp-id","cue":"회사 역할 → 서류·절차·시간·임시카드","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I need to have a new company ID card issued, and I was told to contact you about the application.","ko":"새 사원증을 발급받아야 해서 신청에 관해 연락드리라는 안내를 받았어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which documents do I need to submit?","ko":"어떤 서류를 제출해야 하나요?","shared":false},{"en":"Where should I fill out the application form?","ko":"신청서는 어디에서 작성해야 하나요?","shared":false},{"en":"How long will it take to receive the new card?","ko":"새 카드를 받는 데 얼마나 걸리나요?","shared":false},{"en":"Can I get a temporary pass while I wait?","ko":"기다리는 동안 임시 출입증을 받을 수 있나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M329_11","label":"오픽만수르 IM2–IH · p.329 · M329_11"}],"correction":"","scope":"역할극","requirements":["상황을 드릴 테니 대처를 보여주세요.","당신은 회사에서 발급하는 ID카드를 새로 발급받아야 합니다.","담당자에게 전화하 여 상황을 설명하고, ID카드 발급 절차에 대해 3, 4가지 질문을 해보세요."],"words":82,"representative":"M329_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M330_12","page":330,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You noticed there is an error on your ID card. Contact the person in charge, explain what the problem is, and request a replacement card. Then, suggest two or three possible solutions to resolve the problem quickly.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 ID카드에 문제가 있다는 것을 발견했습니다. 담당자에게 연락하여 문제가 무엇인지 설명하고 새 카드로 교체해 달라고 요청하세요. 그리고 문제를 빠르게 해결하기 위해 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"ID카드","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.330 · M330_12","family":"rp-id-error","cue":"이름 오류 → 오늘 재발급·임시증·수동확인","lines":[{"en":"Hello, I collected my new ID card today, but my name is spelled incorrectly.","ko":"안녕하세요. 오늘 새 ID카드를 받았는데 이름 철자가 틀렸어요.","shared":false},{"en":"The number seems correct, but the name doesn't match my application.","ko":"번호는 맞는 것 같은데 이름이 신청서와 달라요.","shared":false},{"en":"I would like to request a replacement, and I can send you a photo of both documents.","ko":"교체를 요청하고 싶고 두 서류의 사진을 보내드릴 수 있어요.","shared":false},{"en":"Could you print a corrected card today if the information is already in your system?","ko":"정보가 이미 시스템에 있다면 오늘 수정된 카드를 출력해 주실 수 있나요?","shared":false},{"en":"If that takes longer, could I use a temporary pass while I wait?","ko":"더 오래 걸린다면 기다리는 동안 임시 출입증을 쓸 수 있나요?","shared":false},{"en":"Alternatively, could you arrange manual identity checks at the entrance until the new card is ready?","ko":"아니면 새 카드가 나올 때까지 입구에서 수동으로 신원을 확인하도록 할 수 있나요?","shared":false},{"en":"Please confirm when I can collect the replacement.","ko":"교체 카드를 언제 받을 수 있는지 확인해 주세요.","shared":false},{"en":"Thank you for helping me resolve it quickly.","ko":"빨리 해결하도록 도와주셔서 감사합니다.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M330_12","label":"오픽만수르 IM2–IH · p.330 · M330_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만, 당신이 해결해야 할 문제가 있습니다.","당신은 ID카드에 문제가 있다는 것을 발견했습니다.","담당자에게 연락하여 문제가 무엇인지 설명하고 새 카드로 교체해 달라고 요청하세요.","그리고 문제를 빠르게 해결하기 위해 2, 3가지 대안을 제시해 보세요."],"words":102,"representative":"M330_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M331_13","page":331,"title":"","q":"That's the end of the situation. Have you ever had any difficulties when applying for an ID card? What went wrong, and how did you handle the situation? Please describe the entire experience from beginning to end in as many details as possible.","qko":"그것으로 상황은 끝입니다. ID 카드를 발급받으려다 어려움을 겪을 적이 있나요? 무엇이 문제였고 그것을 어 떻게 해결하셨나요? 가능한 많은 세부 내용들과 함께 전체 경험을 처음부터 끝까 지 묘사해 주세요.","source":"pdf","topic":"ID카드","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.331 · M331_13","family":"id-memory","cue":"도서관 카드 → 주소서류 누락 → 확인 → 다음 날","lines":[{"en":"I once had trouble applying for a library ID card after moving to my new neighborhood.","ko":"새 동네로 이사한 뒤 도서관 회원증 신청에 어려움을 겪은 적이 있어요.","shared":false},{"en":"I took my photo identification, but I didn't realize I also needed proof of my current address.","ko":"사진 신분증은 가져갔지만 현주소 증빙도 필요한 줄 몰랐어요.","shared":false},{"en":"The staff couldn't complete the application with the documents I had.","ko":"직원은 제가 가진 서류로 신청을 완료할 수 없었어요.","shared":false},{"en":"I felt frustrated with myself because I had walked there specifically for the card.","ko":"카드를 만들려고 걸어왔기 때문에 제 자신에게 답답했어요.","shared":false},{"en":"I asked exactly which documents were accepted and wrote down the information.","ko":"정확히 어떤 서류가 인정되는지 묻고 적어뒀어요.","shared":false},{"en":"The next day, I returned with the required proof and finished the application.","ko":"다음 날 필요한 증빙을 갖고 가서 신청을 마쳤어요.","shared":false},{"en":"The process was quick once I had everything ready.","ko":"모든 것을 준비하니 절차는 빨랐어요.","shared":false},{"en":"Now I check document requirements before visiting an office in person.","ko":"이제 직접 기관에 가기 전에 서류 요건을 확인해요.","shared":false}],"note":"원문은 ID card 일반 경험을 묻습니다. 일 경험 없음 설정에 맞춰 사원증이 아닌 도서관 회원증으로 답합니다.","sources":[{"id":"M331_13","label":"오픽만수르 IM2–IH · p.331 · M331_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","ID 카드를 발급받으려다 어려움을 겪을 적이 있나요?","무엇이 문제였고 그것을 어 떻게 해결하셨나요?","가능한 많은 세부 내용들과 함께 전체 경험을 처음부터 끝까 지 묘사해 주세요."],"words":103,"representative":"M331_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M332_11","page":332,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend recently bought a new cell phone. Call your friend, explain that you're thinking about buying a new phone, and ask three or four questions about your friend's new phone to get more information.","qko":"상황을 드릴 테니 대처를 보여주세요. 당신의 친구가 최근에 새 휴대폰을 구매했습니다. 친구에게 전화하여 당신이 새 휴대폰을 구매하려고 고민중이라는 것을 설명하고, 친구의 새 휴대폰에 대한 정 보를 알아보기 위해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"휴대폰","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.332 · M332_11","family":"rp-newphone","cue":"새 폰 고민 → 모델·배터리·사진·가격","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I heard you bought a new phone, and I am considering replacing mine because its battery is getting weak.","ko":"새 휴대폰을 샀다고 들었어. 내 건 배터리가 약해져서 바꿀까 생각 중이야.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which model did you choose?","ko":"어떤 모델을 골랐어?","shared":false},{"en":"Does the battery last a full day with normal use?","ko":"평소처럼 쓰면 배터리가 하루 종일 가?","shared":false},{"en":"How clear are the photos when you take them indoors?","ko":"실내 사진은 얼마나 선명해?","shared":false},{"en":"How much did you pay for the phone itself?","ko":"휴대폰 자체 가격으로 얼마를 냈어?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M332_11","label":"오픽만수르 IM2–IH · p.332 · M332_11"}],"correction":"","scope":"역할극","requirements":["상황을 드릴 테니 대처를 보여주세요.","당신의 친구가 최근에 새 휴대폰을 구매했습니다.","친구에게 전화하여 당신이 새 휴대폰을 구매하려고 고민중이라는 것을 설명하고, 친구의 새 휴대폰에 대한 정 보를 알아보기 위해 3, 4가지 질문을 해보세요."],"words":81,"representative":"M332_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M333_12","page":333,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. Your friend sent you a document, but unfortunately, you cannot open it on your cell phone. Call your friend, explain the issue, and suggest two or three alternative ways to receive or access the document.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신의 친구가 당신에게 문서 하나를 보냈습니다. 그러나 불행하게도 당신의 휴 대폰에서 그 파일을 열어볼 수가 없습니다. 친구에게 전화하여 문제를 설명하고 그 문서를 받거나 열어보기 위한 2, 3가지 다른 대안을 제시해 보세요.","source":"pdf","topic":"휴대폰","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.333 · M333_12","family":"rp-file","cue":"폰에서 안 열림 → PDF·링크·컴퓨터","lines":[{"en":"Hi Min, I received the document you sent, but I can't open it on my phone.","ko":"민아, 네가 보낸 문서를 받았는데 휴대폰에서 열리지 않아.","shared":false},{"en":"An error message appears every time I tap the file, even after downloading it again.","ko":"다시 내려받아도 파일을 누를 때마다 오류 메시지가 떠.","shared":false},{"en":"I need to read the information before tomorrow, so I would like to try another way.","ko":"내일 전에 읽어야 해서 다른 방법을 시도하고 싶어.","shared":false},{"en":"Could you save it as a PDF and send that version to me?","ko":"PDF로 저장해서 그 버전을 보내줄 수 있을까?","shared":false},{"en":"Or you could upload it to a shared folder and send me a link to view it in a browser.","ko":"아니면 공유 폴더에 올리고 브라우저로 볼 링크를 보내줘도 돼.","shared":false},{"en":"If those options don't work, please email it so I can open it on my laptop.","ko":"그 방법이 안 되면 노트북에서 열도록 이메일로 보내줘.","shared":false},{"en":"I will let you know as soon as I can read it.","ko":"읽을 수 있게 되면 바로 알려줄게.","shared":false},{"en":"Thanks for sending it again.","ko":"다시 보내줘서 고마워.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M333_12","label":"오픽만수르 IM2–IH · p.333 · M333_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만, 당신이 해결해야 할 문제가 있습니다.","당신의 친구가 당신에게 문서 하나를 보냈습니다.","그러나 불행하게도 당신의 휴 대폰에서 그 파일을 열어볼 수가 없습니다.","친구에게 전화하여 문제를 설명하고 그 문서를 받거나 열어보기 위한 2, 3가지 다른 대안을 제시해 보세요."],"words":113,"representative":"M333_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M334_13","page":334,"title":"","q":"That's the end of the situation. Have you ever had a problem with your cell phone? What was the issue, and how did you fix it? Please describe the whole experience from beginning to end in as much detail as you can.","qko":"그것으로 상황은 끝입니다. 휴대폰을 사용하면서 문제를 겪은 적이 있나요? 문제가 무엇이었고 어떻게 고치 셨나요? 가능한 많은 세부 내용들과 함께 그 경험의 모든 것을 처음부터 끝까지 묘사해 주세요.","source":"pdf","topic":"휴대폰","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.334 · M334_13","family":"phone-file-memory","cue":"지난달 파일 → 안 열림 → 민 연락 → PDF → 성공","lines":[{"en":"Last month, I couldn't open a travel document that Min sent to my phone.","ko":"지난달 민이가 보낸 여행 문서를 제 휴대폰에서 열 수 없었어요.","shared":false},{"en":"We needed to check the hotel address before leaving, so the timing was inconvenient.","ko":"출발 전에 호텔 주소를 확인해야 해서 곤란했어요.","shared":false},{"en":"I downloaded it again, but the same error appeared.","ko":"다시 내려받아도 같은 오류가 났어요.","shared":false},{"en":"Instead of guessing, I called Min and explained what was happening.","ko":"짐작하지 않고 민이에게 전화해 상황을 설명했어요.","shared":false},{"en":"He realized the file format might not work with my phone and saved a PDF version.","ko":"친구가 파일 형식이 폰과 맞지 않을 수 있다고 보고 PDF로 저장했어요.","shared":false},{"en":"When he sent the new version, I opened it immediately and saved it for offline use.","ko":"새 버전을 보내자 바로 열렸고 인터넷 없이 보도록 저장했어요.","shared":false},{"en":"I felt relieved because we could still leave on time.","ko":"제시간에 출발할 수 있어 안심했어요.","shared":false},{"en":"Since then, I check important travel files before the day of a trip.","ko":"그 후 중요한 여행 파일은 여행 당일 전에 확인해요.","shared":false}],"note":"","sources":[{"id":"M334_13","label":"오픽만수르 IM2–IH · p.334 · M334_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","휴대폰을 사용하면서 문제를 겪은 적이 있나요?","문제가 무엇이었고 어떻게 고치 셨나요?","가능한 많은 세부 내용들과 함께 그 경험의 모든 것을 처음부터 끝까지 묘사해 주세요."],"words":103,"representative":"M334_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M335_11","page":335,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are thinking about joining a gym. Call the gym, explain your situation, and ask three or four questions about membership options, facilities, or classes before you decide to register","qko":"헬스장 등록을 고민 중입니다. 헬스장에 전화해 상황을 설명하고 가입 결정 전에 회원권·시설·수업에 관해 질문 3~4개를 하세요.","source":"pdf","topic":"헬스장","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.335 · M335_11","family":"rp-gym","cue":"초보·가벼운 운동 → 가격·수업·시설·체험","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I don't work out regularly, and I am considering a membership so I can start slowly.","ko":"정기적으로 운동하지 않아서 천천히 시작해보려고 회원권을 고민 중이에요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"How much is a monthly membership?","ko":"한 달 회원권은 얼마인가요?","shared":false},{"en":"Do you offer any beginner classes?","ko":"초보자 수업이 있나요?","shared":false},{"en":"Which facilities are included in the membership?","ko":"회원권에 어떤 시설 이용이 포함되나요?","shared":false},{"en":"Could I try the gym once before signing up?","ko":"등록하기 전에 한 번 체험할 수 있나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M335_11","label":"오픽만수르 IM2–IH · p.335 · M335_11"}],"correction":"","scope":"역할극","requirements":["헬스장 등록을 고민 중입니다.","헬스장에 전화해 상황을 설명하고 가입 결정 전에 회원권·시설·수업에 관해 질문 3~4개를 하세요."],"words":72,"representative":"M335_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M336_12","page":336,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You signed up for a gym membership, but after visiting, you found that the gym did not meet your expectations. Call the gym, explain your dissatisfaction, and suggest two or three options to request a cancellation or refund","qko":"등록한 헬스장에 방문했는데 기대와 달랐습니다. 전화해 불만족한 점을 설명하고 취소나 환불을 요청하는 방법 2~3개를 제시하세요.","source":"pdf","topic":"헬스장","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.336 · M336_12","family":"rp-gym-cancel","cue":"기대와 다른 수업·혼잡 → 전액·사용분 제외 환불","lines":[{"en":"Hello, I joined your gym yesterday, but my first visit was quite different from what I expected.","ko":"안녕하세요. 어제 등록했는데 첫 방문이 기대와 상당히 달랐어요.","shared":false},{"en":"I was told the beginner class would be gentle, but it was too intense for me.","ko":"초보자 수업이 가볍다고 들었지만 제게는 너무 강도가 높았어요.","shared":false},{"en":"The room was also so crowded that I couldn't follow the instructor comfortably.","ko":"너무 붐벼서 강사를 편하게 따라갈 수도 없었어요.","shared":false},{"en":"I would like to cancel the membership rather than continue with a program that doesn't suit me.","ko":"맞지 않는 프로그램을 계속하기보다 회원권을 취소하고 싶어요.","shared":false},{"en":"Could you offer a full refund under your cancellation policy, since I have only attended once?","ko":"한 번만 참석했으니 취소 규정에 따라 전액 환불이 가능할까요?","shared":false},{"en":"If that isn't possible, could you deduct the cost of one visit and refund the unused portion?","ko":"안 된다면 한 번 이용한 비용을 빼고 미사용분을 환불해 주실 수 있나요?","shared":false},{"en":"Please explain the available options and confirm the amount before processing anything.","ko":"처리 전에 가능한 방법과 금액을 확인해 주세요.","shared":false},{"en":"Thank you for checking my request.","ko":"요청을 확인해 주셔서 감사합니다.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M336_12","label":"오픽만수르 IM2–IH · p.336 · M336_12"}],"correction":"","scope":"역할극","requirements":["등록한 헬스장에 방문했는데 기대와 달랐습니다.","전화해 불만족한 점을 설명하고 취소나 환불을 요청하는 방법 2~3개를 제시하세요."],"words":114,"representative":"M336_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M337_13","page":337,"title":"","q":"That's the end of the situation. Have you ever experienced any problems after signing up for a gym membership? What kind of issues did you face, and how did you solve them? Please describe the entire experience from beginning to end in as many details as possible.","qko":"그것으로 상황은 끝입니다. 헬스장 회원으로 등록한 후에 문제를 겪은 경험이 있나요? 어떤 문제를 마주했었 고 어떻게 해결하였나요? 처음부터 끝까지 전체 경험을 가능한 한 자세하게 설명 해 주세요","source":"pdf","topic":"헬스장","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.337 · M337_13","family":"gym-memory","cue":"예전 체험 등록 → 너무 강함 → 취소 → 산책","lines":[{"en":"About two years ago, I signed up for a short beginner program at a gym.","ko":"2년쯤 전에 헬스장의 짧은 초보자 프로그램에 등록했어요.","shared":false},{"en":"I didn't exercise regularly, so I expected a gentle introduction.","ko":"정기적으로 운동하지 않아서 가벼운 입문 수업을 기대했어요.","shared":false},{"en":"However, the first class moved too quickly, and I couldn't comfortably follow the exercises.","ko":"하지만 첫 수업이 너무 빨라 편하게 따라 할 수 없었어요.","shared":false},{"en":"I stopped when I felt uncomfortable and spoke to the instructor afterward.","ko":"불편할 때 멈추고 수업 후 강사에게 말했어요.","shared":false},{"en":"I explained that the program didn't match what I had been told and asked about cancellation.","ko":"안내받은 내용과 맞지 않는다고 설명하고 취소를 물었어요.","shared":false},{"en":"The gym checked the policy and refunded the unused classes after deducting the first session.","ko":"헬스장은 규정을 확인하고 첫 수업을 뺀 미사용 수업비를 환불했어요.","shared":false},{"en":"I was glad we could resolve it calmly.","ko":"차분하게 해결해서 다행이었어요.","shared":false},{"en":"I haven't kept a gym membership since then; these days, I mostly take light walks.","ko":"그 이후 헬스장 회원권은 유지하지 않고 요즘은 주로 가볍게 산책해요.","shared":false}],"note":"","sources":[{"id":"M337_13","label":"오픽만수르 IM2–IH · p.337 · M337_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","헬스장 회원으로 등록한 후에 문제를 겪은 경험이 있나요?","어떤 문제를 마주했었 고 어떻게 해결하였나요?","처음부터 끝까지 전체 경험을 가능한 한 자세하게 설명 해 주세요"],"words":105,"representative":"M337_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M338_11","page":338,"title":"","q":"I'd like to give you a situation and ask you to act it out. You’ve been asked to write an in -depth magazine interview with a celebrity. Call their agent and explain your idea. Then ask three or four thoughtful questions that reveal the celebrity’s personality, values, or recent projects.","qko":"유명 연예인과의 심층 인터뷰를 잡지에 싣기로 했습니다. 연예인의 에이전트에게 전화를 걸어 취재 의도를 설명하고, 연예인의 성격이나 가치관, 최근 활동을 잘 보여줄 수 있는 질문을 3~4개 해보세요.","source":"pdf","topic":"인터뷰","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.338 · M338_11","family":"rp-interview","cue":"잡지 역할 → 성격·가치·최근 작업·동기","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am preparing a magazine interview about June, focusing on the person behind the music rather than just her popularity.","ko":"준이의 인기뿐 아니라 음악 뒤의 사람에 초점을 둔 잡지 인터뷰를 준비하고 있어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"How would you describe her personality when she works with other people?","ko":"다른 사람과 작업할 때 성격을 어떻게 설명하시겠어요?","shared":false},{"en":"What values matter most to her when choosing a project?","ko":"작업을 고를 때 어떤 가치를 가장 중요하게 생각하나요?","shared":false},{"en":"What is she working on at the moment?","ko":"현재 어떤 작업을 하고 있나요?","shared":false},{"en":"Why is that project personally important to her?","ko":"그 작업이 개인적으로 중요한 이유는 무엇인가요?","shared":false},{"en":"Your answers would help us prepare a thoughtful interview. I can send the questions by email as well. Thank you.","ko":"답변은 깊이 있는 인터뷰를 준비하는 데 도움이 될 거예요. 질문을 이메일로도 보내드릴 수 있어요. 감사합니다.","shared":false}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M338_11","label":"오픽만수르 IM2–IH · p.338 · M338_11"}],"correction":"","scope":"역할극","requirements":["유명 연예인과의 심층 인터뷰를 잡지에 싣기로 했습니다.","연예인의 에이전트에게 전화를 걸어 취재 의도를 설명하고, 연예인의 성격이나 가치관, 최근 활동을 잘 보여줄 수 있는 질문을 3~4개 해보세요."],"words":96,"representative":"M338_11","additional":0,"sharedCount":2,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M339_12","page":339,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. After the article is published, you noticed several important mistakes in the printed interview. Call the editor to explain your concerns and propose two or three professional ways to handle the situation, such as issuing a correction notice or updating the online version.","qko":"인터뷰 기사가 출간된 후, 중요한 내용 몇 가지가 잘못 실린 것을 발견했습니다. 편집자에게 전화해서 문제를 설명하고, 정정 공지나 온라인 버전 수정 등 전문적 인 방식으로 해결할 수 있는 2~3가지 방법을 제안해 보세요.","source":"pdf","topic":"인터뷰","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.339 · M339_12","family":"rp-article","cue":"인터뷰 오류 → 온라인 정정·다음 호·독자 공지","lines":[{"en":"Hello, I am calling about the interview published in the latest issue.","ko":"안녕하세요. 최근 호에 실린 인터뷰 때문에 전화했어요.","shared":false},{"en":"The article gives a release date that the artist never confirmed, and one quotation changes her meaning.","ko":"기사에 가수가 확정하지 않은 발매일이 있고 인용문 하나는 의미가 달라졌어요.","shared":false},{"en":"I have checked the recording, so I can send you the correct information.","ko":"녹음을 확인했으니 정확한 내용을 보내드릴 수 있어요.","shared":false},{"en":"Could we correct the online version immediately and add a clear correction note?","ko":"온라인판을 즉시 고치고 명확한 정정 안내를 붙일 수 있을까요?","shared":false},{"en":"For the printed copies, we could publish a correction in the next issue.","ko":"인쇄본은 다음 호에 정정문을 실을 수 있어요.","shared":false},{"en":"We could also notify subscribers by email so they don't keep sharing the wrong information.","ko":"독자가 잘못된 정보를 계속 공유하지 않도록 구독자에게 이메일로 알릴 수도 있어요.","shared":false},{"en":"Please let me know the fastest way to arrange these changes.","ko":"이 수정을 가장 빨리 진행할 방법을 알려주세요.","shared":false},{"en":"I want to protect both the reader's trust and the artist's original meaning.","ko":"독자의 신뢰와 가수의 원래 의도를 모두 지키고 싶어요.","shared":false}],"note":"잡지 담당자 역할의 가상 상황입니다. 실제 직업 설정은 바꾸지 않습니다.","sources":[{"id":"M339_12","label":"오픽만수르 IM2–IH · p.339 · M339_12"}],"correction":"","scope":"역할극","requirements":["인터뷰 기사가 출간된 후, 중요한 내용 몇 가지가 잘못 실린 것을 발견했습니다.","편집자에게 전화해서 문제를 설명하고, 정정 공지나 온라인 버전 수정 등 전문적 인 방식으로 해결할 수 있는 2~3가지 방법을 제안해 보세요."],"words":107,"representative":"M339_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M340_13","page":340,"title":"","q":"That's the end of the situation. Describe a time when you met a celebrity in person. What was the occasion, how did you interact, and how did it affect you afterward? Please provide as many details as possible.","qko":"연예인을 직접 만났던 경험에 대해 이야기해 주세요. 어떤 상황이었고, 어떻게 교 류했으며, 그 경험이 이후에 당신에게 어떤 영향을 주었는지 구체적으로 설명해 주세요.","source":"pdf","topic":"인터뷰","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.340 · M340_13","family":"celebrity","cue":"준 공연 뒤 → 인사 → 노래 감사 → 더 가까움","lines":[{"en":"Last fall, I briefly met the singer June after a small concert in Seoul.","ko":"지난가을 서울의 작은 콘서트 후 가수 준이를 잠깐 만났어요.","shared":false},{"en":"Min and I were leaving when the staff announced a short greeting session near the lobby.","ko":"민이와 나가려는데 직원이 로비 근처의 짧은 인사 시간을 안내했어요.","shared":false},{"en":"We waited in line, and I felt nervous because I had never spoken to a singer I liked.","ko":"줄을 서서 기다렸고 좋아하는 가수에게 말한 적이 없어 긴장됐어요.","shared":false},{"en":"When it was my turn, I thanked her for a song that helped me relax.","ko":"제 차례가 되자 편안함을 주는 노래에 대해 감사하다고 했어요.","shared":false},{"en":"She smiled and said she was happy that the song meant something to me.","ko":"가수는 웃으며 그 노래가 제게 의미가 있어 기쁘다고 했어요.","shared":false},{"en":"The conversation lasted only a few seconds, but it felt very personal.","ko":"대화는 몇 초뿐이었지만 아주 개인적으로 느껴졌어요.","shared":false},{"en":"After that, listening to her music reminded me of a real person rather than just a recording.","ko":"그 후 음악을 들으면 단순한 녹음이 아니라 실제 사람이 떠올랐어요.","shared":false},{"en":"It made me appreciate the connection that live performances can create.","ko":"라이브 공연이 만드는 연결을 소중하게 생각하게 됐어요.","shared":false}],"note":"가수와 만남은 연습용 가상 경험입니다.","sources":[{"id":"M340_13","label":"오픽만수르 IM2–IH · p.340 · M340_13"}],"correction":"","scope":"돌발·확장","requirements":["연예인을 직접 만났던 경험에 대해 이야기해 주세요.","어떤 상황이었고, 어떻게 교 류했으며, 그 경험이 이후에 당신에게 어떤 영향을 주었는지 구체적으로 설명해 주세요."],"words":117,"representative":"M340_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_01","source":"photo","set":1,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요.","title":"자기소개를 해주세요.","type":"자기소개","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q01","family":"intro","cue":"혼자 생활 → 산책·음악 → 영어 목표","lines":[{"en":"Hello, my name is Kim, and I live alone in an apartment in Seoul.","ko":"안녕하세요. 저는 김이고 서울의 아파트에 혼자 살아요.","shared":false},{"en":"I am not a student, and I don't have any work experience yet.","ko":"학생은 아니고 아직 일 경험은 없어요.","shared":false},{"en":"It has been more than five years since I last took a class.","ko":"마지막으로 수업을 들은 지는 5년이 넘었어요.","shared":false},{"en":"These days, I practice English on my own and try to keep a simple daily routine.","ko":"요즘은 혼자 영어를 연습하며 단순한 일상을 유지하려 해요.","shared":false},{"en":"In my free time, I enjoy listening to music and taking light walks near my home.","ko":"여가에는 음악을 듣거나 집 근처에서 가볍게 산책하는 걸 좋아해요.","shared":false},{"en":"I also like meeting my friend Min at a cafe when we both have time.","ko":"시간이 맞으면 친구 민이를 카페에서 만나는 것도 좋아해요.","shared":false},{"en":"I am a little quiet at first, but I enjoy talking once I feel comfortable.","ko":"처음에는 조금 조용하지만 편해지면 이야기하는 걸 좋아해요.","shared":false},{"en":"I hope to express my experiences more clearly in English, so I am glad to practice today.","ko":"영어로 경험을 더 분명히 표현하고 싶어서 오늘 연습하게 돼 좋아요.","shared":false}],"note":"","sources":[{"id":"H1_01","label":"해커스 오픽 매뉴얼 · 사진 1 · Q01"},{"id":"H2_01","label":"해커스 오픽 매뉴얼 · 사진 2 · Q01"},{"id":"H3_01","label":"해커스 오픽 매뉴얼 · 사진 3 · Q01"},{"id":"H4_01","label":"해커스 오픽 매뉴얼 · 사진 4 · Q01"},{"id":"H5_01","label":"해커스 오픽 매뉴얼 · 사진 5 · Q01"},{"id":"H6_01","label":"해커스 오픽 매뉴얼 · 사진 6 · Q01"}],"correction":"","scope":"시작","requirements":["자기소개를 해주세요."],"words":119,"representative":"H1_01","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_02","source":"photo","set":1,"number":2,"topic":"집","q":"I'd like to know about the place where you live. Do you live in an apartment or a house? What does it look like? How many rooms does it have? Describe it in as much detail as possible.","qko":"사는 곳이 아파트인지 주택인지, 모습과 방의 수를 자세히 설명하세요.","title":"사는 곳이 아파트인지 주택인지, 모습과 방의 수를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q02","family":"home","cue":"혼자 사는 아파트 → 방 두 개 → 침실","lines":[{"en":"I live alone in a small apartment in Seoul.","ko":"저는 서울의 작은 아파트에 혼자 살아요.","shared":true},{"en":"It has two rooms, a living room, a kitchen, and one bathroom.","ko":"방 두 개와 거실, 부엌, 화장실 한 개가 있어요.","shared":true},{"en":"The walls are white, and the wooden floor makes the place feel warm.","ko":"벽은 흰색이고 나무 바닥 때문에 따뜻한 느낌이 나요.","shared":true},{"en":"My favorite room is the bedroom because it is quiet and gets plenty of sunlight.","ko":"가장 좋아하는 방은 조용하고 햇빛이 잘 드는 침실이에요.","shared":true},{"en":"There is a bed beside the window and a small desk against the wall.","ko":"창문 옆에는 침대가 있고 벽 쪽에는 작은 책상이 있어요.","shared":true},{"en":"I keep my books on the desk and my clothes in a small closet.","ko":"책은 책상에, 옷은 작은 옷장에 둬요.","shared":true},{"en":"In the evening, I listen to music there and take a break from my phone.","ko":"저녁에는 거기서 음악을 들으며 휴대폰을 잠시 내려놓아요.","shared":true},{"en":"It isn't a big place, but it is easy to clean and comfortable enough for me.","ko":"넓지는 않지만 청소하기 쉽고 혼자 지내기에 편안해요.","shared":true}],"note":"","sources":[{"id":"H1_02","label":"해커스 오픽 매뉴얼 · 사진 1 · Q02"}],"correction":"","scope":"설문 중심","requirements":["사는 곳이 아파트인지 주택인지, 모습과 방의 수를 자세히 설명하세요."],"words":108,"representative":"M022_1","additional":0,"sharedCount":8,"related":["M022_1","M024_2","H6_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_03","source":"photo","set":1,"number":3,"topic":"집","q":"There are always problems that happen in any home. Things break, projects do not go as planned, or people you live with don't cooperate. Tell me about some problems that have happened in your home.","qko":"고장, 계획 차질, 동거인의 비협조 같은 예를 참고해 집에서 발생했던 문제들을 말하세요.","title":"고장, 계획 차질, 동거인의 비협조 같은 예를 참고해 집에서 발생했던 문제들을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q03","family":"home-repair","cue":"지난여름 → 에어컨 누수 → 기사 → 수리","lines":[{"en":"Last summer, water started dripping from the air conditioner in my living room.","ko":"지난여름 거실 에어컨에서 물이 떨어지기 시작했어요.","shared":true},{"en":"I had just turned it on when I noticed a wet patch on the floor.","ko":"켜고 얼마 지나지 않아 바닥이 젖은 걸 발견했어요.","shared":true},{"en":"I was worried that the water might damage the wooden floor.","ko":"물이 나무 바닥을 상하게 할까 봐 걱정됐어요.","shared":true},{"en":"I turned the unit off, put a towel under it, and called a repair service.","ko":"전원을 끄고 아래에 수건을 깐 뒤 수리 업체에 전화했어요.","shared":true},{"en":"The technician came the next morning and found a blocked drain pipe.","ko":"다음 날 아침 기사가 와서 배수관이 막힌 걸 확인했어요.","shared":true},{"en":"He cleared the pipe and tested the air conditioner before leaving.","ko":"배수관을 뚫고 에어컨이 잘 작동하는지 확인한 뒤 갔어요.","shared":true},{"en":"The leak stopped, and fortunately the floor was fine.","ko":"누수는 멈췄고 다행히 바닥도 괜찮았어요.","shared":true},{"en":"I felt relieved, and now I arrange regular maintenance before summer.","ko":"안심이 됐고 이제는 여름 전에 정기 점검을 받아요.","shared":true},{"en":"Another problem was a desk with a loose leg, which I fixed by tightening the screws.","ko":"또 책상 다리가 헐거워진 적이 있는데 나사를 조여 고쳤어요.","shared":false},{"en":"Living alone means I have to decide which problems I can handle and which need an expert.","ko":"혼자 살다 보니 직접 해결할 일과 전문가가 필요한 일을 구분해야 해요.","shared":false}],"note":"","sources":[{"id":"H1_03","label":"해커스 오픽 매뉴얼 · 사진 1 · Q03"}],"correction":"","scope":"설문 중심","requirements":["고장, 계획 차질, 동거인의 비협조 같은 예를 참고해 집에서 발생했던 문제들을 말하세요."],"words":130,"representative":"M028_4","additional":2,"sharedCount":8,"related":["M028_4","H1_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_04","source":"photo","set":1,"number":4,"topic":"집","q":"Tell me about a problem that happened in your home. When did it happen? What caused the problem? Tell me in detail how you solved the problem.","qko":"집에서 생긴 문제의 시점과 원인, 해결 과정을 자세히 말하세요.","title":"집에서 생긴 문제의 시점과 원인, 해결 과정을 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q04","family":"home-repair","cue":"지난여름 → 에어컨 누수 → 기사 → 수리","lines":[{"en":"Last summer, water started dripping from the air conditioner in my living room.","ko":"지난여름 거실 에어컨에서 물이 떨어지기 시작했어요.","shared":true},{"en":"I had just turned it on when I noticed a wet patch on the floor.","ko":"켜고 얼마 지나지 않아 바닥이 젖은 걸 발견했어요.","shared":true},{"en":"I was worried that the water might damage the wooden floor.","ko":"물이 나무 바닥을 상하게 할까 봐 걱정됐어요.","shared":true},{"en":"I turned the unit off, put a towel under it, and called a repair service.","ko":"전원을 끄고 아래에 수건을 깐 뒤 수리 업체에 전화했어요.","shared":true},{"en":"The technician came the next morning and found a blocked drain pipe.","ko":"다음 날 아침 기사가 와서 배수관이 막힌 걸 확인했어요.","shared":true},{"en":"He cleared the pipe and tested the air conditioner before leaving.","ko":"배수관을 뚫고 에어컨이 잘 작동하는지 확인한 뒤 갔어요.","shared":true},{"en":"The leak stopped, and fortunately the floor was fine.","ko":"누수는 멈췄고 다행히 바닥도 괜찮았어요.","shared":true},{"en":"I felt relieved, and now I arrange regular maintenance before summer.","ko":"안심이 됐고 이제는 여름 전에 정기 점검을 받아요.","shared":true}],"note":"","sources":[{"id":"H1_04","label":"해커스 오픽 매뉴얼 · 사진 1 · Q04"}],"correction":"","scope":"설문 중심","requirements":["집에서 생긴 문제의 시점과 원인, 해결 과정을 자세히 말하세요."],"words":97,"representative":"M028_4","additional":0,"sharedCount":8,"related":["M028_4","H1_03"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_05","source":"photo","set":1,"number":5,"topic":"국내여행","q":"You mentioned in your background survey that you like to travel domestically. What places do you enjoy visiting? Do you like going to mountains or beaches more? Tell me about a specific area you like to visit, and explain why you like going there.","qko":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","title":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","type":"묘사 + 선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q05","family":"travel-place","cue":"강릉 경포 → 모래·소나무 → 바다 선호 → 휴식","lines":[{"en":"My favorite domestic destination is Gangneung on Korea's east coast.","ko":"제가 좋아하는 국내 여행지는 한국 동해안의 강릉이에요.","shared":true},{"en":"I especially like Gyeongpo Beach, with its long sandy shore and pine trees nearby.","ko":"특히 긴 모래 해변과 근처 소나무가 있는 경포해변을 좋아해요.","shared":true},{"en":"The water looks bright blue on a clear day, and the open view feels refreshing.","ko":"맑은 날에는 바다가 밝은 파란색이고 탁 트인 풍경이 시원해요.","shared":true},{"en":"I prefer beaches to mountains because I can walk slowly without a difficult climb.","ko":"힘들게 오르지 않고 천천히 걸을 수 있어 산보다 해변이 좋아요.","shared":true},{"en":"I also enjoy visiting small cafes and trying local food in the city.","ko":"시내의 작은 카페에 가고 지역 음식을 먹는 것도 좋아해요.","shared":true},{"en":"Domestic trips are convenient because I can travel by train and communicate easily.","ko":"기차로 갈 수 있고 말도 편하게 통하니 국내여행은 편리해요.","shared":true},{"en":"Even a short visit gives me a clear break from my usual surroundings.","ko":"잠깐 다녀와도 평소 환경에서 확실히 벗어난 기분이 들어요.","shared":true},{"en":"That is why I keep choosing the coast when I need to recharge.","ko":"그래서 기운을 되찾고 싶을 때 바닷가를 계속 골라요.","shared":true}],"note":"","sources":[{"id":"H1_05","label":"해커스 오픽 매뉴얼 · 사진 1 · Q05"},{"id":"H4_08","label":"해커스 오픽 매뉴얼 · 사진 4 · Q08"}],"correction":"","scope":"설문 중심","requirements":["즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요."],"words":105,"representative":"M107_1","additional":0,"sharedCount":8,"related":["M107_1","H3_05","H6_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_06","source":"photo","set":1,"number":6,"topic":"국내여행","q":"Think about a trip you took when you were young. Where did you travel? Who went with you? What did you do during that trip?","qko":"어릴 때 여행한 장소, 동행, 여행 중 활동을 말하세요.","title":"어릴 때 여행한 장소, 동행, 여행 중 활동을 말하세요.","type":"어린 시절 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q06","family":"child-trip","cue":"초등학생 → 부모님과 바다 → 모래성·조개","lines":[{"en":"When I was about ten, my parents took me to a beach on Korea's east coast.","ko":"열 살쯤 부모님과 한국 동해안의 해변에 갔어요.","shared":false},{"en":"We drove there early in the morning, and I kept asking when we would arrive.","ko":"아침 일찍 차로 갔고 저는 언제 도착하느냐고 계속 물었어요.","shared":false},{"en":"It was my first clear memory of seeing such a wide ocean.","ko":"그렇게 넓은 바다를 본 첫 뚜렷한 기억이에요.","shared":false},{"en":"My father helped me build a sandcastle while my mother took pictures.","ko":"아버지는 모래성 만드는 걸 도와주시고 어머니는 사진을 찍으셨어요.","shared":false},{"en":"Then we walked along the shore and looked at shells without taking them home.","ko":"그다음 해안을 걸으며 조개껍데기를 구경했고 집으로 가져오진 않았어요.","shared":false},{"en":"For lunch, we had noodles at a small restaurant near the beach.","ko":"점심에는 해변 근처 작은 식당에서 국수를 먹었어요.","shared":false},{"en":"I was tired on the way back, but I couldn't stop talking about the waves.","ko":"돌아올 때 피곤했지만 파도 이야기를 멈출 수 없었어요.","shared":false},{"en":"That simple family trip is one reason I still like beaches today.","ko":"그 소박한 가족 여행 덕분에 지금도 해변을 좋아해요.","shared":false}],"note":"","sources":[{"id":"H1_06","label":"해커스 오픽 매뉴얼 · 사진 1 · Q06"}],"correction":"","scope":"설문 중심","requirements":["어릴 때 여행한 장소, 동행, 여행 중 활동을 말하세요."],"words":108,"representative":"H1_06","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_07","source":"photo","set":1,"number":7,"topic":"국내여행","q":"Describe the most memorable experience you have had while on a trip. When was it, and where were you? What happened? Why was it so unforgettable? Describe the experience in detail.","qko":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","title":"가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q07","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H1_07","label":"해커스 오픽 매뉴얼 · 사진 1 · Q07"},{"id":"H4_10","label":"해커스 오픽 매뉴얼 · 사진 4 · Q10"},{"id":"H6_13","label":"해커스 오픽 매뉴얼 · 사진 6 · Q13"}],"correction":"","scope":"설문 중심","requirements":["가장 기억에 남는 여행 경험의 시점·장소·사건과 잊지 못하는 이유를 자세히 말하세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","M216_3","H3_06","H3_07","H5_07","H6_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_08","source":"photo","set":1,"number":8,"topic":"은행","q":"Tell me about banks in your country. Describe their locations, designs, and operating hours. Give as many details about them as possible.","qko":"국내 은행의 위치, 디자인, 운영 시간을 자세히 설명하세요.","title":"국내 은행의 위치, 디자인, 운영 시간을 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q08","family":"bank","cue":"큰길·역 → 창구·ATM → 동네 지점 9~4","lines":[{"en":"The banks I see in Korea are usually near main roads, stations, or shopping areas.","ko":"제가 한국에서 보는 은행은 보통 큰길, 역, 상점가 근처에 있어요.","shared":true},{"en":"Many branches are on the ground floor, which makes them easy to enter.","ko":"많은 지점이 1층에 있어 들어가기 편해요.","shared":true},{"en":"Inside, there are service counters, a waiting area, and machines for taking a number.","ko":"안에는 창구, 대기 공간, 번호표 기계가 있어요.","shared":true},{"en":"ATMs are often near the entrance for quick withdrawals and deposits.","ko":"빠르게 돈을 찾고 넣는 ATM은 보통 입구 근처에 있어요.","shared":true},{"en":"The branch I use opens around nine and closes around four on weekdays, though hours vary.","ko":"제가 이용하는 지점은 평일 대략 9시에 열고 4시에 닫지만 시간은 지점마다 달라요.","shared":true},{"en":"People go there to discuss accounts, exchange money, or get help with paperwork.","ko":"사람들은 계좌를 상담하거나 환전하거나 서류 도움을 받으러 가요.","shared":true},{"en":"The design is usually bright and practical rather than decorative.","ko":"디자인은 보통 장식적이기보다 밝고 실용적이에요.","shared":true},{"en":"I check the branch's hours before visiting because I don't want to arrive too late.","ko":"너무 늦게 도착하지 않도록 방문 전에 시간을 확인해요.","shared":true}],"note":"사람들의 이용 목적·은행 위치를 설명합니다. 지점 운영 시간은 연습용 사례이며 모든 은행의 현재 운영 시간을 단정하지 않습니다.","sources":[{"id":"H1_08","label":"해커스 오픽 매뉴얼 · 사진 1 · Q08"}],"correction":"","scope":"돌발·확장","requirements":["국내 은행의 위치, 디자인, 운영 시간을 자세히 설명하세요."],"words":107,"representative":"M192_1","additional":0,"sharedCount":8,"related":["M192_1","M194_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_09","source":"photo","set":1,"number":9,"topic":"은행","q":"Describe the last banking experience you had. When and where did it happen? What bank did it involve? How helpful were the bank employees, and did you achieve what you went to the bank for? Please discuss the whole experience.","qko":"최근 은행 이용의 시점·장소·은행, 직원의 도움과 방문 목적 달성 여부를 포함해 전체 경험을 말하세요.","title":"최근 은행 이용의 시점·장소·은행, 직원의 도움과 방문 목적 달성 여부를 포함해 전체 경험을 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q09","family":"bank-visit","cue":"지난가을 동네 은행 → 엔화 → 긴 대기 → 도움","lines":[{"en":"The last time I visited a bank was last fall, before my trip to Osaka.","ko":"마지막 은행 방문은 지난가을 오사카 여행 전이었어요.","shared":true},{"en":"I went to a Woori Bank branch near my apartment to exchange some money for yen.","ko":"엔화로 환전하려고 집 근처 우리은행 지점에 갔어요.","shared":true},{"en":"There were more people than I expected, and I worried about another appointment afterward.","ko":"생각보다 사람이 많아서 다음 약속이 걱정됐어요.","shared":true},{"en":"I asked an employee how long the wait might be and whether I had the right documents.","ko":"직원에게 예상 대기 시간과 서류가 맞는지 물었어요.","shared":true},{"en":"She checked my identification and helped me prepare the form while I waited.","ko":"직원이 신분증을 확인하고 기다리는 동안 서류 작성을 도와줬어요.","shared":true},{"en":"When my number was called, the exchange itself took only a few minutes.","ko":"번호가 불렸을 때 환전 자체는 몇 분밖에 안 걸렸어요.","shared":true},{"en":"I checked the money and receipt, and I still reached my next appointment on time.","ko":"돈과 영수증을 확인했고 다음 약속에도 제시간에 갔어요.","shared":true},{"en":"I was grateful because her practical help turned a stressful wait into a smooth visit.","ko":"실질적인 도움 덕분에 불안한 기다림이 무사한 방문으로 끝나 고마웠어요.","shared":true}],"note":"","sources":[{"id":"H1_09","label":"해커스 오픽 매뉴얼 · 사진 1 · Q09"}],"correction":"","scope":"돌발·확장","requirements":["최근 은행 이용의 시점·장소·은행, 직원의 도움과 방문 목적 달성 여부를 포함해 전체 경험을 말하세요."],"words":118,"representative":"M196_3","additional":0,"sharedCount":8,"related":["M196_3","H1_10"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H1_10","source":"photo","set":1,"number":10,"topic":"은행","q":"Talk about a memorable banking experience you've had. For example, you could describe a time when you encountered a problem at the bank. What happened during the situation, and how did you handle it?","qko":"기억에 남는 은행 경험을 말하세요. 은행에서 겪은 문제 등을 예로 들어 상황과 대처를 설명하세요.","title":"기억에 남는 은행 경험을 말하세요. 은행에서 겪은 문제 등을 예로 들어 상황과 대처를 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q10","family":"bank-visit","cue":"지난가을 동네 은행 → 엔화 → 긴 대기 → 도움","lines":[{"en":"The last time I visited a bank was last fall, before my trip to Osaka.","ko":"마지막 은행 방문은 지난가을 오사카 여행 전이었어요.","shared":true},{"en":"I went to a Woori Bank branch near my apartment to exchange some money for yen.","ko":"엔화로 환전하려고 집 근처 우리은행 지점에 갔어요.","shared":true},{"en":"There were more people than I expected, and I worried about another appointment afterward.","ko":"생각보다 사람이 많아서 다음 약속이 걱정됐어요.","shared":true},{"en":"I asked an employee how long the wait might be and whether I had the right documents.","ko":"직원에게 예상 대기 시간과 서류가 맞는지 물었어요.","shared":true},{"en":"She checked my identification and helped me prepare the form while I waited.","ko":"직원이 신분증을 확인하고 기다리는 동안 서류 작성을 도와줬어요.","shared":true},{"en":"When my number was called, the exchange itself took only a few minutes.","ko":"번호가 불렸을 때 환전 자체는 몇 분밖에 안 걸렸어요.","shared":true},{"en":"I checked the money and receipt, and I still reached my next appointment on time.","ko":"돈과 영수증을 확인했고 다음 약속에도 제시간에 갔어요.","shared":true},{"en":"I was grateful because her practical help turned a stressful wait into a smooth visit.","ko":"실질적인 도움 덕분에 불안한 기다림이 무사한 방문으로 끝나 고마웠어요.","shared":true}],"note":"","sources":[{"id":"H1_10","label":"해커스 오픽 매뉴얼 · 사진 1 · Q10"}],"correction":"","scope":"돌발·확장","requirements":["기억에 남는 은행 경험을 말하세요.","은행에서 겪은 문제 등을 예로 들어 상황과 대처를 설명하세요."],"words":118,"representative":"M196_3","additional":0,"sharedCount":8,"related":["M196_3","H1_09"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_11","source":"photo","set":1,"number":11,"topic":"약속","q":"You want to invite another family over to your home for lunch. Ask your family members multiple questions in order to figure out the best day and time for their visit.","qko":"다른 가족을 집에 점심 식사로 초대하려 합니다. 방문하기 좋은 날짜와 시간을 정하도록 자신의 가족들에게 여러 질문을 하세요.","title":"다른 가족을 집에 점심 식사로 초대하려 합니다. 방문하기 좋은 날짜와 시간을 정하도록 자신의 가족들에게 여러 질문을 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q11","family":"rp-family-lunch","cue":"자기 가족에게 → 토·일·점심시간·일정","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I would like to invite Min's family to my home for lunch, and I want to choose a time when you can all join us.","ko":"민이 가족을 제 집에 점심 초대하려고 하고 우리 가족도 모두 올 수 있는 시간을 고르고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Would Saturday or Sunday be better for everyone?","ko":"모두에게 토요일과 일요일 중 언제가 더 좋을까요?","shared":false},{"en":"Would noon give you enough time to get here?","ko":"정오면 여기 올 시간이 충분할까요?","shared":false},{"en":"Does anyone have another appointment that afternoon?","ko":"그날 오후에 다른 약속이 있는 분이 있나요?","shared":false},{"en":"If this weekend is difficult, would next Sunday work instead?","ko":"이번 주말이 어렵다면 다음 일요일은 괜찮을까요?","shared":false},{"en":"Once we agree on a time, I will check with Min's family and confirm it with everyone.","ko":"시간이 정해지면 민이 가족에게 확인하고 모두에게 확정해서 알려드릴게요.","shared":false}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H1_11","label":"해커스 오픽 매뉴얼 · 사진 1 · Q11"}],"correction":"","scope":"역할극","requirements":["다른 가족을 집에 점심 식사로 초대하려 합니다.","방문하기 좋은 날짜와 시간을 정하도록 자신의 가족들에게 여러 질문을 하세요."],"words":94,"representative":"H1_11","additional":0,"sharedCount":2,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H1_12","source":"photo","set":1,"number":12,"topic":"약속","q":"Sadly, on the day you are supposed to have lunch with the other family, one of your own family members wakes up sick. Call your friend and explain the problem. Then come up with a few ideas for meeting up later.","qko":"다른 가족과 점심을 먹기로 한 날 자신의 가족 한 명이 아픕니다. 친구에게 전화해 상황을 설명하고 나중에 만날 대안을 몇 가지 제시하세요.","title":"다른 가족과 점심을 먹기로 한 날 자신의 가족 한 명이 아픕니다. 친구에게 전화해 상황을 설명하고 나중에 만날 대안을 몇 가지 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q12","family":"rp-lunch-sick","cue":"가족 아픔 → 점심 연기 → 다음 주·회복 후 식당","lines":[{"en":"Hi Min, I am sorry, but we need to change today's family lunch.","ko":"민아, 미안하지만 오늘 가족 점심 약속을 바꿔야 해.","shared":false},{"en":"My mother woke up sick this morning, and we don't want anyone else to catch it.","ko":"오늘 아침 어머니가 아프셔서 다른 사람에게 옮기고 싶지 않아.","shared":false},{"en":"I know your family has made time for this, so I apologize for the short notice.","ko":"너희 가족이 시간을 내준 걸 알아서 갑자기 알려 미안해.","shared":false},{"en":"Could we have lunch at my home next Sunday instead, if she has recovered?","ko":"어머니가 회복하시면 대신 다음 일요일에 우리 집에서 점심 먹을 수 있을까?","shared":false},{"en":"Or we could choose a restaurant and meet there on another weekend that suits everyone.","ko":"아니면 모두 편한 다른 주말에 식당을 정해 만나도 돼.","shared":false},{"en":"I can take care of the new reservation and check everyone's schedule.","ko":"새 예약을 맡고 모두의 일정을 확인할게.","shared":false},{"en":"Please let me know which option would be easier for your family.","ko":"너희 가족에게 어떤 방법이 더 편한지 알려줘.","shared":false},{"en":"Thanks for understanding, and I hope we can meet soon.","ko":"이해해 줘서 고마워. 곧 만나면 좋겠다.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H1_12","label":"해커스 오픽 매뉴얼 · 사진 1 · Q12"}],"correction":"","scope":"역할극","requirements":["다른 가족과 점심을 먹기로 한 날 자신의 가족 한 명이 아픕니다.","친구에게 전화해 상황을 설명하고 나중에 만날 대안을 몇 가지 제시하세요."],"words":108,"representative":"H1_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H1_13","source":"photo","set":1,"number":13,"topic":"약속","q":"Have you ever needed to cancel or change plans you had made with a friend? Talk about what you had planned to do and the reasons that you couldn't follow through with it. Explain the situation in detail.","qko":"친구와 약속을 취소하거나 바꾼 경험이 있나요? 원래 계획과 지키지 못한 이유를 자세히 설명하세요.","title":"친구와 약속을 취소하거나 바꾼 경험이 있나요? 원래 계획과 지키지 못한 이유를 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q13","family":"cancel","cue":"지난달 민과 점심 → 감기 → 전화 → 다음 주","lines":[{"en":"Last month, I had to cancel a lunch appointment with Min at the last minute.","ko":"지난달 민이와의 점심 약속을 직전에 취소해야 했어요.","shared":true},{"en":"We had planned to meet at a cafe near my apartment on Saturday.","ko":"토요일에 집 근처 카페에서 만나기로 했어요.","shared":true},{"en":"That morning, I woke up with a fever and a sore throat.","ko":"그날 아침 열이 나고 목이 아팠어요.","shared":true},{"en":"I didn't want to make him wait or risk passing on my cold.","ko":"친구를 기다리게 하거나 감기를 옮기고 싶지 않았어요.","shared":true},{"en":"I called him immediately, explained what had happened, and apologized.","ko":"바로 전화해서 상황을 설명하고 사과했어요.","shared":true},{"en":"I suggested meeting the following Saturday or having a short video call instead.","ko":"다음 토요일에 만나거나 대신 짧게 영상 통화를 하자고 했어요.","shared":true},{"en":"He understood, and we moved the lunch to the next week.","ko":"친구가 이해해 줘서 점심 약속을 다음 주로 옮겼어요.","shared":true},{"en":"I was disappointed, but letting him know early made the situation much easier.","ko":"아쉬웠지만 일찍 알려서 상황이 훨씬 수월해졌어요.","shared":true}],"note":"","sources":[{"id":"H1_13","label":"해커스 오픽 매뉴얼 · 사진 1 · Q13"}],"correction":"","scope":"돌발·확장","requirements":["친구와 약속을 취소하거나 바꾼 경험이 있나요?","원래 계획과 지키지 못한 이유를 자세히 설명하세요."],"words":100,"representative":"M136_3","additional":0,"sharedCount":8,"related":["M136_3","M255_13","M267_13","M279_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H1_14","source":"photo","set":1,"number":14,"topic":"음악","q":"What are two genres of music that you enjoy? How are they different or similar? Tell me how you feel when you listen to each genre in as much detail as possible.","qko":"좋아하는 음악 두 장르의 차이·공통점과 각각 들을 때의 감정을 자세히 설명하세요.","title":"좋아하는 음악 두 장르의 차이·공통점과 각각 들을 때의 감정을 자세히 설명하세요.","type":"두 대상 비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q14","family":"music-compare","cue":"팝·어쿠스틱 → 공통 멜로디 → 악기·감정 차이","lines":[{"en":"Two kinds of music I enjoy are pop and acoustic folk.","ko":"제가 즐기는 두 종류의 음악은 팝과 어쿠스틱 포크예요.","shared":true},{"en":"Both often have clear melodies and lyrics about everyday feelings.","ko":"둘 다 뚜렷한 멜로디와 일상적인 감정에 관한 가사가 있는 경우가 많아요.","shared":true},{"en":"However, the pop songs I like usually have a strong beat and several electronic sounds.","ko":"하지만 제가 좋아하는 팝송은 보통 강한 박자와 여러 전자음이 있어요.","shared":true},{"en":"The acoustic songs are simpler, often using just a voice and a guitar.","ko":"어쿠스틱 곡은 더 단순해서 목소리와 기타만 쓰기도 해요.","shared":true},{"en":"Pop makes me feel energetic, so I choose it when I need a lift.","ko":"팝은 활력이 나서 기운이 필요할 때 골라요.","shared":true},{"en":"Acoustic folk makes me feel calm, so I listen to it before going to bed.","ko":"어쿠스틱 포크는 차분해져서 자기 전에 들어요.","shared":true},{"en":"June's lively songs and Alex's quiet songs are good examples of that difference.","ko":"준이의 경쾌한 노래와 알렉스의 조용한 노래가 그 차이의 좋은 예예요.","shared":true},{"en":"I like both because they help me in different ways.","ko":"서로 다른 방식으로 도움이 돼서 둘 다 좋아해요.","shared":true}],"note":"","sources":[{"id":"H1_14","label":"해커스 오픽 매뉴얼 · 사진 1 · Q14"}],"correction":"","scope":"설문 중심","requirements":["좋아하는 음악 두 장르의 차이·공통점과 각각 들을 때의 감정을 자세히 설명하세요."],"words":101,"representative":"M302_14","additional":0,"sharedCount":8,"related":["M302_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H1_15","source":"photo","set":1,"number":15,"topic":"음악","q":"People listen to music on many different kinds of devices. Describe some of them. Which ones are the most popular in your country? Describe them in detail.","qko":"음악을 듣는 여러 기기를 설명하고, 국내에서 가장 인기 있는 기기들을 자세히 말하세요.","title":"음악을 듣는 여러 기기를 설명하고, 국내에서 가장 인기 있는 기기들을 자세히 말하세요.","type":"일반 경향","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q15","family":"music-device","cue":"폰·이어폰 → 다운로드 → 스피커·MP3 비교","lines":[{"en":"I usually listen to music on my smartphone with wireless earphones.","ko":"저는 보통 스마트폰과 무선 이어폰으로 음악을 들어요.","shared":true},{"en":"The phone fits in my pocket, and I can choose songs or make playlists in an app.","ko":"휴대폰은 주머니에 들어가고 앱에서 노래를 고르거나 재생목록을 만들 수 있어요.","shared":true},{"en":"I download some songs before a trip so I can listen without a connection.","ko":"여행 전에는 인터넷 없이 들으려고 노래를 내려받아요.","shared":true},{"en":"The earphones are light, and their case charges them when I am not using them.","ko":"이어폰은 가볍고 사용하지 않을 때 케이스가 충전해 줘요.","shared":true},{"en":"At home, I sometimes use a small wireless speaker because it fills the room with sound.","ko":"집에서는 방 안에 소리가 퍼지도록 작은 무선 스피커를 쓰기도 해요.","shared":true},{"en":"People can also use computers or separate MP3 players, but a phone is more convenient for me.","ko":"컴퓨터나 별도 MP3도 쓸 수 있지만 저에게는 휴대폰이 더 편해요.","shared":true},{"en":"Among the people I know in Korea, phones and wireless earphones seem to be the most popular combination.","ko":"제가 아는 한국 사람들 사이에서는 폰과 무선 이어폰 조합이 가장 인기 있어 보여요.","shared":true},{"en":"I keep the volume comfortable so I can enjoy the music without feeling tired.","ko":"피곤해지지 않도록 편안한 음량으로 들어요.","shared":true}],"note":"","sources":[{"id":"H1_15","label":"해커스 오픽 매뉴얼 · 사진 1 · Q15"}],"correction":"","scope":"설문 중심","requirements":["음악을 듣는 여러 기기를 설명하고, 국내에서 가장 인기 있는 기기들을 자세히 말하세요."],"words":122,"representative":"M103_2","additional":0,"sharedCount":8,"related":["M103_2","M303_15"],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"H2_02","source":"photo","set":2,"number":2,"topic":"영화","q":"You said that you enjoy watching movies in your background survey. What types of films do you like watching and why? Describe the kinds of movies with as many details as possible.","qko":"좋아하는 영화 종류와 그 이유를 자세히 설명하세요.","title":"좋아하는 영화 종류와 그 이유를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q02","family":"movie","cue":"따뜻한 코미디 → 가상 영화 작은 실수 → 웃음","lines":[{"en":"I like warm comedies about ordinary people rather than complicated action stories.","ko":"복잡한 액션물보다 평범한 사람들의 따뜻한 코미디를 좋아해요.","shared":true},{"en":"My favorite example is a film called Small Mistakes, starring Alex Kim.","ko":"좋아하는 예는 알렉스 김이 주연인 ‘스몰 미스테이크스’라는 영화예요.","shared":true},{"en":"It follows two friends who try to open a tiny restaurant but keep getting things wrong.","ko":"작은 식당을 열려다 계속 실수하는 두 친구 이야기예요.","shared":true},{"en":"One mixes up the orders while the other tries to keep the customers happy.","ko":"한 명은 주문을 헷갈리고 다른 한 명은 손님 기분을 맞추려고 해요.","shared":true},{"en":"The humor comes from their reactions, so I don't need to understand complicated jokes.","ko":"반응에서 웃음이 나와 복잡한 농담을 이해할 필요가 없어요.","shared":true},{"en":"I laughed a lot, but I also liked how they helped each other instead of giving up.","ko":"많이 웃었지만 포기하지 않고 서로 돕는 점도 좋았어요.","shared":true},{"en":"That mix of humor and kindness leaves me feeling relaxed and positive.","ko":"웃음과 친절이 어우러져 편안하고 긍정적인 기분이 들어요.","shared":true}],"note":"설문 제외 주제의 보충 카드. 영화·배우는 연습용 가상 설정이며 해커스 원본 세트에 포함되어 유지합니다.","sources":[{"id":"H2_02","label":"해커스 오픽 매뉴얼 · 사진 2 · Q02"}],"correction":"","scope":"돌발·확장","requirements":["좋아하는 영화 종류와 그 이유를 자세히 설명하세요."],"words":97,"representative":"H2_02","additional":0,"sharedCount":7,"related":["M080_1","M086_4"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_03","source":"photo","set":2,"number":3,"topic":"영화","q":"Describe the most recent movie you went to watch. What happened on that day before, during, and after the film? Give as many details as possible.","qko":"최근 보러 간 영화와 그날 영화 전·중·후에 있었던 일을 자세히 말하세요.","title":"최근 보러 간 영화와 그날 영화 전·중·후에 있었던 일을 자세히 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q03","family":"movie-last","cue":"지난달 민 → 코미디 → 관객 웃음 → 카페","lines":[{"en":"The last movie I went to see was Small Mistakes, a comedy, last month.","ko":"최근 보러 간 영화는 지난달의 코미디 ‘스몰 미스테이크스’예요.","shared":true},{"en":"I went with Min to the theater near my local station.","ko":"민이와 동네 역 근처 영화관에 갔어요.","shared":true},{"en":"Before the movie, we had noodles and picked up our tickets.","ko":"영화 전에 국수를 먹고 표를 받았어요.","shared":true},{"en":"The film was about two friends struggling to open a restaurant.","ko":"영화는 식당을 열려고 애쓰는 두 친구 이야기였어요.","shared":true},{"en":"During one scene, a waiter carried an empty plate to a customer, and everyone laughed.","ko":"한 장면에서 종업원이 빈 접시를 손님에게 가져가 모두 웃었어요.","shared":true},{"en":"Hearing the whole room laugh together made the scene more enjoyable than watching alone.","ko":"혼자 볼 때보다 상영관 전체가 함께 웃으니 더 즐거웠어요.","shared":true},{"en":"Afterward, Min and I went to a cafe and talked about our own cooking mistakes.","ko":"끝난 뒤 민이와 카페에 가서 우리 요리 실수들을 이야기했어요.","shared":true},{"en":"It was a simple outing, but I went home in a much better mood.","ko":"소박한 외출이었지만 훨씬 좋은 기분으로 집에 갔어요.","shared":true}],"note":"","sources":[{"id":"H2_03","label":"해커스 오픽 매뉴얼 · 사진 2 · Q03"}],"correction":"","scope":"돌발·확장","requirements":["최근 보러 간 영화와 그날 영화 전·중·후에 있었던 일을 자세히 말하세요."],"words":105,"representative":"H2_03","additional":0,"sharedCount":8,"related":["H4_07"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H2_04","source":"photo","set":2,"number":4,"topic":"영화","q":"What actor do you like the most? What is a specific news story that you've heard about him or her? First, tell me about the actor, and then describe what happened in the story. What made this story so memorable for movie fans?","qko":"좋아하는 배우를 소개하고 그 배우에 관해 들은 특정 뉴스, 뉴스 속 사건, 팬들에게 기억에 남는 이유를 설명하세요.","title":"좋아하는 배우를 소개하고 그 배우에 관해 들은 특정 뉴스, 뉴스 속 사건, 팬들에게 기억에 남는 이유를 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q04","family":"movie-news","cue":"가상 배우 Alex → 작은 영화 제작 지원 → 신인 기회","lines":[{"en":"My favorite actor is Alex Kim, who usually plays warm and slightly awkward characters.","ko":"좋아하는 배우는 따뜻하고 조금 어색한 인물을 주로 연기하는 알렉스 김이에요.","shared":false},{"en":"I like him because his reactions feel natural rather than exaggerated.","ko":"반응이 과장되지 않고 자연스러워서 좋아해요.","shared":false},{"en":"I remember reading a story about him helping a small film continue production.","ko":"그가 작은 영화 제작이 계속되도록 도왔다는 기사를 읽은 기억이 나요.","shared":false},{"en":"The team had lost part of its budget, so he agreed to reduce his fee.","ko":"제작비 일부가 부족해져서 출연료를 줄이는 데 동의했어요.","shared":false},{"en":"That allowed the crew to finish filming and gave several new actors a chance to work.","ko":"덕분에 촬영을 마치고 신인 배우 몇 명도 참여할 기회를 얻었어요.","shared":false},{"en":"Fans found it memorable because it showed a helpful side of him outside his screen roles.","ko":"팬들에게는 화면 속 역할 외에 도움을 주는 모습이라 기억에 남았어요.","shared":false},{"en":"For me, it made his performances feel more meaningful because I respected the choice he had made.","ko":"저도 그의 선택을 존중하게 돼 연기가 더 의미 있게 느껴졌어요.","shared":false}],"note":"기사·배우·사건 모두 말하기 연습용 가상 설정입니다. 실제 보도라고 검증한 내용이 아닙니다.","sources":[{"id":"H2_04","label":"해커스 오픽 매뉴얼 · 사진 2 · Q04"}],"correction":"","scope":"돌발·확장","requirements":["좋아하는 배우를 소개하고 그 배우에 관해 들은 특정 뉴스, 뉴스 속 사건, 팬들에게 기억에 남는 이유를 설명하세요."],"words":102,"representative":"H2_04","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_05","source":"photo","set":2,"number":5,"topic":"가구","q":"What piece of furniture do you like the most in your home? What do you use it for? Why is it special to you? Provide as many details as you can.","qko":"집에서 가장 좋아하는 가구의 용도와 특별한 이유를 자세히 설명하세요.","title":"집에서 가장 좋아하는 가구의 용도와 특별한 이유를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q05","family":"desk","cue":"침대·책상 → 서랍 두 개 → 공부 → 정돈","lines":[{"en":"My favorite piece of furniture is the small wooden desk in my bedroom.","ko":"가장 좋아하는 가구는 침실의 작은 나무 책상이에요.","shared":true},{"en":"I also have a bed, a closet, and a small sofa, but I use the desk in many different ways.","ko":"침대, 옷장, 작은 소파도 있지만 책상을 여러 용도로 써요.","shared":true},{"en":"It has a light brown surface and two drawers underneath.","ko":"밝은 갈색 상판과 아래 서랍 두 개가 있어요.","shared":true},{"en":"I use it to study English, plan trips, and keep important papers together.","ko":"영어 공부와 여행 계획을 하고 중요한 서류를 모아두는 데 써요.","shared":true},{"en":"Before I bought it, my books were usually on the floor or the bed.","ko":"사기 전에는 책을 주로 바닥이나 침대에 뒀어요.","shared":true},{"en":"Now I can put things away quickly and find them when I need them.","ko":"이제 물건을 빨리 정리하고 필요할 때 찾을 수 있어요.","shared":true},{"en":"It is special to me because it made living alone feel more organized.","ko":"혼자 사는 생활이 더 정돈되게 해줘서 특별해요.","shared":true},{"en":"It wasn't expensive, but it improved my daily routine more than I expected.","ko":"비싸지 않았지만 생각보다 일상을 많이 개선해 줬어요.","shared":true}],"note":"","sources":[{"id":"H2_05","label":"해커스 오픽 매뉴얼 · 사진 2 · Q05"}],"correction":"","scope":"돌발·확장","requirements":["집에서 가장 좋아하는 가구의 용도와 특별한 이유를 자세히 설명하세요."],"words":110,"representative":"M230_1","additional":0,"sharedCount":8,"related":["M230_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_06","source":"photo","set":2,"number":6,"topic":"가구","q":"Describe a piece of furniture you recently purchased. Where did you get it from? Provide as many details as you can about it.","qko":"최근 구입한 가구와 구입처를 자세히 설명하세요.","title":"최근 구입한 가구와 구입처를 자세히 설명하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q06","family":"desk-change","cue":"빈 침실 → 작은 책상 → 창가 → 만족","lines":[{"en":"When I first moved in last year, my bedroom had a bed but almost no other furniture.","ko":"작년에 처음 이사 왔을 때 침실에는 침대 외에 가구가 거의 없었어요.","shared":true},{"en":"I used to put my books on the floor, so the room always looked messy.","ko":"책을 바닥에 놓곤 해서 방이 늘 어수선해 보였어요.","shared":true},{"en":"Two months ago, I bought a small wooden desk from an online furniture store.","ko":"두 달 전에 온라인 가구점에서 작은 나무 책상을 샀어요.","shared":true},{"en":"I measured the space beside the window before choosing it.","ko":"고르기 전에 창문 옆 공간을 재 봤어요.","shared":true},{"en":"The desk has two drawers, so I can keep my books and cables out of sight.","ko":"서랍 두 개가 있어서 책과 케이블을 깔끔하게 넣어둘 수 있어요.","shared":true},{"en":"I put a warm lamp on top and moved the desk against the wall.","ko":"위에는 따뜻한 빛의 조명을 놓고 벽 쪽으로 책상을 옮겼어요.","shared":true},{"en":"The room looks much tidier now, and I have a proper place to study.","ko":"지금은 방이 훨씬 정돈됐고 제대로 공부할 공간이 생겼어요.","shared":true},{"en":"I'm happy with the change because it made a small room more useful.","ko":"작은 방을 더 잘 활용하게 돼서 만족해요.","shared":true}],"note":"","sources":[{"id":"H2_06","label":"해커스 오픽 매뉴얼 · 사진 2 · Q06"}],"correction":"","scope":"돌발·확장","requirements":["최근 구입한 가구와 구입처를 자세히 설명하세요."],"words":113,"representative":"M028_5","additional":0,"sharedCount":8,"related":["M028_5","M232_2","H6_04"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H2_07","source":"photo","set":2,"number":7,"topic":"가구","q":"Have you ever had any problem with a product that you bought for your home? What was the issue? Tell me how you resolved the issue.","qko":"집에 쓰려고 산 제품의 문제와 해결 방법을 말하세요.","title":"집에 쓰려고 산 제품의 문제와 해결 방법을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q07","family":"desk-problem","cue":"두 달 전 배송 → 다른 색·흔들림 → 사진 → 교환","lines":[{"en":"Two months ago, I ordered a small wooden desk online, but the wrong one arrived.","ko":"두 달 전에 작은 나무 책상을 온라인으로 주문했는데 다른 제품이 왔어요.","shared":true},{"en":"I had chosen a light brown desk, but the delivered one was dark and had a loose leg.","ko":"밝은 갈색을 골랐는데 온 것은 어둡고 다리도 헐거웠어요.","shared":true},{"en":"I stopped assembling it because I didn't want to make the problem worse.","ko":"문제를 키우고 싶지 않아 조립을 멈췄어요.","shared":true},{"en":"I took photos of the desk and the label and contacted the seller with my order number.","ko":"책상과 라벨 사진을 찍고 주문 번호와 함께 판매자에게 연락했어요.","shared":true},{"en":"The employee checked the details and confirmed a warehouse mistake.","ko":"직원이 확인하고 창고의 실수라고 했어요.","shared":true},{"en":"We arranged for them to collect it and deliver the correct desk three days later.","ko":"수거한 뒤 사흘 후 맞는 책상을 보내기로 했어요.","shared":true},{"en":"This time, I checked the color and tested the legs before putting my things on it.","ko":"이번에는 물건을 올리기 전에 색과 다리를 확인했어요.","shared":true},{"en":"The replacement was fine, and I was satisfied with how the seller handled the mistake.","ko":"교환품은 괜찮았고 판매자의 대응에도 만족했어요.","shared":true}],"note":"","sources":[{"id":"H2_07","label":"해커스 오픽 매뉴얼 · 사진 2 · Q07"}],"correction":"","scope":"돌발·확장","requirements":["집에 쓰려고 산 제품의 문제와 해결 방법을 말하세요."],"words":119,"representative":"M234_3","additional":0,"sharedCount":8,"related":["M234_3","M252_13","M264_13","H3_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_08","source":"photo","set":2,"number":8,"topic":"해외여행","q":"Think about a place you have gone to on vacation. What is it like? Where is it? What are the local people like, and what is interesting or unique about it?","qko":"휴가 때 방문한 장소의 위치와 모습, 현지 사람들, 흥미롭거나 독특한 점을 말하세요.","title":"휴가 때 방문한 장소의 위치와 모습, 현지 사람들, 흥미롭거나 독특한 점을 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q08","family":"abroad","cue":"작년 가을 오사카 → 민 → 시장·강 → 길 도움","lines":[{"en":"My most recent overseas trip was to Osaka in Japan last fall with Min.","ko":"최근 해외여행은 지난가을 민이와 일본 오사카에 간 거예요.","shared":true},{"en":"We stayed for three days in a small hotel near a train station.","ko":"기차역 근처 작은 호텔에서 사흘간 머물렀어요.","shared":true},{"en":"The city had busy shopping streets, bright signs,
