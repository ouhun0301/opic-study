?? What did you do? Explain all the experiences in detail","qko":"어릴 적 겪은 기억에 남거나 잊을 수 없는 명절 경험에 대해 말해주세요. 그 날 어디에 있었나요? 누구와 그 명절을 보냈나요? 무엇을 했었나요? 그 경험에 대해 자세히 말해주세요.","source":"pdf","topic":"명절","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.172 · M172_3","family":"holiday-child","cue":"어릴 때 설 → 조부모님 → 떡국·게임 → 동전","lines":[{"en":"One childhood holiday I remember clearly is Seollal at my grandparents' home.","ko":"어린 시절 명절 중 조부모님 댁에서 보낸 설날이 또렷이 기억나요.","shared":false},{"en":"I was about ten, and my parents and cousins were all there.","ko":"열 살쯤이었고 부모님과 사촌들이 모두 있었어요.","shared":false},{"en":"We had rice-cake soup in the morning and greeted the older relatives.","ko":"아침에 떡국을 먹고 어른들께 인사했어요.","shared":false},{"en":"After lunch, my cousins and I played a traditional board game with my grandfather.","ko":"점심 후에는 사촌들과 할아버지와 전통 보드게임을 했어요.","shared":false},{"en":"I kept losing, so he quietly explained a better strategy to me.","ko":"제가 계속 지자 할아버지가 좋은 방법을 조용히 설명해 주셨어요.","shared":false},{"en":"When I finally won a round, everyone cheered as if I had won a championship.","ko":"마침내 한 판을 이기자 우승한 것처럼 모두 환호했어요.","shared":false},{"en":"The game wasn't important, but I felt included and cared for.","ko":"게임 자체보다 함께하며 사랑받는 느낌이 중요했어요.","shared":false},{"en":"That is why I remember the laughter more than the food or presents.","ko":"그래서 음식이나 선물보다 웃음소리가 기억나요.","shared":false}],"note":"","sources":[{"id":"M172_3","label":"오픽만수르 IM2–IH · p.172 · M172_3"}],"correction":"with??의 중복 물음표를 원문에 유지했습니다.","scope":"돌발·확장","requirements":["어릴 적 겪은 기억에 남거나 잊을 수 없는 명절 경험에 대해 말해주세요.","그 날 어디에 있었나요?","누구와 그 명절을 보냈나요?","무엇을 했었나요?","그 경험에 대해 자세히 말해주세요."],"words":101,"representative":"M172_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M174_1","page":174,"title":"대중교통 설명 묘사","q":"I would like to know about public transportation in your country. What kind of transportation do people use to get around? Do you use public transportation, or do you drive? Which one do you prefer to take and why?","qko":"당신의 나라에 있는 대중 교통에 대해 알고 싶습니다. 사람들은 이동을 위해 어 떤 교통수단을 이용하나요? 당신은 대중교통을 타나요? 또는 차를 운전 하시나요? 어떤 것을 선호하고 이유는 무엇인가요?","source":"pdf","topic":"교통","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.174 · M174_1","family":"transport","cue":"버스·지하철 → 교통카드 → 지하철 선호","lines":[{"en":"In Korea, people use buses, subways, trains, and taxis to get around.","ko":"한국에서는 버스, 지하철, 기차, 택시로 이동해요.","shared":false},{"en":"In Seoul, I mostly use the subway because it is easy to plan my journey.","ko":"서울에서는 이동 계획을 세우기 쉬워 주로 지하철을 타요.","shared":false},{"en":"I check a map app, find the right line, and use a transport card at the gate.","ko":"지도 앱에서 노선을 확인하고 개찰구에서 교통카드를 써요.","shared":false},{"en":"I don't usually drive because finding parking near busy places can be difficult.","ko":"번화가 주차가 어려울 수 있어 보통 운전하지 않아요.","shared":false},{"en":"Buses are useful when the destination is far from a station.","ko":"목적지가 역에서 멀면 버스가 유용해요.","shared":false},{"en":"For a longer trip, I prefer a train so I can relax instead of watching the road.","ko":"장거리 여행은 길을 신경 쓰지 않고 쉴 수 있어 기차가 좋아요.","shared":false},{"en":"The subway can get crowded, but it is still my first choice for everyday travel.","ko":"지하철이 붐빌 수 있지만 일상 이동에서는 첫 번째 선택이에요.","shared":false}],"note":"","sources":[{"id":"M174_1","label":"오픽만수르 IM2–IH · p.174 · M174_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에 있는 대중 교통에 대해 알고 싶습니다.","사람들은 이동을 위해 어 떤 교통수단을 이용하나요?","당신은 대중교통을 타나요?","또는 차를 운전 하시나요?","어떤 것을 선호하고 이유는 무엇인가요?"],"words":100,"representative":"M174_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M176_2","page":176,"title":"대중교통 변화 비교","q":"Transportation systems have been improved. Have there been any changes to transportation in your country since you were young? What are the changes between the past and the present?","qko":"대중교통 시스템은 발전되어 왔습니다. 당신의 나라에 당신이 어렸을 때부터 변 화된 대중교통이 있습니까? 과거와 현재 사이 어떤 변화가 있습니까?","source":"pdf","topic":"교통","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.176 · M176_2","family":"transport-change","cue":"종이지도·기다림 → 앱·카드 → 예측","lines":[{"en":"Public transportation feels easier to use now than when I was a child.","ko":"어릴 때보다 지금 대중교통을 이용하기 쉬워진 것 같아요.","shared":false},{"en":"Back then, my family checked printed maps or asked people where to get off.","ko":"당시에는 종이 지도를 보거나 어디서 내릴지 사람들에게 물었어요.","shared":false},{"en":"At bus stops, we often waited without knowing exactly when the bus would arrive.","ko":"버스 정류장에서는 언제 올지 정확히 모른 채 기다리곤 했어요.","shared":false},{"en":"Now, apps and electronic signs show routes and expected arrival times.","ko":"이제 앱과 전광판이 경로와 예상 도착 시간을 보여줘요.","shared":false},{"en":"Using a transport card also makes changing between services much simpler.","ko":"교통카드로 다른 교통수단을 갈아타기도 훨씬 간단해졌어요.","shared":false},{"en":"For me, the biggest benefit is being able to plan when to leave home.","ko":"저에게 가장 큰 장점은 집에서 언제 나갈지 정할 수 있다는 거예요.","shared":false},{"en":"Crowding and delays still happen, but I have more information when they do.","ko":"혼잡과 지연은 여전하지만 그런 상황에서 더 많은 정보를 얻어요.","shared":false}],"note":"","sources":[{"id":"M176_2","label":"오픽만수르 IM2–IH · p.176 · M176_2"}],"correction":"","scope":"돌발·확장","requirements":["대중교통 시스템은 발전되어 왔습니다.","당신의 나라에 당신이 어렸을 때부터 변 화된 대중교통이 있습니까?","과거와 현재 사이 어떤 변화가 있습니까?"],"words":90,"representative":"M176_2","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M178_3","page":178,"title":"대중교통 과거 경험, 발생한 문제","q":"Sometimes riding the subway or bus can be uncomfortable. Have you ever had any problems related to transportation? Were there traffic jams, or did something uncomfortable happen? What was the problem, and how did you deal with the situation?","qko":"때때로 지하철이나 버스를 타는 것은 불편할 수 있습니다. 대중교통을 이용하면 서 어떤 문제를 겪은 경험이 있습니까? 교통체증이나 어떤 불편한 일이 있었나요? 문제가 무엇이었고 어떻게 그 상황을 해결했나요?","source":"pdf","topic":"교통","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.178 · M178_3","family":"late","cue":"지난달 약속 → 버스 지연 → 연락 → 지하철 → 사과","lines":[{"en":"Last month, I was late for an important lunch with Min because my bus got stuck in traffic.","ko":"지난달 버스가 교통 체증에 갇혀 민이와의 중요한 점심 약속에 늦었어요.","shared":true},{"en":"We were meeting to plan our next trip, and I had brought the information we needed.","ko":"다음 여행을 계획하는 자리여서 필요한 자료도 제가 가져가고 있었어요.","shared":true},{"en":"At first, I hoped the traffic would clear, but the bus barely moved.","ko":"처음에는 길이 뚫리길 바랐지만 버스가 거의 움직이지 않았어요.","shared":true},{"en":"I called Min, apologized, and gave him an updated arrival time.","ko":"민이에게 전화해 사과하고 바뀐 도착 시간을 알려줬어요.","shared":true},{"en":"At the next stop, I got off and changed to the subway.","ko":"다음 정류장에서 내려 지하철로 갈아탔어요.","shared":true},{"en":"I arrived about twenty minutes late, and he was waiting inside the cafe.","ko":"20분쯤 늦게 도착했고 친구는 카페 안에서 기다리고 있었어요.","shared":true},{"en":"I thanked him for waiting, and we still had enough time to finish our plan.","ko":"기다려줘서 고맙다고 했고 계획을 마칠 시간은 충분했어요.","shared":true},{"en":"Since then, I have allowed extra time when an appointment really matters.","ko":"그 뒤로 중요한 약속에는 여유 시간을 더 잡아요.","shared":true}],"note":"","sources":[{"id":"M178_3","label":"오픽만수르 IM2–IH · p.178 · M178_3"}],"correction":"","scope":"돌발·확장","requirements":["때때로 지하철이나 버스를 타는 것은 불편할 수 있습니다.","대중교통을 이용하면 서 어떤 문제를 겪은 경험이 있습니까?","교통체증이나 어떤 불편한 일이 있었나요?","문제가 무엇이었고 어떻게 그 상황을 해결했나요?"],"words":110,"representative":"M178_3","additional":0,"sharedCount":8,"related":["H2_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M180_1","page":180,"title":"호텔 소개","q":"Tell me about hotels in your country. What are they like? Where are they usually located? Describe it in detail.","qko":"당신의 나라에 있는 호텔에 대해 말해주세요. 그들은 어떤가요? 그들은 주로 어 디에 위치해 있나요? 자세히 말해주세요.","source":"pdf","topic":"호텔","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.180 · M180_1","family":"hotel","cue":"역·바다 → 로비·객실 → 규모 차이","lines":[{"en":"Hotels in Korea vary from small local places to large buildings with many facilities.","ko":"한국의 호텔은 작은 지역 숙소부터 시설이 많은 큰 건물까지 다양해요.","shared":false},{"en":"In cities, I often see them near stations or busy shopping areas.","ko":"도시에서는 역이나 번화한 상점가 근처에서 자주 봐요.","shared":false},{"en":"In vacation areas, some are close to beaches or other attractions.","ko":"휴양지에서는 해변이나 관광지 가까이에 있기도 해요.","shared":false},{"en":"Most hotels I have used have a reception desk, a lobby, and private rooms with bathrooms.","ko":"제가 이용한 호텔 대부분은 프런트, 로비, 개별 욕실이 있는 객실을 갖췄어요.","shared":false},{"en":"Larger ones may also have restaurants, meeting rooms, or a gym.","ko":"큰 호텔에는 식당, 회의실, 헬스장이 있을 수도 있어요.","shared":false},{"en":"I prefer a simple hotel near public transportation rather than an expensive room with a view.","ko":"비싼 전망 좋은 방보다 대중교통 가까운 간단한 호텔이 좋아요.","shared":false},{"en":"For me, cleanliness, a quiet room, and helpful staff matter most.","ko":"저에게는 청결, 조용한 객실, 친절한 직원이 가장 중요해요.","shared":false}],"note":"","sources":[{"id":"M180_1","label":"오픽만수르 IM2–IH · p.180 · M180_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에 있는 호텔에 대해 말해주세요.","그들은 어떤가요?","그들은 주로 어 디에 위치해 있나요?","자세히 말해주세요."],"words":91,"representative":"M180_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M182_2","page":182,"title":"호텔에서 하는 일, 행동 습관","q":"Please tell me what you do when you arrive at a hotel. What steps do you take? Tell me everything from beginning to end.","qko":"당신이 호텔에 도착했을 때 무엇을 하는지 말해주세요. 어떤 절차를 진행하나요? 처음부터 끝까지 전부다 이야기해주세요.","source":"pdf","topic":"호텔","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.182 · M182_2","family":"hotel-routine","cue":"예약 확인 → 카드키 → 객실 점검 → 정리","lines":[{"en":"When I arrive at a hotel, I first go to the reception desk and give my reservation name.","ko":"호텔에 도착하면 먼저 프런트에 가서 예약자 이름을 말해요.","shared":false},{"en":"I show my identification if needed and confirm the number of nights.","ko":"필요하면 신분증을 보여주고 숙박 일수를 확인해요.","shared":false},{"en":"Then I ask about checkout time and any breakfast service.","ko":"그다음 체크아웃 시간과 조식 서비스를 물어요.","shared":false},{"en":"After receiving the key, I take my bags to the room.","ko":"열쇠를 받으면 짐을 가지고 객실로 가요.","shared":false},{"en":"I check that the bed, bathroom, and air conditioner are in good condition.","ko":"침대, 욕실, 에어컨 상태가 괜찮은지 확인해요.","shared":false},{"en":"If something is wrong, I call reception before unpacking everything.","ko":"문제가 있으면 짐을 모두 풀기 전에 프런트에 전화해요.","shared":false},{"en":"Finally, I charge my phone, put away my clothes, and rest before going out.","ko":"마지막으로 폰을 충전하고 옷을 정리한 뒤 나가기 전에 쉬어요.","shared":false},{"en":"Doing these simple checks helps me settle in comfortably.","ko":"이렇게 간단히 확인하면 편하게 지낼 준비가 돼요.","shared":false}],"note":"","sources":[{"id":"M182_2","label":"오픽만수르 IM2–IH · p.182 · M182_2"}],"correction":"","scope":"돌발·확장","requirements":["당신이 호텔에 도착했을 때 무엇을 하는지 말해주세요.","어떤 절차를 진행하나요?","처음부터 끝까지 전부다 이야기해주세요."],"words":97,"representative":"M182_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M184_3","page":184,"title":"호텔 경험, 머물렀던 호텔","q":"When was the last time you stayed in a hotel? Where did you stay? Why were you there? What did you do at the hotel? Tell me everything from beginning to end.","qko":"언제가 마지막으로 호텔에 머물렀을 때입니까? 어디서 숙박했나요? 왜 거기에 있 었나요? 그 호텔에서 무엇을 했나요? 처음부터 끝까지 모두 다 말해주세요.","source":"pdf","topic":"호텔","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.184 · M184_3","family":"abroad","cue":"작년 가을 오사카 → 민 → 시장·강 → 길 도움","lines":[{"en":"My most recent overseas trip was to Osaka in Japan last fall with Min.","ko":"최근 해외여행은 지난가을 민이와 일본 오사카에 간 거예요.","shared":true},{"en":"We stayed for three days in a small hotel near a train station.","ko":"기차역 근처 작은 호텔에서 사흘간 머물렀어요.","shared":true},{"en":"The city had busy shopping streets, bright signs, and quieter streets along the river.","ko":"도시에는 번화한 상점가와 밝은 간판, 강변의 조용한 길이 있었어요.","shared":true},{"en":"We visited a market, tried local noodles, and walked around after dinner.","ko":"시장에 가고 현지 국수를 먹고 저녁 후에는 산책했어요.","shared":true},{"en":"One shop owner patiently showed us the way when we couldn't find the right street.","ko":"길을 못 찾았을 때 한 가게 주인이 차분히 알려줬어요.","shared":true},{"en":"That kindness made the unfamiliar place feel much more welcoming.","ko":"그 친절 덕분에 낯선 곳이 훨씬 편안하게 느껴졌어요.","shared":true},{"en":"I especially liked how lively areas and peaceful corners were so close together.","ko":"활기찬 곳과 조용한 곳이 가까이 있다는 점이 특히 좋았어요.","shared":true},{"en":"I came home with the impression that exploring on foot was the best part of the trip.","ko":"걸어서 둘러보는 게 여행에서 가장 좋았다는 생각을 하며 돌아왔어요.","shared":true},{"en":"At the hotel, we checked in, unpacked, and rested before going out to the market.","ko":"호텔에서 체크인하고 짐을 푼 뒤 쉬다가 시장에 갔어요.","shared":false},{"en":"Each evening, I showered and checked the next day's route; on the last morning, we returned the keys and checked out.","ko":"매일 저녁 샤워하고 다음 날 경로를 확인했고 마지막 날 아침에는 열쇠를 반납하고 체크아웃했어요.","shared":false}],"note":"","sources":[{"id":"M184_3","label":"오픽만수르 IM2–IH · p.184 · M184_3"}],"correction":"","scope":"돌발·확장","requirements":["언제가 마지막으로 호텔에 머물렀을 때입니까?","어디서 숙박했나요?","왜 거기에 있 었나요?","그 호텔에서 무엇을 했나요?","처음부터 끝까지 모두 다 말해주세요."],"words":144,"representative":"M116_1","additional":2,"sharedCount":8,"related":["M116_1","M273_13","H2_08","H2_09","H2_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M186_1","page":186,"title":"식당 묘사","q":"Tell me about your favorite restaurant near where you live. What does it look like? How often do you go there? What kinds of food do they serve?","qko":"당신의 집 주변에 가장 좋아하는 식당에 대해 말해주세요. 어떻게 생겼나요? 얼마나 자주 거기에 가나요? 그들은 어떤 음식을 제공하나요?","source":"pdf","topic":"식당","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.186 · M186_1","family":"restaurant","cue":"동네 국숫집 → 한 달 두 번 → 따뜻한 국물","lines":[{"en":"My favorite restaurant is a small noodle shop near my apartment.","ko":"제가 좋아하는 식당은 집 근처 작은 국숫집이에요.","shared":true},{"en":"I go there about twice a month, sometimes with Min.","ko":"한 달에 두 번쯤 가고 가끔 민이와 함께 가요.","shared":true},{"en":"It has a few wooden tables, an open kitchen, and a simple menu on the wall.","ko":"나무 테이블 몇 개와 열린 주방, 벽에 붙은 간단한 메뉴판이 있어요.","shared":true},{"en":"They serve noodle soup, dumplings, and a few rice dishes.","ko":"국수와 만두, 밥 요리 몇 가지를 팔아요.","shared":true},{"en":"My favorite is a bowl of noodles in a clear, warm broth with vegetables on top.","ko":"제가 좋아하는 건 맑고 따뜻한 국물에 채소를 얹은 국수예요.","shared":true},{"en":"The noodles are soft but not mushy, and the soup isn't too salty.","ko":"면이 부드럽지만 퍼지지 않았고 국물이 너무 짜지 않아요.","shared":true},{"en":"I usually add a small plate of dumplings when I am hungry.","ko":"배가 고프면 만두 작은 접시를 추가해요.","shared":true},{"en":"The food is simple and comforting, which is exactly what I want after a long day.","ko":"소박하고 편안한 음식이라 긴 하루 끝에 딱 좋아요.","shared":true}],"note":"","sources":[{"id":"M186_1","label":"오픽만수르 IM2–IH · p.186 · M186_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 집 주변에 가장 좋아하는 식당에 대해 말해주세요.","어떻게 생겼나요?","얼마나 자주 거기에 가나요?","그들은 어떤 음식을 제공하나요?"],"words":104,"representative":"M186_1","additional":0,"sharedCount":8,"related":["M188_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M188_2","page":188,"title":"식당 메뉴 설명","q":"What kind of food does your favorite restaurant offer? Tell me about your favorite food. What is it? Give as many details as you can.","qko":"당신이 가는 식당은 어떤 음식을 제공합니까? 당신이 가장 좋아하는 음식을 말해 주세요. 가능한 자세하게 말해주세요.","source":"pdf","topic":"식당","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.188 · M188_2","family":"restaurant","cue":"동네 국숫집 → 한 달 두 번 → 따뜻한 국물","lines":[{"en":"My favorite restaurant is a small noodle shop near my apartment.","ko":"제가 좋아하는 식당은 집 근처 작은 국숫집이에요.","shared":true},{"en":"I go there about twice a month, sometimes with Min.","ko":"한 달에 두 번쯤 가고 가끔 민이와 함께 가요.","shared":true},{"en":"It has a few wooden tables, an open kitchen, and a simple menu on the wall.","ko":"나무 테이블 몇 개와 열린 주방, 벽에 붙은 간단한 메뉴판이 있어요.","shared":true},{"en":"They serve noodle soup, dumplings, and a few rice dishes.","ko":"국수와 만두, 밥 요리 몇 가지를 팔아요.","shared":true},{"en":"My favorite is a bowl of noodles in a clear, warm broth with vegetables on top.","ko":"제가 좋아하는 건 맑고 따뜻한 국물에 채소를 얹은 국수예요.","shared":true},{"en":"The noodles are soft but not mushy, and the soup isn't too salty.","ko":"면이 부드럽지만 퍼지지 않았고 국물이 너무 짜지 않아요.","shared":true},{"en":"I usually add a small plate of dumplings when I am hungry.","ko":"배가 고프면 만두 작은 접시를 추가해요.","shared":true},{"en":"The food is simple and comforting, which is exactly what I want after a long day.","ko":"소박하고 편안한 음식이라 긴 하루 끝에 딱 좋아요.","shared":true}],"note":"","sources":[{"id":"M188_2","label":"오픽만수르 IM2–IH · p.188 · M188_2"}],"correction":"","scope":"돌발·확장","requirements":["당신이 가는 식당은 어떤 음식을 제공합니까?","당신이 가장 좋아하는 음식을 말해 주세요.","가능한 자세하게 말해주세요."],"words":104,"representative":"M186_1","additional":0,"sharedCount":8,"related":["M186_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M190_3","page":190,"title":"식당, 외식 경험","q":"When was the last time you ate out? Where did you visit and who did you go with? What kind of restaurant was it? What did you have? Please tell me what happened in detail.","qko":"마지막으로 외식한 게 언제입니까? 어디 갔습니까? 누구와 갔습니까? 무슨 식당 이었나요? 무슨 메뉴를 먹었습니까? 무슨 일이 있었는지 자세히 말해주세요.","source":"pdf","topic":"식당","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.190 · M190_3","family":"restaurant-memory","cue":"지난달 → 민 생일 → 국수 → 작은 케이크","lines":[{"en":"Last month, I took Min to my favorite noodle shop for his birthday.","ko":"지난달 민이 생일에 좋아하는 국숫집에 데려갔어요.","shared":false},{"en":"It wasn't a fancy celebration, but he had asked for a quiet meal.","ko":"화려한 축하는 아니었지만 친구가 조용한 식사를 원했어요.","shared":false},{"en":"We ordered noodle soup and shared a plate of dumplings.","ko":"국수를 주문하고 만두 한 접시를 나눠 먹었어요.","shared":false},{"en":"I had brought a small cake and asked the owner whether we could have it after dinner.","ko":"작은 케이크를 가져가서 식사 후 먹어도 되는지 주인에게 물었어요.","shared":false},{"en":"She kindly gave us two extra plates and turned down the music for a moment.","ko":"주인은 친절하게 접시 두 개를 더 주고 잠시 음악을 줄여줬어요.","shared":false},{"en":"Min looked surprised when I lit the candle, and we both laughed.","ko":"초를 켜자 민이가 놀랐고 둘 다 웃었어요.","shared":false},{"en":"We spent another hour talking before walking home.","ko":"한 시간 더 이야기한 뒤 걸어서 집에 갔어요.","shared":false},{"en":"I remember it because a simple dinner felt special thanks to a small personal effort.","ko":"작은 정성으로 평범한 저녁이 특별해져서 기억나요.","shared":false}],"note":"","sources":[{"id":"M190_3","label":"오픽만수르 IM2–IH · p.190 · M190_3"}],"correction":"","scope":"돌발·확장","requirements":["마지막으로 외식한 게 언제입니까?","어디 갔습니까?","누구와 갔습니까?","무슨 식당 이었나요?","무슨 메뉴를 먹었습니까?","무슨 일이 있었는지 자세히 말해주세요."],"words":103,"representative":"M190_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M192_1","page":192,"title":"은행에 가는 이유, 은행에서 하는 일","q":"People go to the bank for many reasons. Why do people go to the bank in your country? Where are they? Please give me as many details as possible.","qko":"사람들은 여러 이유로 은행에 갑니다. 당신 나라에서는 사람들이 왜 은행에 가나요? 은행은 어디에 있나요? 가능한 한 자세히 설명하세요.","source":"pdf","topic":"은행","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.192 · M192_1","family":"bank","cue":"큰길·역 → 창구·ATM → 동네 지점 9~4","lines":[{"en":"The banks I see in Korea are usually near main roads, stations, or shopping areas.","ko":"제가 한국에서 보는 은행은 보통 큰길, 역, 상점가 근처에 있어요.","shared":true},{"en":"Many branches are on the ground floor, which makes them easy to enter.","ko":"많은 지점이 1층에 있어 들어가기 편해요.","shared":true},{"en":"Inside, there are service counters, a waiting area, and machines for taking a number.","ko":"안에는 창구, 대기 공간, 번호표 기계가 있어요.","shared":true},{"en":"ATMs are often near the entrance for quick withdrawals and deposits.","ko":"빠르게 돈을 찾고 넣는 ATM은 보통 입구 근처에 있어요.","shared":true},{"en":"The branch I use opens around nine and closes around four on weekdays, though hours vary.","ko":"제가 이용하는 지점은 평일 대략 9시에 열고 4시에 닫지만 시간은 지점마다 달라요.","shared":true},{"en":"People go there to discuss accounts, exchange money, or get help with paperwork.","ko":"사람들은 계좌를 상담하거나 환전하거나 서류 도움을 받으러 가요.","shared":true},{"en":"The design is usually bright and practical rather than decorative.","ko":"디자인은 보통 장식적이기보다 밝고 실용적이에요.","shared":true},{"en":"I check the branch's hours before visiting because I don't want to arrive too late.","ko":"너무 늦게 도착하지 않도록 방문 전에 시간을 확인해요.","shared":true}],"note":"사람들의 이용 목적·은행 위치를 설명합니다. 지점 운영 시간은 연습용 사례이며 모든 은행의 현재 운영 시간을 단정하지 않습니다.","sources":[{"id":"M192_1","label":"오픽만수르 IM2–IH · p.192 · M192_1"}],"correction":"","scope":"돌발·확장","requirements":["사람들은 여러 이유로 은행에 갑니다.","당신 나라에서는 사람들이 왜 은행에 가나요?","은행은 어디에 있나요?","가능한 한 자세히 설명하세요."],"words":107,"representative":"M192_1","additional":0,"sharedCount":8,"related":["M194_2","H1_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M194_2","page":194,"title":"은행 묘사","q":"Tell me about banks in your country. What do they look like? Where are they located? When do they open and close? What do people usually do at banks?","qko":"당신의 나라에 있는 은행에 대해 말해주세요. 은행은 어떤가요? 어디에 위치해 있나요? 언제 문을 열고 닫나요? 사람들은 은행에서 무엇을 하나요?","source":"pdf","topic":"은행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.194 · M194_2","family":"bank","cue":"큰길·역 → 창구·ATM → 동네 지점 9~4","lines":[{"en":"The banks I see in Korea are usually near main roads, stations, or shopping areas.","ko":"제가 한국에서 보는 은행은 보통 큰길, 역, 상점가 근처에 있어요.","shared":true},{"en":"Many branches are on the ground floor, which makes them easy to enter.","ko":"많은 지점이 1층에 있어 들어가기 편해요.","shared":true},{"en":"Inside, there are service counters, a waiting area, and machines for taking a number.","ko":"안에는 창구, 대기 공간, 번호표 기계가 있어요.","shared":true},{"en":"ATMs are often near the entrance for quick withdrawals and deposits.","ko":"빠르게 돈을 찾고 넣는 ATM은 보통 입구 근처에 있어요.","shared":true},{"en":"The branch I use opens around nine and closes around four on weekdays, though hours vary.","ko":"제가 이용하는 지점은 평일 대략 9시에 열고 4시에 닫지만 시간은 지점마다 달라요.","shared":true},{"en":"People go there to discuss accounts, exchange money, or get help with paperwork.","ko":"사람들은 계좌를 상담하거나 환전하거나 서류 도움을 받으러 가요.","shared":true},{"en":"The design is usually bright and practical rather than decorative.","ko":"디자인은 보통 장식적이기보다 밝고 실용적이에요.","shared":true},{"en":"I check the branch's hours before visiting because I don't want to arrive too late.","ko":"너무 늦게 도착하지 않도록 방문 전에 시간을 확인해요.","shared":true}],"note":"사람들의 이용 목적·은행 위치를 설명합니다. 지점 운영 시간은 연습용 사례이며 모든 은행의 현재 운영 시간을 단정하지 않습니다.","sources":[{"id":"M194_2","label":"오픽만수르 IM2–IH · p.194 · M194_2"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에 있는 은행에 대해 말해주세요.","은행은 어떤가요?","어디에 위치해 있나요?","언제 문을 열고 닫나요?","사람들은 은행에서 무엇을 하나요?"],"words":107,"representative":"M192_1","additional":0,"sharedCount":8,"related":["M192_1","H1_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M196_3","page":196,"title":"마지막으로 간 은행 경험","q":"When was the last time you went to a bank? Which bank did you visit? Why did you go there? Please describe your recent experience in detail.","qko":"언제 마지막으로 은행에 갔나요? 어느 은행을 방문했나요? 왜 거기에 갔나요? 최 근 경험을 자세히 말해주세요.","source":"pdf","topic":"은행","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.196 · M196_3","family":"bank-visit","cue":"지난가을 동네 은행 → 엔화 → 긴 대기 → 도움","lines":[{"en":"The last time I visited a bank was last fall, before my trip to Osaka.","ko":"마지막 은행 방문은 지난가을 오사카 여행 전이었어요.","shared":true},{"en":"I went to a Woori Bank branch near my apartment to exchange some money for yen.","ko":"엔화로 환전하려고 집 근처 우리은행 지점에 갔어요.","shared":true},{"en":"There were more people than I expected, and I worried about another appointment afterward.","ko":"생각보다 사람이 많아서 다음 약속이 걱정됐어요.","shared":true},{"en":"I asked an employee how long the wait might be and whether I had the right documents.","ko":"직원에게 예상 대기 시간과 서류가 맞는지 물었어요.","shared":true},{"en":"She checked my identification and helped me prepare the form while I waited.","ko":"직원이 신분증을 확인하고 기다리는 동안 서류 작성을 도와줬어요.","shared":true},{"en":"When my number was called, the exchange itself took only a few minutes.","ko":"번호가 불렸을 때 환전 자체는 몇 분밖에 안 걸렸어요.","shared":true},{"en":"I checked the money and receipt, and I still reached my next appointment on time.","ko":"돈과 영수증을 확인했고 다음 약속에도 제시간에 갔어요.","shared":true},{"en":"I was grateful because her practical help turned a stressful wait into a smooth visit.","ko":"실질적인 도움 덕분에 불안한 기다림이 무사한 방문으로 끝나 고마웠어요.","shared":true}],"note":"","sources":[{"id":"M196_3","label":"오픽만수르 IM2–IH · p.196 · M196_3"}],"correction":"","scope":"돌발·확장","requirements":["언제 마지막으로 은행에 갔나요?","어느 은행을 방문했나요?","왜 거기에 갔나요?","최 근 경험을 자세히 말해주세요."],"words":118,"representative":"M196_3","additional":0,"sharedCount":8,"related":["H1_09","H1_10"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"M198_1","page":198,"title":"패션 설명 묘사","q":"What kinds of clothes do people in your country typically wear? What are fashion trends? What do people wear when they work and when they are at home? Are there different clothes for work and at home? Tell me about the fashion in your country in detail.","qko":"당신의 나라 사람들은 일반적으로 어떤 옷을 입나요? 패션 트렌드는 어떤가요? 사람들이 일할 때와 집에 있을 때 어떤 옷을 입나요? 직장과 집에서 옷의 차이점이 있나요? 당신의 나라 패션에 대해 자세히 말해주세요.","source":"pdf","topic":"패션","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.198 · M198_1","family":"fashion","cue":"편한 옷 → 일할 땐 단정·집은 느슨 → 계절","lines":[{"en":"The clothes I notice around me in Korea are often comfortable and practical.","ko":"한국에서 주변을 보면 편하고 실용적인 옷이 많아요.","shared":false},{"en":"Jeans, loose shirts, and sneakers are common in casual settings.","ko":"일상에서는 청바지, 넉넉한 셔츠, 운동화를 자주 봐요.","shared":false},{"en":"For work, some people wear suits or neat shirts, depending on their workplace.","ko":"일할 때는 직장에 따라 정장이나 단정한 셔츠를 입기도 해요.","shared":false},{"en":"At home, people can change into softer clothes such as T-shirts and sweatpants.","ko":"집에서는 티셔츠나 트레이닝복처럼 더 부드러운 옷으로 갈아입을 수 있어요.","shared":false},{"en":"The weather also matters: light clothes are useful in summer, and thick coats are needed in winter.","ko":"날씨도 중요해서 여름에는 가벼운 옷, 겨울에는 두꺼운 외투가 필요해요.","shared":false},{"en":"I see many people choosing relaxed fits, but there isn't just one style for everyone.","ko":"편한 핏을 고르는 사람이 많아 보이지만 모두 한 가지 스타일인 건 아니에요.","shared":false},{"en":"Personally, I prefer simple colors because they are easy to match.","ko":"저는 맞춰 입기 쉬워서 단순한 색을 좋아해요.","shared":false}],"note":"","sources":[{"id":"M198_1","label":"오픽만수르 IM2–IH · p.198 · M198_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라 사람들은 일반적으로 어떤 옷을 입나요?","패션 트렌드는 어떤가요?","사람들이 일할 때와 집에 있을 때 어떤 옷을 입나요?","직장과 집에서 옷의 차이점이 있나요?","당신의 나라 패션에 대해 자세히 말해주세요."],"words":92,"representative":"M198_1","additional":0,"sharedCount":0,"related":[],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"M200_2","page":200,"title":"패션 쇼핑 경험","q":"Please tell me about the last time you went clothes shopping. Where did you go to buy it? What items did you buy?","qko":"마지막으로 한 옷 쇼핑에 대해 이야기해주세요. 옷을 사러 어디로 갔나요? 무엇 을 샀습니까?","source":"pdf","topic":"패션","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.200 · M200_2","family":"clothes","cue":"지난달 몰 → 민 → 재킷·셔츠 → 영수증 할인 오류","lines":[{"en":"Last month, I went to a clothing store in a nearby shopping mall with Min.","ko":"지난달 민이와 근처 쇼핑몰의 옷 가게에 갔어요.","shared":true},{"en":"I needed a light jacket and a plain T-shirt for cooler evenings.","ko":"선선한 저녁에 입을 가벼운 재킷과 무지 티셔츠가 필요했어요.","shared":true},{"en":"We tried a few sizes, and Min helped me choose a jacket that fitted comfortably.","ko":"몇 가지 사이즈를 입어보고 민이가 편하게 맞는 재킷을 고르도록 도와줬어요.","shared":true},{"en":"I bought both items, but I noticed a mistake on the receipt before leaving the mall.","ko":"둘 다 샀는데 몰을 나가기 전에 영수증의 오류를 발견했어요.","shared":true},{"en":"The jacket was marked down on the shelf, but I had paid the full price.","ko":"매장에서는 할인 표시가 있었지만 원래 가격으로 결제됐어요.","shared":true},{"en":"I went back with the receipt, and the employee checked the price label.","ko":"영수증을 갖고 돌아가니 직원이 가격표를 확인했어요.","shared":true},{"en":"She apologized and refunded the difference to my card.","ko":"직원이 사과하고 차액을 카드로 환불해 줬어요.","shared":true},{"en":"I liked the clothes, and the experience reminded me to check receipts carefully.","ko":"옷은 마음에 들었고 영수증을 잘 확인해야겠다고 느꼈어요.","shared":true}],"note":"","sources":[{"id":"M200_2","label":"오픽만수르 IM2–IH · p.200 · M200_2"}],"correction":"","scope":"돌발·확장","requirements":["마지막으로 한 옷 쇼핑에 대해 이야기해주세요.","옷을 사러 어디로 갔나요?","무엇 을 샀습니까?"],"words":108,"representative":"M200_2","additional":0,"sharedCount":8,"related":["M064_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M202_3","page":202,"title":"패션 트렌드 변화, 유행","q":"Fashion trends change over time. What kind of clothes were popular when you were young? How were the styles? And what about now? Please compare the fashion trends in the past and now.","qko":"패션 트렌드는 시간이 지나면서 변합니다. 당신이 어릴 때 사람들은 어떤 옷을 입었나요? 스타일이 어땠나요? 그리고 지금은 어떤가요? 과거와 현재의 패션 트 렌드를 비교해주세요.","source":"pdf","topic":"패션","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.202 · M202_3","family":"fashion-change","cue":"어릴 때 몸에 붙는 옷 → 지금 편한 핏 → 개인 관찰","lines":[{"en":"The biggest fashion change I notice is a greater focus on comfort.","ko":"제가 느끼는 가장 큰 패션 변화는 편안함을 더 중시한다는 거예요.","shared":false},{"en":"When I was younger, many people around me liked fitted shirts and narrow jeans.","ko":"어릴 때 주변에는 몸에 맞는 셔츠와 폭이 좁은 청바지를 좋아하는 사람이 많았어요.","shared":false},{"en":"People often chose clothes because they looked neat, even if they were not very comfortable.","ko":"별로 편하지 않아도 단정해 보인다는 이유로 옷을 고르곤 했어요.","shared":false},{"en":"Now I see more loose trousers, roomy tops, and sneakers in everyday outfits.","ko":"지금은 일상복에서 넉넉한 바지, 여유 있는 상의, 운동화를 더 많이 봐요.","shared":false},{"en":"Of course, styles come back and not everyone follows the same trend.","ko":"물론 유행은 돌아오고 모두 같은 유행을 따르진 않아요.","shared":false},{"en":"My own clothes have become simpler, and I care more about being able to move easily.","ko":"제 옷도 단순해졌고 편하게 움직이는 걸 더 중요하게 생각해요.","shared":false},{"en":"I prefer that change because I can wear the same comfortable outfit for several daily activities.","ko":"편한 옷 하나로 여러 일상 활동을 할 수 있어 그 변화가 좋아요.","shared":false}],"note":"","sources":[{"id":"M202_3","label":"오픽만수르 IM2–IH · p.202 · M202_3"}],"correction":"","scope":"돌발·확장","requirements":["패션 트렌드는 시간이 지나면서 변합니다.","당신이 어릴 때 사람들은 어떤 옷을 입었나요?","스타일이 어땠나요?","그리고 지금은 어떤가요?","과거와 현재의 패션 트 렌드를 비교해주세요."],"words":98,"representative":"M202_3","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M204_1","page":204,"title":"계절 묘사","q":"Please tell me about the seasons in your country. How's the weather in each season? Are there any distinct changes? Which season do you like?","qko":"당신의 나라의 계절에 대해 말해주세요. 각 계절마다 날씨는 어떤가요? 뚜렷한 변화가 있나요? 어느 계절을 좋아하시나요?","source":"pdf","topic":"날씨","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.204 · M204_1","family":"weather","cue":"사계절 → 여름 습함·겨울 추움 → 가을 산책","lines":[{"en":"Korea has four seasons: spring, summer, autumn, and winter.","ko":"한국에는 봄, 여름, 가을, 겨울의 사계절이 있어요.","shared":true},{"en":"Spring is mild, and flowers start appearing in parks and along the streets.","ko":"봄은 온화하고 공원과 거리에 꽃이 피기 시작해요.","shared":true},{"en":"Summer is hot and humid, with periods of heavy rain.","ko":"여름은 덥고 습하며 비가 많이 오는 기간이 있어요.","shared":true},{"en":"Autumn is generally cooler and drier, and the leaves change color.","ko":"가을은 대체로 더 서늘하고 건조하며 단풍이 들어요.","shared":true},{"en":"Winter is cold, so people wear thick coats, and we sometimes get snow.","ko":"겨울은 추워서 두꺼운 외투를 입고 가끔 눈도 와요.","shared":true},{"en":"The difference between a humid summer day and a freezing winter morning is very clear.","ko":"습한 여름날과 몹시 추운 겨울 아침의 차이는 분명해요.","shared":true},{"en":"My favorite season is autumn because I can spend time outside without getting too hot.","ko":"너무 덥지 않게 밖에서 지낼 수 있어 가을이 가장 좋아요.","shared":true},{"en":"Many people go hiking or enjoy the fall colors, while I prefer a gentle walk in the park.","ko":"많은 사람이 등산이나 단풍 구경을 하고 저는 공원에서 가볍게 걷는 게 좋아요.","shared":true}],"note":"","sources":[{"id":"M204_1","label":"오픽만수르 IM2–IH · p.204 · M204_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라의 계절에 대해 말해주세요.","각 계절마다 날씨는 어떤가요?","뚜렷한 변화가 있나요?","어느 계절을 좋아하시나요?"],"words":104,"representative":"M204_1","additional":0,"sharedCount":8,"related":["H5_05","H5_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M206_2","page":206,"title":"최근, 오늘 날씨 묘사","q":"What is the weather like in your country these days? Is it cold or warm? Please tell me about today's weather in detail.","qko":"요즘 날씨 어떤가요? 덥나요? 춥나요? 오늘 날씨에 대해 자세히 설명해주세요.","source":"pdf","topic":"날씨","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.206 · M206_2","family":"today","cue":"연습용 선선한 날 → 구름·바람 → 얇은 겉옷","lines":[{"en":"The weather has been fairly mild here recently, with cooler mornings and evenings.","ko":"최근 여기 날씨는 대체로 온화하고 아침저녁은 더 서늘해요.","shared":false},{"en":"Today, the sky is partly cloudy, but it hasn't rained so far.","ko":"오늘은 구름이 조금 있지만 아직 비는 안 왔어요.","shared":false},{"en":"There is a light breeze, so it feels pleasant when I walk outside.","ko":"가벼운 바람이 불어 밖에서 걸으면 기분이 좋아요.","shared":false},{"en":"I put on a thin jacket this morning because it felt cool when I left home.","ko":"아침에 나설 때 서늘해서 얇은 재킷을 입었어요.","shared":false},{"en":"Around midday, it was warm enough to take it off for a while.","ko":"한낮에는 잠시 벗어도 될 만큼 따뜻했어요.","shared":false},{"en":"It seems like a good day for a short walk, as long as the weather stays this way.","ko":"이 날씨가 이어진다면 짧게 산책하기 좋은 날 같아요.","shared":false},{"en":"I will still check the forecast before going out later because conditions can change.","ko":"날씨가 바뀔 수 있어 나중에 나가기 전에 예보는 확인할 거예요.","shared":false}],"note":"선선하고 구름이 조금 있는 날을 가정한 완성 예시. 실제 시험 당일 날씨에 맞게 바꿔야 합니다.","sources":[{"id":"M206_2","label":"오픽만수르 IM2–IH · p.206 · M206_2"}],"correction":"","scope":"돌발·확장","requirements":["요즘 날씨 어떤가요?","덥나요?","춥나요?","오늘 날씨에 대해 자세히 설명해주세요."],"words":99,"representative":"M206_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M208_3","page":208,"title":"날씨 관련 경험, 과거","q":"Tell me about a memorable incident related to severe weather conditions. What was the problem? How did you deal with the situation?","qko":"안 좋은 날씨와 관련된 기억에 남는 사건이 있나요? 문제가 무엇이었나요? 그 상황을 어떻게 해결했나요?","source":"pdf","topic":"날씨","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.208 · M208_3","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"M208_3","label":"오픽만수르 IM2–IH · p.208 · M208_3"}],"correction":"","scope":"돌발·확장","requirements":["안 좋은 날씨와 관련된 기억에 남는 사건이 있나요?","문제가 무엇이었나요?","그 상황을 어떻게 해결했나요?"],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M216_3","H1_07","H3_06","H3_07","H5_07","H6_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M210_4","page":210,"title":"과거 현재 날씨 변화 비교","q":"How has the weather in your country changed over time? What was the weather like when you were a child, and how was it different from now?","qko":"시간이 지나며 당신의 나라의 날씨는 어떻게 변화했나요? 어릴 적 날씨는 어땠고 지금과 어떤 차이가 있었나요?","source":"pdf","topic":"날씨","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.210 · M210_4","family":"weather-change","cue":"어릴 때 완만한 기억 → 요즘 더위·갑작스런 비 체감 → 대비","lines":[{"en":"From my own experience, the weather feels less predictable than when I was a child.","ko":"제 경험으로는 어릴 때보다 날씨를 예측하기 어려운 느낌이에요.","shared":false},{"en":"I remember spending long afternoons outside in spring without checking the forecast much.","ko":"어릴 때 봄에는 예보를 자주 안 보고도 오후 내내 밖에 있던 기억이 나요.","shared":false},{"en":"These days, I pay more attention to sudden rain and very hot days.","ko":"요즘은 갑작스러운 비와 아주 더운 날에 더 신경 써요.","shared":false},{"en":"Of course, childhood memories are not the same as weather records.","ko":"물론 어린 시절 기억이 기상 기록과 같은 건 아니에요.","shared":false},{"en":"Still, I personally carry a small umbrella more often and change outdoor plans more quickly.","ko":"그래도 개인적으로 작은 우산을 더 자주 챙기고 야외 계획을 빨리 바꿔요.","shared":false},{"en":"In summer, I prefer going out early or in the evening instead of at midday.","ko":"여름에는 한낮 대신 이른 시간이나 저녁에 나가는 게 좋아요.","shared":false},{"en":"The biggest difference for me is how much planning I now do around the weather.","ko":"저에게 가장 큰 차이는 날씨에 맞춰 계획하는 일이 많아졌다는 거예요.","shared":false}],"note":"","sources":[{"id":"M210_4","label":"오픽만수르 IM2–IH · p.210 · M210_4"}],"correction":"","scope":"돌발·확장","requirements":["시간이 지나며 당신의 나라의 날씨는 어떻게 변화했나요?","어릴 적 날씨는 어땠고 지금과 어떤 차이가 있었나요?"],"words":97,"representative":"M210_4","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M212_1","page":212,"title":"지형 설명, 묘사","q":"Describe your country's geography. Are there many mountains, rivers, or other landforms? Is there a seashore part of the geography? Tell me about the layout of your country's land in detail.","qko":"당신의 나라의 지형에 대해 설명해주세요. 산, 강 또는 다른 지형 특성들이 많이 있나요? 해안 지형이 있나요? 당신의 나라의 지형에 대해 자세히 말해주세요.","source":"pdf","topic":"지형","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.212 · M212_1","family":"geography","cue":"한반도 → 산·강·해안 → 일본 섬과 비교","lines":[{"en":"South Korea is in the southern part of the Korean Peninsula.","ko":"한국은 한반도 남쪽에 있어요.","shared":true},{"en":"There are many mountains inland, along with rivers and flatter areas where cities and farms are located.","ko":"내륙에는 산이 많고 강과 도시·농지가 있는 평지도 있어요.","shared":true},{"en":"The country has coastlines to the east, west, and south.","ko":"동쪽, 서쪽, 남쪽에 해안이 있어요.","shared":true},{"en":"That means people can often reach either a mountain or the sea without a very long trip.","ko":"그래서 아주 멀리 가지 않고 산이나 바다에 갈 수 있는 경우가 많아요.","shared":true},{"en":"Japan also has mountains and long coastlines, but it is made up of islands rather than being part of this peninsula.","ko":"일본도 산과 긴 해안이 있지만 이 반도의 일부가 아니라 섬들로 이루어져 있어요.","shared":true},{"en":"I especially enjoy the east coast of Korea because of its open sea views.","ko":"저는 탁 트인 바다 풍경 때문에 한국 동해안을 특히 좋아해요.","shared":true},{"en":"The variety of landscapes gives us many choices for short trips.","ko":"다양한 풍경 덕분에 짧은 여행의 선택지가 많아요.","shared":true}],"note":"","sources":[{"id":"M212_1","label":"오픽만수르 IM2–IH · p.212 · M212_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라의 지형에 대해 설명해주세요.","산, 강 또는 다른 지형 특성들이 많이 있나요?","해안 지형이 있나요?","당신의 나라의 지형에 대해 자세히 말해주세요."],"words":101,"representative":"M212_1","additional":0,"sharedCount":7,"related":["H6_05"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M214_2","page":214,"title":"지형 특성 활동","q":"What kinds of activities do people in your country do using geographical features? Do they go hiking, swimming, or riding a bicycle? What are the differences from other countries? Please give me all the details.","qko":"당신의 나라 사람들은 지형 특성을 이용하여 어떤 활동을 하나요? 하이킹, 수영 또는 자전거를 타나요? 다른 나라와 차이점은 무엇인가요? 많은 세부사항을 알려 주세요.","source":"pdf","topic":"지형","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.214 · M214_2","family":"geo-activity","cue":"산 등산·강 자전거·바다 → 네덜란드 평지 비교","lines":[{"en":"People in Korea enjoy different activities depending on the landscape.","ko":"한국 사람들은 지형에 따라 다양한 활동을 즐겨요.","shared":false},{"en":"In mountain areas, many people go hiking and enjoy the view from a trail.","ko":"산에서는 많은 사람이 등산하며 길에서 풍경을 즐겨요.","shared":false},{"en":"Along rivers, there are places where people can walk or ride bicycles.","ko":"강을 따라서는 걷거나 자전거를 탈 수 있는 곳이 있어요.","shared":false},{"en":"At the coast, people swim in suitable areas, take pictures, or simply walk on the beach.","ko":"해안에서는 적절한 곳에서 수영하거나 사진을 찍거나 해변을 걸어요.","shared":false},{"en":"Compared with a flatter country such as the Netherlands, Korea offers more mountain hiking close to many towns.","ko":"네덜란드처럼 평평한 나라와 비교하면 한국에는 여러 도시 가까이 산에서 등산할 곳이 더 많아요.","shared":false},{"en":"Of course, both countries have outdoor activities; the terrain just changes the choices.","ko":"물론 두 나라 모두 야외 활동이 있고 지형에 따라 선택이 달라지는 거예요.","shared":false},{"en":"Personally, I prefer an easy coastal walk to a steep mountain trail.","ko":"개인적으로는 가파른 산길보다 편한 해안 산책이 좋아요.","shared":false}],"note":"","sources":[{"id":"M214_2","label":"오픽만수르 IM2–IH · p.214 · M214_2"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라 사람들은 지형 특성을 이용하여 어떤 활동을 하나요?","하이킹, 수영 또는 자전거를 타나요?","다른 나라와 차이점은 무엇인가요?","많은 세부사항을 알려 주세요."],"words":95,"representative":"M214_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M216_3","page":216,"title":"지형 관련 과거 경험","q":"Tell me about a special landscape you have seen in your country. Where was it, and when did you see it? What were the geographical features of that place? What did the place look like? Describe a memorable time when you visited that place in detail.","qko":"당신의 나라에서 본 특별한 지형에 대해 말해주세요. 어디였고 언제 그것을 보았 나요? 그 장소의 지형적 특성은 무엇이었나요? 그 장소는 어떻게 생겼나요? 그 장소를 방문했을 때 기억에 남는 것을 묘사해주세요.","source":"pdf","topic":"지형","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.216 · M216_3","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"M216_3","label":"오픽만수르 IM2–IH · p.216 · M216_3"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에서 본 특별한 지형에 대해 말해주세요.","어디였고 언제 그것을 보았 나요?","그 장소의 지형적 특성은 무엇이었나요?","그 장소는 어떻게 생겼나요?","그 장소를 방문했을 때 기억에 남는 것을 묘사해주세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","H1_07","H3_06","H3_07","H5_07","H6_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M218_1","page":218,"title":"집안일 역할 / 집안일 종류 소개, 묘사","q":"Everyone has to do housework regularly. What kind of chores do you usually do at home? What is your responsibility at home? Tell me in detail.","qko":"모든 사람들은 정기적으로 집안일을 해야 합니다. 당신은 집에서 어떤 집안일을 주로 합니까? 그것들에 대해 자세히 말해주세요.","source":"pdf","topic":"집안일","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.218 · M218_1","family":"chores","cue":"현재 혼자 전부 → 예전 가족 분담 → 공정","lines":[{"en":"Since I live alone, I am responsible for all the chores in my apartment.","ko":"혼자 살아서 집안일을 모두 제가 맡아요.","shared":true},{"en":"I wash the dishes every day and do laundry and vacuuming on weekends.","ko":"매일 설거지하고 주말에 빨래와 청소기를 돌려요.","shared":true},{"en":"I also sort the recycling and take it to the collection area.","ko":"재활용품도 분류해 배출장에 가져가요.","shared":true},{"en":"When I lived with my parents, my mother usually cooked, my father cleaned the floors, and I washed the dishes.","ko":"부모님과 살 때는 보통 어머니가 요리하고 아버지가 바닥을 청소하고 저는 설거지했어요.","shared":true},{"en":"We changed jobs when someone was busy, so the division felt reasonably fair.","ko":"누군가 바쁘면 역할을 바꿔서 분담은 꽤 공정하다고 느꼈어요.","shared":true},{"en":"As a child, I only had to tidy my room, but now I manage the whole home.","ko":"어릴 때는 제 방만 정리하면 됐지만 지금은 집 전체를 관리해요.","shared":true},{"en":"It takes more effort, so I make a short weekly list instead of doing everything at once.","ko":"더 힘들어서 한꺼번에 하기보다 주간 목록을 짧게 만들어요.","shared":true},{"en":"Having my own place has made me appreciate how much work my parents used to do.","ko":"독립하고 나서 부모님이 얼마나 많은 일을 하셨는지 알게 됐어요.","shared":true}],"note":"가족 분담 질문에는 현재 혼자 산다는 점을 먼저 밝히고, 부모님과 부모님과 살던 때의 분담을 구분합니다.","sources":[{"id":"M220_2","label":"오픽만수르 IM2–IH · p.220 · M220_2"}],"correction":"","scope":"돌발·확장","requirements":["당신의 가족들은 집에서 아마 각자 다른 책임(역할)을 가졌을 것입니다.","각 가족 구성원의 집안일 역할은 무엇입니까?","그리고 그들은 어떻게 합니까?"],"words":122,"representative":"M218_1","additional":0,"sharedCount":8,"related":["M218_1","H4_02","H4_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M222_3","page":222,"title":"집안일 관련 경험","q":"Have you ever had housework that you were not able to do? Please explain why you were not able to do them. Use as many details as possible to explain it.","qko":"당신은 집안일을 할 수 없었던 적이 있습니까? 그렇다면 왜 그것을 할 수 없었는 지 설명해주세요. 가능한 많이 세부적으로 말해주세요.","source":"pdf","topic":"집안일","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.222 · M222_3","family":"chores-problem","cue":"지난달 빨래 → 세탁기 멈춤 → 기사 → 빨래방","lines":[{"en":"Last month, I couldn't finish my laundry because my washing machine stopped halfway through.","ko":"지난달 세탁기가 중간에 멈춰서 빨래를 끝내지 못했어요.","shared":true},{"en":"It was Saturday morning, and the clothes were still wet inside.","ko":"토요일 아침이었고 옷이 안에서 젖어 있었어요.","shared":true},{"en":"I felt frustrated because I needed some of them for the next day.","ko":"다음 날 필요한 옷도 있어서 답답했어요.","shared":true},{"en":"I checked the manual and called the service center rather than forcing the door open.","ko":"문을 억지로 열지 않고 설명서를 본 뒤 서비스센터에 전화했어요.","shared":true},{"en":"The staff explained how to drain the machine safely and arranged a repair visit.","ko":"직원이 안전하게 물을 빼는 방법을 알려주고 수리 방문을 잡아줬어요.","shared":true},{"en":"I took the wet clothes to a nearby laundry shop and finished washing them there.","ko":"젖은 옷은 근처 빨래방에서 마저 세탁했어요.","shared":true},{"en":"The machine was repaired the next day, and none of the clothes were damaged.","ko":"다음 날 세탁기를 고쳤고 옷은 상하지 않았어요.","shared":true},{"en":"It taught me to leave extra time for chores instead of always doing them at the last minute.","ko":"집안일을 늘 마지막에 하지 말고 여유를 두어야겠다고 느꼈어요.","shared":true}],"note":"","sources":[{"id":"M222_3","label":"오픽만수르 IM2–IH · p.222 · M222_3"}],"correction":"","scope":"돌발·확장","requirements":["당신은 집안일을 할 수 없었던 적이 있습니까?","그렇다면 왜 그것을 할 수 없었는 지 설명해주세요.","가능한 많이 세부적으로 말해주세요."],"words":114,"representative":"M222_3","additional":0,"sharedCount":8,"related":["H4_03"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M224_1","page":224,"title":"우리나라 재활용 시스템 설명","q":"Recycling is a common practice. How do people in your country recycle? What kind of items do people usually recycle? What is special about recycling? Please tell me about the recycling system in your country in detail.","qko":"재활용은 일반적인 관행입니다. 당신의 나라 사람들은 어떻게 재활용을 하나요? 어떤 물건들을 주로 재활용하나요? 재활용에 특별한 점은 무엇인가요? 당신의 나 라의 재활용 시스템에 대해 자세히 말해주세요.","source":"pdf","topic":"재활용","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.224 · M224_1","family":"recycle","cue":"종이·플라스틱·캔 → 비우고 분류 → 일요일 배출","lines":[{"en":"At home, I separate paper, plastic containers, cans, and glass from ordinary trash.","ko":"집에서 종이, 플라스틱 용기, 캔, 유리를 일반 쓰레기와 나눠요.","shared":true},{"en":"I empty the containers and clean off food before putting them in separate bags.","ko":"용기를 비우고 음식물을 씻어낸 뒤 각각의 봉투에 넣어요.","shared":true},{"en":"I flatten cardboard boxes so they take up less space.","ko":"종이 상자는 납작하게 접어 부피를 줄여요.","shared":true},{"en":"In my building, I take the bags to the marked collection area on Sunday.","ko":"저희 건물에서는 일요일에 표시된 배출장에 봉투를 가져가요.","shared":true},{"en":"I sort things as I use them, but I don't carry them outside every day.","ko":"쓸 때마다 분류하지만 매일 밖에 내놓지는 않아요.","shared":true},{"en":"For confusing items, I check the building's notice instead of guessing.","ko":"헷갈리는 물건은 짐작하지 않고 건물 안내문을 확인해요.","shared":true},{"en":"Rules can differ by area, but separating materials and keeping them clean are important parts of the process.","ko":"지역별 규칙은 다를 수 있지만 재질을 나누고 깨끗하게 하는 건 중요한 과정이에요.","shared":true},{"en":"For example, rinsing a yogurt cup takes only a moment and makes the collection area less messy.","ko":"예를 들어 요구르트 용기를 헹구는 데는 잠깐이면 되고 배출장도 덜 지저분해져요.","shared":true}],"note":"","sources":[{"id":"M224_1","label":"오픽만수르 IM2–IH · p.224 · M224_1"}],"correction":"","scope":"돌발·확장","requirements":["재활용은 일반적인 관행입니다.","당신의 나라 사람들은 어떻게 재활용을 하나요?","어떤 물건들을 주로 재활용하나요?","재활용에 특별한 점은 무엇인가요?","당신의 나 라의 재활용 시스템에 대해 자세히 말해주세요."],"words":112,"representative":"M224_1","additional":0,"sharedCount":8,"related":["M226_2","H5_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M226_2","page":226,"title":"재활용 하는 방법 설명","q":"Tell me, how do you recycle at home? What items do you usually recycle? How often do you take out recyclable items? Where do you take the recycling items to? Describe each step you take when you recycle at home.","qko":"당신이 집에서 어떻게 재활용을 하는지 말해주세요. 어떤 물건을 주로 재활용하 나요? 얼마나 자주 재활용품들을 밖에 버리나요? 어디에 재활용품을 버리나요? 집에서 재활용하는 각 단계를 설명해주세요.","source":"pdf","topic":"재활용","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.226 · M226_2","family":"recycle","cue":"종이·플라스틱·캔 → 비우고 분류 → 일요일 배출","lines":[{"en":"At home, I separate paper, plastic containers, cans, and glass from ordinary trash.","ko":"집에서 종이, 플라스틱 용기, 캔, 유리를 일반 쓰레기와 나눠요.","shared":true},{"en":"I empty the containers and clean off food before putting them in separate bags.","ko":"용기를 비우고 음식물을 씻어낸 뒤 각각의 봉투에 넣어요.","shared":true},{"en":"I flatten cardboard boxes so they take up less space.","ko":"종이 상자는 납작하게 접어 부피를 줄여요.","shared":true},{"en":"In my building, I take the bags to the marked collection area on Sunday.","ko":"저희 건물에서는 일요일에 표시된 배출장에 봉투를 가져가요.","shared":true},{"en":"I sort things as I use them, but I don't carry them outside every day.","ko":"쓸 때마다 분류하지만 매일 밖에 내놓지는 않아요.","shared":true},{"en":"For confusing items, I check the building's notice instead of guessing.","ko":"헷갈리는 물건은 짐작하지 않고 건물 안내문을 확인해요.","shared":true},{"en":"Rules can differ by area, but separating materials and keeping them clean are important parts of the process.","ko":"지역별 규칙은 다를 수 있지만 재질을 나누고 깨끗하게 하는 건 중요한 과정이에요.","shared":true},{"en":"For example, rinsing a yogurt cup takes only a moment and makes the collection area less messy.","ko":"예를 들어 요구르트 용기를 헹구는 데는 잠깐이면 되고 배출장도 덜 지저분해져요.","shared":true}],"note":"","sources":[{"id":"M226_2","label":"오픽만수르 IM2–IH · p.226 · M226_2"}],"correction":"","scope":"돌발·확장","requirements":["당신이 집에서 어떻게 재활용을 하는지 말해주세요.","어떤 물건을 주로 재활용하 나요?","얼마나 자주 재활용품들을 밖에 버리나요?","어디에 재활용품을 버리나요?","집에서 재활용하는 각 단계를 설명해주세요."],"words":112,"representative":"M224_1","additional":0,"sharedCount":8,"related":["M224_1","H5_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M228_3","page":228,"title":"재활용 관련 기억에 남는 경험, 과거","q":"Tell me about a memorable experience you had while recycling. What incident event was it? What happened? And how did you deal with it? Why was it so special? Tell me all the experience in detail.","qko":"재활용하며 겪은 기억에 남는 경험을 말해주세요. 어떤 사건이 있었나요? 무슨 일이 있었나요? 그리고 어떻게 그것을 해결했나요? 왜 그것이 특별한가요? 그 경 험에 대해 자세히 말해주세요.","source":"pdf","topic":"재활용","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.228 · M228_3","family":"recycle-memory","cue":"지난달 → 상자 속 열쇠 → 배출장 → 발견","lines":[{"en":"Last month, I accidentally took my spare keys out with the recycling.","ko":"지난달 실수로 여분 열쇠를 재활용품과 함께 내놨어요.","shared":true},{"en":"I had left them in a small cardboard box while cleaning my desk.","ko":"책상을 청소하면서 작은 종이 상자에 넣어뒀던 거예요.","shared":true},{"en":"After taking the boxes downstairs, I noticed the keys were missing.","ko":"상자들을 아래층에 내놓은 뒤 열쇠가 없는 걸 알아챘어요.","shared":true},{"en":"I checked my pockets first and then remembered the box.","ko":"먼저 주머니를 확인하다가 상자가 생각났어요.","shared":true},{"en":"I hurried back to the collection area before the boxes were picked up.","ko":"상자가 수거되기 전에 배출장으로 급히 돌아갔어요.","shared":true},{"en":"Fortunately, the small box was still on top, and the keys were inside.","ko":"다행히 작은 상자가 아직 위에 있었고 열쇠도 안에 있었어요.","shared":true},{"en":"I felt relieved because replacing them would have been a hassle.","ko":"다시 만들려면 번거로웠을 텐데 안심이 됐어요.","shared":true},{"en":"Now I open every box before flattening it, so that small mistake changed my routine.","ko":"이제 접기 전에 모든 상자를 열어보니 작은 실수가 습관을 바꾼 셈이에요.","shared":true}],"note":"","sources":[{"id":"M228_3","label":"오픽만수르 IM2–IH · p.228 · M228_3"}],"correction":"What incident event was it? → What kind of incident was it?","scope":"돌발·확장","requirements":["재활용하며 겪은 기억에 남는 경험을 말해주세요.","어떤 사건이 있었나요?","무슨 일이 있었나요?","그리고 어떻게 그것을 해결했나요?","왜 그것이 특별한가요?","그 경 험에 대해 자세히 말해주세요."],"words":98,"representative":"M228_3","additional":0,"sharedCount":8,"related":["H5_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M230_1","page":230,"title":"가구 묘사, 설명","q":"Tell me about your favorite piece of furniture in your house. What furniture do you have? What does it look like, and what do you like about the furniture? Describe it in detail.","qko":"당신의 집에서 가장 좋아하는 가구 하나를 말해주세요. 무슨 가구를 가지고 있나 요? 그 가구는 어떤가요? 그리고 왜 그것을 좋아하나요? 자세히 말해주세요.","source":"pdf","topic":"가구","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.230 · M230_1","family":"desk","cue":"침대·책상 → 서랍 두 개 → 공부 → 정돈","lines":[{"en":"My favorite piece of furniture is the small wooden desk in my bedroom.","ko":"가장 좋아하는 가구는 침실의 작은 나무 책상이에요.","shared":true},{"en":"I also have a bed, a closet, and a small sofa, but I use the desk in many different ways.","ko":"침대, 옷장, 작은 소파도 있지만 책상을 여러 용도로 써요.","shared":true},{"en":"It has a light brown surface and two drawers underneath.","ko":"밝은 갈색 상판과 아래 서랍 두 개가 있어요.","shared":true},{"en":"I use it to study English, plan trips, and keep important papers together.","ko":"영어 공부와 여행 계획을 하고 중요한 서류를 모아두는 데 써요.","shared":true},{"en":"Before I bought it, my books were usually on the floor or the bed.","ko":"사기 전에는 책을 주로 바닥이나 침대에 뒀어요.","shared":true},{"en":"Now I can put things away quickly and find them when I need them.","ko":"이제 물건을 빨리 정리하고 필요할 때 찾을 수 있어요.","shared":true},{"en":"It is special to me because it made living alone feel more organized.","ko":"혼자 사는 생활이 더 정돈되게 해줘서 특별해요.","shared":true},{"en":"It wasn't expensive, but it improved my daily routine more than I expected.","ko":"비싸지 않았지만 생각보다 일상을 많이 개선해 줬어요.","shared":true}],"note":"","sources":[{"id":"M230_1","label":"오픽만수르 IM2–IH · p.230 · M230_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 집에서 가장 좋아하는 가구 하나를 말해주세요.","무슨 가구를 가지고 있나 요?","그 가구는 어떤가요?","그리고 왜 그것을 좋아하나요?","자세히 말해주세요."],"words":110,"representative":"M230_1","additional":0,"sharedCount":8,"related":["H2_05"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M232_2","page":232,"title":"최근에 산 가구","q":"Can you tell me about a piece of furniture you bought recently for some reason? What was it? Why did you buy it? Where did you buy it?","qko":"어떤 이유로 최근에 산 가구 하나를 말해 줄 수 있나요? 무엇인가요? 왜 구매했 나요? 어디서 구매했나요?","source":"pdf","topic":"가구","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.232 · M232_2","family":"desk-change","cue":"빈 침실 → 작은 책상 → 창가 → 만족","lines":[{"en":"When I first moved in last year, my bedroom had a bed but almost no other furniture.","ko":"작년에 처음 이사 왔을 때 침실에는 침대 외에 가구가 거의 없었어요.","shared":true},{"en":"I used to put my books on the floor, so the room always looked messy.","ko":"책을 바닥에 놓곤 해서 방이 늘 어수선해 보였어요.","shared":true},{"en":"Two months ago, I bought a small wooden desk from an online furniture store.","ko":"두 달 전에 온라인 가구점에서 작은 나무 책상을 샀어요.","shared":true},{"en":"I measured the space beside the window before choosing it.","ko":"고르기 전에 창문 옆 공간을 재 봤어요.","shared":true},{"en":"The desk has two drawers, so I can keep my books and cables out of sight.","ko":"서랍 두 개가 있어서 책과 케이블을 깔끔하게 넣어둘 수 있어요.","shared":true},{"en":"I put a warm lamp on top and moved the desk against the wall.","ko":"위에는 따뜻한 빛의 조명을 놓고 벽 쪽으로 책상을 옮겼어요.","shared":true},{"en":"The room looks much tidier now, and I have a proper place to study.","ko":"지금은 방이 훨씬 정돈됐고 제대로 공부할 공간이 생겼어요.","shared":true},{"en":"I'm happy with the change because it made a small room more useful.","ko":"작은 방을 더 잘 활용하게 돼서 만족해요.","shared":true}],"note":"","sources":[{"id":"M232_2","label":"오픽만수르 IM2–IH · p.232 · M232_2"}],"correction":"","scope":"돌발·확장","requirements":["어떤 이유로 최근에 산 가구 하나를 말해 줄 수 있나요?","무엇인가요?","왜 구매했 나요?","어디서 구매했나요?"],"words":113,"representative":"M028_5","additional":0,"sharedCount":8,"related":["M028_5","H2_06","H6_04"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"M234_3","page":234,"title":"가구 관련 문제, 경험","q":"Have you ever had any problems with your furniture? Was it broken, or did it get stained or ripped? What happened? How did you solve this problem? Tell me everything from beginning to end.","qko":"가구와 관련한 문제를 겪은 적이 있나요? 부러지거나 녹슬거나 찢어졌나요? 무슨 일이 있었나요? 어떻게 그 문제를 해결했나요? 처음부터 끝까지 다 말해주세요.","source":"pdf","topic":"가구","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.234 · M234_3","family":"desk-problem","cue":"두 달 전 배송 → 다른 색·흔들림 → 사진 → 교환","lines":[{"en":"Two months ago, I ordered a small wooden desk online, but the wrong one arrived.","ko":"두 달 전에 작은 나무 책상을 온라인으로 주문했는데 다른 제품이 왔어요.","shared":true},{"en":"I had chosen a light brown desk, but the delivered one was dark and had a loose leg.","ko":"밝은 갈색을 골랐는데 온 것은 어둡고 다리도 헐거웠어요.","shared":true},{"en":"I stopped assembling it because I didn't want to make the problem worse.","ko":"문제를 키우고 싶지 않아 조립을 멈췄어요.","shared":true},{"en":"I took photos of the desk and the label and contacted the seller with my order number.","ko":"책상과 라벨 사진을 찍고 주문 번호와 함께 판매자에게 연락했어요.","shared":true},{"en":"The employee checked the details and confirmed a warehouse mistake.","ko":"직원이 확인하고 창고의 실수라고 했어요.","shared":true},{"en":"We arranged for them to collect it and deliver the correct desk three days later.","ko":"수거한 뒤 사흘 후 맞는 책상을 보내기로 했어요.","shared":true},{"en":"This time, I checked the color and tested the legs before putting my things on it.","ko":"이번에는 물건을 올리기 전에 색과 다리를 확인했어요.","shared":true},{"en":"The replacement was fine, and I was satisfied with how the seller handled the mistake.","ko":"교환품은 괜찮았고 판매자의 대응에도 만족했어요.","shared":true}],"note":"","sources":[{"id":"M234_3","label":"오픽만수르 IM2–IH · p.234 · M234_3"}],"correction":"","scope":"돌발·확장","requirements":["가구와 관련한 문제를 겪은 적이 있나요?","부러지거나 녹슬거나 찢어졌나요?","무슨 일이 있었나요?","어떻게 그 문제를 해결했나요?","처음부터 끝까지 다 말해주세요."],"words":119,"representative":"M234_3","additional":0,"sharedCount":8,"related":["M252_13","M264_13","H2_07","H3_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M244_11","page":244,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to buy an mp3 player. Your friend bought an MP3 player recently. Before you make a purchase, call your friend and ask 3 or 4 questions about his or her MP3 player to get some information about the MP3 player.","qko":"주어진 상황에 연기해 보세요. 당신은 MP3 player를 구매하고 싶습니다. 당신의 친구가 최근에 MP3 player를 구 매했습니다. 당신이 구매를 하기 전에, 친구에게 전화하여 MP3 player에 대한 정 보를 얻기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"MP3","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.244 · M244_11","family":"rp-mp3","cue":"구매 의도 → 모델·용량·배터리·가격","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am thinking about buying an MP3 player because I want to listen to music without using my phone.","ko":"휴대폰을 쓰지 않고 음악을 듣고 싶어서 MP3를 살까 생각 중이에요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which model would you recommend for someone who mainly listens while traveling?","ko":"주로 여행 중 듣는 사람에게 어떤 모델을 추천하나요?","shared":true},{"en":"How much music can it store?","ko":"음악을 얼마나 저장할 수 있나요?","shared":true},{"en":"How long does the battery last on one charge?","ko":"한 번 충전하면 배터리가 얼마나 가나요?","shared":true},{"en":"How much did yours cost, including any accessories you needed?","ko":"필요한 액세서리를 포함해 얼마에 샀나요?","shared":true},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M244_11","label":"오픽만수르 IM2–IH · p.244 · M244_11"}],"correction":"","scope":"역할극","requirements":["주어진 상황에 연기해 보세요.","당신은 MP3 player를 구매하고 싶습니다.","당신의 친구가 최근에 MP3 player를 구 매했습니다.","당신이 구매를 하기 전에, 친구에게 전화하여 MP3 player에 대한 정 보를 얻기 위한 3, 4가지 질문을 해보세요."],"words":84,"representative":"M244_11","additional":0,"sharedCount":8,"related":["H4_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M245_12","page":245,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You borrowed an MP3 player from your friend but unfortunately broke it. Call your friend, explain the situation, and give two or three suggestions to get your friend a working MP3 player as quickly as possible.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 친구에게 MP3 player를 빌렸는데 안타깝게도 파손/고장 났습니다. 친구에 게 전화하고, 상황을 설명하세요. 가능한 빨리 친구의 MP3를 정상으로 만들어주 기 위한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"MP3","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.245 · M245_12","family":"rp-broken","cue":"떨어뜨림 → 화면 고장 → 오늘 수리·대체 기기·구매","lines":[{"en":"Hi Min, I am really sorry, but I accidentally dropped your MP3 player while taking it out of my bag.","ko":"민아, 정말 미안한데 가방에서 꺼내다가 네 MP3를 실수로 떨어뜨렸어.","shared":true},{"en":"The screen is cracked, and it won't turn on now.","ko":"화면에 금이 갔고 지금 켜지지 않아.","shared":true},{"en":"I know you need it soon, so I want to get this sorted out quickly.","ko":"곧 필요한 걸 알아서 빨리 해결하고 싶어.","shared":true},{"en":"First, I can take it to a repair shop today and pay for an urgent repair.","ko":"첫째로 오늘 수리점에 가져가 빠른 수리 비용을 낼 수 있어.","shared":true},{"en":"While it is being repaired, you could use a spare music player I can arrange for you.","ko":"수리하는 동안 내가 마련할 수 있는 여분 기기를 써도 돼.","shared":true},{"en":"If it cannot be fixed quickly, I can buy you the same model or another one you choose.","ko":"빨리 고칠 수 없다면 같은 모델이나 네가 고른 다른 모델을 사줄게.","shared":true},{"en":"Please tell me which option you prefer, and I will handle the cost.","ko":"어떤 방법이 좋은지 알려줘. 비용은 내가 부담할게.","shared":true},{"en":"Again, I am sorry for not being more careful.","ko":"더 조심하지 못해서 다시 한번 미안해.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M245_12","label":"오픽만수르 IM2–IH · p.245 · M245_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 친구에게 MP3 player를 빌렸는데 안타깝게도 파손/고장 났습니다.","친구에 게 전화하고, 상황을 설명하세요.","가능한 빨리 친구의 MP3를 정상으로 만들어주 기 위한 2, 3가지 대안을 제시해 보세요."],"words":118,"representative":"M245_12","additional":0,"sharedCount":8,"related":["M248_12","H4_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M246_13","page":246,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had some equipment that broke or was not working properly? What was the problem, and how did you solve it? Provide as many details as possible.","qko":"그것으로 상황은 끝입니다. 어떤 장비/기기가 고장 나거나 제대로 작동하지 않았던 적이 있었나요? 문제가 무엇이었고, 어떻게 해결하셨나요? 가능한 자세하게 말해주세요.","source":"pdf","topic":"MP3","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.246 · M246_13","family":"device-problem","cue":"빌린 MP3 → 떨어뜨림 → 연락 → 수리·비용","lines":[{"en":"Last year, I borrowed Min's MP3 player for a short trip because my phone battery was unreliable.","ko":"작년에 휴대폰 배터리가 불안정해서 짧은 여행용으로 민이의 MP3를 빌렸어요.","shared":true},{"en":"While taking it out of my bag, I accidentally dropped it on the floor.","ko":"가방에서 꺼내다가 실수로 바닥에 떨어뜨렸어요.","shared":true},{"en":"The screen cracked, and the player wouldn't turn on.","ko":"화면에 금이 가고 켜지지 않았어요.","shared":true},{"en":"I felt terrible because it belonged to a friend who had trusted me.","ko":"저를 믿고 빌려준 친구 물건이라 정말 미안했어요.","shared":true},{"en":"I called Min immediately, explained what happened, and offered to pay for the repair.","ko":"바로 전화해 설명하고 수리비를 내겠다고 했어요.","shared":true},{"en":"The repair shop replaced the screen and checked the battery the next day.","ko":"수리점에서 다음 날 화면을 바꾸고 배터리를 확인했어요.","shared":true},{"en":"I tested it, returned it to Min, and apologized again.","ko":"작동을 확인하고 돌려주며 다시 사과했어요.","shared":true},{"en":"He appreciated my honesty, and I learned to use a protective case for borrowed devices.","ko":"친구는 솔직히 말해줘서 고맙다고 했고 저는 빌린 기기에 보호 케이스를 쓰게 됐어요.","shared":true}],"note":"","sources":[{"id":"M246_13","label":"오픽만수르 IM2–IH · p.246 · M246_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","어떤 장비/기기가 고장 나거나 제대로 작동하지 않았던 적이 있었나요?","문제가 무엇이었고, 어떻게 해결하셨나요?","가능한 자세하게 말해주세요."],"words":105,"representative":"M246_13","additional":0,"sharedCount":8,"related":["M249_13","H4_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M247_11","page":247,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to borrow your friend's MP3 player. Call your friend, explain your situation, and ask him or her three or four questions to borrow the MP3 player.","qko":"주어진 상황에 연기해 보세요. 당신은 친구의 MP3 플레이어를 빌리고 싶습니다. 친구에게 전화하여 상황을 설 명하고 MP3 플레이어를 빌리기 위해 3 ~ 4개의 질문을 해보세요.","source":"pdf","topic":"MP3","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.247 · M247_11","family":"rp-borrow","cue":"여행 → 빌리기·충전기·사용법·반납","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"My phone battery is unreliable, and I would like to borrow your MP3 player for a short trip on Sunday.","ko":"휴대폰 배터리가 불안정해서 일요일 짧은 여행에 네 MP3를 빌리고 싶어.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Would it be okay for me to borrow it for one day?","ko":"하루만 빌려도 될까?","shared":false},{"en":"Could I borrow the charging cable as well?","ko":"충전 케이블도 빌릴 수 있을까?","shared":false},{"en":"Is there anything special I need to know about using it?","ko":"사용할 때 특별히 알아야 할 게 있을까?","shared":false},{"en":"When and where would you like me to return it?","ko":"언제 어디서 돌려주면 될까?","shared":false},{"en":"I will keep it in a 모델을 사줄게.","shared":true},{"en":"Please tell me which option you prefer, and I will handle the cost.","ko":"어떤 방법이 좋은지 알려줘. 비용은 내가 부담할게.","shared":true},{"en":"Again, I am sorry for not being more careful.","ko":"더 조심하지 못해서 다시 한번 미안해.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M248_12","label":"오픽만수르 IM2–IH · p.248 · M248_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 친구에게 MP3 player를 빌렸는데 안타깝게도 파손/고장 났습니다.","친구에 게 연락하고, 어떻게 된 것이고 현재 상태가 어떤 지 설명하세요.","이 문제를 해결 하기 위해 2, 3가지 제안을 해보세요."],"words":118,"representative":"M245_12","additional":0,"sharedCount":8,"related":["M245_12","H4_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M249_13","page":249,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had a problem with any electronic devices? What was the problem, and how did you solve it? Provide as many details as possible.","qko":"그것으로 상황은 끝입니다. 어떤 전자기기 사용에 문제가 있었던 적이 있었나요? 문제가 무엇이었고, 어떻게 해결 하셨나요? 가능한 자세하게 말해주세요.","source":"pdf","topic":"MP3","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.249 · M249_13","family":"device-problem","cue":"빌린 MP3 → 떨어뜨림 → 연락 → 수리·비용","lines":[{"en":"Last year, I borrowed Min's MP3 player for a short trip because my phone battery was unreliable.","ko":"작년에 휴대폰 배터리가 불안정해서 짧은 여행용으로 민이의 MP3를 빌렸어요.","shared":true},{"en":"While taking it out of my bag, I accidentally dropped it on the floor.","ko":"가방에서 꺼내다가 실수로 바닥에 떨어뜨렸어요.","shared":true},{"en":"The screen cracked, and the player wouldn't turn on.","ko":"화면에 금이 가고 켜지지 않았어요.","shared":true},{"en":"I felt terrible because it belonged to a friend who had trusted me.","ko":"저를 믿고 빌려준 친구 물건이라 정말 미안했어요.","shared":true},{"en":"I called Min immediately, explained what happened, and offered to pay for the repair.","ko":"바로 전화해 설명하고 수리비를 내겠다고 했어요.","shared":true},{"en":"The repair shop replaced the screen and checked the battery the next day.","ko":"수리점에서 다음 날 화면을 바꾸고 배터리를 확인했어요.","shared":true},{"en":"I tested it, returned it to Min, and apologized again.","ko":"작동을 확인하고 돌려주며 다시 사과했어요.","shared":true},{"en":"He appreciated my honesty, and I learned to use a protective case for borrowed devices.","ko":"친구는 솔직히 말해줘서 고맙다고 했고 저는 빌린 기기에 보호 케이스를 쓰게 됐어요.","shared":true}],"note":"","sources":[{"id":"M249_13","label":"오픽만수르 IM2–IH · p.249 · M249_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","어떤 전자기기 사용에 문제가 있었던 적이 있었나요?","문제가 무엇이었고, 어떻게 해결 하셨나요?","가능한 자세하게 말해주세요."],"words":105,"representative":"M246_13","additional":0,"sharedCount":8,"related":["M246_13","H4_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M250_11","page":250,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to purchase new furniture. Call a furniture store, explain to a salesperson what you are looking for and ask three or four questions about the furniture you want to buy.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 새로운 가구를 구매하려고 합니다. 가구점에 전화하고 무슨 가구를 찾는 지 점원에게 설명하세요. 그리고 원하는 가구에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"가구","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.250 · M250_11","family":"rp-furniture","cue":"작은 책상 → 크기·가격·배송·교환","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am looking for a small wooden desk for my bedroom, with enough space for a laptop.","ko":"침실에서 쓸 작은 나무 책상을 찾고 있어요. 노트북을 놓을 공간은 필요해요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"What are the exact width and depth of this desk?","ko":"이 책상의 정확한 가로와 깊이는 얼마인가요?","shared":false},{"en":"What is the total price, including delivery?","ko":"배송비를 포함한 총가격은 얼마인가요?","shared":false},{"en":"Could you deliver and assemble it next Saturday?","ko":"다음 토요일에 배송하고 조립해 주실 수 있나요?","shared":false},{"en":"What is your return policy if the desk arrives damaged?","ko":"책상이 손상된 채 도착하면 반품 규정은 어떻게 되나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M250_11","label":"오픽만수르 IM2–IH · p.250 · M250_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 새로운 가구를 구매하려고 합니다.","가구점에 전화하고 무슨 가구를 찾는 지 점원에게 설명하세요.","그리고 원하는 가구에 대해 3, 4가지 질문을 해보세요."],"words":80,"representative":"M250_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M251_12","page":251,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You discover a problem with the furniture that you bought. It's just been delivered, but the furniture that arrived is not what you ordered. Call the store, explain this problem, and give two or three options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 구매한 가구에 문제가 있는 것을 발견했습니다. 방금 배송 되었는데, 당신 이 주문한 것이 아닙니다. 가구점에 전화하고 문제를 설명하세요. 그리고 문제를 해결하기 위한 2, 3가지 제안을 해보세요.","source":"pdf","topic":"가구","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.251 · M251_12","family":"rp-wrongdesk","cue":"다른 책상 → 주문 증거 → 교환·환불","lines":[{"en":"Hello, I am calling about the desk delivered to me today.","ko":"안녕하세요. 오늘 배송된 책상 때문에 전화했어요.","shared":false},{"en":"I ordered a small light brown desk, but I received a larger dark one.","ko":"작은 밝은 갈색 책상을 주문했는데 큰 어두운 책상이 왔어요.","shared":false},{"en":"It doesn't fit the space in my bedroom, and I have not assembled it.","ko":"침실 공간에 맞지 않아서 아직 조립하지 않았어요.","shared":false},{"en":"I have the order confirmation and photos ready if you need them.","ko":"필요하시면 주문 확인서와 사진을 보여드릴 수 있어요.","shared":false},{"en":"Could you collect this desk and send the correct one without an extra delivery charge?","ko":"추가 배송비 없이 이 책상을 수거하고 맞는 제품을 보내주실 수 있나요?","shared":false},{"en":"If the correct model is unavailable, I would prefer a full refund and collection of this item.","ko":"맞는 모델이 없다면 전액 환불과 수거를 받고 싶어요.","shared":false},{"en":"Please let me know which option you can arrange and when it would happen.","ko":"어떤 방법이 가능하고 언제 처리되는지 알려주세요.","shared":false},{"en":"Thank you for helping me resolve this.","ko":"해결을 도와주셔서 감사합니다.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M251_12","label":"오픽만수르 IM2–IH · p.251 · M251_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 구매한 가구에 문제가 있는 것을 발견했습니다.","방금 배송 되었는데, 당신 이 주문한 것이 아닙니다.","가구점에 전화하고 문제를 설명하세요.","그리고 문제를 해결하기 위한 2, 3가지 제안을 해보세요."],"words":104,"representative":"M251_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M252_13","page":252,"title":"","q":"That's the end of the situation. Have you ever had a problem with something you bought for your house? What was the problem? And how did you solve it? Provide as many details as possible.","qko":"그것으로 상And끝입니다. 당신의 집을 위해 산 어떤 것에 문제가 있었던 적이 있나요? 무엇이 문제였나요? 그리고 어떻게 해결했나요? 가능한 많은 세부 사항을 제공해주세요.","source":"pdf","topic":"가구","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.252 · M252_13","family":"desk-problem","cue":"두 달 전 배송 → 다른 색·흔들림 → 사진 → 교환","lines":[{"en":"Two months ago, I ordered a small wooden desk online, but the wrong one arrived.","ko":"두 달 전에 작은 나무 책상을 온라인으로 주문했는데 다른 제품이 왔어요.","shared":true},{"en":"I had chosen a light brown desk, but the delivered one was dark and had a loose leg.","ko":"밝은 갈색을 골랐는데 온 것은 어둡고 다리도 헐거웠어요.","shared":true},{"en":"I stopped assembling it because I didn't want to make the problem worse.","ko":"문제를 키우고 싶지 않아 조립을 멈췄어요.","shared":true},{"en":"I took photos of the desk and the label and contacted the seller with my order number.","ko":"책상과 라벨 사진을 찍고 주문 번호와 함께 판매자에게 연락했어요.","shared":true},{"en":"The employee checked the details and confirmed a warehouse mistake.","ko":"직원이 확인하고 창고의 실수라고 했어요.","shared":true},{"en":"We arranged for them to collect it and deliver the correct desk three days later.","ko":"수거한 뒤 사흘 후 맞는 책상을 보내기로 했어요.","shared":true},{"en":"This time, I checked the color and tested the legs before putting my things on it.","ko":"이번에는 물건을 올리기 전에 색과 다리를 확인했어요.","shared":true},{"en":"The replacement was fine, and I was satisfied with how the seller handled the mistake.","ko":"교환품은 괜찮았고 판매자의 대응에도 만족했어요.","shared":true}],"note":"","sources":[{"id":"M252_13","label":"오픽만수르 IM2–IH · p.252 · M252_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상And끝입니다.","당신의 집을 위해 산 어떤 것에 문제가 있었던 적이 있나요?","무엇이 문제였나요?","그리고 어떻게 해결했나요?","가능한 많은 세부 사항을 제공해주세요."],"words":119,"representative":"M234_3","additional":0,"sharedCount":8,"related":["M234_3","M264_13","H2_07","H3_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M253_11","page":253,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend wants to see a performance with you. Call your friend and ask 3 or 4 questions about the performance and his or her plan","qko":"상황을 드립니다. 연기를 해보세요. 당신의 친구가 당신과 공연을 보러 가고 싶어 합니다. 친구에게 전화하고 그 또 는 그녀의 계획과 공연에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"공연","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.253 · M253_11","family":"rp-play","cue":"민의 공연 계획 → 작품·시간·극장·가격","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I would love to see a performance with you, but I need a few details before I can confirm.","ko":"너와 공연을 보고 싶은데 확답하기 전에 몇 가지를 알아야 해.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which play are you thinking of seeing?","ko":"어떤 연극을 보려고 해?","shared":false},{"en":"What day and time does it start?","ko":"무슨 요일 몇 시에 시작해?","shared":false},{"en":"Where is the theater, and where should we meet?","ko":"극장은 어디고 우리는 어디서 만나면 돼?","shared":false},{"en":"How much is each ticket?","ko":"표 한 장에 얼마야?","shared":false},{"en":"Once I have those details, I will check my calendar and message you today. Thanks for inviting me.","ko":"그 내용을 알면 일정을 확인해서 오늘 연락할게. 초대해 줘서 고마워.","shared":false}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M253_11","label":"오픽만수르 IM2–IH · p.253 · M253_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신의 친구가 당신과 공연을 보러 가고 싶어 합니다.","친구에게 전화하고 그 또 는 그녀의 계획과 공연에 대해 3, 4가지 질문을 해보세요."],"words":83,"representative":"M253_11","additional":0,"sharedCount":2,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M254_12","page":254,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You were supposed to go to the performance with your friend today. But unfortunately, you are very sick that you can't get out of bed. Make a telephone call to your friend, explain the situation, and offer 2 or 3 options to solve the situation.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 오늘 친구와 공연을 보러 가기로 했었습니다. 그러나 불행히도 침대에서 일어나지 못할 만큼 아픕니다. 친구에게 전화하고 상황을 설명하세요. 그리고 상황을 해결하기 위한 2, 3가지 대안을 제시해보세요.","source":"pdf","topic":"공연","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.254 · M254_12","family":"rp-sick-play","cue":"갑자기 아픔 → 다른 날·다른 친구 → 확인","lines":[{"en":"Hi Min, I am sorry to change our plans so late, but I woke up with a fever.","ko":"민아, 이렇게 늦게 계획을 바꿔 미안한데 자고 일어나니 열이 나.","shared":true},{"en":"I am too unwell to go to the play today, and I don't want to pass on my cold.","ko":"몸이 너무 안 좋아서 오늘 연극을 보러 갈 수가 없고 감기도 옮기고 싶지 않아.","shared":false},{"en":"I was looking forward to it, so I am disappointed too.","ko":"기대하고 있었어서 나도 아쉬워.","shared":true},{"en":"One option is to move our plans to another date, once I have recovered.","ko":"한 가지는 내가 나은 뒤 다른 날로 계획을 옮기는 거야.","shared":true},{"en":"I can check whether any booking can be changed and handle that part.","ko":"예약을 바꿀 수 있는지 내가 확인해서 처리할게.","shared":true},{"en":"Alternatively, you c
