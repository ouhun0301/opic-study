 to the movies. Which theater or auditorium do you like the most? Where is it? What does it look like? Why do you like that place? Tell me about the movie you watched at this venue.","qko":"당신은 설문조사에서 영화 보는 것을 즐긴다고 답했습니다. 어떤 영화관이나 극 장을 자주 가시나요? 어디에 있나요? 그 곳은 어떤가요? 왜 그 장소를 좋아하시 나요? 이 곳에서 당신이 본 영화에 대해서 말해주세요.","source":"pdf","topic":"영화","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.82 · M082_2"},{"id":"M084_3","page":84,"title":"영화관에서 하는 일","q":"When you go to the movies, who do you usually go with? Are there any reasons you go to the movies with that person? What do you do with that person before going to a movie theater and after watching the movie?","qko":"당신이 영화를 보러 갈 때, 누구와 주로 가시나요? 그 사람과 가는 특별한 이유 가 있나요? 그 사람과 영화 보기 전, 후에 무엇을 하시나요?","source":"pdf","topic":"영화","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.84 · M084_3"},{"id":"M086_4","page":86,"title":"기억에 남는 영화, 과거 경험","q":"Can you tell me about a memorable movie you have seen? What was the movie about? Who was the main actor or actress? How did you feel when you watched it? Explain all the details.","qko":"당신이 본 기억에 남는 영화에 대해 말해 주시겠어요? 어떤 영화였나요? 누가 메 인 주인공이었나요? 그것을 볼 때 어떤 기분이었나요? 자세히 말해주세요.","source":"pdf","topic":"영화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.86 · M086_4"},{"id":"M086_5","page":86,"title":"영화 취향 변화 비교","q":"Talk about one of the movies you watched as a child. What was it? How has your taste in movies changed over the years? How are the movies you enjoy now different from those in the past?","qko":"당신이 어릴 적 봤던 영화에 대해 말해주세요. 무슨 영화였나요? 당신의 영화 취 향은 어떻게 변해왔나요? 지금 즐기는 영화가 과거의 것들과 어떤 차이가 있나요?","source":"pdf","topic":"영화","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.86 · M086_5"},{"id":"M088_1","page":88,"title":"좋아하는 공연 묘사","q":"You indicated in the survey that you enjoy watching plays. What kinds of plays do you like the most? Who is your favorite performer? What play has this actor or actress starred in?","qko":"설문에서 연극 보기를 즐긴다고 했습니다. 어떤 종류의 연극을 가장 좋아하나요? 좋아하는 공연자는 누구이며 그 배우는 어떤 연극에 출연했나요?","source":"pdf","topic":"공연","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.88 · M088_1"},{"id":"M090_2","page":90,"title":"가장 좋아하는 공연장 묘사하기","q":"You indicated in the survey that you enjoy watching plays. Which theater or auditorium do you like the most? Where is it located? What does it look like? How often do you go there? What performances are often held in that theater? Give me many details.","qko":"당신은 설문조사에서 공연 보는 것을 좋아한다고 했습니다. 어떤 영화관이나 극 장을 자주 가시나요? 어디에 있나요? 어떻게 생겼나요? 얼마나 자주 거기에 가나 요? 어떤 공연이 거기서 자주 개최되나요? 많은 세부사항을 알려주세요.","source":"pdf","topic":"공연","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.90 · M090_2"},{"id":"M092_3","page":92,"title":"공연장에서 하는 일","q":"What is your typical day when you go to the auditorium? What do you do before you watch a play? What about after? Please describe your routine in detail.","qko":"공연장에 갈 때 당신의 일반적인 하루는 어떤가요? 공연을 보기 전에 무엇을 하시나요? 공연 후에는 어떤가요? 당신의 일과(루틴)에 대해 자세히 말해주세요.","source":"pdf","topic":"공연","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.92 · M092_3"},{"id":"M094_4","page":94,"title":"기억에 남는 공연, 과거 경험","q":"Can you tell me about the most memorable play you have seen? What play did you see? What do you remember about that play? Who was the main performer? What made it so special? How did it feel when you were watching it? Give as many details as you can.","qko":"가장 기억에 남는 연극을 말하세요. 어떤 연극을 봤고 무엇이 기억나나요? 주연은 누구였나요? 무엇이 특별했고 볼 때 어떤 기분이었나요? 자세히 설명하세요.","source":"pdf","topic":"공연","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.94 · M094_4"},{"id":"M094_5","page":94,"title":"공연 취향 변화 비교","q":"How has your interest in plays changed over the last few years? What kind of play did you like in the past? What about now?","qko":"최근 몇 년간 당신의 공연 취향은 어떻게 변화했나요? 과거에는 어떤 종류의 공 연을 좋아하셨나요? 지금은 어떤가요?","source":"pdf","topic":"공연","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.94 · M094_5"},{"id":"M096_1","page":96,"title":"좋아하는 콘서트 묘사","q":"You indicated in the survey that you would like to go to a concert. What kind of concert do you like the most? Why do you like that concert? Please tell me about it in detail.","qko":"당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다. 어떤 콘서트를 가장 좋아하시나요? 그 콘서트를 왜 좋아하나요? 자세히 말씀해주세요.","source":"pdf","topic":"콘서트","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.96 · M096_1"},{"id":"M097_2","page":97,"title":"가장 좋아하는 콘서트장 묘사하기","q":"You indicated in the survey that you like going to concerts. Tell me about a theater or auditorium you often go to. Where is it located? What do you like about that place? Tell me about the concert you watched at this venue in detail.","qko":"당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다. 자주 가는 극장이나 공연장에 대해 말해주세요. 위치가 어디인가요? 그 장소의 무엇을 좋아하시나요? 이 장소에서 본 콘서트에 대해 말해주세요.","source":"pdf","topic":"콘서트","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.97 · M097_2"},{"id":"M098_3","page":98,"title":"콘서트장에서 하는 일","q":"What is your routine when you go to the auditorium? What do you do before the concert and after? Please describe your routine in as much detail as possible.","qko":"공연장에 가면 어떤 활동을 하시나요? 콘서트 전과 후에 무엇을 하시나요? 당신의 활동 순서를 최대한 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.98 · M098_3"},{"id":"M099_4","page":99,"title":"기억에 남는 콘서트, 과거 경험","q":"Tell me about the most memorable concert you have seen. When was it, and where was it held? Who was the singer? How did you feel when you were watching the concert? Provide as many details as possible.","qko":"가장 기억에 남는 콘서트에 대해 말해주세요. 언제, 어디서였나요? 가수는 누구였 나요? 그 콘서트를 볼 때 어떤 기분이었나요? 최대한 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.99 · M099_4"},{"id":"M100_5","page":100,"title":"콘서트 취향 변화 비교","q":"How has your interest in concerts changed over the last few years? What kind of play did you like in the past? What about now?","qko":"최근 몇 년간 콘서트에 대한 관심이 어떻게 변했나요? 예전에는 어떤 종류의 연극(play)을 좋아했나요? 지금은 어떤가요? ※ 원문에서 concerts와 play를 혼용합니다.","source":"pdf","topic":"콘서트","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.100 · M100_5"},{"id":"M101_1","page":101,"title":"좋아하는 가수 묘사","q":"You indicated in the survey that you like listening to music. What types of music do you like? Who is your favorite singer or composer? Why do you like him or her? (singer = musician = performer)","qko":"당신은 설문조사에서 음악감상을 즐긴다고 답했습니다. 어떤 음악을 좋아하나요? 당신이 가장 좋아하는 가수는 누구입니까? 왜 그 또는 그녀를 좋아하시나요?","source":"pdf","topic":"음악","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.101 · M101_1"},{"id":"M103_2","page":103,"title":"노래, 음악 듣는 방법 설명","q":"You indicated in the survey that you like listening to music. What kind of device do you use when you listen to music? Which gadget do you usually use? Please explain the devices in detail.","qko":"당신은 설문조사에서 음악 감상을 좋아한다고 답했습니다. 음악을 들을 때 어떤 기기를 사용하시나요? 어떤 기기를 주로 사용하시나요? 당신이 사용하는 장비에 대해 자세히 말해주세요.","source":"pdf","topic":"음악","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.103 · M103_2"},{"id":"M105_3","page":105,"title":"처음 음악 흥미를 가진 계기, 과거 경험","q":"How did you first become interested in listening to music? What kind of music did you listen to when you were young? What was your favorite song? And how has your taste in music changed over time?","qko":"어떻게 처음 음악 감상에 흥미를 가지셨나요? 어릴 때 어떤 음악을 들으셨나요? 가장 좋아하는 노래는 무엇인가요? 당신의 음악 취향은 어떻게 변화했나요?","source":"pdf","topic":"음악","type":"처음·계기 + 변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.105 · M105_3"},{"id":"M105_4","page":105,"title":"가장 좋아하는 노래 설명, 과거 경험","q":"Tell me about a memorable experience you have had while listening to music. Did you listen to your favorite song? When was it, and where did it happen? What makes this experience so memorable?","qko":"음악을 듣다가 겪은 기억에 남는 경험을 말하세요. 좋아하는 노래를 들었나요? 언제 어디에서 있었고 왜 기억에 남나요?","source":"pdf","topic":"음악","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.105 · M105_4"},{"id":"M107_1","page":107,"title":"국내 여행 설명 묘사_나 중심","q":"You indicated in the survey that you like to take traveling domestically. Why do you like to take trips to your home country? Tell me about some places that you like to travel to. What is your favorite location? Why do you like going there?","qko":"당신은 국내 여행을 좋아한다고 답했습니다. 왜 국내 여행을 좋아하시나요? 당신 이 여행하기 좋아하는 장소 몇 군데를 말해주세요. 가장 좋아하는 장소는 어디인 가요? 왜 거기 가는 것을 좋아하시나요?","source":"pdf","topic":"국내여행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.107 · M107_1"},{"id":"M109_1-2","page":109,"title":"국내 여행 설명 묘사_사람들 중심","q":"I'd like to know about places people like to travel to for their vacations. Please tell me where people in your country go for vacations these days.","qko":"사람들이 휴가를 위해 가는 장소를 알고 싶습니다. 요즘 당신의 나라의 사람들이 휴가를 위해 어디로 가는지 말해주세요.","source":"pdf","topic":"국내여행","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.109 · M109_1-2"},{"id":"M111_2","page":111,"title":"국내 여행 준비 습관","q":"What do you usually prepare before you take a trip? What things do you take in your luggage? What items do you bring with you? Describe each step you take to prepare for your trip in detail.","qko":"당신은 여행을 가기 전 주로 어떤 준비를 하시나요? 당신의 짐에 무엇을 넣으시 나요? 어떤 아이템들을 가져 가시나요? 당신이 여행을 준비하며 챙기는 각 단계 를 자세히 말해주세요.","source":"pdf","topic":"국내여행","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.111 · M111_2"},{"id":"M113_3","page":113,"title":"국내 여행 과거 경험","q":"Tell me about the most memorable travel experience you had. When and where did you go? What did you see? What happened? Why was this experience unforgettable to you?","qko":"가장 기억에 남는 여행 경험을 말해주세요. 언제 어디로 갔나요? 무엇을 보았나 요? 무슨 일이 있었나요? 왜 그 경험을 잊을 수 없나요?","source":"pdf","topic":"국내여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.113 · M113_3"},{"id":"M116_1","page":116,"title":"해외 여행 설명 묘사_나 중심","q":"You indicated in the survey that you like to take vacations internationally. Tell me about a city or a country you have visited. Where was it? What did the place look like? What kind of impression did you get at the location?","qko":"당신은 설문조사에서 해외여행을 좋아한다고 했습니다. 당신이 방문했던 도시나 나라에 대해 말해주세요. 어디였나요? 그 장소는 어땠나요? 거기서 어떤 인상을 받았나요?","source":"pdf","topic":"해외여행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.116 · M116_1"},{"id":"M117_1-2","page":117,"title":"해외 여행 설명 묘사_사람들 중심","q":"Where do people in your country like to visit when they travel abroad? Why do they like visiting those locations? What are the special reasons they like to go to those areas? Tell me about it in detail.","qko":"당신의 나라 사람들은 해외여행을 갈 때 어디로 가는 것을 좋아하나요? 왜 그 장소들을 좋아하나요? 그 지역에 가는 특별한 이유가 있나요? 자세히 말해주세요.","source":"pdf","topic":"해외여행","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.117 · M117_1-2"},{"id":"M118_1-3","page":118,"title":"해외 여행 설명 묘사_미래 중심","q":"You indicated in the survey that you like to travel internationally. Which place do you want to travel to in the future? What activities do you want to do in that place? Why do you want to go there?","qko":"설문에서 해외여행을 좋아한다고 했습니다. 앞으로 어느 곳을 여행하고 싶나요? 그곳에서 무엇을 하고 싶으며 왜 가고 싶나요?","source":"pdf","topic":"해외여행","type":"미래 계획","sourceLabel":"오픽만수르 IM2–IH · p.118 · M118_1-3"},{"id":"M119_2","page":119,"title":"해외 여행 준비물, 행동 습관","q":"What do you typically prepare before you travel internationally? What do you do before the trip? What things do you usually bring in your luggage? Please tell me what you do before going on a trip in detail.","qko":"해외여행을 가기 전에 일반적으로 어떤 준비를 하시나요? 여행 전에 무엇을 하시 나요? 짐가방에 주로 어떤 것들을 넣어 가시나요? 여행을 가기 전에 하시는 것에 대해 자세히 말해주세요.","source":"pdf","topic":"해외여행","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.119 · M119_2"},{"id":"M120_3","page":120,"title":"해외 여행 과거 경험","q":"Tell me about a memorable or unforgettable experience you had when you took a trip abroad. Maybe something happened that was funny, unexpected, challenging, or embarrassing. What happened, and how did you deal with it? What made this experience so memorable? Use as many details as possible to explain the whole story.","qko":"해외여행을 하면서 겪은 기억에 남거나 잊을 수 없는 경험에 대해 말해주세요. 웃기거나 예상치 못했거나, 어려웠거나 또는 당황스러웠던 경험이 있었을지도 모 릅니다. 무슨 일을 겪었고 어떻게 대처하셨나요? 무엇이 이 경험을 기억에 남게 했나요? 전체 이야기를 최대한 자세하게 말해주세요.","source":"pdf","topic":"해외여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.120 · M120_3"},{"id":"M121_1","page":121,"title":"좋아하는 요리 설명하기","q":"You indicated that you like to cook. What kind of food do you like to cook? Do you have any special recipes? When and where do you usually cook? Why do you like to cook? Please describe your whole process of cooking from beginning to end.","qko":"당신은 요리를 좋아한다고 답했습니다. 어떤 요리를 좋아하시나요? 특별한 레시 피가 있나요? 언제 어디서 주로 요리하나요? 왜 요리를 좋아하나요? 당신의 요리 과정을 처음부터 끝까지 말해주세요.","source":"pdf","topic":"요리","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.121 · M121_1"},{"id":"M123_2","page":123,"title":"요리하며 겪은 기억에 남는 경험","q":"Tell me about an interesting or memorable experience you have had while cooking. What did you cook? What made this experience so memorable? Please tell me everything.","qko":"요리하며 겪은 흥미롭거나 기억에 남는 경험을 말해주세요. 무엇을 요리했나요? 무엇이 그 경험을 기억에 남게 했나요? 모두 다 말해주세요.","source":"pdf","topic":"요리","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.123 · M123_2"},{"id":"M125_3","page":125,"title":"요리하며 겪은 문제","q":"Unexpected difficulties can occur while you are cooking. What was the problem you recently experienced while you were cooking? How did you solve the problem? Tell me in detail.","qko":"요리를 할 때 예상치 못한 어려움이 발생할 수 있습니다. 최근에 당신이 요리하 며 겪은 문제가 무엇인가요? 어떻게 그것을 해결했나요? 자세히 말해주세요.","source":"pdf","topic":"요리","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.125 · M125_3"},{"id":"M127_4","page":127,"title":"다른 나라와 요리 비교","q":"Compare the food in your country with the food in another country. What are the differences? Is it the recipes or the ingredients that mainly differ? Tell me in detail.","qko":"당신의 나라와 다른 나라의 음식에 대해 비교해주세요. 무엇이 다른가요? 레시피 나 재료가 주로 다른가요? 자세히 말해주세요.","source":"pdf","topic":"요리","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.127 · M127_4"},{"id":"M129_5","page":129,"title":"요리에 흥미를 갖게 된 계기","q":"How did you first become interested in cooking? How did you learn to cook? Did someone teach you cooking? Who did you cook with? Please tell me everything about it in detail.","qko":"당신의 어떻게 처음 요리에 관심을 가지게 되었나요? 어떻게 요리를 배웠나요? 누군가 당신에게 요리를 가르쳤나요? 누구와 같이 요리했나요? 모든 것을 자세히 말해주세요.","source":"pdf","topic":"요리","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.129 · M129_5"},{"id":"M132_1","page":132,"title":"주로 하는 약속/예약 설명, 묘사","q":"People make many different kinds of appointments. What kinds of appointments do you usually make with people around you? How do you make appointments? Tell me in detail.","qko":"사람들은 많은 여러 약속을 만듭니다. 당신은 사람들과 주로 어떤 종류의 약속을 합니까? 어떻게 약속을 만드나요? 자세히 말해주세요.","source":"pdf","topic":"약속","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.132 · M132_1"},{"id":"M134_2","page":134,"title":"약속/예약 잡을 때 하는 일","q":"What do you usually do when you make an appointment? What steps do you take, and what do you consider when making an appointment? Please provide as many details as possible.","qko":"약속을 잡을 때 주로 무엇을 합니까? 어떤 단계를 거치고 약속을 잡을 때 무엇을 고려하나요? 가능한 많은 세부 사항을 제공해주세요.","source":"pdf","topic":"약속","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.134 · M134_2"},{"id":"M136_3","page":136,"title":"약속/예약 취소 과거 경험","q":"Tell me about one experience when you had to cancel an appointment you made. What happened? Why did you have to cancel the appointment and how did you deal with it? Give as many details as you can.","qko":"약속을 했으나 취소했어야 했던 경험을 말해주세요. 무슨 일이었나요? 왜 약속을 취소해야 했고 어떻게 해결했나요? 가능한 많은 세부사항을 말해주세요.","source":"pdf","topic":"약속","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.136 · M136_3"},{"id":"M138_1","page":138,"title":"주로 하는 전화 설명, 묘사","q":"People talk on the phone with family or friends. Who do you usually talk with on the phone most often? What do you normally talk about? Describe it in detail.","qko":"사람들은 가족 또는 친구들과 전화를 합니다. 당신은 누구와 주로 전화를 합니까? 주로 무슨 이야기를 합니까? 자세히 말해주세요.","source":"pdf","topic":"전화","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.138 · M138_1"},{"id":"M140_2","page":140,"title":"전화 행동 패턴, 습관","q":"When and where do you usually chat on the phone? How often do you talk on the phone? What do you typically have phone conversations about? Do you talk with your friends or family over the phone?","qko":"당신은 주로 언제 어디서 전화를 합니까? 얼마나 자주 전화를 합니까? 주로 어떤 대화를 합니까? 당신은 친구나 가족과 전화하나요?","source":"pdf","topic":"전화","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.140 · M140_2"},{"id":"M142_3","page":142,"title":"기억에 남는 전화, 과거 경험","q":"Please tell me a memorable phone conversation you had. When was it? Who were you talking with? Was there anything interesting? What made it so special? Give me many details.","qko":"기억에 남는 전화를 말해주세요. 언제입니까? 누구와 전화를 했습니까? 어떤 흥 미로운 일이 있었나요? 왜 그것이 기억에 남습니까? 자세히 말해주세요.","source":"pdf","topic":"전화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.142 · M142_3"},{"id":"M144_1","page":144,"title":"휴대폰 처음 산 경험, 과거, 계기","q":"Do you remember the first time that you bought a cell phone? What was it like? Please describe your first cell phone in as much detail as possible.","qko":"처음 휴대폰을 산 것을 기억합니까? 어떤 것이었나요? 당신의 첫 휴대폰을 가능 한 자세히 설명해주세요.","source":"pdf","topic":"휴대폰","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.144 · M144_1"},{"id":"M146_2","page":146,"title":"휴대폰 현재 과거 비교","q":"Tell me about your first cell phone and compare it to your current phone. What is the difference between the phone you used back then and the phone you use now? Provide as many details as possible.","qko":"당신의 첫 휴대폰을 말하고 지금의 휴대폰과 비교해주세요. 과거에 사용한 휴대 폰과 지금의 휴대폰과 어떤 차이가 있나요? 가능한 많은 세부사항을 말해주세요.","source":"pdf","topic":"휴대폰","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.146 · M146_2"},{"id":"M148_3","page":148,"title":"휴대폰 과거 경험","q":"Please tell me a memorable phone conversation you had. When was it? Who were you talking with? Was there anything interesting? What made it so special? Give me many details.","qko":"전화를 하며 기억에 남는 경험을 말해주세요. 언제인가요? 누구와 전화 했나요? 어떤 흥미로운 일이 있었나요? 무엇이 그것을 특별하게 했나요? 자세히 말해주세요.","source":"pdf","topic":"휴대폰","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.148 · M148_3"},{"id":"M150_1","page":150,"title":"테크놀로지, 기술 설명","q":"What kinds of technology do you use most often? Is it your computer or cell phone? Or any other handheld device? What is it, and why do you use it? Provide as many details as possible.","qko":"어떤 기술을 자주 사용하나요? 컴퓨터나 휴대폰인가요? 또는 다른 모바일 기기 인가요? 그것이 무엇이고 왜 그것을 사용하나요? 가능한 자세히 말해주세요.","source":"pdf","topic":"기술","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.150 · M150_1"},{"id":"M152_2","page":152,"title":"최근 사용 테크놀로지 설명","q":"Can you explain all the technologies such as a cell phone or computer that you enjoy using most these days? What is it? Why do you use this?","qko":"스마트폰이나 컴퓨터 같은 요즘 당신이 가장 많이 사용한 기술에 대해 모두 설명 해주세요. 무엇인가요? 왜 그것을 사용하나요?","source":"pdf","topic":"기술","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.152 · M152_2"},{"id":"M154_3","page":154,"title":"테크놀로지 과거 현재 비교","q":"Please compare the present technology with past technology. What are the differences between them, and how have they affected? How has technology changed over time?","qko":"현재와 과거의 기술을 비교해주세요. 그들 사이에 어떤 차이점이 있고 어떻게 영 향을 미쳤나요? 기술을 시간이 지나며 어떻게 변화했나요?","source":"pdf","topic":"기술","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.154 · M154_3"},{"id":"M156_1","page":156,"title":"주로 사용하는 인터넷 웹사이트","q":"People use the internet. Which website do you usually visit? How often do you visit that website? What services does the website offer? Why do you like it?","qko":"사람들은 인터넷을 사용합니다. 어떤 웹사이트를 주로 방문하시나요? 얼마나 자 주 그 웹사이트를 방문하시나요? 그 웹사이트는 어떤 서비스를 제공하나요? 당신 은 왜 그것을 사용하나요?","source":"pdf","topic":"인터넷","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.156 · M156_1"},{"id":"M158_2","page":158,"title":"인터넷을 위해 쓰는 장비, 소프트웨어","q":"What kinds of devices do you usually use to surf the Internet? Which gadget or software do you typically use? Describe it in detail.","qko":"인터넷을 하기 위해 어떤 장비를 사용하나요? 어떤 기기 또는 소프트웨어를 일반 적으로 사용하시나요? 자세히 말해주세요.","source":"pdf","topic":"인터넷","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.158 · M158_2"},{"id":"M160_3","page":160,"title":"인터넷 사용 과거 경험, 계기","q":"Tell me about your first internet surfing experience. When was it? What did you do? What things do you remember about that experience? How did you access the internet? What was your first impression while surfing the internet?","qko":"당신의 첫 인터넷 경험을 말해주세요. 언제인가요? 무엇을 하셨나요? 그 경험에 대해 어떤 것들이 기억나나요? 인터넷을 어떻게 접속했나요? 인터넷을 할 때 첫 인상이 어땠나요?","source":"pdf","topic":"인터넷","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.160 · M160_3"},{"id":"M162_1","page":162,"title":"건강한 사람 설명 묘사","q":"Tell me about a healthy person you know. Who is it? What does he or she look like? What do they typically do to stay healthy? What makes that person healthy? Why do you think that person is healthy?","qko":"당신이 아는 건강한 사람에 대해 말해주세요. 누구인가요? 그 또는 그녀는 어떤 가요? 그들은 건강을 위해 일반적으로 무엇을 하나요? 무엇이 그들을 건강하게 하나요? 왜 그들이 건강하다고 생각하시나요?","source":"pdf","topic":"건강","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.162 · M162_1"},{"id":"M164_2","page":164,"title":"건강 유지 활동, 운동","q":"What kinds of things do you usually do to stay healthy? What healthy food do you eat? Do you regularly work out? Please tell me what activities you do to stay healthy in detail.","qko":"건강을 위해 어떤 것을 주로 하시나요? 어떤 건강 음식을 드시나요? 운동을 정기 적으로 하시나요? 당신이 건강을 위해 하는 활동들을 자세히 말해주세요.","source":"pdf","topic":"건강","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.164 · M164_2"},{"id":"M166_3","page":166,"title":"건강 과거 경험","q":"Tell me about one thing that you try to be healthy. Were your health improved? Did you join a new exercise program, play a sport, or eat new healthy food? Give as many details as you can.","qko":"건강해지려고 시도한 일 하나를 말하세요. 건강이 좋아졌나요? 새 운동 프로그램, 스포츠, 건강한 음식 등을 시도했나요? 자세히 설명하세요.","source":"pdf","topic":"건강","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.166 · M166_3"},{"id":"M168_1","page":168,"title":"휴일, 명절 설명","q":"Let's talk about holidays in your country. What kinds of holidays are there? What holidays are popular? How do people typically celebrate the holidays? Please tell me a detailed description of holidays in your country.","qko":"당신의 나라에 있는 명절에 대해 이야기합시다. 어떤 명절이 있나요? 어떤 명절 이 유명한가요? 사람들이 그 명절을 일반적으로 어떻게 기념하나요? 당신의 나라 의 그 명절에 대해 자세한 설명을 말해주세요.","source":"pdf","topic":"명절","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.168 · M168_1"},{"id":"M170_2","page":170,"title":"휴일, 명절 행동 습관 / 하는 일","q":"What is the biggest holiday in your country? How do people celebrate it? What kinds of activities do people usually do during that holiday? Please tell me about all the details.","qko":"당신의 나라에서 가장 큰 명절은 무엇인가요? 사람들은 그것을 어떻게 기념하나 요? 그 명절에 사람들은 주로 어떤 활동을 하나요? 모든 세부사항을 말해주세요.","source":"pdf","topic":"명절","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.170 · M170_2"},{"id":"M172_3","page":172,"title":"휴일, 명절 과거 경험","q":"Tell me about a memorable or unforgettable holiday memory you had in your childhood. Where were you on that day? Who did you spend that holiday with?? What did you do? Explain all the experiences in detail","qko":"어릴 적 겪은 기억에 남거나 잊을 수 없는 명절 경험에 대해 말해주세요. 그 날 어디에 있었나요? 누구와 그 명절을 보냈나요? 무엇을 했었나요? 그 경험에 대해 자세히 말해주세요.","source":"pdf","topic":"명절","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.172 · M172_3"},{"id":"M174_1","page":174,"title":"대중교통 설명 묘사","q":"I would like to know about public transportation in your country. What kind of transportation do people use to get around? Do you use public transportation, or do you drive? Which one do you prefer to take and why?","qko":"당신의 나라에 있는 대중 교통에 대해 알고 싶습니다. 사람들은 이동을 위해 어 떤 교통수단을 이용하나요? 당신은 대중교통을 타나요? 또는 차를 운전 하시나요? 어떤 것을 선호하고 이유는 무엇인가요?","source":"pdf","topic":"교통","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.174 · M174_1"},{"id":"M176_2","page":176,"title":"대중교통 변화 비교","q":"Transportation systems have been improved. Have there been any changes to transportation in your country since you were young? What are the changes between the past and the present?","qko":"대중교통 시스템은 발전되어 왔습니다. 당신의 나라에 당신이 어렸을 때부터 변 화된 대중교통이 있습니까? 과거와 현재 사이 어떤 변화가 있습니까?","source":"pdf","topic":"교통","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.176 · M176_2"},{"id":"M178_3","page":178,"title":"대중교통 과거 경험, 발생한 문제","q":"Sometimes riding the subway or bus can be uncomfortable. Have you ever had any problems related to transportation? Were there traffic jams, or did something uncomfortable happen? What was the problem, and how did you deal with the situation?","qko":"때때로 지하철이나 버스를 타는 것은 불편할 수 있습니다. 대중교통을 이용하면 서 어떤 문제를 겪은 경험이 있습니까? 교통체증이나 어떤 불편한 일이 있었나요? 문제가 무엇이었고 어떻게 그 상황을 해결했나요?","source":"pdf","topic":"교통","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.178 · M178_3"},{"id":"M180_1","page":180,"title":"호텔 소개","q":"Tell me about hotels in your country. What are they like? Where are they usually located? Describe it in detail.","qko":"당신의 나라에 있는 호텔에 대해 말해주세요. 그들은 어떤가요? 그들은 주로 어 디에 위치해 있나요? 자세히 말해주세요.","source":"pdf","topic":"호텔","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.180 · M180_1"},{"id":"M182_2","page":182,"title":"호텔에서 하는 일, 행동 습관","q":"Please tell me what you do when you arrive at a hotel. What steps do you take? Tell me everything from beginning to end.","qko":"당신이 호텔에 도착했을 때 무엇을 하는지 말해주세요. 어떤 절차를 진행하나요? 처음부터 끝까지 전부다 이야기해주세요.","source":"pdf","topic":"호텔","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.182 · M182_2"},{"id":"M184_3","page":184,"title":"호텔 경험, 머물렀던 호텔","q":"When was the last time you stayed in a hotel? Where did you stay? Why were you there? What did you do at the hotel? Tell me everything from beginning to end.","qko":"언제가 마지막으로 호텔에 머물렀을 때입니까? 어디서 숙박했나요? 왜 거기에 있 었나요? 그 호텔에서 무엇을 했나요? 처음부터 끝까지 모두 다 말해주세요.","source":"pdf","topic":"호텔","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.184 · M184_3"},{"id":"M186_1","page":186,"title":"식당 묘사","q":"Tell me about your favorite restaurant near where you live. What does it look like? How often do you go there? What kinds of food do they serve?","qko":"당신의 집 주변에 가장 좋아하는 식당에 대해 말해주세요. 어떻게 생겼나요? 얼마나 자주 거기에 가나요? 그들은 어떤 음식을 제공하나요?","source":"pdf","topic":"식당","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.186 · M186_1"},{"id":"M188_2","page":188,"title":"식당 메뉴 설명","q":"What kind of food does your favorite restaurant offer? Tell me about your favorite food. What is it? Give as many details as you can.","qko":"당신이 가는 식당은 어떤 음식을 제공합니까? 당신이 가장 좋아하는 음식을 말해 주세요. 가능한 자세하게 말해주세요.","source":"pdf","topic":"식당","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.188 · M188_2"},{"id":"M190_3","page":190,"title":"식당, 외식 경험","q":"When was the last time you ate out? Where did you visit and who did you go with? What kind of restaurant was it? What did you have? Please tell me what happened in detail.","qko":"마지막으로 외식한 게 언제입니까? 어디 갔습니까? 누구와 갔습니까? 무슨 식당 이었나요? 무슨 메뉴를 먹었습니까? 무슨 일이 있었는지 자세히 말해주세요.","source":"pdf","topic":"식당","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.190 · M190_3"},{"id":"M192_1","page":192,"title":"은행에 가는 이유, 은행에서 하는 일","q":"People go to the bank for many reasons. Why do people go to the bank in your country? Where are they? Please give me as many details as possible.","qko":"사람들은 여러 이유로 은행에 갑니다. 당신 나라에서는 사람들이 왜 은행에 가나요? 은행은 어디에 있나요? 가능한 한 자세히 설명하세요.","source":"pdf","topic":"은행","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.192 · M192_1"},{"id":"M194_2","page":194,"title":"은행 묘사","q":"Tell me about banks in your country. What do they look like? Where are they located? When do they open and close? What do people usually do at banks?","qko":"당신의 나라에 있는 은행에 대해 말해주세요. 은행은 어떤가요? 어디에 위치해 있나요? 언제 문을 열고 닫나요? 사람들은 은행에서 무엇을 하나요?","source":"pdf","topic":"은행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.194 · M194_2"},{"id":"M196_3","page":196,"title":"마지막으로 간 은행 경험","q":"When was the last time you went to a bank? Which bank did you visit? Why did you go there? Please describe your recent experience in detail.","qko":"언제 마지막으로 은행에 갔나요? 어느 은행을 방문했나요? 왜 거기에 갔나요? 최 근 경험을 자세히 말해주세요.","source":"pdf","topic":"은행","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.196 · M196_3"},{"id":"M198_1","page":198,"title":"패션 설명 묘사","q":"What kinds of clothes do people in your country typically wear? What are fashion trends? What do people wear when they work and when they are at home? Are there different clothes for work and at home? Tell me about the fashion in your country in detail.","qko":"당신의 나라 사람들은 일반적으로 어떤 옷을 입나요? 패션 트렌드는 어떤가요? 사람들이 일할 때와 집에 있을 때 어떤 옷을 입나요? 직장과 집에서 옷의 차이점이 있나요? 당신의 나라 패션에 대해 자세히 말해주세요.","source":"pdf","topic":"패션","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.198 · M198_1"},{"id":"M200_2","page":200,"title":"패션 쇼핑 경험","q":"Please tell me about the last time you went clothes shopping. Where did you go to buy it? What items did you buy?","qko":"마지막으로 한 옷 쇼핑에 대해 이야기해주세요. 옷을 사러 어디로 갔나요? 무엇 을 샀습니까?","source":"pdf","topic":"패션","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.200 · M200_2"},{"id":"M202_3","page":202,"title":"패션 트렌드 변화, 유행","q":"Fashion trends change over time. What kind of clothes were popular when you were young? How were the styles? And what about now? Please compare the fashion trends in the past and now.","qko":"패션 트렌드는 시간이 지나면서 변합니다. 당신이 어릴 때 사람들은 어떤 옷을 입었나요? 스타일이 어땠나요? 그리고 지금은 어떤가요? 과거와 현재의 패션 트 렌드를 비교해주세요.","source":"pdf","topic":"패션","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.202 · M202_3"},{"id":"M204_1","page":204,"title":"계절 묘사","q":"Please tell me about the seasons in your country. How's the weather in each season? Are there any distinct changes? Which season do you like?","qko":"당신의 나라의 계절에 대해 말해주세요. 각 계절마다 날씨는 어떤가요? 뚜렷한 변화가 있나요? 어느 계절을 좋아하시나요?","source":"pdf","topic":"날씨","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.204 · M204_1"},{"id":"M206_2","page":206,"title":"최근, 오늘 날씨 묘사","q":"What is the weather like in your country these days? Is it cold or warm? Please tell me about today's weather in detail.","qko":"요즘 날씨 어떤가요? 덥나요? 춥나요? 오늘 날씨에 대해 자세히 설명해주세요.","source":"pdf","topic":"날씨","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.206 · M206_2"},{"id":"M208_3","page":208,"title":"날씨 관련 경험, 과거","q":"Tell me about a memorable incident related to severe weather conditions. What was the problem? How did you deal with the situation?","qko":"안 좋은 날씨와 관련된 기억에 남는 사건이 있나요? 문제가 무엇이었나요? 그 상황을 어떻게 해결했나요?","source":"pdf","topic":"날씨","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.208 · M208_3"},{"id":"M210_4","page":210,"title":"과거 현재 날씨 변화 비교","q":"How has the weather in your country changed over time? What was the weather like when you were a child, and how was it different from now?","qko":"시간이 지나며 당신의 나라의 날씨는 어떻게 변화했나요? 어릴 적 날씨는 어땠고 지금과 어떤 차이가 있었나요?","source":"pdf","topic":"날씨","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.210 · M210_4"},{"id":"M212_1","page":212,"title":"지형 설명, 묘사","q":"Describe your country's geography. Are there many mountains, rivers, or other landforms? Is there a seashore part of the geography? Tell me about the layout of your country's land in detail.","qko":"당신의 나라의 지형에 대해 설명해주세요. 산, 강 또는 다른 지형 특성들이 많이 있나요? 해안 지형이 있나요? 당신의 나라의 지형에 대해 자세히 말해주세요.","source":"pdf","topic":"지형","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.212 · M212_1"},{"id":"M214_2","page":214,"title":"지형 특성 활동","q":"What kinds of activities do people in your country do using geographical features? Do they go hiking, swimming, or riding a bicycle? What are the differences from other countries? Please give me all the details.","qko":"당신의 나라 사람들은 지형 특성을 이용하여 어떤 활동을 하나요? 하이킹, 수영 또는 자전거를 타나요? 다른 나라와 차이점은 무엇인가요? 많은 세부사항을 알려 주세요.","source":"pdf","topic":"지형","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.214 · M214_2"},{"id":"M216_3","page":216,"title":"지형 관련 과거 경험","q":"Tell me about a special landscape you have seen in your country. Where was it, and when did you see it? What were the geographical features of that place? What did the place look like? Describe a memorable time when you visited that place in detail.","qko":"당신의 나라에서 본 특별한 지형에 대해 말해주세요. 어디였고 언제 그것을 보았 나요? 그 장소의 지형적 특성은 무엇이었나요? 그 장소는 어떻게 생겼나요? 그 장소를 방문했을 때 기억에 남는 것을 묘사해주세요.","source":"pdf","topic":"지형","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.216 · M216_3"},{"id":"M218_1","page":218,"title":"집안일 역할 / 집안일 종류 소개, 묘사","q":"Everyone has to do housework regularly. What kind of chores do you usually do at home? What is your responsibility at home? Tell me in detail.","qko":"모든 사람들은 정기적으로 집안일을 해야 합니다. 당신은 집에서 어떤 집안일을 주로 합니까? 그것들에 대해 자세히 말해주세요.","source":"pdf","topic":"집안일","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.218 · M218_1"},{"id":"M220_2","page":220,"title":"가족 역할, 책임","q":"Your family probably has different responsibilities at home. Which chores is each family member responsible for? And how do they do that?","qko":"당신의 가족들은 집에서 아마 각자 다른 책임(역할)을 가졌을 것입니다. 각 가족 구성원의 집안일 역할은 무엇입니까? 그리고 그들은 어떻게 합니까?","source":"pdf","topic":"집안일","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.220 · M220_2"},{"id":"M222_3","page":222,"title":"집안일 관련 경험","q":"Have you ever had housework that you were not able to do? Please explain why you were not able to do them. Use as many details as possible to explain it.","qko":"당신은 집안일을 할 수 없었던 적이 있습니까? 그렇다면 왜 그것을 할 수 없었는 지 설명해주세요. 가능한 많이 세부적으로 말해주세요.","source":"pdf","topic":"집안일","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.222 · M222_3"},{"id":"M224_1","page":224,"title":"우리나라 재활용 시스템 설명","q":"Recycling is a common practice. How do people in your country recycle? What kind of items do people usually recycle? What is special about recycling? Please tell me about the recycling system in your country in detail.","qko":"재활용은 일반적인 관행입니다. 당신의 나라 사람들은 어떻게 재활용을 하나요? 어떤 물건들을 주로 재활용하나요? 재활용에 특별한 점은 무엇인가요? 당신의 나 라의 재활용 시스템에 대해 자세히 말해주세요.","source":"pdf","topic":"재활용","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.224 · M224_1"},{"id":"M226_2","page":226,"title":"재활용 하는 방법 설명","q":"Tell me, how do you recycle at home? What items do you usually recycle? How often do you take out recyclable items? Where do you take the recycling items to? Describe each step you take when you recycle at home.","qko":"당신이 집에서 어떻게 재활용을 하는지 말해주세요. 어떤 물건을 주로 재활용하 나요? 얼마나 자주 재활용품들을 밖에 버리나요? 어디에 재활용품을 버리나요? 집에서 재활용하는 각 단계를 설명해주세요.","source":"pdf","topic":"재활용","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.226 · M226_2"},{"id":"M228_3","page":228,"title":"재활용 관련 기억에 남는 경험, 과거","q":"Tell me about a memorable experience you had while recycling. What incident event was it? What happened? And how did you deal with it? Why was it so special? Tell me all the experience in detail.","qko":"재활용하며 겪은 기억에 남는 경험을 말해주세요. 어떤 사건이 있었나요? 무슨 일이 있었나요? 그리고 어떻게 그것을 해결했나요? 왜 그것이 특별한가요? 그 경 험에 대해 자세히 말해주세요.","source":"pdf","topic":"재활용","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.228 · M228_3"},{"id":"M230_1","page":230,"title":"가구 묘사, 설명","q":"Tell me about your favorite piece of furniture in your house. What furniture do you have? What does it look like, and what do you like about the furniture? Describe it in detail.","qko":"당신의 집에서 가장 좋아하는 가구 하나를 말해주세요. 무슨 가구를 가지고 있나 요? 그 가구는 어떤가요? 그리고 왜 그것을 좋아하나요? 자세히 말해주세요.","source":"pdf","topic":"가구","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.230 · M230_1"},{"id":"M232_2","page":232,"title":"최근에 산 가구","q":"Can you tell me about a piece of furniture you bought recently for some reason? What was it? Why did you buy it? Where did you buy it?","qko":"어떤 이유로 최근에 산 가구 하나를 말해 줄 수 있나요? 무엇인가요? 왜 구매했 나요? 어디서 구매했나요?","source":"pdf","topic":"가구","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.232 · M232_2"},{"id":"M234_3","page":234,"title":"가구 관련 문제, 경험","q":"Have you ever had any problems with your furniture? Was it broken, or did it get stained or ripped? What happened? How did you solve this problem? Tell me everything from beginning to end.","qko":"가구와 관련한 문제를 겪은 적이 있나요? 부러지거나 녹슬거나 찢어졌나요? 무슨 일이 있었나요? 어떻게 그 문제를 해결했나요? 처음부터 끝까지 다 말해주세요.","source":"pdf","topic":"가구","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.234 · M234_3"},{"id":"M244_11","page":244,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to buy an mp3 player. Your friend bought an MP3 player recently. Before you make a purchase, call your friend and ask 3 or 4 questions about his or her MP3 player to get some information about the MP3 player.","qko":"주어진 상황에 연기해 보세요. 당신은 MP3 player를 구매하고 싶습니다. 당신의 친구가 최근에 MP3 player를 구 매했습니다. 당신이 구매를 하기 전에, 친구에게 전화하여 MP3 player에 대한 정 보를 얻기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"MP3","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.244 · M244_11"},{"id":"M245_12","page":245,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You borrowed an MP3 player from your friend but unfortunately broke it. Call your friend, explain the situation, and give two or three suggestions to get your friend a working MP3 player as quickly as possible.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 친구에게 MP3 player를 빌렸는데 안타깝게도 파손/고장 났습니다. 친구에 게 전화하고, 상황을 설명하세요. 가능한 빨리 친구의 MP3를 정상으로 만들어주 기 위한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"MP3","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.245 · M245_12"},{"id":"M246_13","page":246,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had some equipment that broke or was not working properly? What was the problem, and how did you solve it? Provide as many details as possible.","qko":"그것으로 상황은 끝입니다. 어떤 장비/기기가 고장 나거나 제대로 작동하지 않았던 적이 있었나요? 문제가 무엇이었고, 어떻게 해결하셨나요? 가능한 자세하게 말해주세요.","source":"pdf","topic":"MP3","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.246 · M246_13"},{"id":"M247_11","page":247,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to borrow your friend's MP3 player. Call your friend, explain your situation, and ask him or her three or four questions to borrow the MP3 player.","qko":"주어진 상황에 연기해 보세요. 당신은 친구의 MP3 플레이어를 빌리고 싶습니다. 친구에게 전화하여 상황을 설 명하고 MP3 플레이어를 빌리기 위해 3 ~ 4개의 질문을 해보세요.","source":"pdf","topic":"MP3","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.247 · M247_11"},{"id":"M248_12","page":248,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You borrowed an MP3 player from your friend, but unfortunately, you broke it accidentally. Contact your friend and describe how it broke and its current condition. Then suggest two or three alternatives to deal with this problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 친구에게 MP3 player를 빌렸는데 안타깝게도 파손/고장 났습니다. 친구에 게 연락하고, 어떻게 된 것이고 현재 상태가 어떤 지 설명하세요. 이 문제를 해결 하기 위해 2, 3가지 제안을 해보세요.","source":"pdf","topic":"MP3","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.248 · M248_12"},{"id":"M249_13","page":249,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had a problem with any electronic devices? What was the problem, and how did you solve it? Provide as many details as possible.","qko":"그것으로 상황은 끝입니다. 어떤 전자기기 사용에 문제가 있었던 적이 있었나요? 문제가 무엇이었고, 어떻게 해결 하셨나요? 가능한 자세하게 말해주세요.","source":"pdf","topic":"MP3","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.249 · M249_13"},{"id":"M250_11","page":250,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to purchase new furniture. Call a furniture store, explain to a salesperson what you are looking for and ask three or four questions about the furniture you want to buy.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 새로운 가구를 구매하려고 합니다. 가구점에 전화하고 무슨 가구를 찾는 지 점원에게 설명하세요. 그리고 원하는 가구에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"가구","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.250 · M250_11"},{"id":"M251_12","page":251,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You discover a problem with the furniture that you bought. It's just been delivered, but the furniture that arrived is not what you ordered. Call the store, explain this problem, and give two or three options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 구매한 가구에 문제가 있는 것을 발견했습니다. 방금 배송 되었는데, 당신 이 주문한 것이 아닙니다. 가구점에 전화하고 문제를 설명하세요. 그리고 문제를 해결하기 위한 2, 3가지 제안을 해보세요.","source":"pdf","topic":"가구","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.251 · M251_12"},{"id":"M252_13","page":252,"title":"","q":"That's the end of the situation. Have you ever had a problem with something you bought for your house? What was the problem? And how did you solve it? Provide as many details as possible.","qko":"그것으로 상And끝입니다. 당신의 집을 위해 산 어떤 것에 문제가 있었던 적이 있나요? 무엇이 문제였나요? 그리고 어떻게 해결했나요? 가능한 많은 세부 사항을 제공해주세요.","source":"pdf","topic":"가구","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.252 · M252_13"},{"id":"M253_11","page":253,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend wants to see a performance with you. Call your friend and ask 3 or 4 questions about the performance and his or her plan","qko":"상황을 드립니다. 연기를 해보세요. 당신의 친구가 당신과 공연을 보러 가고 싶어 합니다. 친구에게 전화하고 그 또 는 그녀의 계획과 공연에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"공연","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.253 · M253_11"},{"id":"M254_12","page":254,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You were supposed to go to the performance with your friend today. But unfortunately, you are very sick that you can't get out of bed. Make a telephone call to your friend, explain the situation, and offer 2 or 3 options to solve the situation.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 오늘 친구와 공연을 보러 가기로 했었습니다. 그러나 불행히도 침대에서 일어나지 못할 만큼 아픕니다. 친구에게 전화하고 상황을 설명하세요. 그리고 상황을 해결하기 위한 2, 3가지 대안을 제시해보세요.","source":"pdf","topic":"공연","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.254 · M254_12"},{"id":"M255_13","page":255,"title":"","q":"That's the end of the situation. Have you ever experienced that you had to cancel or break a promise with other people because you are ill or have an urgent problem? When did it occur, and what steps did you follow to solve the problem?","qko":"그것으로 상황은 끝입니다. 당신이 아프거나 급한 문제가 있어서 다른 사람들과의 약속을 취소하거나 어겨야 만 했던 경험이 있나요? 언제 그 일이 발생했고, 문제를 해결하기 위해 어떤 절 차를 진행했나요?","source":"pdf","topic":"공연","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.255 · M255_13"},{"id":"M256_11","page":256,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend wants to go to a park this weekend and invited you to go together. Call your friend, ask 3 or 4 questions about your friend's plan to find out the details of this meeting.","qko":"상황을 드립니다. 연기를 해보세요. 당신의 친구는 이번 주에 공원에 가고 싶어 하고, 당신과 함께 가기 위해 초대하 고 싶어 합니다. 친구에게 전화해서 만남의 세부 내용을 알기 위해 친구의 계획 에 대한 3, 4 가지 질문을 해보세요.","source":"pdf","topic":"공원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.256 · M256_11"},{"id":"M257_12","page":257,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You just found out the park you and your friend are going to visit this weekend will be closed. Contact your friend, explain the situation, and provide 2 or 3 alternatives to the issue.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 당신과 친구가 함께 가기로 한 공원이 이번 주에 문을 닫는 다는 것을 알 았습니다. 친구에게 연락하세요. 상황을 설명하고 문제에 대한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"공원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.257 · M257_12"},{"id":"M258_13","page":258,"title":"","q":"That's the end of the situation. Have you ever had a memorable experience while visiting a park? Maybe something interesting, fun, or unexpected happened. What made it so special? What happened, and how did you deal with the situation?","qko":"그것으로 상황은 끝입니다. 공원을 방문하면서 겪은 기억에 남는 경험이 있나요? 어떤 흥미롭거나 재미있거 나, 기대치 못한 일이 일어났었나요? 왜 그 경험이 특별 한가요? 무슨 일이 있었 고 어떻게 그 상황을 해결하셨나요?","source":"pdf","topic":"공원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.258 · M258_13"},{"id":"M259_11","page":259,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are on vacation in New York City. Now you are at a car rental company. You need to rent a car, and you are speaking to the person who works at the car rental company. Ask him 3 or 4 questions about renting a car.","qko":"상황을 드릴 테니, 연기를 해보세요. 당신은 뉴욕에서 휴가를 보내고 있습니다. 지금 당신은 렌트카 회사에 있습니다. 당신은 차를 빌려야 하고 렌트카 회사의 직원과 이야기하고 있습니다. 차를 빌리는 것에 대해 3, 4 가지 질문을 해보세요.","source":"pdf","topic":"렌터카","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.259 · M259_11"},{"id":"M260_12","page":260,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. I'm not sure if you are allowed to rent a car because you don't have an international driver's license or an American driver's license. Please explain what your license says and suggest 2 or 3 alternatives to rent a car.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 국제 면허증 또는 미국 면허증이 없기 때문에 차를 빌릴 수 있을 지 확신 할 수 없습니다. 당신의 면허증에 뭐라고 적혀 있는지 설명하고 차를 빌리기 위 해 2, 3 가지 대안을 제시해 보세요.","source":"pdf","topic":"렌터카","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.260 · M260_12"},{"id":"M261_13","page":261,"title":"","q":"That's the end of the situation. Have you ever rented a car for your traveling? What was the reason you rented a car? Did something crazy or terrible happen? What happened, and how did you solve it? Why was the experience so memorable?","qko":"그것으로 상황은 끝입니다. 여행을 위해 차를 렌트 한 적이 있나요? 차를 렌트 한 이유가 무엇이었나요? 어 떤 말도 안 되거나 끔찍한 일이 있었나요? 무슨 일이 있었고 어떻게 해결하셨나 요? 왜 그 경험이 기억에 남나요?","source":"pdf","topic":"렌터카","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.261 · M261_13"},{"id":"M262_11","page":262,"title":"","q":"I'd like to give you a situation and ask you to act it out. You heard that your favorite store is having a big sale. And you want to find out more about the sale. Call this store and leave a message. Ask 3 or 4 questions to gain more information about the sale.","qko":"상황을 드릴 테니 연기를 해보세요. 당신이 가장 좋아하는 가게에서 큰 세일을 한다고 들었습니다. 그리고 당신은 세 일에 대해 더 알고 싶어합니다. 이 가게에 전화해서 메시지를 남기세요. 세일에 대한 더 많은 정보를 얻기 위해 3개 또는 4개의 질문을 하세요.","source":"pdf","topic":"쇼핑","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.262 · M262_11"},{"id":"M263_12","page":263,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You arrive home with the clothes you bought and realize you didn't get them at the sale price. Contact the store, explain the situation, and provide 2 or 3 options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 당신이 구매한 옷을 가지고 집에 도착했습니다. 그리고 옷들을 세일 가격 으로 구매하지 않았다는 것을 알았습니다. 매장에 연락하세요. 상황을 설명하고 문제를 해결하기 위한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"쇼핑","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.263 · M263_12"},{"id":"M264_13","page":264,"title":"","q":"That's the end of the situation. Reflect back to the time when you bought something. What things did you buy and what happened with them? How did you handle the situation? Tell me what steps you took to solve the problem.","qko":"그것으로 상황은 끝입니다. 무언가를 구매했던 때를 떠올려 보세요. 무엇을 구매했고, 그것과 무슨 일이 있었 나요? 그 상황을 어떻게 해결했나요? 문제를 해결하기 위해 어떤 절차를 진행했 었는지 말해주세요.","source":"pdf","topic":"쇼핑","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.264 · M264_13"},{"id":"M265_11","page":265,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to make a doctor's appointment. Call the doctor's office and ask 3 or 4 questions to make an appointment.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 병원 예약을 하려고 합니다. 병원에 전화하고 예약을 하기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"병원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.265 · M265_11"},{"id":"M266_12","page":266,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You made an appointment with your doctor, but something came up, and you can't make it. Call the doctor's office, explain the situation, and reschedule the appointment with 2 or 3 questions.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 병원 예약을 했습니다. 그러나 어떠한 일이 생겨서 갈 수가 없습니다. 병 원에 전화하세요. 상황을 설명하고 예약을 바꾸기 위한 2, 3가지 질문을 해보세 요.","source":"pdf","topic":"병원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.266 · M266_12"},{"id":"M267_13","page":267,"title":"","q":"That's the end of the situation. Please tell me about an experience when you had to cancel an appointment for some reason. What happened, and why did you have to cancel the appointment? How did you deal with the situation?","qko":"그것으로 상황은 끝입니다. 어떠한 이유로 예약을 취소해야 했던 경험에 대해 말해주세요. 무슨 일이 있었고 왜 그 예약을 취소해야 했나요? 그 상황을 어떻게 해결하셨나요?","source":"pdf","topic":"병원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.267 · M267_13"},{"id":"M268_11","page":268,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are planning on going on a trip with your friend. Call a travel agency and ask 3 or 4 questions about the trip you want to go on.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친구와 여행을 계획하고 있습니다. 여행사에 전화하고 가고 싶은 여행에 대한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"여행","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.268 · M268_11"},{"id":"M269_12","page":269,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. For some reason, the travel agency informs you that the trip that you wanted to go on is unavailable. Call your friend, leave a message to explain the situation, and give 2 or 3 options to solve this problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 어떠한 이유로, 여행사에서 당신이 가려고 한 여행이 불가능하다고 연락했습니다. 친구에게 전화하세요. 상황을 설명하기 위해 메시지를 남기고, 문제를 해결하기 위한 2, 3가지 대안을 제시하세요.","source":"pdf","topic":"여행","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.269 · M269_12"},{"id":"M270_13","page":270,"title":"","q":"That's the end of the situation. Reflect back to the time when you had any problems while you were planning a trip. What was the problem, and how did you deal with it? Tell me what happened from beginning to end.","qko":"그것으로 상황은 끝입니다. 여행을 준비하면서 문제를 겪었던 때를 떠올려 보세요. 문제가 무엇이었고 어떻게 해결하셨나요? 무슨 일이 있었는지 처음부터 끝까지 말해주세요.","source":"pdf","topic":"여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.270 · M270_13"},{"id":"M271_11","page":271,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are going to visit your friend who lives abroad. Call your friend and ask 3 or 4 questions about the geographical features of his or her country.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 외국에 사는 친구를 만나러 갈 예정입니다. 친구에게 전화하고 그 또는 그녀의 나라 지형 특성에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"지형","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.271 · M271_11"},{"id":"M272_12","page":272,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You were supposed to travel abroad to visit your friend. But something came up, and you will not be able to go there. Call your friend, explain what happens, and give 2 or 3 options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 친구를 만나기 위해 해외 여행을 가려고 했습니다. 그러나 어떠한 일이 발생했고, 여행을 갈 수 없을 것입니다. 친구에게 전화하세요. 무슨 일이 생겼는 지 설명하고 문제를 해결하기 위한 2, 3가지 제안을 해보세요.","source":"pdf","topic":"지형","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.272 · M272_12"},{"id":"M273_13","page":273,"title":"","q":"That's the end of the situation. Tell me a memorable experience that you visited another country. When and where did you go? What was the place like? How was the geography of that country different from the geography of your country?","qko":"그것으로 상황은 끝입니다. 다른 나라를 방문하며 겪은 기억에 남는 경험을 말해주세요. 언제 어디로 가셨나 요? 그 장소는 어땠나요? 당신의 나라 지형과 그 나라의 지형은 어떻게 달랐나 요?","source":"pdf","topic":"지형","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.273 · M273_13"},{"id":"M274_11","page":274,"title":"","q":"I'd like to give you a situation and ask you to act it out. You got a phone call from a relative asking you to help prepare a large party. Call this relative and pose 3 or 4 questions to determine what you need to do for this party.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친척으로부터 큰 파티를 준비하기 위해 도움을 요청하는 전화를 받았습니 다. 이 친척에게 전화하고 파티를 위해 당신이 무엇을 해야 하는지 정하기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"모임","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.274 · M274_11"},{"id":"M275_12","page":275,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You discovered that you have to work on the day of the party. So you are not able to attend the party. Contact your relative and leave a message. Explain the situation and offer 2 or 3 alternatives to help prepare the party even though you will not be able to attend.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 파티 당일에 일을 해야 한다는 것을 알았습니다. 그래서 파티에 참석할 수 없습니다. 당신의 친척에게 연락하고 메시지를 남기세요. 상황을 설명하고 당 신이 참석할 수는 없지만 파티 준비를 돕기 위해 2, 3가지 대안을 제시해보세요.","source":"pdf","topic":"모임","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.275 · M275_12"},{"id":"M276_13","page":276,"title":"","q":"That's the end of the situation. Tell me the time when you had a chance to help your family or friends. Reflect back to that time when you were able to help them. What was the problem, and what did you provide assistance with? What was the outcome of the situation? Give as many details as you can.","qko":"그것으로 상황은 끝입니다. 가족이나 친구를 도와줘야 했던 때를 말해주세요. 그들을 도울 수 있었던 때를 떠올려 보세요. 문제가 무엇이었고, 어떤 도움을 주셨나요? 그 상황의 결과는 어 떻게 되었나요? 가능한 많은 세부 내용을 알려주세요.","source":"pdf","topic":"모임","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.276 · M276_13"},{"id":"M277_11","page":277,"title":"","q":"I'd like to give you a situation and ask you to act it out. Now you want to buy two tickets to a concert. Call a theater and ask 3 or 4 questions about how to purchase the tickets.","qko":"상황을 드립니다. 연기를 해보세요. 지금 당신은 콘서트 티켓 2장을 사고 싶습니다. 공연장에 전화하고 티켓을 구매 하는 방법에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"콘서트","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.277 · M277_11"},{"id":"M278_12","page":278,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You bought the concert tickets and were supposed to go to that concert with your friend. But you are very sick at the last minute. Call your friend, explain the situation, and suggest 2 or 3 alternatives.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 콘서트 티켓을 구매했습니다. 그리고 친구와 그 콘서트에 가기로 했습니 다. 그러나 콘서트 시간이 다되어서 당신은 매우 아픕니다. 친구에게 전화하세요. 상황을 설명하고 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"콘서트","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.278 · M278_12"},{"id":"M279_13","page":279,"title":"","q":"That's the end of the situation. Have you ever experienced something similar in that you bought concert tickets or made any other plans but had to cancel at the last minute because something came up? What was the problem, and how did you solve the problem? Tell me what happened in detail.","qko":"그것으로 상황은 끝입니다. 콘서트 티켓을 사거나 다른 약속을 잡았는데, 어떠한 일이 발생하여 약속 시간이 다되었을 때 취소해야 했던 비슷한 경험을 한 적이 있나요? 문제가 무엇이었고 그 문제를 어떻게 해결하셨나요? 무슨 일이 있었는지 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.279 · M279_13"},{"id":"M280_11","page":280,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to watch a movie with your friend. Call a theater and ask 3 or 4 questions to get the information you need to purchase tickets.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친구와 영화를 보고 싶습니다. 영화관에 전화하고 티켓을 구매하는데 필 요한 정보를 얻기 위해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"영화","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.280 · M280_11"},{"id":"M281_12","page":281,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You just arrived at the theater and found out that they have sold the wrong tickets to you. Go to the ticket seller at the booth. And explain this situation. And provide 2 or 3 alternatives to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 방금 극장에 도착했고, 영화관에서 당신에게 잘못된 티켓을 팔았다는 것 을 알았습니다. 티켓 판매원에게 가세요. 그리고 상황을 설명하고 문제를 해결하 기 위한 2, 3가지 대안을 제시하세요.","source":"pdf","topic":"영화","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.281 · M281_12"},{"id":"M282_13","page":282,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had a problem with reservations or bought some tickets, and something went wrong? What was the problem, and when did it occur? How did you solve this problem?","qko":"그것으로 상황은 끝입니다. 티켓을 사거나 예약을 하거나 어떠한 문제가 생겼던 적이 있으신가요? 문제가 무 엇이었고 언제 그것이 발생 했었나요? 그 문제를 어떻게 해결하셨나요?","source":"pdf","topic":"영화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.282 · M282_13"},{"id":"M292_14","page":292,"title":"","q":"Please pick two of different your friends or family members. What are the differences and similarities between them? Describe each of them in detail.","qko":"친구 또는 가족 구성원 2명을 선택해 주세요. 그들 사이의 차이점과 비슷한 점은 무엇인가요? 그들 각각을 자세히 묘사해 주세요.","source":"pdf","topic":"가족·친구","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.292 · M292_14"},{"id":"M293_15","page":293,"title":"","q":"When you are with your friends or family members, what do you typically talk about with them? What topic do you talk about most often? How was the last conversation you had with them? Tell me about the normal conversation in detail.","qko":"언제 친구 또는 가족과 함께 있나요? 일반적으로 그들과 무엇에 대해 이야기하나 요? 어떤 주제를 가장 자주 이야기하시나요? 그들과 가장 마지막에 가졌던 대화 는 어땠나요? 일반적으로 하는 대화에 대해 자세히 말해주세요.","source":"pdf","topic":"가족·친구","type":"습관·활동 + 최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.293 · M293_15"},{"id":"M294_14","page":294,"title":"","q":"How was the way people in your country maintained their health when you were young, and how is it now? Tell me how people keep their health has changed over the years.","qko":"당신이 어릴 때 당신의 나라 사람들의 건강을 유지하는 방법은 어땠나요? 그리고 지금은 어떤가요? 시간이 지나며 사람들이 건강을 유지하는 방법이 어떻게 변했 는지 말해주세요.","source":"pdf","topic":"건강","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.294 · M294_14"},{"id":"M295_15","page":295,"title":"","q":"Tell me about recent news you read or watched related to health issues. What was the news about? Do people talk about that news often? What do people think about this issue? Describe the news in detail.","qko":"당신이 최근에 읽거나 본 건강 문제에 관련한 뉴스에 대해 말해주세요. 그 뉴스 는 무엇에 관한 것이었나요? 사람들은 그 뉴스에 대해 자주 이야기하나요? 사람 들은 그 문제에 대해 어떻게 생각하나요? 그 뉴스를 자세히 설명해 주세요.","source":"pdf","topic":"건강","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.295 · M295_15"},{"id":"M296_14","page":296,"title":"","q":"Please pick two popular parks you know. And compare those two different parks. What are the differences and similarities between them? Which Park do you like better? Tell me how they are different.","qko":"당신이 아는 유명한 공원 2 곳을 선택해 주세요. 그리고 그 두개의 서로 다른 공 원을 비교해 주세요. 그 공원들 사이의 차이점과 비슷한 점은 무엇인가요? 어느 공원을 더 좋아하시나요? 그 공원들이 어떻게 다른 지 말해주세요.","source":"pdf","topic":"공원","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.296 · M296_14"},{"id":"M297_15","page":297,"title":"","q":"I'd like to know about some issues parks face these days. What are the challenges that parks face? What caused these concerns? How can the problems be solved, and what do people need to do?","qko":"요즘 공원들이 마주하고 있는 문제들에 대해 알고 싶습니다. 공원들이 마주하고 있는 어려움은 무엇인가요? 무엇이 이런 우려를 발생시키나요? 어떻게 그 문제들 이 해결될 수 있고 사람들이 해야 할 것은 무엇인가요?","source":"pdf","topic":"공원","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.297 · M297_15"},{"id":"M298_14","page":298,"title":"","q":"You indicated in the survey that you like to take vacations domestically. How was traveling domestically different when you were young compared to these days. Is it easier or more difficult now than in the past? Tell me how traveling has changed.","qko":"당신은 설문조사에서 국내 여행을 좋아한다고 했습니다. 당신이 어렸을 때의 국 내여행은 요즘의 여행과 비교해서 어떻게 다른가요? 과거보다 지금이 더 쉬운가 요 아니면 어려운가요? 여행이 어떻게 변화했는지 말해주세요.","source":"pdf","topic":"국내여행","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.298 · M298_14"},{"id":"M299_15","page":299,"title":"","q":"What are some issues concerning people traveling these days? What things are people most interested in? What things cause these concerns? Tell me what people discuss as the main concern of traveling","qko":"요즘 여행하는 사람들에게 어떤 문제가 있나요? 사람들이 가장 관심을 가지는 것 은 무엇인가요? 무엇이 이런 우려를 발생시키나요? 사람들이 여행의 주요 관심사 로 이야기하는 것을 말해주세요.","source":"pdf","topic":"국내여행","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.299 · M299_15"},{"id":"M300_14","page":300,"title":"","q":"You indicated in the survey that you like to take vacations internationally. How has traveling overseas changed over the years? Do you think it has become easier than before, or has it got more difficult? Why do you think that? Describe what traveling to other countries was like in the past and now.","qko":"당신은 설문조사에서 해외 여행을 좋아한다고 했습니다. 시간이 지나며 해외 여 행은 어떻게 변화했나요? 더 쉬워진 것 같나요 아니면 더 어려워진 것 같나요? 왜 그렇게 생각하시나요? 다른 나라를 여행하는 것은 과거에는 어땠고 현재는 어 떤 지 설명해 주세요.","source":"pdf","topic":"해외여행","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.300 · M300_14"},{"id":"M301_15","page":301,"title":"","q":"When people prepare to travel abroad, what things are they concerned about? It might be a hotel reservation, tourist attractions, or the travel schedule. What is it? How are those concerns being addressed for the future?","qko":"사람들이 해외 여행을 준비할 때, 무엇을 걱정하나요? 그것은 호텔 예약, 관광지, 또는 여행 일정일 수 있겠는데요. 그것이 무엇인가요? 미래를 위해 그 우려를 어 떻게 해결하고 있나요?","source":"pdf","topic":"해외여행","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.301 · M301_15"},{"id":"M302_14","page":302,"title":"","q":"Please pick two different kinds of music or musician you like. Compare those two, and what are their differences and similarities? Give as many details as you can.","qko":"당신이 좋아하는 서로 다른 두 음악이나 두 음악가를 선택해 주세요. 그 둘을 비 교해 주세요. 그리고 그들의 차이점과 비슷한 점은 무엇인가요? 가능한 많은 세 부 내용을 알려주세요.","source":"pdf","topic":"음악","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.302 · M302_14"},{"id":"M303_15","page":303,"title":"","q":"I'd like to know what gadgets or electronic equipment people are interested in these days. Why do people in your country like those music gadgets or equipment? What new products excite them and why? Tell me what people talk about it.","qko":"요즘 사람들이 관심 가지는 기기나 전자 장비에 대해 알고 싶습니다. 당신의 나 라 사람들은 왜 그 음악 기기나 장비를 좋아하나요? 어떤 신제품이 그들을 흥분 시키고 이유는 무엇인가요? 사람들이 그것에 대해 무엇을 이야기하는지 말해주세요.","source":"pdf","topic":"음악","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.303 · M303_15"},{"id":"M304_14","page":304,"title":"","q":"How has the recycling practice changed over the years? Did the recycling materials change compared to in the past? Tell me all the changes regarding the recycling system in your country.","qko":"수년간 재활용 관행은 어떻게 변화 했나요? 예전과 비교해서 재활용 대상 물품이 변화 했나요? 당신의 나라의 재활용 시스템에 대한 모든 변화를 말해주세요.","source":"pdf","topic":"재활용","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.304 · M304_14"},{"id":"M305_15","page":305,"title":"","q":"Please tell me about some recent issues related to recycling in your country. What was the news about? What does the media say about this problem? What do you think about this matter? How does this matter affect the environment?","qko":"당신의 나라의 재활용에 관련한 최근 문제에 대해 말해주세요. 그 뉴스는 무엇에 관한 것인가요? 언론은 이 문제에 대해 어떻게 이야기 하나요? 이 문제에 대해 당신은 어떻게 생각하나요? 이 문제가 환경에 어떤 영향을 주나요?","source":"pdf","topic":"재활용","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.305 · M305_15"},{"id":"M306_14","page":306,"title":"","q":"Tell me about a country that is geographically similar or neighboring to your country. What geographical features does this country have? What changes has this country had in recent years? Provide as many details as possible.","qko":"당신의 나라와 지형적으로 비슷하거나 가까운 나라에 대해 말해주세요. 이 나라 는 어떤 지형적 특징이 있나요? 최근 몇 년 동안 이 나라에는 어떤 변화가 있었 나요? 가능한 많은 세부 사항을 말해주세요.","source":"pdf","topic":"지형","type":"묘사 + 변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.306 · M306_14"},{"id":"M307_15","page":307,"title":"","q":"Have you read or seen some articles about the country you just mentioned about? What do you think about these articles? What was the news? Was it economic, or political relationships news?","qko":"당신이 방금 언급한 나라의 뉴스 기사를 읽거나 본 적이 있나요? 이 뉴스 기사들 에 대해 어떻게 생각하시나요? 뉴스가 무엇이었나요? 경제 뉴스인가요 아니면 정 치적 관계에 대한 뉴스인가요?","source":"pdf","topic":"지형","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.307 · M307_15"},{"id":"M308_14","page":308,"title":"","q":"I'd like to know how different the ways are to solve problems at home between you and your parents. How do you solve problems when they occur in your home and how do your parents solve problems in their house? Tell me the differences and the similarities.","qko":"당신과 당신의 부모님이 집에서 발생한 문제를 해결하는 방법이 어떻게 다른 지 알고 싶습니다. 당신의 집에서 문제가 발생했을 때 당신은 어떻게 해결하고 당신의 부모님은 그들의 집에서 문제가 생겼을 때 어떻게 해결하나요? 차이점과 비슷 한 점을 말해주세요.","source":"pdf","topic":"집","type":"두 대상 비교","sourceLabel":"오픽만수르 IM2–IH · p.308 · M308_14"},{"id":"M309_15","page":309,"title":"","q":"Talk about some issues most people have when they rent a house or an apartment. What are the things people are concerned about? How do these problems affect people's lives? How do they deal with these issues?","qko":"대부분의 사람들이 주택이나 아파트 세를 얻을 때 어떤 문제를 겪는지 말해주세요. 사람들이 우려하는 것은 무엇인가요? 이런 문제들이 사람들의 삶에 어떻게 영향을 미치나요? 그들은 이 문제들을 어떻게 해결하나요?","source":"pdf","topic":"집","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.309 · M309_15"},{"id":"M310_14","page":310,"title":"","q":"I'd like to know about the rising industries in your country. What industries do people talk about these days? What is this industry about? How has that industry changed over the years? How was it different compared to the industry now?","qko":"당신의 나라에서 떠오르는 산업에 대해 알고 싶습니다. 요즘 사람들은 어떤 산업 에 대해 이야기하나요? 이 산업은 무엇에 대한 것인가요? 지난 몇 년간 그 산업 은 어떻게 변화했나요? 이 산업은 지금의 산업과 비교했을 때 어떻게 달랐나요?","source":"pdf","topic":"산업","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.310 · M310_14"},{"id":"M311_15","page":311,"title":"","q":"Have the industry you just mentioned ever released a new product that couldn't meet people's expectations? What was the product about? Why were people disappointed about it? How did people react to this issue?","qko":"방금 말씀하신 산업에서 사람들의 기대에 못 미친 신제품을 출시한 적이 있나요? 그 제품은 무엇에 관한 것이었나요? 왜 사람들이 이것에 대해 실망했나요? 사람 들은 이 문제에 어떻게 반응 했었나요?","source":"pdf","topic":"산업","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.311 · M311_15"},{"id":"M312_14","page":312,"title":"","q":"People have gatherings and celebrations for particular reasons. How were gatherings and celebrations when you were a child? How were they different from now? How do people get together nowadays? Tell me how gatherings have changed over the years.","qko":"사람들은 특별한 이유로 모임과 기념을 합니다. 당신이 어릴 때 모임과 기념은 어땠나요? 그것은 지금과 어떻게 달랐나요? 요즘 사람들은 어떻게 모임을 하나 요? 몇 년 동안 모임이 어떻게 변화 했는지 말해주세요.","source":"pdf","topic":"모임","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.312 · M312_14"},{"id":"M313_15","page":313,"title":"","q":"Sometimes people can complain about the gatherings and celebrations. What concerns do people in your community have about gatherings and celebrations? Perhaps they complain about traffic or noise. What do people concern about such gatherings?","qko":"때때로 사람들은 모임과 기념식에 불평을 할 수 있습니다. 당신의 지역 사회 사 람들은 모임과 기념 행사에 대해 어떤 우려를 가지고 있나요? 아마도, 그들은 교 통체증이나 소음에 불만을 가질 수 있을 것입니다. 사람들은 그런 모임에 대해 무엇을 걱정하나요?","source":"pdf","topic":"모임","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.313 · M313_15"},{"id":"M314_14","page":314,"title":"","q":"Tell me about holidays in your country. What do people typically do during holidays? Describe what activities people do for the holidays in detail.","qko":"당신의 나라에 있는 명절/공휴일에 대해 말해주세요. 일반적으로 사람들은 명절/ 공휴일에 무엇을 하나요? 사람들이 명절/공휴일에 하는 활동을 자세히 설명해 주 세요.","source":"pdf","topic":"명절","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.314 · M314_14"},{"id":"M315_15","page":315,"title":"","q":"Sometimes problems can occur during holidays. What kinds of issues or concerns do people in your country have regarding holidays? What causes those problems? How do people handle those issues or concerns?","qko":"때때로 명절/공휴일 동안 문제가 발생할 수 있습니다. 당신의 나라 사람들은 명 절/공휴일에 관련하여 어떤 문제 또는 우려를 가지나요? 무엇이 그 문제를 발생 시키나요? 사람들은 이런 문제와 우려를 어떻게 다루나요?","source":"pdf","topic":"명절","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.315 · M315_15"},{"id":"M318_1","page":318,"title":"Hair Salon / Description / 자주 가는 미용실 묘사","q":"Let's talk about your favorite hair salon. Can you describe what it looks like? Why do you like that place? How often do you go there? Please provide as many details as possible.","qko":"당신이 자주 가는 미용실에 대해 이야기해봅시다. 그 미용실이 어떻게 생겼는지 묘사해 주실 수 있나요? 왜 그 장소에 자주 가시나요? 얼마나 자주 거기에 가시 나요? 가능한 많은 세부 내용들을 말해주세요.","source":"pdf","topic":"미용실","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.318 · M318_1"},{"id":"M319_1","page":319,"title":"Hair Salon / Routine / 미용실에서 하는 활동","q":"When you go to a hair salon, what do you usually do there? Can you describe the process in order? What services do you typically get, and how does the visit usually go? Please explain step-by-step.","qko":"미용실에 가면 보통 무엇을 하나요? 과정을 순서대로 설명할 수 있나요? 주로 어떤 서비스를 받고 방문은 어떻게 진행되나요? 단계별로 설명하세요.","source":"pdf","topic":"미용실","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.319 · M319_1"},{"id":"M320_1","page":320,"title":"Hair Salon / Past Experience / 헤어 디자이너를 처음 만난 경험","q":"Tell me about the first time you met your favorite hair designer. How did you find the salon or the stylist ? What made you choose them? Please describe everything you remember about that experience in detail.","qko":"당신이 가장 좋아하는 헤어 디자이너를 처음 만났던 때에 대하여 말해주세요. 그 미용실 또는 디자이너를 어떻게 찾았나요? 무엇이 당신의 선택에 영향을 미쳤나 요? 그 경험에 대해 기억하시는 모든 것을 자세히 묘사해 주세요.","source":"pdf","topic":"미용실","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.320 · M320_1"},{"id":"M321_1","page":321,"title":"Hair Salon / Past Experience / 미용실에서 겪은 과거 경험","q":"Please describe a memorable experience you had when you went to get a haircut. When and where did it happen? What exactly happened that made it unforgettable? Tell me the whole story from beginning to end, with as much detail as possible.","qko":"머리를 하러 갔을 때 겪은 기억에 남는 경험을 묘사해 주세요. 언제 어디서 있었 던 일인가요? 정확히 어떤 일이 발생해서 이 기억을 잊지 못하나요? 전체 이야기 를 자세히 말해주세요.","source":"pdf","topic":"미용실","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.321 · M321_1"},{"id":"M323_11","page":323,"title":"","q":"I'd like to give you a situation and ask you to act it out. You have a special event coming up, and you want to get your hair done for the occasion. Call a hair salon, explain your situation, and ask three or four questions about making an appointment and getting your hair styled.","qko":"상황을 드릴 테니 대처를 보여주세요. 곧 특별한 행사가 있을 예정이고, 그 행사를 위해 머리를 하려고 합니다. 미용실 에 전화하여 상황을 설명하고, 예약과 헤어 스타일에 대한 3, 4 가지 질문을 해보 세요.","source":"pdf","topic":"미용실","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.323 · M323_11"},{"id":"M324_12","page":324,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You got your hair done at a salon, but you are not satisfied with the result. Call the salon, explain what you are unhappy with, and suggest two or three options to resolve the issue, such as fixing the style or getting a refund.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 미용실에서 머리를 했습니다. 그러나 결과가 마음에 들지 않습니다. 미용 실에 전화하여 무엇이 마음에 들지 않는지 설명하고, 머리를 다시 손보거나 환불 받는 것과 같이 문제를 해결하기 위한 대안을 2, 3가지 제안해 보세요.","source":"pdf","topic":"미용실","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.324 · M324_12"},{"id":"M325_13","page":325,"title":"","q":"That's the end of the situation. Have you ever had a bad experience at a hair salon? What happened, and how did you deal with it? Please describe the entire experience from beginning to end in as many details as possible.","qko":"그것으로 상황은 끝입니다. 미용실에서 겪은 좋지 않은 경험이 있나요? 무슨 일이 있었고 그것을 어떻게 해 결했나요? 가능한 많은 세부 사항들과 함께 전체 경험의 처음부터 끝까지 묘사해 주세요.","source":"pdf","topic":"미용실","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.325 · M325_13"},{"id":"M326_11","page":326,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to make a doctor's appointment. Call the doctor's office, explain your situation, and ask 3 or 4 questions about scheduling the appointment.","qko":"상황을 연기하세요. 진료 예약을 하려고 합니다. 병원에 전화해 상황을 설명하고 예약에 관한 질문 3~4개를 하세요.","source":"pdf","topic":"병원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.326 · M326_11"},{"id":"M327_12","page":327,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You made an appointment with your doctor, but something came up, and you can't make it. Call the doctor's office, explain the situation and ask a few questions to reschedule your appointment.","qko":"진료 예약을 했지만 일이 생겨 갈 수 없습니다. 병원에 전화해 상황을 설명하고 예약을 다시 잡기 위한 질문을 몇 개 하세요.","source":"pdf","topic":"병원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.327 · M327_12"},{"id":"M328_13","page":328,"title":"","q":"That's the end of the situation. Please tell me about an experience when you had to cancel an appointment for some reason. What happened, and why did you have to cancel the appointment? How did you deal with the situation?","qko":"그것으로 상황은 끝입니다. 어떤 이유로 약속을 취소해야 했던 경험에 대해 말씀 해 주세요. 무슨 일이 있었고, 왜 약속을 취소해야 했나요? 그 상황에 어떻게 대 처했나요?","source":"pdf","topic":"병원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.328 · M328_13"},{"id":"M329_11","page":329,"title":"","q":"I'd like to give you a situation and ask you to act it out. You need to have a new company ID card issued. Call the person responsible, explain your situation, and ask 3 or 4 questions about how to apply for the new card.","qko":"상황을 드릴 테니 대처를 보여주세요. 당신은 회사에서 발급하는 ID카드를 새로 발급받아야 합니다. 담당자에게 전화하 여 상황을 설명하고, ID카드 발급 절차에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"ID카드","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.329 · M329_11"},{"id":"M330_12","page":330,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You noticed there is an error on your ID card. Contact the person in charge, explain what the problem is, and request a replacement card. Then, suggest two or three possible solutions to resolve the problem quickly.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 ID카드에 문제가 있다는 것을 발견했습니다. 담당자에게 연락하여 문제가 무엇인지 설명하고 새 카드로 교체해 달라고 요청하세요. 그리고 문제를 빠르게 해결하기 위해 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"ID카드","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.330 · M330_12"},{"id":"M331_13","page":331,"title":"","q":"That's the end of the situation. Have you ever had any difficulties when applying for an ID card? What went wrong, and how did you handle the situation? Please describe the entire experience from beginning to end in as many details as possible.","qko":"그것으로 상황은 끝입니다. ID 카드를 발급받으려다 어려움을 겪을 적이 있나요? 무엇이 문제였고 그것을 어 떻게 해결하셨나요? 가능한 많은 세부 내용들과 함께 전체 경험을 처음부터 끝까 지 묘사해 주세요.","source":"pdf","topic":"ID카드","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.331 · M331_13"},{"id":"M332_11","page":332,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend recently bought a new cell phone. Call your friend, explain that you're thinking about buying a new phone, and ask three or four questions about your friend's new phone to get more information.","qko":"상황을 드릴 테니 대처를 보여주세요. 당신의 친구가 최근에 새 휴대폰을 구매했습니다. 친구에게 전화하여 당신이 새 휴대폰을 구매하려고 고민중이라는 것을 설명하고, 친구의 새 휴대폰에 대한 정 보를 알아보기 위해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"휴대폰","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.332 · M332_11"},{"id":"M333_12","page":333,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. Your friend sent you a document, but unfortunately, you cannot open it on your cell phone. Call your friend, explain the issue, and suggest two or three alternative ways to receive or access the document.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신의 친구가 당신에게 문서 하나를 보냈습니다. 그러나 불행하게도 당신의 휴 대폰에서 그 파일을 열어볼 수가 없습니다. 친구에게 전화하여 문제를 설명하고 그 문서를 받거나 열어보기 위한 2, 3가지 다른 대안을 제시해 보세요.","source":"pdf","topic":"휴대폰","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.333 · M333_12"},{"id":"M334_13","page":334,"title":"","q":"That's the end of the situation. Have you ever had a problem with your cell phone? What was the issue, and how did you fix it? Please describe the whole experience from beginning to end in as much detail as you can.","qko":"그것으로 상황은 끝입니다. 휴대폰을 사용하면서 문제를 겪은 적이 있나요? 문제가 무엇이었고 어떻게 고치 셨나요? 가능한 많은 세부 내용들과 함께 그 경험의 모든 것을 처음부터 끝까지 묘사해 주세요.","source":"pdf","topic":"휴대폰","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.334 · M334_13"},{"id":"M335_11","page":335,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are thinking about joining a gym. Call the gym, explain your situation, and ask three or four questions about membership options, facilities, or classes before you decide to register","qko":"헬스장 등록을 고민 중입니다. 헬스장에 전화해 상황을 설명하고 가입 결정 전에 회원권·시설·수업에 관해 질문 3~4개를 하세요.","source":"pdf","topic":"헬스장","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.335 · M335_11"},{"id":"M336_12","page":336,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You signed up for a gym membership, but after visiting, you found that the gym did not meet your expectations. Call the gym, explain your dissatisfaction, and suggest two or three options to request a cancellation or refund","qko":"등록한 헬스장에 방문했는데 기대와 달랐습니다. 전화해 불만족한 점을 설명하고 취소나 환불을 요청하는 방법 2~3개를 제시하세요.","source":"pdf","topic":"헬스장","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.336 · M336_12"},{"id":"M337_13","page":337,"title":"","q":"That's the end of the situation. Have you ever experienced any problems after signing up for a gym membership? What kind of issues did you face, and how did you solve them? Please describe the entire experience from beginning to end in as many details as possible.","qko":"그것으로 상황은 끝입니다. 헬스장 회원으로 등록한 후에 문제를 겪은 경험이 있나요? 어떤 문제를 마주했었 고 어떻게 해결하였나요? 처음부터 끝까지 전체 경험을 가능한 한 자세하게 설명 해 주세요","source":"pdf","topic":"헬스장","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.337 · M337_13"},{"id":"M338_11","page":338,"title":"","q":"I'd like to give you a situation and ask you to act it out. You’ve been asked to write an in -depth magazine interview with a celebrity. Call their agent and explain your idea. Then ask three or four thoughtful questions that reveal the celebrity’s personality, values, or recent projects.","qko":"유명 연예인과의 심층 인터뷰를 잡지에 싣기로 했습니다. 연예인의 에이전트에게 전화를 걸어 취재 의도를 설명하고, 연예인의 성격이나 가치관, 최근 활동을 잘 보여줄 수 있는 질문을 3~4개 해보세요.","source":"pdf","topic":"인터뷰","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.338 · M338_11"},{"id":"M339_12","page":339,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. After the article is published, you noticed several important mistakes in the printed interview. Call the editor to explain your concerns and propose two or three professional ways to handle the situation, such as issuing a correction notice or updating the online version.","qko":"인터뷰 기사가 출간된 후, 중요한 내용 몇 가지가 잘못 실린 것을 발견했습니다. 편집자에게 전화해서 문제를 설명하고, 정정 공지나 온라인 버전 수정 등 전문적 인 방식으로 해결할 수 있는 2~3가지 방법을 제안해 보세요.","source":"pdf","topic":"인터뷰","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.339 · M339_12"},{"id":"M340_13","page":340,"title":"","q":"That's the end of the situation. Describe a time when you met a celebrity in person. What was the occasion, how did you interact, and how did it affect you afterward? Please provide as many details as possible.","qko":"연예인을 직접 만났던 경험에 대해 이야기해 주세요. 어떤 상황이었고, 어떻게 교 류했으며, 그 경험이 이후에 당신에게 어떤 영향을 주었는지 구체적으로 설명해 주세요.","source":"pdf","topic":"인터뷰","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.340 · M340_13"},{"id":"H1_01","source":"photo","set":1,"number":1,"topic":"자기소개","q":"Let's start the interview now. Tell me a little bit about yourself.","qko":"자기소개를 해주세요.","title":"자기소개를 해주세요.","type":"자기소개","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q01"},{"id":"H1_02","source":"photo","set":1,"number":2,"topic":"집","q":"I'd like to know about the place where you live. Do you live in an apartment or a house? What does it look like? How many rooms does it have? Describe it in as much detail as possible.","qko":"사는 곳이 아파트인지 주택인지, 모습과 방의 수를 자세히 설명하세요.","title":"사는 곳이 아파트인지 주택인지, 모습과 방의 수를 자세히 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q02"},{"id":"H1_03","source":"photo","set":1,"number":3,"topic":"집","q":"There are always problems that happen in any home. Things break, projects do not go as planned, or people you live with don't cooperate. Tell me about some problems that have happened in your home.","qko":"고장, 계획 차질, 동거인의 비협조 같은 예를 참고해 집에서 발생했던 문제들을 말하세요.","title":"고장, 계획 차질, 동거인의 비협조 같은 예를 참고해 집에서 발생했던 문제들을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q03"},{"id":"H1_04","source":"photo","set":1,"number":4,"topic":"집","q":"Tell me about a problem that happened in your home. When did it happen? What caused the problem? Tell me in detail how you solved the problem.","qko":"집에서 생긴 문제의 시점과 원인, 해결 과정을 자세히 말하세요.","title":"집에서 생긴 문제의 시점과 원인, 해결 과정을 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q04"},{"id":"H1_05","source":"photo","set":1,"number":5,"topic":"국내여행","q":"You mentioned in your background survey that you like to travel domestically. What places do you enjoy visiting? Do you like going to mountains or beaches more? Tell me about a specific area you like to visit, and explain why you like going there.","qko":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","title":"즐겨 찾는 국내 여행지와 산·해변 중 선호하는 곳을 말하고, 특정 지역과 좋아하는 이유를 설명하세요.","type":"묘사 + 선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q05"},{"id":"H1_06","source":"photo","set":1,"number":6,"topic":"국내여행","q":"Think about a trip you took when you were young. Where did you travel? Who went with you? What did you do during that trip?","qko":"어릴 때 여행한 장소, 동행, 여행 중 활동을 말하세요.","title":"어릴 때 여행한 장소, 동행, 여행 중 활동을 말하세요.","type":"어린 시절 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 1 · Q06"},{"id":"H1_07","source":
