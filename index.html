ould go with another friend today, and I can help transfer my place if that is allowed.","ko":"아니면 오늘 다른 친구와 가도 돼. 허용된다면 내 자리를 넘기는 걸 도울게.","shared":true},{"en":"Let me know which option works better for you.","ko":"어느 방법이 더 좋은지 알려줘.","shared":true},{"en":"I am really sorry for the trouble, and I appreciate your understanding.","ko":"불편하게 해서 정말 미안하고 이해해 줘서 고마워.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M254_12","label":"오픽만수르 IM2–IH · p.254 · M254_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 오늘 친구와 공연을 보러 가기로 했었습니다.","그러나 불행히도 침대에서 일어나지 못할 만큼 아픕니다.","친구에게 전화하고 상황을 설명하세요.","그리고 상황을 해결하기 위한 2, 3가지 대안을 제시해보세요."],"words":115,"representative":"M254_12","additional":0,"sharedCount":7,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M255_13","page":255,"title":"","q":"That's the end of the situation. Have you ever experienced that you had to cancel or break a promise with other people because you are ill or have an urgent problem? When did it occur, and what steps did you follow to solve the problem?","qko":"그것으로 상황은 끝입니다. 당신이 아프거나 급한 문제가 있어서 다른 사람들과의 약속을 취소하거나 어겨야 만 했던 경험이 있나요? 언제 그 일이 발생했고, 문제를 해결하기 위해 어떤 절 차를 진행했나요?","source":"pdf","topic":"공연","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.255 · M255_13","family":"cancel","cue":"지난달 민과 점심 → 감기 → 전화 → 다음 주","lines":[{"en":"Last month, I had to cancel a lunch appointment with Min at the last minute.","ko":"지난달 민이와의 점심 약속을 직전에 취소해야 했어요.","shared":true},{"en":"We had planned to meet at a cafe near my apartment on Saturday.","ko":"토요일에 집 근처 카페에서 만나기로 했어요.","shared":true},{"en":"That morning, I woke up with a fever and a sore throat.","ko":"그날 아침 열이 나고 목이 아팠어요.","shared":true},{"en":"I didn't want to make him wait or risk passing on my cold.","ko":"친구를 기다리게 하거나 감기를 옮기고 싶지 않았어요.","shared":true},{"en":"I called him immediately, explained what had happened, and apologized.","ko":"바로 전화해서 상황을 설명하고 사과했어요.","shared":true},{"en":"I suggested meeting the following Saturday or having a short video call instead.","ko":"다음 토요일에 만나거나 대신 짧게 영상 통화를 하자고 했어요.","shared":true},{"en":"He understood, and we moved the lunch to the next week.","ko":"친구가 이해해 줘서 점심 약속을 다음 주로 옮겼어요.","shared":true},{"en":"I was disappointed, but letting him know early made the situation much easier.","ko":"아쉬웠지만 일찍 알려서 상황이 훨씬 수월해졌어요.","shared":true}],"note":"","sources":[{"id":"M255_13","label":"오픽만수르 IM2–IH · p.255 · M255_13"}],"correction":"","scope":"설문 중심","requirements":["그것으로 상황은 끝입니다.","당신이 아프거나 급한 문제가 있어서 다른 사람들과의 약속을 취소하거나 어겨야 만 했던 경험이 있나요?","언제 그 일이 발생했고, 문제를 해결하기 위해 어떤 절 차를 진행했나요?"],"words":100,"representative":"M136_3","additional":0,"sharedCount":8,"related":["M136_3","M267_13","M279_13","H1_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M256_11","page":256,"title":"","q":"I'd like to give you a situation and ask you to act it out. Your friend wants to go to a park this weekend and invited you to go together. Call your friend, ask 3 or 4 questions about your friend's plan to find out the details of this meeting.","qko":"상황을 드립니다. 연기를 해보세요. 당신의 친구는 이번 주에 공원에 가고 싶어 하고, 당신과 함께 가기 위해 초대하 고 싶어 합니다. 친구에게 전화해서 만남의 세부 내용을 알기 위해 친구의 계획 에 대한 3, 4 가지 질문을 해보세요.","source":"pdf","topic":"공원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.256 · M256_11","family":"rp-park","cue":"공원 계획 → 장소·시간·활동·준비물","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"Thanks for inviting me to the park this weekend. I would like to come, and I want to prepare properly.","ko":"이번 주말에 공원에 초대해 줘서 고마워. 가고 싶고 제대로 준비하고 싶어.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which park are we going to?","ko":"어느 공원에 가는 거야?","shared":false},{"en":"What time should we meet at the entrance?","ko":"입구에서 몇 시에 만날까?","shared":false},{"en":"Are we planning to walk or have a picnic?","ko":"산책할 계획이야, 피크닉할 계획이야?","shared":false},{"en":"What should I bring with me?","ko":"무엇을 가져가면 될까?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M256_11","label":"오픽만수르 IM2–IH · p.256 · M256_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신의 친구는 이번 주에 공원에 가고 싶어 하고, 당신과 함께 가기 위해 초대하 고 싶어 합니다.","친구에게 전화해서 만남의 세부 내용을 알기 위해 친구의 계획 에 대한 3, 4 가지 질문을 해보세요."],"words":77,"representative":"M256_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M257_12","page":257,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You just found out the park you and your friend are going to visit this weekend will be closed. Contact your friend, explain the situation, and provide 2 or 3 alternatives to the issue.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 당신과 친구가 함께 가기로 한 공원이 이번 주에 문을 닫는 다는 것을 알 았습니다. 친구에게 연락하세요. 상황을 설명하고 문제에 대한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"공원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.257 · M257_12","family":"rp-closedpark","cue":"공원 폐쇄 → 다른 공원·카페 → 민 선택","lines":[{"en":"Hi Min, I just checked the park's notice, and it will be closed this weekend for maintenance.","ko":"민아, 방금 공지를 확인했는데 이번 주말에 공원이 보수 작업으로 문을 닫는대.","shared":false},{"en":"That means we can't have our walk there as planned.","ko":"그래서 계획대로 거기서 산책할 수 없어.","shared":false},{"en":"I wanted to tell you before you started preparing anything.","ko":"뭘 준비하기 전에 알려주고 싶었어.","shared":false},{"en":"We could go to the smaller park near my apartment at the same time.","ko":"같은 시간에 우리 집 근처 작은 공원에 갈 수 있어.","shared":false},{"en":"It has an easy walking path, so it would still suit our plan.","ko":"걷기 편한 길이 있어서 계획에 잘 맞을 거야.","shared":false},{"en":"Or we could meet at my usual cafe and save the park visit for next weekend.","ko":"아니면 단골 카페에서 만나고 공원은 다음 주말로 미뤄도 돼.","shared":false},{"en":"I am happy with either option, so let me know what you prefer.","ko":"난 둘 다 괜찮으니 뭐가 좋은지 알려줘.","shared":false},{"en":"I will check the new place's opening hours before we meet.","ko":"만나기 전에 새 장소의 시간을 확인할게.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M257_12","label":"오픽만수르 IM2–IH · p.257 · M257_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 당신과 친구가 함께 가기로 한 공원이 이번 주에 문을 닫는 다는 것을 알 았습니다.","친구에게 연락하세요.","상황을 설명하고 문제에 대한 2, 3가지 대안을 제시해 보세요."],"words":104,"representative":"M257_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M258_13","page":258,"title":"","q":"That's the end of the situation. Have you ever had a memorable experience while visiting a park? Maybe something interesting, fun, or unexpected happened. What made it so special? What happened, and how did you deal with the situation?","qko":"그것으로 상황은 끝입니다. 공원을 방문하면서 겪은 기억에 남는 경험이 있나요? 어떤 흥미롭거나 재미있거 나, 기대치 못한 일이 일어났었나요? 왜 그 경험이 특별 한가요? 무슨 일이 있었 고 어떻게 그 상황을 해결하셨나요?","source":"pdf","topic":"공원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.258 · M258_13","family":"park-rain","cue":"지난 일요일 → 민 → 갑작스러운 비 → 카페","lines":[{"en":"Last Sunday afternoon, I went to my neighborhood park with Min.","ko":"지난 일요일 오후에 민이와 동네 공원에 갔어요.","shared":true},{"en":"We planned to walk around the lawn and sit outside for a while.","ko":"잔디밭 주변을 걷고 잠시 밖에 앉아 있을 계획이었어요.","shared":true},{"en":"About twenty minutes later, dark clouds appeared and heavy rain started.","ko":"20분쯤 지나 먹구름이 끼고 비가 많이 내렸어요.","shared":true},{"en":"Neither of us had an umbrella, so we quickly went into a cafe near the entrance.","ko":"둘 다 우산이 없어서 입구 근처 카페로 급히 들어갔어요.","shared":true},{"en":"We dried our bags with paper towels and ordered hot drinks.","ko":"종이 타월로 가방을 닦고 따뜻한 음료를 주문했어요.","shared":true},{"en":"While we waited, we laughed about how confidently we had ignored the forecast.","ko":"기다리면서 일기예보를 무시한 걸 두고 웃었어요.","shared":true},{"en":"The rain stopped after half an hour, and we walked home together.","ko":"30분쯤 뒤 비가 그쳐 함께 걸어서 집에 갔어요.","shared":true},{"en":"It was memorable because the unexpected change gave us time for a really good conversation.","ko":"뜻밖의 계획 변경 덕분에 좋은 대화를 나눠 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"M258_13","label":"오픽만수르 IM2–IH · p.258 · M258_13"}],"correction":"","scope":"설문 중심","requirements":["그것으로 상황은 끝입니다.","공원을 방문하면서 겪은 기억에 남는 경험이 있나요?","어떤 흥미롭거나 재미있거 나, 기대치 못한 일이 일어났었나요?","왜 그 경험이 특별 한가요?","무슨 일이 있었 고 어떻게 그 상황을 해결하셨나요?"],"words":102,"representative":"M036_3","additional":0,"sharedCount":8,"related":["M036_3","M050_3","H5_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M259_11","page":259,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are on vacation in New York City. Now you are at a car rental company. You need to rent a car, and you are speaking to the person who works at the car rental company. Ask him 3 or 4 questions about renting a car.","qko":"상황을 드릴 테니, 연기를 해보세요. 당신은 뉴욕에서 휴가를 보내고 있습니다. 지금 당신은 렌트카 회사에 있습니다. 당신은 차를 빌려야 하고 렌트카 회사의 직원과 이야기하고 있습니다. 차를 빌리는 것에 대해 3, 4 가지 질문을 해보세요.","source":"pdf","topic":"렌터카","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.259 · M259_11","family":"rp-rental","cue":"뉴욕 렌터카 → 비용·면허·보험·반납","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am visiting New York and would like to rent a small car for two days.","ko":"뉴욕을 방문 중이고 작은 차를 이틀 동안 빌리고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"What is the total price for two days, including fees?","ko":"수수료를 포함해 이틀 총비용이 얼마인가요?","shared":false},{"en":"Which driving documents do you accept from visitors?","ko":"방문객에게 어떤 운전 서류를 받으시나요?","shared":false},{"en":"What insurance options are available with the rental?","ko":"대여할 때 어떤 보험 선택지가 있나요?","shared":false},{"en":"Where and when should I return the car?","ko":"차는 언제 어디에 반납해야 하나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M259_11","label":"오픽만수르 IM2–IH · p.259 · M259_11"}],"correction":"","scope":"역할극","requirements":["상황을 드릴 테니, 연기를 해보세요.","당신은 뉴욕에서 휴가를 보내고 있습니다.","지금 당신은 렌트카 회사에 있습니다.","당신은 차를 빌려야 하고 렌트카 회사의 직원과 이야기하고 있습니다.","차를 빌리는 것에 대해 3, 4 가지 질문을 해보세요."],"words":78,"representative":"M259_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M260_12","page":260,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. I'm not sure if you are allowed to rent a car because you don't have an international driver's license or an American driver's license. Please explain what your license says and suggest 2 or 3 alternatives to rent a car.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 국제 면허증 또는 미국 면허증이 없기 때문에 차를 빌릴 수 있을 지 확신 할 수 없습니다. 당신의 면허증에 뭐라고 적혀 있는지 설명하고 차를 빌리기 위 해 2, 3 가지 대안을 제시해 보세요.","source":"pdf","topic":"렌터카","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.260 · M260_12","family":"rp-license","cue":"한국 면허 설명 → 인정 여부·동행 운전자·나중 대여","lines":[{"en":"I understand there may be a problem with my driving documents.","ko":"제 운전 서류에 문제가 있을 수 있다는 점 이해해요.","shared":false},{"en":"This is my Korean driver's license, and it shows my name, photo, license type, and expiry date.","ko":"이건 한국 면허증이고 이름, 사진, 면허 종류, 만료일이 적혀 있어요.","shared":false},{"en":"I don't have an international permit or an American license with me.","ko":"국제 운전 허가증이나 미국 면허는 가지고 있지 않아요.","shared":false},{"en":"Could you first check whether your policy allows this license with any supporting document?","ko":"먼저 귀사 규정상 추가 서류와 함께 이 면허를 사용할 수 있는지 확인해 주실 수 있나요?","shared":false},{"en":"If it doesn't, my travel companion has the required documents and could apply as the driver, if your rules allow it.","ko":"안 된다면 동행이 필요한 서류를 갖췄는데 규정이 허용하면 운전자로 신청할 수 있어요.","shared":false},{"en":"Another option is to postpone the rental until I can obtain the proper documents.","ko":"다른 방법은 적절한 서류를 구할 때까지 대여를 미루는 거예요.","shared":false},{"en":"I will not drive unless the documents and rental agreement are valid.","ko":"서류와 대여 계약이 유효하지 않으면 운전하지 않을게요.","shared":false},{"en":"Please explain which option is possible.","ko":"어느 방법이 가능한지 설명해 주세요.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M260_12","label":"오픽만수르 IM2–IH · p.260 · M260_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 국제 면허증 또는 미국 면허증이 없기 때문에 차를 빌릴 수 있을 지 확신 할 수 없습니다.","당신의 면허증에 뭐라고 적혀 있는지 설명하고 차를 빌리기 위 해 2, 3 가지 대안을 제시해 보세요."],"words":107,"representative":"M260_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M261_13","page":261,"title":"","q":"That's the end of the situation. Have you ever rented a car for your traveling? What was the reason you rented a car? Did something crazy or terrible happen? What happened, and how did you solve it? Why was the experience so memorable?","qko":"그것으로 상황은 끝입니다. 여행을 위해 차를 렌트 한 적이 있나요? 차를 렌트 한 이유가 무엇이었나요? 어 떤 말도 안 되거나 끔찍한 일이 있었나요? 무슨 일이 있었고 어떻게 해결하셨나 요? 왜 그 경험이 기억에 남나요?","source":"pdf","topic":"렌터카","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.261 · M261_13","family":"car-trip","cue":"작년 부모님과 해안 → 렌트 → 펑크 → 업체 교체","lines":[{"en":"Last year, I rented a car for a short coastal trip with my parents.","ko":"작년에 부모님과 짧은 해안 여행을 하려고 차를 빌렸어요.","shared":false},{"en":"We wanted to visit several places that were difficult to reach by bus.","ko":"버스로 가기 어려운 곳들을 방문하고 싶었어요.","shared":false},{"en":"On the second morning, I noticed that one tire looked flat while the car was parked.","ko":"둘째 날 아침 주차된 차의 타이어 하나가 주저앉은 걸 봤어요.","shared":false},{"en":"I didn't drive it, and I called the rental company using the number in the contract.","ko":"운전하지 않고 계약서에 있는 번호로 렌터카 업체에 전화했어요.","shared":false},{"en":"They asked for our location and sent roadside assistance.","ko":"업체가 위치를 묻고 긴급 지원을 보냈어요.","shared":false},{"en":"We waited at a nearby cafe until the tire was replaced.","ko":"근처 카페에서 타이어 교체를 기다렸어요.","shared":false},{"en":"We skipped one stop but still enjoyed the rest of the trip.","ko":"방문지 하나는 건너뛰었지만 남은 여행은 즐겼어요.","shared":false},{"en":"The experience was memorable because staying calm prevented a small problem from ruining the whole day.","ko":"차분하게 대처해 작은 문제로 하루 전체를 망치지 않아 기억에 남아요.","shared":false}],"note":"","sources":[{"id":"M261_13","label":"오픽만수르 IM2–IH · p.261 · M261_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","여행을 위해 차를 렌트 한 적이 있나요?","차를 렌트 한 이유가 무엇이었나요?","어 떤 말도 안 되거나 끔찍한 일이 있었나요?","무슨 일이 있었고 어떻게 해결하셨나 요?","왜 그 경험이 기억에 남나요?"],"words":107,"representative":"M261_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M262_11","page":262,"title":"","q":"I'd like to give you a situation and ask you to act it out. You heard that your favorite store is having a big sale. And you want to find out more about the sale. Call this store and leave a message. Ask 3 or 4 questions to gain more information about the sale.","qko":"상황을 드릴 테니 연기를 해보세요. 당신이 가장 좋아하는 가게에서 큰 세일을 한다고 들었습니다. 그리고 당신은 세 일에 대해 더 알고 싶어합니다. 이 가게에 전화해서 메시지를 남기세요. 세일에 대한 더 많은 정보를 얻기 위해 3개 또는 4개의 질문을 하세요.","source":"pdf","topic":"쇼핑","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.262 · M262_11","family":"rp-sale","cue":"음성메시지 → 기간·품목·사이즈·교환","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am leaving a message because I heard your store is having a sale and I would like to visit this weekend.","ko":"매장에서 세일을 한다고 들어 이번 주말에 가고 싶어서 메시지를 남깁니다.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"When does the sale end?","ko":"세일은 언제 끝나나요?","shared":false},{"en":"Which jackets are included in the discount?","ko":"어떤 재킷이 할인 대상인가요?","shared":false},{"en":"Do you have the light blue jacket in a medium size?","ko":"연한 파란 재킷의 미디엄 사이즈가 있나요?","shared":false},{"en":"Can sale items be exchanged if the size is wrong?","ko":"세일 상품도 사이즈가 안 맞으면 교환할 수 있나요?","shared":false},{"en":"Please call me back at the number I am calling from. Thank you for your help.","ko":"지금 전화한 번호로 연락해 주세요. 감사합니다.","shared":false}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M262_11","label":"오픽만수르 IM2–IH · p.262 · M262_11"}],"correction":"","scope":"역할극","requirements":["상황을 드릴 테니 연기를 해보세요.","당신이 가장 좋아하는 가게에서 큰 세일을 한다고 들었습니다.","그리고 당신은 세 일에 대해 더 알고 싶어합니다.","이 가게에 전화해서 메시지를 남기세요.","세일에 대한 더 많은 정보를 얻기 위해 3개 또는 4개의 질문을 하세요."],"words":89,"representative":"M262_11","additional":0,"sharedCount":2,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M263_12","page":263,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You arrive home with the clothes you bought and realize you didn't get them at the sale price. Contact the store, explain the situation, and provide 2 or 3 options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 당신이 구매한 옷을 가지고 집에 도착했습니다. 그리고 옷들을 세일 가격 으로 구매하지 않았다는 것을 알았습니다. 매장에 연락하세요. 상황을 설명하고 문제를 해결하기 위한 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"쇼핑","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.263 · M263_12","family":"rp-sale-error","cue":"정가 결제 → 영수증 → 차액 환불·반품","lines":[{"en":"Hello, I bought a jacket at your store today, but I noticed a pricing mistake after getting home.","ko":"안녕하세요. 오늘 매장에서 재킷을 샀는데 집에 와서 가격 오류를 발견했어요.","shared":false},{"en":"The shelf label showed a discount, but my receipt shows the full price.","ko":"매장 가격표는 할인이었는데 영수증에는 정가가 찍혔어요.","shared":false},{"en":"I have kept the receipt and haven't worn the jacket.","ko":"영수증을 보관했고 재킷은 아직 입지 않았어요.","shared":false},{"en":"Could you check the sale price and refund the difference to my card?","ko":"세일 가격을 확인하고 차액을 카드로 환불해 주실 수 있나요?","shared":false},{"en":"I can send a photo of the receipt or bring it to the store.","ko":"영수증 사진을 보내거나 매장으로 가져갈 수 있어요.","shared":false},{"en":"If the discount doesn't apply, I would like to return the unworn jacket for a refund under your return policy.","ko":"할인이 적용되지 않는다면 반품 규정에 따라 입지 않은 재킷을 반품하고 환불받고 싶어요.","shared":false},{"en":"Please let me know which option is available and what I should bring.","ko":"어떤 방법이 가능하고 뭘 가져가야 하는지 알려주세요.","shared":false},{"en":"Thank you for checking this for me.","ko":"확인해 주셔서 감사합니다.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M263_12","label":"오픽만수르 IM2–IH · p.263 · M263_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 당신이 구매한 옷을 가지고 집에 도착했습니다.","그리고 옷들을 세일 가격 으로 구매하지 않았다는 것을 알았습니다.","매장에 연락하세요.","상황을 설명하고 문제를 해결하기 위한 2, 3가지 대안을 제시해 보세요."],"words":108,"representative":"M263_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M264_13","page":264,"title":"","q":"That's the end of the situation. Reflect back to the time when you bought something. What things did you buy and what happened with them? How did you handle the situation? Tell me what steps you took to solve the problem.","qko":"그것으로 상황은 끝입니다. 무언가를 구매했던 때를 떠올려 보세요. 무엇을 구매했고, 그것과 무슨 일이 있었 나요? 그 상황을 어떻게 해결했나요? 문제를 해결하기 위해 어떤 절차를 진행했 었는지 말해주세요.","source":"pdf","topic":"쇼핑","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.264 · M264_13","family":"desk-problem","cue":"두 달 전 배송 → 다른 색·흔들림 → 사진 → 교환","lines":[{"en":"Two months ago, I ordered a small wooden desk online, but the wrong one arrived.","ko":"두 달 전에 작은 나무 책상을 온라인으로 주문했는데 다른 제품이 왔어요.","shared":true},{"en":"I had chosen a light brown desk, but the delivered one was dark and had a loose leg.","ko":"밝은 갈색을 골랐는데 온 것은 어둡고 다리도 헐거웠어요.","shared":true},{"en":"I stopped assembling it because I didn't want to make the problem worse.","ko":"문제를 키우고 싶지 않아 조립을 멈췄어요.","shared":true},{"en":"I took photos of the desk and the label and contacted the seller with my order number.","ko":"책상과 라벨 사진을 찍고 주문 번호와 함께 판매자에게 연락했어요.","shared":true},{"en":"The employee checked the details and confirmed a warehouse mistake.","ko":"직원이 확인하고 창고의 실수라고 했어요.","shared":true},{"en":"We arranged for them to collect it and deliver the correct desk three days later.","ko":"수거한 뒤 사흘 후 맞는 책상을 보내기로 했어요.","shared":true},{"en":"This time, I checked the color and tested the legs before putting my things on it.","ko":"이번에는 물건을 올리기 전에 색과 다리를 확인했어요.","shared":true},{"en":"The replacement was fine, and I was satisfied with how the seller handled the mistake.","ko":"교환품은 괜찮았고 판매자의 대응에도 만족했어요.","shared":true}],"note":"","sources":[{"id":"M264_13","label":"오픽만수르 IM2–IH · p.264 · M264_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","무언가를 구매했던 때를 떠올려 보세요.","무엇을 구매했고, 그것과 무슨 일이 있었 나요?","그 상황을 어떻게 해결했나요?","문제를 해결하기 위해 어떤 절차를 진행했 었는지 말해주세요."],"words":119,"representative":"M234_3","additional":0,"sharedCount":8,"related":["M234_3","M252_13","H2_07","H3_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M265_11","page":265,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to make a doctor's appointment. Call the doctor's office and ask 3 or 4 questions to make an appointment.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 병원 예약을 하려고 합니다. 병원에 전화하고 예약을 하기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"병원","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.265 · M265_11","family":"rp-doctor","cue":"목 아픔 → 시간·의사·준비·비용 → 예약","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I have had a sore throat for two days, and I would like to see a doctor rather than wait longer.","ko":"이틀째 목이 아파 더 기다리지 않고 진료를 받고 싶어요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Do you have an appointment available tomorrow afternoon?","ko":"내일 오후에 예약 가능한 시간이 있나요?","shared":true},{"en":"Which doctor could I see for these symptoms?","ko":"이 증상으로 어느 선생님께 진료받을 수 있나요?","shared":true},{"en":"What documents should I bring for my first visit?","ko":"첫 방문 때 어떤 서류를 가져가야 하나요?","shared":true},{"en":"How much is the consultation before any additional tests?","ko":"추가 검사 전 진료비는 얼마인가요?","shared":true},{"en":"Tomorrow at three works for me. Please book that appointment under the name Kim. I will arrive a little early. Thank you.","ko":"내일 3시면 괜찮아요. 김이라는 이름으로 예약해 주세요. 조금 일찍 도착할게요. 감사합니다.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M265_11","label":"오픽만수르 IM2–IH · p.265 · M265_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 병원 예약을 하려고 합니다.","병원에 전화하고 예약을 하기 위한 3, 4가지 질문을 해보세요."],"words":95,"representative":"M265_11","additional":0,"sharedCount":8,"related":["M326_11","H2_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M266_12","page":266,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You made an appointment with your doctor, but something came up, and you can't make it. Call the doctor's office, explain the situation, and reschedule the appointment with 2 or 3 questions.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 병원 예약을 했습니다. 그러나 어떠한 일이 생겨서 갈 수가 없습니다. 병 원에 전화하세요. 상황을 설명하고 예약을 바꾸기 위한 2, 3가지 질문을 해보세 요.","source":"pdf","topic":"병원","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.266 · M266_12","family":"rp-reschedule","cue":"오늘 못 감 → 내일·모레 → 변경비·확인","lines":[{"en":"Hello, I have an appointment today at three under the name Kim.","ko":"안녕하세요. 오늘 3시에 김이라는 이름으로 예약돼 있어요.","shared":true},{"en":"An urgent family matter has come up, so I won't be able to arrive on time.","ko":"급한 가족 일이 생겨 제시간에 갈 수 없어요.","shared":true},{"en":"I am sorry for the short notice, and I would like to reschedule rather than miss it without calling.","ko":"갑자기 알려드려 죄송하고 연락 없이 빠지기보다 예약을 바꾸고 싶어요.","shared":true},{"en":"Could I move the appointment to tomorrow afternoon instead?","ko":"내일 오후로 옮길 수 있을까요?","shared":true},{"en":"If tomorrow is full, would the morning after that be available?","ko":"내일이 다 찼다면 모레 아침은 가능할까요?","shared":true},{"en":"Is there a fee for changing it this late?","ko":"이렇게 늦게 변경하면 수수료가 있나요?","shared":true},{"en":"Please confirm the new date and time by text once it is arranged.","ko":"정해지면 새 날짜와 시간을 문자로 확인해 주세요.","shared":true},{"en":"Thank you for helping me find another time.","ko":"다른 시간을 잡도록 도와주셔서 감사합니다.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M266_12","label":"오픽만수르 IM2–IH · p.266 · M266_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 병원 예약을 했습니다.","그러나 어떠한 일이 생겨서 갈 수가 없습니다.","병 원에 전화하세요.","상황을 설명하고 예약을 바꾸기 위한 2, 3가지 질문을 해보세 요."],"words":97,"representative":"M266_12","additional":0,"sharedCount":8,"related":["M327_12","H2_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M267_13","page":267,"title":"","q":"That's the end of the situation. Please tell me about an experience when you had to cancel an appointment for some reason. What happened, and why did you have to cancel the appointment? How did you deal with the situation?","qko":"그것으로 상황은 끝입니다. 어떠한 이유로 예약을 취소해야 했던 경험에 대해 말해주세요. 무슨 일이 있었고 왜 그 예약을 취소해야 했나요? 그 상황을 어떻게 해결하셨나요?","source":"pdf","topic":"병원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.267 · M267_13","family":"cancel","cue":"지난달 민과 점심 → 감기 → 전화 → 다음 주","lines":[{"en":"Last month, I had to cancel a lunch appointment with Min at the last minute.","ko":"지난달 민이와의 점심 약속을 직전에 취소해야 했어요.","shared":true},{"en":"We had planned to meet at a cafe near my apartment on Saturday.","ko":"토요일에 집 근처 카페에서 만나기로 했어요.","shared":true},{"en":"That morning, I woke up with a fever and a sore throat.","ko":"그날 아침 열이 나고 목이 아팠어요.","shared":true},{"en":"I didn't want to make him wait or risk passing on my cold.","ko":"친구를 기다리게 하거나 감기를 옮기고 싶지 않았어요.","shared":true},{"en":"I called him immediately, explained what had happened, and apologized.","ko":"바로 전화해서 상황을 설명하고 사과했어요.","shared":true},{"en":"I suggested meeting the following Saturday or having a short video call instead.","ko":"다음 토요일에 만나거나 대신 짧게 영상 통화를 하자고 했어요.","shared":true},{"en":"He understood, and we moved the lunch to the next week.","ko":"친구가 이해해 줘서 점심 약속을 다음 주로 옮겼어요.","shared":true},{"en":"I was disappointed, but letting him know early made the situation much easier.","ko":"아쉬웠지만 일찍 알려서 상황이 훨씬 수월해졌어요.","shared":true}],"note":"","sources":[{"id":"M267_13","label":"오픽만수르 IM2–IH · p.267 · M267_13"},{"id":"M328_13","label":"오픽만수르 IM2–IH · p.328 · M328_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","어떠한 이유로 예약을 취소해야 했던 경험에 대해 말해주세요.","무슨 일이 있었고 왜 그 예약을 취소해야 했나요?","그 상황을 어떻게 해결하셨나요?"],"words":100,"representative":"M136_3","additional":0,"sharedCount":8,"related":["M136_3","M255_13","M279_13","H1_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M268_11","page":268,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are planning on going on a trip with your friend. Call a travel agency and ask 3 or 4 questions about the trip you want to go on.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친구와 여행을 계획하고 있습니다. 여행사에 전화하고 가고 싶은 여행에 대한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"여행","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.268 · M268_11","family":"rp-travel","cue":"민과 짧은 휴가 → 여행지·비용·활동·취소","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am planning a short vacation with a friend, and we would like somewhere relaxing near the coast.","ko":"친구와 짧은 휴가를 계획하고 있고 해안 근처 편안한 곳을 원해요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which destinations would you recommend for a three-day trip?","ko":"사흘 여행으로 어느 여행지를 추천하시나요?","shared":true},{"en":"What is included in the total price?","ko":"총가격에 무엇이 포함되나요?","shared":true},{"en":"Are there any easy outdoor activities available during our visit?","ko":"방문 기간에 할 만한 가벼운 야외 활동이 있나요?","shared":true},{"en":"What happens if we need to change the dates?","ko":"날짜를 바꿔야 하면 어떻게 되나요?","shared":true},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M268_11","label":"오픽만수르 IM2–IH · p.268 · M268_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 친구와 여행을 계획하고 있습니다.","여행사에 전화하고 가고 싶은 여행에 대한 3, 4가지 질문을 해보세요."],"words":81,"representative":"M268_11","additional":0,"sharedCount":8,"related":["H6_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M269_12","page":269,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. For some reason, the travel agency informs you that the trip that you wanted to go on is unavailable. Call your friend, leave a message to explain the situation, and give 2 or 3 options to solve this problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 어떠한 이유로, 여행사에서 당신이 가려고 한 여행이 불가능하다고 연락했습니다. 친구에게 전화하세요. 상황을 설명하기 위해 메시지를 남기고, 문제를 해결하기 위한 2, 3가지 대안을 제시하세요.","source":"pdf","topic":"여행","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.269 · M269_12","family":"rp-trip-cancel","cue":"여행 불가 연락 → 다른 날짜·다른 장소","lines":[{"en":"Hi Min, I am leaving a message about our trip.","ko":"민아, 우리 여행에 관해 메시지를 남겨.","shared":false},{"en":"The travel agency just told me that the trip we wanted is unavailable on our dates.","ko":"여행사에서 우리가 원한 여행이 그 날짜에는 불가능하다고 연락했어.","shared":false},{"en":"I know we were looking forward to it, but I think we still have a couple of options.","ko":"기대했던 건 알지만 아직 몇 가지 방법은 있는 것 같아.","shared":false},{"en":"We could ask for the same trip on the following weekend if you are free.","ko":"네가 시간이 되면 다음 주말에 같은 여행이 가능한지 물어볼 수 있어.","shared":false},{"en":"Or we could keep our dates and choose another coastal town with available rooms.","ko":"아니면 날짜는 그대로 두고 방이 있는 다른 해안 도시를 고를 수 있어.","shared":false},{"en":"I can compare the prices and check the cancellation conditions before we decide.","ko":"결정하기 전에 내가 가격과 취소 조건을 비교할게.","shared":false},{"en":"Please call me back when you have time and tell me which plan you prefer.","ko":"시간 될 때 전화해서 어떤 계획이 좋은지 알려줘.","shared":false},{"en":"I won't confirm anything until we agree.","ko":"합의하기 전에는 아무것도 확정하지 않을게.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M269_12","label":"오픽만수르 IM2–IH · p.269 · M269_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","어떠한 이유로, 여행사에서 당신이 가려고 한 여행이 불가능하다고 연락했습니다.","친구에게 전화하세요.","상황을 설명하기 위해 메시지를 남기고, 문제를 해결하기 위한 2, 3가지 대안을 제시하세요."],"words":108,"representative":"M269_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M270_13","page":270,"title":"","q":"That's the end of the situation. Reflect back to the time when you had any problems while you were planning a trip. What was the problem, and how did you deal with it? Tell me what happened from beginning to end.","qko":"그것으로 상황은 끝입니다. 여행을 준비하면서 문제를 겪었던 때를 떠올려 보세요. 문제가 무엇이었고 어떻게 해결하셨나요? 무슨 일이 있었는지 처음부터 끝까지 말해주세요.","source":"pdf","topic":"여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.270 · M270_13","family":"trip-booking","cue":"강릉 계획 → 예약 실패 → 연락 → 다른 호텔","lines":[{"en":"While planning last summer's trip to Gangneung, I had a problem with our hotel booking.","ko":"지난여름 강릉 여행을 준비하며 호텔 예약에 문제가 생겼어요.","shared":false},{"en":"I thought the payment had gone through, but I never received a confirmation email.","ko":"결제가 됐다고 생각했는데 확인 이메일이 오지 않았어요.","shared":false},{"en":"The next morning, I checked the website and saw that the booking was incomplete.","ko":"다음 날 아침 사이트를 보니 예약이 완료되지 않았어요.","shared":false},{"en":"I contacted customer service to make sure I wouldn't be charged twice.","ko":"이중 결제가 되지 않도록 고객센터에 연락했어요.","shared":false},{"en":"They confirmed the first payment had failed, but the room was no longer available.","ko":"첫 결제는 실패했지만 그 방은 더 이상 예약할 수 없다고 했어요.","shared":false},{"en":"Min and I compared other hotels and found a similar one near the station.","ko":"민이와 다른 호텔을 비교해 역 근처 비슷한 곳을 찾았어요.","shared":false},{"en":"This time, I waited for the confirmation and saved it before closing the page.","ko":"이번에는 확인서를 받은 뒤 저장하고 페이지를 닫았어요.","shared":false},{"en":"We kept the same trip dates, and I learned not to treat an unfinished booking as confirmed.","ko":"여행 날짜는 유지했고 미완료 예약을 확정으로 생각하면 안 된다는 걸 배웠어요.","shared":false}],"note":"","sources":[{"id":"M270_13","label":"오픽만수르 IM2–IH · p.270 · M270_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","여행을 준비하면서 문제를 겪었던 때를 떠올려 보세요.","문제가 무엇이었고 어떻게 해결하셨나요?","무슨 일이 있었는지 처음부터 끝까지 말해주세요."],"words":114,"representative":"M270_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M271_11","page":271,"title":"","q":"I'd like to give you a situation and ask you to act it out. You are going to visit your friend who lives abroad. Call your friend and ask 3 or 4 questions about the geographical features of his or her country.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 외국에 사는 친구를 만나러 갈 예정입니다. 친구에게 전화하고 그 또는 그녀의 나라 지형 특성에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"지형","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.271 · M271_11","family":"rp-geography","cue":"외국 친구 방문 → 산·해안·가까운 곳·차이","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am looking forward to visiting you abroad, and I want to understand the area before I plan any outings.","ko":"해외의 너를 방문할 게 기대돼. 나들이를 계획하기 전에 그 지역을 알고 싶어.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Are there mountains near your city, or is the area mostly flat?","ko":"네 도시 근처에 산이 있어, 아니면 대부분 평지야?","shared":false},{"en":"How far is the nearest coast or lake?","ko":"가장 가까운 해안이나 호수는 얼마나 멀어?","shared":false},{"en":"Which natural place would be easiest for us to visit together?","ko":"함께 가기 가장 쉬운 자연 명소는 어디야?","shared":false},{"en":"What landscape there would feel most different from Korea?","ko":"그곳의 어떤 풍경이 한국과 가장 다르게 느껴질까?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M271_11","label":"오픽만수르 IM2–IH · p.271 · M271_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 외국에 사는 친구를 만나러 갈 예정입니다.","친구에게 전화하고 그 또는 그녀의 나라 지형 특성에 대해 3, 4가지 질문을 해보세요."],"words":88,"representative":"M271_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M272_12","page":272,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You were supposed to travel abroad to visit your friend. But something came up, and you will not be able to go there. Call your friend, explain what happens, and give 2 or 3 options to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 친구를 만나기 위해 해외 여행을 가려고 했습니다. 그러나 어떠한 일이 발생했고, 여행을 갈 수 없을 것입니다. 친구에게 전화하세요. 무슨 일이 생겼는 지 설명하고 문제를 해결하기 위한 2, 3가지 제안을 해보세요.","source":"pdf","topic":"지형","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.272 · M272_12","family":"rp-friend-abroad","cue":"해외 친구 방문 불가 → 다음 달·영상통화","lines":[{"en":"Hi Min, I am really sorry, but I won't be able to visit you abroad next week.","ko":"민아, 정말 미안하지만 다음 주에 해외에 있는 너를 방문할 수 없게 됐어.","shared":false},{"en":"A family member needs my help at home, and I can't leave as planned.","ko":"가족 한 분이 집에서 내 도움이 필요해서 계획대로 떠날 수 없어.","shared":false},{"en":"I know you have prepared for my visit, so I wanted to tell you immediately.","ko":"내 방문을 준비한 걸 알아서 바로 알려주고 싶었어.","shared":false},{"en":"Could we move the visit to next month, once things are more settled?","ko":"상황이 정리된 뒤 다음 달로 방문을 옮길 수 있을까?","shared":false},{"en":"I will check the ticket change conditions and cover any costs on my side.","ko":"항공권 변경 조건을 확인하고 내 쪽 비용은 부담할게.","shared":false},{"en":"In the meantime, we could have a long video call this weekend and plan the visit together.","ko":"그동안 이번 주말에 길게 영상 통화하며 방문 계획을 같이 세울 수 있어.","shared":false},{"en":"Let me know what dates might work for you.","ko":"어떤 날짜가 가능할지 알려줘.","shared":false},{"en":"I am disappointed too, and I appreciate your understanding.","ko":"나도 아쉽고 이해해 줘서 고마워.","shared":false}],"note":"역할극에서만 해외에 사는 친구를 가정합니다. 평소 동네 친구 설정과 실제 이력은 아닙니다.","sources":[{"id":"M272_12","label":"오픽만수르 IM2–IH · p.272 · M272_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 친구를 만나기 위해 해외 여행을 가려고 했습니다.","그러나 어떠한 일이 발생했고, 여행을 갈 수 없을 것입니다.","친구에게 전화하세요.","무슨 일이 생겼는 지 설명하고 문제를 해결하기 위한 2, 3가지 제안을 해보세요."],"words":108,"representative":"M272_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M273_13","page":273,"title":"","q":"That's the end of the situation. Tell me a memorable experience that you visited another country. When and where did you go? What was the place like? How was the geography of that country different from the geography of your country?","qko":"그것으로 상황은 끝입니다. 다른 나라를 방문하며 겪은 기억에 남는 경험을 말해주세요. 언제 어디로 가셨나 요? 그 장소는 어땠나요? 당신의 나라 지형과 그 나라의 지형은 어떻게 달랐나 요?","source":"pdf","topic":"지형","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.273 · M273_13","family":"abroad","cue":"작년 가을 오사카 → 민 → 시장·강 → 길 도움","lines":[{"en":"My most recent overseas trip was to Osaka in Japan last fall with Min.","ko":"최근 해외여행은 지난가을 민이와 일본 오사카에 간 거예요.","shared":true},{"en":"We stayed for three days in a small hotel near a train station.","ko":"기차역 근처 작은 호텔에서 사흘간 머물렀어요.","shared":true},{"en":"The city had busy shopping streets, bright signs, and quieter streets along the river.","ko":"도시에는 번화한 상점가와 밝은 간판, 강변의 조용한 길이 있었어요.","shared":true},{"en":"We visited a market, tried local noodles, and walked around after dinner.","ko":"시장에 가고 현지 국수를 먹고 저녁 후에는 산책했어요.","shared":true},{"en":"One shop owner patiently showed us the way when we couldn't find the right street.","ko":"길을 못 찾았을 때 한 가게 주인이 차분히 알려줬어요.","shared":true},{"en":"That kindness made the unfamiliar place feel much more welcoming.","ko":"그 친절 덕분에 낯선 곳이 훨씬 편안하게 느껴졌어요.","shared":true},{"en":"I especially liked how lively areas and peaceful corners were so close together.","ko":"활기찬 곳과 조용한 곳이 가까이 있다는 점이 특히 좋았어요.","shared":true},{"en":"I came home with the impression that exploring on foot was the best part of the trip.","ko":"걸어서 둘러보는 게 여행에서 가장 좋았다는 생각을 하며 돌아왔어요.","shared":true},{"en":"Japan and Korea both have mountains and coastal scenery, but Japan is a group of islands while Korea is on a peninsula.","ko":"일본과 한국 모두 산과 해안 풍경이 있지만 일본은 섬들로, 한국은 반도에 위치해 있어요.","shared":false},{"en":"Walking beside the river in Osaka made me notice how the city had grown around its waterways.","ko":"오사카 강변을 걸으며 도시가 수로를 중심으로 자랐다는 점에 눈길이 갔어요.","shared":false}],"note":"","sources":[{"id":"M273_13","label":"오픽만수르 IM2–IH · p.273 · M273_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","다른 나라를 방문하며 겪은 기억에 남는 경험을 말해주세요.","언제 어디로 가셨나 요?","그 장소는 어땠나요?","당신의 나라 지형과 그 나라의 지형은 어떻게 달랐나 요?"],"words":147,"representative":"M116_1","additional":2,"sharedCount":8,"related":["M116_1","M184_3","H2_08","H2_09","H2_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M274_11","page":274,"title":"","q":"I'd like to give you a situation and ask you to act it out. You got a phone call from a relative asking you to help prepare a large party. Call this relative and pose 3 or 4 questions to determine what you need to do for this party.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친척으로부터 큰 파티를 준비하기 위해 도움을 요청하는 전화를 받았습니 다. 이 친척에게 전화하고 파티를 위해 당신이 무엇을 해야 하는지 정하기 위한 3, 4가지 질문을 해보세요.","source":"pdf","topic":"모임","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.274 · M274_11","family":"rp-party","cue":"친척 파티 도움 → 시간·인원·역할·준비물","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I got your message about the party, and I would be happy to help with the preparation.","ko":"파티에 관한 메시지를 받았고 준비를 기꺼이 도와드리고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"What time should I arrive to help set everything up?","ko":"준비를 도우려면 몇 시에 도착해야 하나요?","shared":false},{"en":"How many guests are you expecting?","ko":"손님은 몇 명쯤 오시나요?","shared":false},{"en":"Would you like me to prepare food or decorate the room?","ko":"음식을 준비할까요, 방을 꾸밀까요?","shared":false},{"en":"What supplies should I buy before coming over?","ko":"가기 전에 어떤 준비물을 사야 하나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M274_11","label":"오픽만수르 IM2–IH · p.274 · M274_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 친척으로부터 큰 파티를 준비하기 위해 도움을 요청하는 전화를 받았습니 다.","이 친척에게 전화하고 파티를 위해 당신이 무엇을 해야 하는지 정하기 위한 3, 4가지 질문을 해보세요."],"words":80,"representative":"M274_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M275_12","page":275,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You discovered that you have to work on the day of the party. So you are not able to attend the party. Contact your relative and leave a message. Explain the situation and offer 2 or 3 alternatives to help prepare the party even though you will not be able to attend.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 파티 당일에 일을 해야 한다는 것을 알았습니다. 그래서 파티에 참석할 수 없습니다. 당신의 친척에게 연락하고 메시지를 남기세요. 상황을 설명하고 당 신이 참석할 수는 없지만 파티 준비를 돕기 위해 2, 3가지 대안을 제시해보세요.","source":"pdf","topic":"모임","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.275 · M275_12","family":"rp-party-work","cue":"역할상 근무 → 전날 준비·배달·도우미","lines":[{"en":"Hi, I am leaving a message about the party preparations.","ko":"안녕하세요. 파티 준비에 대해 메시지를 남겨요.","shared":false},{"en":"I have just found out that I have to work on the day of the party, so I won't be able to attend.","ko":"파티 당일에 일해야 한다는 걸 방금 알아서 참석할 수 없어요.","shared":false},{"en":"I am sorry because I promised to help, but I still want to contribute.","ko":"돕기로 약속했는데 죄송하고 그래도 보탬이 되고 싶어요.","shared":false},{"en":"I could come the evening before to decorate the room and prepare the tables.","ko":"전날 저녁에 와서 방을 꾸미고 상을 준비할 수 있어요.","shared":false},{"en":"Another option is for me to order the food and have it delivered before the guests arrive.","ko":"다른 방법은 제가 음식을 주문해서 손님 도착 전에 배달되게 하는 거예요.","shared":false},{"en":"I can also ask a relative to take over any tasks that must be done during the party.","ko":"파티 중 해야 할 일은 다른 친척에게 맡아줄 수 있는지 물어볼 수도 있어요.","shared":false},{"en":"Please call me back and let me know what would help most.","ko":"전화 주셔서 무엇이 가장 도움이 될지 알려주세요.","shared":false},{"en":"I will arrange everything I can in advance.","ko":"미리 준비할 수 있는 건 모두 준비할게요.","shared":false}],"note":"원문이 근무하는 역할을 지정합니다. 이 카드에서만 그 역할을 수행하며 실제 일 경험을 추가하지 않습니다.","sources":[{"id":"M275_12","label":"오픽만수르 IM2–IH · p.275 · M275_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 파티 당일에 일을 해야 한다는 것을 알았습니다.","그래서 파티에 참석할 수 없습니다.","당신의 친척에게 연락하고 메시지를 남기세요.","상황을 설명하고 당 신이 참석할 수는 없지만 파티 준비를 돕기 위해 2, 3가지 대안을 제시해보세요."],"words":116,"representative":"M275_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M276_13","page":276,"title":"","q":"That's the end of the situation. Tell me the time when you had a chance to help your family or friends. Reflect back to that time when you were able to help them. What was the problem, and what did you provide assistance with? What was the outcome of the situation? Give as many details as you can.","qko":"그것으로 상황은 끝입니다. 가족이나 친구를 도와줘야 했던 때를 말해주세요. 그들을 도울 수 있었던 때를 떠올려 보세요. 문제가 무엇이었고, 어떤 도움을 주셨나요? 그 상황의 결과는 어 떻게 되었나요? 가능한 많은 세부 내용을 알려주세요.","source":"pdf","topic":"모임","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.276 · M276_13","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true},{"en":"Min had little experience cooking pasta, so I measured the ingredients and helped him adjust the heat.","ko":"민이는 파스타 경험이 적어서 제가 재료를 재고 불 조절을 도왔어요.","shared":false},{"en":"By the end, we had made enough for both of us, and he felt ready to try it at home.","ko":"결국 둘이 먹을 만큼 만들었고 민이는 자기 집에서도 해볼 자신이 생겼어요.","shared":false}],"note":"","sources":[{"id":"M276_13","label":"오픽만수르 IM2–IH · p.276 · M276_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","가족이나 친구를 도와줘야 했던 때를 말해주세요.","그들을 도울 수 있었던 때를 떠올려 보세요.","문제가 무엇이었고, 어떤 도움을 주셨나요?","그 상황의 결과는 어 떻게 되었나요?","가능한 많은 세부 내용을 알려주세요."],"words":141,"representative":"M044_3","additional":2,"sharedCount":8,"related":["M044_3","M123_2","M125_3","H3_03","H3_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M277_11","page":277,"title":"","q":"I'd like to give you a situation and ask you to act it out. Now you want to buy two tickets to a concert. Call a theater and ask 3 or 4 questions about how to purchase the tickets.","qko":"상황을 드립니다. 연기를 해보세요. 지금 당신은 콘서트 티켓 2장을 사고 싶습니다. 공연장에 전화하고 티켓을 구매 하는 방법에 대해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"콘서트","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.277 · M277_11","family":"rp-concert","cue":"표 두 장 → 날짜·자리·총액·구매법","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I would like to buy two tickets for a pop concert, and I want to sit with my friend.","ko":"팝 콘서트 표 두 장을 사고 친구와 함께 앉고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Are two seats together available for Saturday's concert?","ko":"토요일 콘서트에 나란한 두 자리가 있나요?","shared":false},{"en":"Which available section has a clear view of the stage?","ko":"남은 구역 중 무대가 잘 보이는 곳은 어디인가요?","shared":false},{"en":"What is the total price for both tickets, including fees?","ko":"수수료 포함 두 장의 총가격은 얼마인가요?","shared":false},{"en":"How can I pay for and receive the tickets?","ko":"어떻게 결제하고 표를 받을 수 있나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M277_11","label":"오픽만수르 IM2–IH · p.277 · M277_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","지금 당신은 콘서트 티켓 2장을 사고 싶습니다.","공연장에 전화하고 티켓을 구매 하는 방법에 대해 3, 4가지 질문을 해보세요."],"words":84,"representative":"M277_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M278_12","page":278,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You bought the concert tickets and were supposed to go to that concert with your friend. But you are very sick at the last minute. Call your friend, explain the situation, and suggest 2 or 3 alternatives.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 콘서트 티켓을 구매했습니다. 그리고 친구와 그 콘서트에 가기로 했습니 다. 그러나 콘서트 시간이 다되어서 당신은 매우 아픕니다. 친구에게 전화하세요. 상황을 설명하고 2, 3가지 대안을 제시해 보세요.","source":"pdf","topic":"콘서트","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.278 · M278_12","family":"rp-sick-concert","cue":"갑자기 아픔 → 다른 날·다른 친구 → 확인","lines":[{"en":"Hi Min, I am sorry to change our plans so late, but I woke up with a fever.","ko":"민아, 이렇게 늦게 계획을 바꿔 미안한데 자고 일어나니 열이 나.","shared":true},{"en":"I am too unwell to attend the concert today, and I don't want to pass on my cold.","ko":"몸이 너무 안 좋아서 오늘 콘서트에 갈 수가 없고 감기도 옮기고 싶지 않아.","shared":false},{"en":"I was looking forward to it, so I am disappointed too.","ko":"기대하고 있었어서 나도 아쉬워.","shared":true},{"en":"One option is to move our plans to another date, once I have recovered.","ko":"한 가지는 내가 나은 뒤 다른 날로 계획을 옮기는 거야.","shared":true},{"en":"I can check whether any booking can be changed and handle that part.","ko":"예약을 바꿀 수 있는지 내가 확인해서 처리할게.","shared":true},{"en":"Alternatively, you could go with another friend today, and I can help transfer my place if that is allowed.","ko":"아니면 오늘 다른 친구와 가도 돼. 허용된다면 내 자리를 넘기는 걸 도울게.","shared":true},{"en":"Let me know which option works better for you.","ko":"어느 방법이 더 좋은지 알려줘.","shared":true},{"en":"I am really sorry for the trouble, and I appreciate your understanding.","ko":"불편하게 해서 정말 미안하고 이해해 줘서 고마워.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M278_12","label":"오픽만수르 IM2–IH · p.278 · M278_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만, 당신이 해결해야 할 문제가 있습니다.","당신은 콘서트 티켓을 구매했습니다.","그리고 친구와 그 콘서트에 가기로 했습니 다.","그러나 콘서트 시간이 다되어서 당신은 매우 아픕니다.","친구에게 전화하세요.","상황을 설명하고 2, 3가지 대안을 제시해 보세요."],"words":114,"representative":"M278_12","additional":0,"sharedCount":7,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M279_13","page":279,"title":"","q":"That's the end of the situation. Have you ever experienced something similar in that you bought concert tickets or made any other plans but had to cancel at the last minute because something came up? What was the problem, and how did you solve the problem? Tell me what happened in detail.","qko":"그것으로 상황은 끝입니다. 콘서트 티켓을 사거나 다른 약속을 잡았는데, 어떠한 일이 발생하여 약속 시간이 다되었을 때 취소해야 했던 비슷한 경험을 한 적이 있나요? 문제가 무엇이었고 그 문제를 어떻게 해결하셨나요? 무슨 일이 있었는지 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.279 · M279_13","family":"cancel","cue":"지난달 민과 점심 → 감기 → 전화 → 다음 주","lines":[{"en":"Last month, I had to cancel a lunch appointment with Min at the last minute.","ko":"지난달 민이와의 점심 약속을 직전에 취소해야 했어요.","shared":true},{"en":"We had planned to meet at a cafe near my apartment on Saturday.","ko":"토요일에 집 근처 카페에서 만나기로 했어요.","shared":true},{"en":"That morning, I woke up with a fever and a sore throat.","ko":"그날 아침 열이 나고 목이 아팠어요.","shared":true},{"en":"I didn't want to make him wait or risk passing on my cold.","ko":"친구를 기다리게 하거나 감기를 옮기고 싶지 않았어요.","shared":true},{"en":"I called him immediately, explained what had happened, and apologized.","ko":"바로 전화해서 상황을 설명하고 사과했어요.","shared":true},{"en":"I suggested meeting the following Saturday or having a short video call instead.","ko":"다음 토요일에 만나거나 대신 짧게 영상 통화를 하자고 했어요.","shared":true},{"en":"He understood, and we moved the lunch to the next week.","ko":"친구가 이해해 줘서 점심 약속을 다음 주로 옮겼어요.","shared":true},{"en":"I was disappointed, but letting him know early made the situation much easier.","ko":"아쉬웠지만 일찍 알려서 상황이 훨씬 수월해졌어요.","shared":true}],"note":"","sources":[{"id":"M279_13","label":"오픽만수르 IM2–IH · p.279 · M279_13"}],"correction":"","scope":"설문 중심","requirements":["그것으로 상황은 끝입니다.","콘서트 티켓을 사거나 다른 약속을 잡았는데, 어떠한 일이 발생하여 약속 시간이 다되었을 때 취소해야 했던 비슷한 경험을 한 적이 있나요?","문제가 무엇이었고 그 문제를 어떻게 해결하셨나요?","무슨 일이 있었는지 자세히 말해주세요."],"words":100,"representative":"M136_3","additional":0,"sharedCount":8,"related":["M136_3","M255_13","M267_13","H1_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M280_11","page":280,"title":"","q":"I'd like to give you a situation and ask you to act it out. You want to watch a movie with your friend. Call a theater and ask 3 or 4 questions to get the information you need to purchase tickets.","qko":"상황을 드립니다. 연기를 해보세요. 당신은 친구와 영화를 보고 싶습니다. 영화관에 전화하고 티켓을 구매하는데 필 요한 정보를 얻기 위해 3, 4가지 질문을 해보세요.","source":"pdf","topic":"영화","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.280 · M280_11","family":"rp-movie-tickets","cue":"영화 두 명 → 시간·좌석·가격·수령","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I would like to watch a comedy with my friend this Saturday and buy two tickets.","ko":"이번 토요일 친구와 코미디를 보고 표 두 장을 사고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"What time is the afternoon screening?","ko":"오후 상영은 몇 시인가요?","shared":false},{"en":"Are two seats together available near the middle?","ko":"가운데 근처에 나란한 두 자리가 있나요?","shared":false},{"en":"How much do the two tickets cost altogether?","ko":"표 두 장의 총가격은 얼마인가요?","shared":false},{"en":"Can I pay now and collect the tickets at the theater?","ko":"지금 결제하고 영화관에서 표를 받을 수 있나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M280_11","label":"오픽만수르 IM2–IH · p.280 · M280_11"}],"correction":"","scope":"역할극","requirements":["상황을 드립니다.","연기를 해보세요.","당신은 친구와 영화를 보고 싶습니다.","영화관에 전화하고 티켓을 구매하는데 필 요한 정보를 얻기 위해 3, 4가지 질문을 해보세요."],"words":77,"representative":"M280_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M281_12","page":281,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You just arrived at the theater and found out that they have sold the wrong tickets to you. Go to the ticket seller at the booth. And explain this situation. And provide 2 or 3 alternatives to solve the problem.","qko":"죄송하지만 당신이 해결해야 할 문제가 있습니다. 당신은 방금 극장에 도착했고, 영화관에서 당신에게 잘못된 티켓을 팔았다는 것 을 알았습니다. 티켓 판매원에게 가세요. 그리고 상황을 설명하고 문제를 해결하 기 위한 2, 3가지 대안을 제시하세요.","source":"pdf","topic":"영화","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.281 · M281_12","family":"rp-tickets","cue":"잘못 발권 → 예약 확인 → 교환·다른 회차·환불","lines":[{"en":"Excuse me, I think there has been a mistake with our movie tickets.","ko":"실례합니다. 영화 표에 오류가 있는 것 같아요.","shared":false},{"en":"We booked two seats for the comedy at three, but these tickets are for a different film.","ko":"3시 코미디 두 자리를 예약했는데 이 표는 다른 영화예요.","shared":false},{"en":"Here is the confirmation on my phone showing the film and time we selected.","ko":"선택한 영화와 시간이 나온 휴대폰 예약 확인서가 여기 있어요.","shared":false},{"en":"Could you exchange these for the correct screening if two seats are still available?","ko":"두 자리가 남아 있다면 맞는 회차로 바꿔주실 수 있나요?","shared":false},{"en":"If that screening is full, we could watch the same film at a later time today.","ko":"그 회차가 다 찼다면 오늘 더 늦은 시간에 같은 영화를 볼 수 있어요.","shared":false},{"en":"If neither is possible, we would like a refund so we can book another day.","ko":"둘 다 불가능하면 다른 날 예매하도록 환불받고 싶어요.","shared":false},{"en":"We haven't used these tickets, so please check the booking for us.","ko":"이 표는 아직 사용하지 않았으니 예약을 확인해 주세요.","shared":false},{"en":"Thank you for your help.","ko":"도와주셔서 감사합니다.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M281_12","label":"오픽만수르 IM2–IH · p.281 · M281_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만 당신이 해결해야 할 문제가 있습니다.","당신은 방금 극장에 도착했고, 영화관에서 당신에게 잘못된 티켓을 팔았다는 것 을 알았습니다.","티켓 판매원에게 가세요.","그리고 상황을 설명하고 문제를 해결하 기 위한 2, 3가지 대안을 제시하세요."],"words":106,"representative":"M281_12","additional":0,"sharedCount":1,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"M282_13","page":282,"title":"","q":"That's the end of the situation. Have you ever been in a situation where you had a problem with reservations or bought some tickets, and something went wrong? What was the problem, and when did it occur? How did you solve this problem?","qko":"그것으로 상황은 끝입니다. 티켓을 사거나 예약을 하거나 어떠한 문제가 생겼던 적이 있으신가요? 문제가 무 엇이었고 언제 그것이 발생 했었나요? 그 문제를 어떻게 해결하셨나요?","source":"pdf","topic":"영화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.282 · M282_13","family":"ticket-memory","cue":"지난봄 → 영화표 날짜 오류 → 직원 → 교환","lines":[{"en":"Last spring, I had a problem with movie tickets I had booked for Min and me.","ko":"지난봄 민이와 보려고 예약한 영화 표에 문제가 있었어요.","shared":false},{"en":"At the theater, I realized I had selected the following day by mistake.","ko":"영화관에서 제가 실수로 다음 날을 선택한 걸 알았어요.","shared":false},{"en":"I felt embarrassed because Min had already traveled there to meet me.","ko":"민이가 이미 만나러 와 있어서 민망했어요.","shared":false},{"en":"I showed the confirmation to an employee and explained that the mistake was mine.","ko":"직원에게 확인서를 보여주고 제 실수라고 설명했어요.","shared":false},{"en":"She checked the booking conditions and found two seats for a later screening that day.","ko":"직원이 예약 조건을 확인하고 당일 더 늦은 회차의 두 자리를 찾아줬어요.","shared":false},{"en":"We changed the tickets and waited at a cafe nearby.","ko":"표를 바꾸고 근처 카페에서 기다렸어요.","shared":false},{"en":"We still got to watch the film, and Min was kind about the delay.","ko":"결국 영화를 봤고 민이는 지연을 이해해 줬어요.","shared":false},{"en":"Now I check the date twice before paying for any tickets.","ko":"이제는 표를 결제하기 전에 날짜를 두 번 확인해요.","shared":false}],"note":"","sources":[{"id":"M282_13","label":"오픽만수르 IM2–IH · p.282 · M282_13"}],"correction":"","scope":"돌발·확장","requirements":["그것으로 상황은 끝입니다.","티켓을 사거나 예약을 하거나 어떠한 문제가 생겼던 적이 있으신가요?","문제가 무 엇이었고 언제 그것이 발생 했었나요?","그 문제를 어떻게 해결하셨나요?"],"words":105,"representative":"M282_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M292_14","page":292,"title":"","q":"Please pick two of different your friends or family members. What are the differences and similarities between them? Describe each of them in detail.","qko":"친구 또는 가족 구성원 2명을 선택해 주세요. 그들 사이의 차이점과 비슷한 점은 무엇인가요? 그들 각각을 자세히 묘사해 주세요.","source":"pdf","topic":"가족·친구","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.292 · M292_14","family":"people-compare","cue":"민 계획형·지수 즉흥형 → 친절 공통 → 여행","lines":[{"en":"I will compare my friends Min and Jisoo, who are both kind but have different personalities.","ko":"둘 다 친절하지만 성격이 다른 친구 민이와 지수를 비교할게요.","shared":false},{"en":"Min is quiet and organized, and he likes deciding things in advance.","ko":"민이는 조용하고 체계적이며 미리 결정하는 걸 좋아해요.","shared":false},{"en":"Before a trip, he checks the route and saves the tickets carefully.","ko":"여행 전에 경로를 확인하고 표를 잘 저장해 둬요.","shared":false},{"en":"Jisoo is more outgoing and likes trying things without a detailed plan.","ko":"지수는 더 외향적이고 자세한 계획 없이 시도하는 걸 좋아해요.","shared":false},{"en":"She might notice a small restaurant and suggest going in immediately.","ko":"작은 식당을 보고 바로 들어가자고 할 수도 있어요.","shared":false},{"en":"Both are good listeners, and neither makes me feel bad when I change my mind.","ko":"둘 다 말을 잘 들어주고 제가 마음을 바꿔도 불편하게 하지 않아요.","shared":false},{"en":"I like traveling with Min when timing matters, and with Jisoo when I want a surprise.","ko":"시간이 중요할 때는 민이와, 뜻밖의 경험을 원할 때는 지수와 여행하는 게 좋아요.","shared":false},{"en":"Their differences make our time together more balanced rather than difficult.","ko":"그 차이는 함께하는 시간을 어렵게 하기보다 균형 있게 해줘요.","shared":false}],"note":"","sources":[{"id":"M292_14","label":"오픽만수르 IM2–IH · p.292 · M292_14"}],"correction":"two of different your friends → two of your friends","scope":"돌발·확장","requirements":["친구 또는 가족 구성원 2명을 선택해 주세요.","그들 사이의 차이점과 비슷한 점은 무엇인가요?","그들 각각을 자세히 묘사해 주세요."],"words":105,"representative":"M292_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M293_15","page":293,"title":"","q":"When you are with your friends or family members, what do you typically talk about with them? What topic do you talk about most often? How was the last conversation you had with them? Tell me about the normal conversation in detail.","qko":"언제 친구 또는 가족과 함께 있나요? 일반적으로 그들과 무엇에 대해 이야기하나 요? 어떤 주제를 가장 자주 이야기하시나요? 그들과 가장 마지막에 가졌던 대화 는 어땠나요? 일반적으로 하는 대화에 대해 자세히 말해주세요.","source":"pdf","topic":"가족·친구","type":"습관·활동 + 최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.293 · M293_15","family":"phone-talk","cue":"부모님·민 → 저녁 집 → 건강·주말 계획","lines":[{"en":"I talk on the phone with my parents and my friend Min most often.","ko":"주로 부모님과 친구 민이와 통화해요.","shared":true},{"en":"I usually call my parents from home in the evening, about twice a week.","ko":"보통 일주일에 두 번 정도 저녁에 집에서 부모님께 전화해요.","shared":true},{"en":"We talk about what we ate, how we feel, and whether we need anything.","ko":"뭘 먹었는지, 몸은 어떤지, 필요한 건 없는지 이야기해요.","shared":true},{"en":"With Min, I usually discuss plans for the weekend or a place we want to visit.","ko":"민이와는 주말 계획이나 가고 싶은 곳을 주로 이야기해요.","shared":true},{"en":"Our calls normally last ten or fifteen minutes.","ko":"통화는 보통 10~15분 정도 해요.","shared":true},{"en":"I prefer calling when a plan is complicated because we can decide more quickly.","ko":"계획이 복잡할 때는 빨리 결정할 수 있어서 전화가 좋아요.","shared":true},{"en":"For simple details like an address, I send a message afterward.","ko":"주소 같은 간단한 정보는 나중에 메시지로 보내요.","shared":true},{"en":"Hearing a familiar voice also makes living alone feel less lonely.","ko":"익숙한 목소리를 들으면 혼자 살아도 덜 외로워요.","shared":true},{"en":"Our most common topic is planning something simple to do together.","ko":"가장 자주 이야기하는 주제는 함께 할 간단한 활동을 계획하는 거예요.","shared":false},{"en":"In our last conversation, Min and I checked the weather and agreed to meet at the park on Sunday.","ko":"최근 대화에서는 민이와 날씨를 확인하고 일요일 공원에서 만나기로 했어요.","shared":false}],"note":"","sources":[{"id":"M293_15","label":"오픽만수르 IM2–IH · p.293 · M293_15"}],"correction":"","scope":"돌발·확장","requirements":["언제 친구 또는 가족과 함께 있나요?","일반적으로 그들과 무엇에 대해 이야기하나 요?","어떤 주제를 가장 자주 이야기하시나요?","그들과 가장 마지막에 가졌던 대화 는 어땠나요?","일반적으로 하는 대화에 대해 자세히 말해주세요."],"words":132,"representative":"M138_1","additional":2,"sharedCount":8,"related":["M138_1","M140_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M294_14","page":294,"title":"","q":"How was the way people in your country maintained their health when you were young, and how is it now? Tell me how people keep their health has changed over the years.","qko":"당신이 어릴 때 당신의 나라 사람들의 건강을 유지하는 방법은 어땠나요? 그리고 지금은 어떤가요? 시간이 지나며 사람들이 건강을 유지하는 방법이 어떻게 변했 는지 말해주세요.","source":"pdf","topic":"건강","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.294 · M294_14","family":"health-change","cue":"예전 생활활동·가족 조언 → 앱·기록 → 기본은 같음","lines":[{"en":"When I was a child, the adults around me mainly talked about eating well and staying active.","ko":"어릴 때 주변 어른들은 주로 잘 먹고 활발히 움직이는 것을 이야기했어요.","shared":false},{"en":"They walked to local places, did physical chores, and asked family members for advice.","ko":"동네를 걸어 다니고 몸을 쓰는 집안일을 하며 가족에게 조언을 구했어요.","shared":false},{"en":"Now I notice more people using apps or watches to track steps and sleep.","ko":"지금은 앱이나 시계로 걸음 수와 수면을 기록하는 사람이 더 눈에 띄어요.","shared":false},{"en":"Some also choose specific exercise classes and look up health information online.","ko":"특정 운동 수업을 고르거나 건강 정보를 온라인에서 찾기도 해요.","shared":false},{"en":"That can make habits easier to follow because progress is visible.","ko":"변화가 보여서 습관을 유지하기 쉬워질 수 있어요.","shared":false},{"en":"However, too much information can also be confusing, especially when advice conflicts.","ko":"하지만 조언이 충돌하면 정보가 너무 많아 혼란스러울 수도 있어요.","shared":false},{"en":"I think the tools have changed more than the basic need for balanced meals, movement, and rest.","ko":"균형 잡힌 식사, 움직임, 휴식이라는 기본 필요보다 도구가 더 바뀐 것 같아요.","shared":false}],"note":"","sources":[{"id":"M294_14","label":"오픽만수르 IM2–IH · p.294 · M294_14"}],"correction":"","scope":"돌발·확장","requirements":["당신이 어릴 때 당신의 나라 사람들의 건강을 유지하는 방법은 어땠나요?","그리고 지금은 어떤가요?","시간이 지나며 사람들이 건강을 유지하는 방법이 어떻게 변했 는지 말해주세요."],"words":97,"representative":"M294_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M295_15","page":295,"title":"","q":"Tell me about recent news you read or watched related to health issues. What was the news about? Do people talk about that news often? What do people think about this issue? Describe the news in detail.","qko":"당신이 최근에 읽거나 본 건강 문제에 관련한 뉴스에 대해 말해주세요. 그 뉴스 는 무엇에 관한 것이었나요? 사람들은 그 뉴스에 대해 자주 이야기하나요? 사람 들은 그 문제에 대해 어떻게 생각하나요? 그 뉴스를 자세히 설명해 주세요.","source":"pdf","topic":"건강","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.295 · M295_15","family":"health-news","cue":"수면 기사 → 폰·늦은 잠 → 친구 공감 → 습관","lines":[{"en":"I recently read a health article about people not getting enough sleep.","ko":"최근 사람들이 잠을 충분히 못 잔다는 건강 기사를 읽었어요.","shared":false},{"en":"It described how late-night phone use can push bedtime back even when people feel tired.","ko":"피곤해도 늦은 밤 폰 사용으로 취침 시간이 미뤄질 수 있다고 설명했어요.","shared":false},{"en":"One example was someone planning to watch one short video but staying awake for another hour.","ko":"짧은 영상 하나만 보려다가 한 시간 더 깨어 있는 사람의 예가 있었어요.","shared":false},{"en":"My friends talk about this fairly often because they recognize the same habit in themselves.","ko":"친구들도 자기 습관과 비슷해서 이 문제를 꽤 자주 이야기해요.","shared":false},{"en":"Most agree that it is difficult to stop scrolling when new videos keep appearing.","ko":"새 영상이 계속 나오면 넘겨보는 걸 멈추기 어렵다는 데 대체로 동의해요.","shared":false},{"en":"I thought the article was useful because it focused on everyday behavior rather than blaming people.","ko":"사람을 탓하기보다 일상 행동에 초점을 맞춰 유용하다고 생각했어요.","shared":false},{"en":"For my own routine, I now try to put the phone away before bed and choose music instead.","ko":"저는 잠들기 전에 폰을 내려놓고 대신 음악을 들으려고 해요.","shared":false}],"note":"특정 실제 보도를 인용한 것이 아닌 연습용 기사 설정. 실제 기사 경험을 쓰려면 확인한 기사로 교체하세요.","sources":[{"id":"M295_15","label":"오픽만수르 IM2–IH · p.295 · M295_15"}],"correction":"","scope":"돌발·확장","requirements":["당신이 최근에 읽거나 본 건강 문제에 관련한 뉴스에 대해 말해주세요.","그 뉴스 는 무엇에 관한 것이었나요?","사람들은 그 뉴스에 대해 자주 이야기하나요?","사람 들은 그 문제에 대해 어떻게 생각하나요?","그 뉴스를 자세히 설명해 주세요."],"words":106,"representative":"M295_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M296_14","page":296,"title":"","q":"Please pick two popular parks you know. And compare those two different parks. What are the differences and similarities between them? Which Park do you like better? Tell me how they are different.","qko":"당신이 아는 유명한 공원 2 곳을 선택해 주세요. 그리고 그 두개의 서로 다른 공 원을 비교해 주세요. 그 공원들 사이의 차이점과 비슷한 점은 무엇인가요? 어느 공원을 더 좋아하시나요? 그 공원들이 어떻게 다른 지 말해주세요.","source":"pdf","topic":"공원","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.296 · M296_14","family":"park-compare","cue":"동네공원·한강공원 → 크기·활동·공통 휴식 → 동네 선호","lines":[{"en":"I will compare my neighborhood park with a riverside park along the Han River.","ko":"동네 공원과 한강변 공원을 비교할게요.","shared":false},{"en":"Both have walking paths and places where people can sit outside and relax.","ko":"둘 다 산책로와 밖에 앉아 쉴 공간이 있어요.","shared":false},{"en":"My neighborhood park is small, with a playground and benches around one lawn.","ko":"동네 공원은 작고 잔디밭 하나 주변에 놀이터와 벤치가 있어요.","shared":false},{"en":"The riverside park feels much more open, with long paths and wide views of the water.","ko":"강변 공원은 긴 길과 넓은 물 풍경으로 훨씬 탁 트인 느낌이에요.","shared":false},{"en":"People often go there for a longer outing, while the local park suits a quick break.","ko":"강변에는 오래 나들이 가는 사람이 많고 동네 공원은 짧은 휴식에 맞아요.","shared":false},{"en":"The river view is beautiful, but it takes me longer to get there.","ko":"강 풍경은 아름답지만 가는 데 더 오래 걸려요.","shared":false},{"en":"For everyday use, I prefer my neighborhood park because I can reach it in ten minutes.","ko":"일상적으로는 10분이면 갈 수 있는 동네 공원이 더 좋아요.","shared":false},{"en":"I save the riverside park for a day when I have more time.","ko":"강변 공원은 시간이 더 있는 날 가요.","shared":false},{"en":"The local park is popular with nearby residents, while the riverside park attracts visitors from a wider area.","ko":"동네 공원은 인근 주민들에게 인기 있고 강변 공원에는 더 넓은 지역에서 방문객이 와요.","shared":false}],"note":"","sources":[{"id":"M296_14","label":"오픽만수르 IM2–IH · p.296 · M296_14"}],"correction":"","scope":"설문 중심","requirements":["당신이 아는 유명한 공원 2 곳을 선택해 주세요.","그리고 그 두개의 서로 다른 공 원을 비교해 주세요.","그 공원들 사이의 차이점과 비슷한 점은 무엇인가요?","어느 공원을 더 좋아하시나요?","그 공원들이 어떻게 다른 지 말해주세요."],"words":132,"representative":"M296_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M297_15","page":297,"title":"","q":"I'd like to know about some issues parks face these days. What are the challenges that parks face? What caused these concerns? How can the problems be solved, and what do people need to do?","qko":"요즘 공원들이 마주하고 있는 문제들에 대해 알고 싶습니다. 공원들이 마주하고 있는 어려움은 무엇인가요? 무엇이 이런 우려를 발생시키나요? 어떻게 그 문제들 이 해결될 수 있고 사람들이 해야 할 것은 무엇인가요?","source":"pdf","topic":"공원","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.297 · M297_15","family":"park-issue","cue":"피크닉 쓰레기 → 넘치는 통 → 표지·수거·가져가기","lines":[{"en":"One problem I notice in busy parks is litter after weekends or special events.","ko":"붐비는 공원에서 주말이나 행사 후 쓰레기 문제를 봐요.","shared":false},{"en":"People bring food and drinks, but bins can fill up before the end of the day.","ko":"사람들이 음식과 음료를 가져오지만 하루가 끝나기 전에 쓰레기통이 찰 수 있어요.","shared":false},{"en":"Some leave bags beside the bins, and wind spreads the rubbish across the grass.","ko":"일부는 통 옆에 봉투를 놓고 바람이 쓰레기를 잔디에 퍼뜨려요.","shared":false},{"en":"This makes the park unpleasant and creates extra work for cleaners.","ko":"공원이 불쾌해지고 청소하는 분들의 일도 늘어요.","shared":false},{"en":"Park managers could add clear signs and increase collection during busy periods.","ko":"관리자는 명확한 안내를 설치하고 붐빌 때 수거를 늘릴 수 있어요.","shared":false},{"en":"Visitors should bring less disposable packaging and take rubbish home if the bins are full.","ko":"방문객은 일회용 포장을 줄이고 통이 찼으면 쓰레기를 가져가야 해요.","shared":false},{"en":"I don't think one new bin solves everything; both planning and considerate behavior are needed.","ko":"통 하나를 추가한다고 모두 해결되진 않고 계획과 배려가 모두 필요하다고 생각해요.","shared":false}],"note":"","sources":[{"id":"M297_15","label":"오픽만수르 IM2–IH · p.297 · M297_15"}],"correction":"","scope":"설문 중심","requirements":["요즘 공원들이 마주하고 있는 문제들에 대해 알고 싶습니다.","공원들이 마주하고 있는 어려움은 무엇인가요?","무엇이 이런 우려를 발생시키나요?","어떻게 그 문제들 이 해결될 수 있고 사람들이 해야 할 것은 무엇인가요?"],"words":97,"representative":"M297_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M298_14","page":298,"title":"","q":"You indicated in the survey that you like to take vacations domestically. How was traveling domestically different when you were young compared to these days. Is it easier or more difficult now than in the past? Tell me how traveling has changed.","qko":"당신은 설문조사에서 국내 여행을 좋아한다고 했습니다. 당신이 어렸을 때의 국 내여행은 요즘의 여행과 비교해서 어떻게 다른가요? 과거보다 지금이 더 쉬운가 요 아니면 어려운가요? 여행이 어떻게 변화했는지 말해주세요.","source":"pdf","topic":"국내여행","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.298 · M298_14","family":"travel-change","cue":"예전 전화·지도 → 앱·예약·번역 → 정보과다","lines":[{"en":"Travel is easier for me now mainly because information is easier to find.","ko":"지금 여행이 더 쉬운 건 주로 정보를 찾기 쉬워졌기 때문이에요.","shared":true},{"en":"When I was young, my parents called hotels and relied on printed maps or travel agents.","ko":"어릴 때 부모님은 호텔에 전화하고 종이 지도나 여행사에 의존하셨어요.","shared":true},{"en":"They had to settle many details before leaving home.","ko":"집을 나서기 전에 많은 내용을 정해야 했어요.","shared":true},{"en":"Now I can compare rooms, book tickets, and check routes on my phone.","ko":"이제 폰으로 객실을 비교하고 표를 예약하고 경로를 확인해요.","shared":true},{"en":"For overseas travel, translation tools also make it easier to ask simple questions.","ko":"해외여행에서는 번역 도구로 간단한 질문을 하기도 쉬워졌어요.","shared":true},{"en":"If a plan changes, I can look for another route or contact the hotel immediately.","ko":"계획이 바뀌면 다른 경로를 찾거나 호텔에 바로 연락할 수 있어요.","shared":true},{"en":"The downside is that too many reviews can make choosing stressful.","ko":"단점은 후기가 너무 많으면 선택이 부담스러울 수 있다는 거예요.","shared":true},{"en":"Overall, I find travel more manageable now, as long as I don't try to research every tiny detail.","ko":"모든 작은 내용까지 조사하려 하지 않으면 전반적으로 지금 여행이 더 수월해요.","shared":true}],"note":"","sources":[{"id":"M298_14","label":"오픽만수르 IM2–IH · p.298 · M298_14"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 국내 여행을 좋아한다고 했습니다.","당신이 어렸을 때의 국 내여행은 요즘의 여행과 비교해서 어떻게 다른가요?","과거보다 지금이 더 쉬운가 요 아니면 어려운가요?","여행이 어떻게 변화했는지 말해주세요."],"words":108,"representative":"M298_14","additional":0,"sharedCount":8,"related":["M300_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M299_15","page":299,"title":"","q":"What are some issues concerning people traveling these days? What things are people most interested in? What things cause these concerns? Tell me what people discuss as the main concern of traveling","qko":"요즘 여행하는 사람들에게 어떤 문제가 있나요? 사람들이 가장 관심을 가지는 것 은 무엇인가요? 무엇이 이런 우려를 발생시키나요? 사람들이 여행의 주요 관심사 로 이야기하는 것을 말해주세요.","source":"pdf","topic":"국내여행","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.299 · M299_15","family":"travel-concern","cue":"가격·예약 → 성수기 → 예산·조건·대안","lines":[{"en":"The travel concerns I hear most are cost and whether a booking is reliable.","ko":"제가 가장 자주 듣는 여행 걱정은 비용과 예약을 믿을 수 있는지예요.","shared":true},{"en":"During popular holiday periods, rooms and transport can cost more than people expected.","ko":"인기 휴가철에는 숙박과 교통비가 예상보다 비쌀 수 있어요.","shared":true},{"en":"People also worry that a room will look different from its photos or that extra fees will appear later.","ko":"객실이 사진과 다르거나 추가 비용이 나올까 걱정하기도 해요.","shared":true},{"en":"When planning an overseas trip, these concerns feel bigger because fixing a problem may involve another language.","ko":"해외여행은 다른 언어로 문제를 해결해야 할 수 있어 걱정이 커져요.","shared":true},{"en":"My friends mainly discuss how to stay within a budget without choosing an unsafe or inconvenient place.","ko":"친구들은 불안하거나 불편한 곳을 피하면서 예산을 지키는 방법을 주로 이야기해요.","shared":true},{"en":"Clear total prices, recent reviews, and written cancellation conditions can help.","ko":"명확한 총가격, 최근 후기, 서면 취소 조건이 도움이 될 수 있어요.","shared":true},{"en":"For future trips, I think providers should make those details easier to compare before payment.","ko":"앞으로 업체들이 결제 전에 그 내용을 쉽게 비교하도록 해야 한다고 생각해요.","shared":true},{"en":"I also keep a little spare money and a backup plan instead of spending my full budget at once.","ko":"저도 예산을 전부 쓰지 않고 여유 자금과 대안을 남겨둬요.","shared":true}],"note":"","sources":[{"id":"M299_15","label":"오픽만수르 IM2–IH · p.299 · M299_15"}],"correction":"","scope":"설문 중심","requirements":["요즘 여행하는 사람들에게 어떤 문제가 있나요?","사람들이 가장 관심을 가지는 것 은 무엇인가요?","무엇이 이런 우려를 발생시키나요?","사람들이 여행의 주요 관심사 로 이야기하는 것을 말해주세요."],"words":125,"representative":"M299_15","additional":0,"sharedCount":8,"related":["M301_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M300_14","page":300,"title":"","q":"You indicated in the survey that you like to take vacations internationally. How has traveling overseas changed over the years? Do you think it has become easier than before, or has it got more difficult? Why do you think that? Describe what traveling to other countries was like in the past and now.","qko":"당신은 설문조사에서 해외 여행을 좋아한다고 했습니다. 시간이 지나며 해외 여 행은 어떻게 변화했나요? 더 쉬워진 것 같나요 아니면 더 어려워진 것 같나요? 왜 그렇게 생각하시나요? 다른 나라를 여행하는 것은 과거에는 어땠고 현재는 어 떤 지 설명해 주세요.","source":"pdf","topic":"해외여행","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.300 · M300_14","family":"travel-change","cue":"예전 전화·지도 → 앱·예약·번역 → 정보과다","lines":[{"en":"Travel is easier for me now mainly because information is easier to find.","ko":"지금 여행이 더 쉬운 건 주로 정보를 찾기 쉬워졌기 때문이에요.","shared":true},{"en":"When I was young, my parents called hotels and relied on printed maps or travel agents.","ko":"어릴 때 부모님은 호텔에 전화하고 종이 지도나 여행사에 의존하셨어요.","shared":true},{"en":"They had to settle many details before leaving home.","ko":"집을 나서기 전에 많은 내용을 정해야 했어요.","shared":true},{"en":"Now I can compare rooms, book tickets, and check routes on my phone.","ko":"이제 폰으로 객실을 비교하고 표를 예약하고 경로를 확인해요.","shared":true},{"en":"For overseas travel, translation tools also make it easier to ask simple questions.","ko":"해외여행에서는 번역 도구로 간단한 질문을 하기도 쉬워졌어요.","shared":true},{"en":"If a plan changes, I can look for another route or contact the hotel immediately.","ko":"계획이 바뀌면 다른 경로를 찾거나 호텔에 바로 연락할 수 있어요.","shared":true},{"en":"The downside is that too many reviews can make choosing stressful.","ko":"단점은 후기가 너무 많으면 선택이 부담스러울 수 있다는 거예요.","shared":true},{"en":"Overall, I find travel more manageable now, as long as I don't try to research every tiny detail.","ko":"모든 작은 내용까지 조사하려 하지 않으면 전반적으로 지금 여행이 더 수월해요.","shared":true}],"note":"","sources":[{"id":"M300_14","label":"오픽만수르 IM2–IH · p.300 · M300_14"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 해외 여행을 좋아한다고 했습니다.","시간이 지나며 해외 여 행은 어떻게 변화했나요?","더 쉬워진 것 같나요 아니면 더 어려워진 것 같나요?","왜 그렇게 생각하시나요?","다른 나라를 여행하는 것은 과거에는 어땠고 현재는 어 떤 지 설명해 주세요."],"words":108,"representative":"M298_14","additional":0,"sharedCount":8,"related":["M298_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M301_15","page":301,"title":"","q":"When people prepare to travel abroad, what things are they concerned about? It might be a hotel reservation, tourist attractions, or the travel schedule. What is it? How are those concerns being addressed for the future?","qko":"사람들이 해외 여행을 준비할 때, 무엇을 걱정하나요? 그것은 호텔 예약, 관광지, 또는 여행 일정일 수 있겠는데요. 그것이 무엇인가요? 미래를 위해 그 우려를 어 떻게 해결하고 있나요?","source":"pdf","topic":"해외여행","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.301 · M301_15","family":"travel-concern","cue":"가격·예약 → 성수기 → 예산·조건·대안","lines":[{"en":"The travel concerns I hear most are cost and whether a booking is reliable.","ko":"제가 가장 자주 듣는 여행 걱정은 비용과 예약을 믿을 수 있는지예요.","shared":true},{"en":"During popular holiday periods, rooms and transport can cost more than people expected.","ko":"인기 휴가철에는 숙박과 교통비가 예상보다 비쌀 수 있어요.","shared":true},{"en":"People also worry that a room will look different from its photos or that extra fees will appear later.","ko":"객실이 사진과 다르거나 추가 비용이 나올까 걱정하기도 해요.","shared":true},{"en":"When planning an overseas trip, these concerns feel bigger because fixing a problem may involve another language.","ko":"해외여행은 다른 언어로 문제를 해결해야 할 수 있어 걱정이 커져요.","shared":true},{"en":"My friends mainly discuss how to stay within a budget without choosing an unsafe or inconvenient place.","ko":"친구들은 불안하거나 불편한 곳을 피하면서 예산을 지키는 방법을 주로 이야기해요.","shared":true},{"en":"Clear total prices, recent reviews, and written cancellation conditions can help.","ko":"명확한 총가격, 최근 후기, 서면 취소 조건이 도움이 될 수 있어요.","shared":true},{"en":"For future trips, I think providers should make those details easier to compare before payment.","ko":"앞으로 업체들이 결제 전에 그 내용을 쉽게 비교하도록 해야 한다고 생각해요.","shared":true},{"en":"I also keep a little spare money and a backup plan instead of spending my full budget at once.","ko":"저도 예산을 전부 쓰지 않고 여유 자금과 대안을 남겨둬요.","shared":true}],"note":"","sources":[{"id":"M301_15","label":"오픽만수르 IM2–IH · p.301 · M301_15"}],"correction":"","scope":"설문 중심","requirements":["사람들이 해외 여행을 준비할 때, 무엇을 걱정하나요?","그것은 호텔 예약, 관광지, 또는 여행 일정일 수 있겠는데요.","그것이 무엇인가요?","미래를 위해 그 우려를 어 떻게 해결
