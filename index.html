"lines":[{"en":"When I first moved in last year, my bedroom had a bed but almost no other furniture.","ko":"작년에 처음 이사 왔을 때 침실에는 침대 외에 가구가 거의 없었어요.","shared":true},{"en":"I used to put my books on the floor, so the room always looked messy.","ko":"책을 바닥에 놓곤 해서 방이 늘 어수선해 보였어요.","shared":true},{"en":"Two months ago, I bought a small wooden desk from an online furniture store.","ko":"두 달 전에 온라인 가구점에서 작은 나무 책상을 샀어요.","shared":true},{"en":"I measured the space beside the window before choosing it.","ko":"고르기 전에 창문 옆 공간을 재 봤어요.","shared":true},{"en":"The desk has two drawers, so I can keep my books and cables out of sight.","ko":"서랍 두 개가 있어서 책과 케이블을 깔끔하게 넣어둘 수 있어요.","shared":true},{"en":"I put a warm lamp on top and moved the desk against the wall.","ko":"위에는 따뜻한 빛의 조명을 놓고 벽 쪽으로 책상을 옮겼어요.","shared":true},{"en":"The room looks much tidier now, and I have a proper place to study.","ko":"지금은 방이 훨씬 정돈됐고 제대로 공부할 공간이 생겼어요.","shared":true},{"en":"I'm happy with the change because it made a small room more useful.","ko":"작은 방을 더 잘 활용하게 돼서 만족해요.","shared":true}],"note":"","sources":[{"id":"M028_5","label":"오픽만수르 IM2–IH · p.28 · M028_5"}],"correction":"","scope":"설문 중심","requirements":["당신의 집에 준 변화 한 가지를 말해주세요.","새 가구를 샀거나 페인트 칠을 했거 나 인테리어를 새로 하셨나요?","그 변화에 행복했나요?","행복하지 않았나요?","왜 그 변화를 주려고 결정하셨나요?","그 후에 집이 어떻게 보였나요?","모든 것을 자세히 말해주세요."],"words":113,"representative":"M028_5","additional":0,"sharedCount":8,"related":["M232_2","H2_06","H6_04"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M030_6","page":30,"title":"집 비교","q":"Please compare the house you lived in before to the house you live in now. Is there something different between those two houses? Why did you move? Tell me about it in detail.","qko":"이전에 살던 집과 지금 사는 집을 비교해주세요. 그 두 집 사이에 어떤 차이점이 있나요? 왜 이사를 하셨나요? 자세히 말해주세요.","source":"pdf","topic":"집","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.30 · M030_6","family":"home-compare","cue":"예전 가족 집 넓음 → 현재 작지만 편리 → 독립","lines":[{"en":"My previous home was a larger apartment where I lived with my parents.","ko":"이전 집은 부모님과 함께 살던 더 큰 아파트였어요.","shared":true},{"en":"It had three bedrooms, and we shared a large living room.","ko":"침실 세 개가 있었고 넓은 거실을 함께 썼어요.","shared":true},{"en":"Now I live alone in a smaller apartment with two rooms.","ko":"지금은 방 두 개가 있는 더 작은 아파트에 혼자 살아요.","shared":true},{"en":"The old place was farther from shops, but my current home is close to a station and a park.","ko":"이전 집은 가게들과 멀었지만 지금 집은 역과 공원이 가까워요.","shared":true},{"en":"Both places get good sunlight, which is something I really like.","ko":"두 집 모두 햇빛이 잘 들어서 그 점이 좋아요.","shared":true},{"en":"I moved last year because I wanted to live independently and manage my own routine.","ko":"독립해서 제 생활을 관리하고 싶어 작년에 이사했어요.","shared":true},{"en":"I miss having dinner with my parents, but I enjoy the privacy here.","ko":"부모님과 저녁 먹던 건 그립지만 여기서는 사생활이 보장돼 좋아요.","shared":true},{"en":"The smaller size also means I spend less time cleaning.","ko":"집이 작아서 청소 시간도 줄었어요.","shared":true}],"note":"","sources":[{"id":"M030_6","label":"오픽만수르 IM2–IH · p.30 · M030_6"}],"correction":"","scope":"설문 중심","requirements":["이전에 살던 집과 지금 사는 집을 비교해주세요.","그 두 집 사이에 어떤 차이점이 있나요?","왜 이사를 하셨나요?","자세히 말해주세요."],"words":103,"representative":"M030_6","additional":0,"sharedCount":8,"related":["H6_03"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M032_1","page":32,"title":"동네 묘사하기","q":"Let's talk about where you live. What does your neighborhood look like? Where is it located? What kinds of amenities are there in your neighborhood? Tell me about a place around your house.","qko":"당신의 사는 곳에 대해 이야기합시다. 당신의 동네는 어떤가요? 어디에 위치해 있나요? 당신의 동네에는 어떤 편의시설이 있습니까? 당신의 집 근처 장소에 대 해 말해주세요","source":"pdf","topic":"동네","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.32 · M032_1","family":"neighborhood","cue":"서울 → 역·공원·가게 → 걸어서 해결","lines":[{"en":"I live in a residential neighborhood in Seoul, close to a subway station.","ko":"저는 서울의 지하철역 가까운 주택가에 살아요.","shared":false},{"en":"There are apartment buildings along the main road and smaller houses on the side streets.","ko":"큰길에는 아파트가 있고 골목에는 작은 주택들이 있어요.","shared":false},{"en":"We have a grocery store, a pharmacy, a bank, and several cafes.","ko":"식료품점, 약국, 은행, 카페 여러 곳이 있어요.","shared":false},{"en":"My favorite place is a small park about ten minutes away on foot.","ko":"가장 좋아하는 곳은 걸어서 10분 정도 거리의 작은 공원이에요.","shared":false},{"en":"It has a walking path, tall trees, and benches around an open lawn.","ko":"산책로와 큰 나무가 있고 잔디밭 주변에 벤치가 있어요.","shared":false},{"en":"I can buy what I need and take a short walk without driving anywhere.","ko":"차를 타지 않고 필요한 물건을 사고 짧게 산책할 수 있어요.","shared":false},{"en":"The main road can be noisy, but the street behind my building is usually quiet.","ko":"큰길은 시끄러울 수 있지만 건물 뒤쪽 길은 보통 조용해요.","shared":false},{"en":"That mix of convenience and quiet is why I like living here.","ko":"편리하면서도 조용해서 여기 사는 게 좋아요.","shared":false}],"note":"","sources":[{"id":"M032_1","label":"오픽만수르 IM2–IH · p.32 · M032_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 사는 곳에 대해 이야기합시다.","당신의 동네는 어떤가요?","어디에 위치해 있나요?","당신의 동네에는 어떤 편의시설이 있습니까?","당신의 집 근처 장소에 대 해 말해주세요"],"words":107,"representative":"M032_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M034_2","page":34,"title":"이웃 묘사하기","q":"Can you tell me about your neighbors? Who are they, and what are they like? Are you close to your neighbors? What do you typically do when you meet them?","qko":"당신의 이웃에 대해 말해주세요. 그들은 누구이고, 어떤 사람들인가요? 당신은 이 웃들과 친한가요? 그들을 만날 때 당신은 일반적으로 어떤 것을 하나요?","source":"pdf","topic":"동네","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.34 · M034_2","family":"neighbor","cue":"옆집 부부 → 인사 → 택배 도움 → 적당한 친분","lines":[{"en":"My next-door neighbors are a middle-aged couple, and they are very friendly.","ko":"옆집 이웃은 중년 부부인데 정말 친절하세요.","shared":false},{"en":"I wouldn't say we are close friends, but we know each other quite well.","ko":"친한 친구 사이는 아니지만 서로 꽤 잘 알아요.","shared":false},{"en":"When we meet in the elevator, we usually say hello and talk about the weather.","ko":"엘리베이터에서 만나면 인사하고 날씨 이야기를 해요.","shared":false},{"en":"Sometimes we discuss a notice from the building manager, like a change in recycling hours.","ko":"가끔 재활용 시간 변경 같은 관리소 공지를 이야기해요.","shared":false},{"en":"Once, they kept a package for me when it was left near the wrong door.","ko":"한번은 택배가 엉뚱한 문 앞에 놓였을 때 보관해 주셨어요.","shared":false},{"en":"I thanked them and brought them a small box of cookies.","ko":"감사 인사를 하고 작은 쿠키 상자를 드렸어요.","shared":false},{"en":"We respect each other's privacy, but I feel comfortable asking them a small favor.","ko":"서로 사생활을 존중하면서도 작은 부탁을 편하게 할 수 있어요.","shared":false}],"note":"","sources":[{"id":"M034_2","label":"오픽만수르 IM2–IH · p.34 · M034_2"}],"correction":"","scope":"돌발·확장","requirements":["당신의 이웃에 대해 말해주세요.","그들은 누구이고, 어떤 사람들인가요?","당신은 이 웃들과 친한가요?","그들을 만날 때 당신은 일반적으로 어떤 것을 하나요?"],"words":96,"representative":"M034_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M036_3","page":36,"title":"동네 과거 경험","q":"Now, talk about an interesting or memorable experience in your neighborhood. When and where did it occur? Why was it interesting or memorable?","qko":"이제, 당신의 동네에서의 흥미롭거나 기억에 남는 경험에 대해 말해주세요. 언제 어디서 발생한 일인가요? 왜 그것이 흥미롭거나 기억에 남는 가요?","source":"pdf","topic":"동네","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.36 · M036_3","family":"park-rain","cue":"지난 일요일 → 민 → 갑작스러운 비 → 카페","lines":[{"en":"Last Sunday afternoon, I went to my neighborhood park with Min.","ko":"지난 일요일 오후에 민이와 동네 공원에 갔어요.","shared":true},{"en":"We planned to walk around the lawn and sit outside for a while.","ko":"잔디밭 주변을 걷고 잠시 밖에 앉아 있을 계획이었어요.","shared":true},{"en":"About twenty minutes later, dark clouds appeared and heavy rain started.","ko":"20분쯤 지나 먹구름이 끼고 비가 많이 내렸어요.","shared":true},{"en":"Neither of us had an umbrella, so we quickly went into a cafe near the entrance.","ko":"둘 다 우산이 없어서 입구 근처 카페로 급히 들어갔어요.","shared":true},{"en":"We dried our bags with paper towels and ordered hot drinks.","ko":"종이 타월로 가방을 닦고 따뜻한 음료를 주문했어요.","shared":true},{"en":"While we waited, we laughed about how confidently we had ignored the forecast.","ko":"기다리면서 일기예보를 무시한 걸 두고 웃었어요.","shared":true},{"en":"The rain stopped after half an hour, and we walked home together.","ko":"30분쯤 뒤 비가 그쳐 함께 걸어서 집에 갔어요.","shared":true},{"en":"It was memorable because the unexpected change gave us time for a really good conversation.","ko":"뜻밖의 계획 변경 덕분에 좋은 대화를 나눠 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"M036_3","label":"오픽만수르 IM2–IH · p.36 · M036_3"}],"correction":"","scope":"돌발·확장","requirements":["이제, 당신의 동네에서의 흥미롭거나 기억에 남는 경험에 대해 말해주세요.","언제 어디서 발생한 일인가요?","왜 그것이 흥미롭거나 기억에 남는 가요?"],"words":102,"representative":"M036_3","additional":0,"sharedCount":8,"related":["M050_3","M258_13","H5_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M038_4","page":38,"title":"동네 비교하기","q":"How has the place where you live changed or developed over the past ten years? What was the city like, and what about now? Please tell me in as much detail as possible.","qko":"당신이 사는 지역은 지난 10년간 어떻게 변화되고 발전되었나요? 그 도시는 어땠 고, 지금은 어떤가요? 가능한 자세히 말해주세요.","source":"pdf","topic":"동네","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.38 · M038_4","family":"neighborhood-change","cue":"10년 전 낮은 건물 → 아파트·역 → 편리하지만 혼잡","lines":[{"en":"My neighborhood has changed a lot over the past ten years.","ko":"우리 동네는 지난 10년 동안 많이 달라졌어요.","shared":true},{"en":"When I was younger, there were more small houses and only a few local shops.","ko":"제가 어렸을 때는 작은 주택이 더 많았고 동네 가게가 몇 개뿐이었어요.","shared":true},{"en":"Some of those houses have been replaced by taller apartment buildings.","ko":"그 주택 중 일부는 더 높은 아파트로 바뀌었어요.","shared":true},{"en":"The streets look brighter now because the sidewalks and streetlights have been improved.","ko":"보도와 가로등이 개선돼 지금은 거리가 더 밝아 보여요.","shared":true},{"en":"There are more cafes, and public transportation is easier to use.","ko":"카페가 늘었고 대중교통도 이용하기 편해졌어요.","shared":true},{"en":"I like being able to walk to most places instead of asking someone for a ride.","ko":"누군가에게 태워 달라고 하지 않고 대부분 걸어갈 수 있어서 좋아요.","shared":true},{"en":"However, there is more traffic around the main road, especially in the evening.","ko":"하지만 특히 저녁에는 큰길 주변 교통량이 늘었어요.","shared":true},{"en":"Overall, it is more convenient, although I miss how quiet it used to be.","ko":"전반적으로 편해졌지만 예전의 조용한 분위기는 그리워요.","shared":true}],"note":"","sources":[{"id":"M038_4","label":"오픽만수르 IM2–IH · p.38 · M038_4"}],"correction":"","scope":"돌발·확장","requirements":["당신이 사는 지역은 지난 10년간 어떻게 변화되고 발전되었나요?","그 도시는 어땠 고, 지금은 어떤가요?","가능한 자세히 말해주세요."],"words":104,"representative":"M038_4","additional":0,"sharedCount":8,"related":["H2_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M040_1","page":40,"title":"집에서 보내는 휴가","q":"You indicated in the survey that you prefer to stay home during vacations. How do you spend your vacations at home? What do you usually do, and why do you like to stay at home? Who usually visits you when your vacation? Use as many details as possible to describe it.","qko":"설문에서 집에서 휴가 보내기를 선호한다고 했습니다. 집 휴가를 어떻게 보내나요? 보통 무엇을 하고 왜 집에 있는 것을 좋아하나요? 휴가 때 누가 주로 방문하나요? 자세히 설명하세요.","source":"pdf","topic":"집휴가","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.40 · M040_1","family":"stay","cue":"늦은 아침 → 음악·요리 → 민 방문 → 쉬는 속도","lines":[{"en":"During a vacation at home, I slow down and avoid making a tight schedule.","ko":"집에서 휴가를 보내면 여유를 갖고 빡빡한 계획을 세우지 않아요.","shared":true},{"en":"I sleep a little later, make a simple breakfast, and listen to music.","ko":"조금 늦게 일어나 간단한 아침을 만들고 음악을 들어요.","shared":true},{"en":"In the afternoon, I watch a film or try cooking something new.","ko":"오후에는 영화를 보거나 새로운 요리를 해봐요.","shared":true},{"en":"My friend Min sometimes visits, and we cook lunch and talk for hours.","ko":"가끔 친구 민이가 와서 점심을 만들고 몇 시간씩 이야기해요.","shared":true},{"en":"I live alone, so having a friend over makes the day feel special.","ko":"혼자 살아서 친구가 오면 그날이 특별하게 느껴져요.","shared":true},{"en":"I prefer this for short breaks because I don't have to pack or pay for a hotel.","ko":"짐을 싸거나 호텔비를 낼 필요가 없어 짧은 휴가에는 이 방식이 좋아요.","shared":true},{"en":"I still enjoy traveling, but staying home lets me rest at my own pace.","ko":"여행도 좋아하지만 집에서는 제 속도로 쉴 수 있어요.","shared":true},{"en":"By the end of the break, I usually feel refreshed rather than tired from moving around.","ko":"휴가가 끝나면 이동하느라 지치기보다 기운을 되찾은 느낌이에요.","shared":true}],"note":"","sources":[{"id":"M040_1","label":"오픽만수르 IM2–IH · p.40 · M040_1"}],"correction":"Who usually visits you when your vacation? → Who usually visits you during your vacation?","scope":"설문 중심","requirements":["설문에서 집에서 휴가 보내기를 선호한다고 했습니다.","집 휴가를 어떻게 보내나요?","보통 무엇을 하고 왜 집에 있는 것을 좋아하나요?","휴가 때 누가 주로 방문하나요?","자세히 설명하세요."],"words":112,"representative":"M040_1","additional":0,"sharedCount":8,"related":["M042_2","H3_02","H5_14"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M042_2","page":42,"title":"집에서 휴가 보내는 이유","q":"Most people want to travel during their vacations. Can you tell me why you prefer to stay at home during your vacation? What makes a vacation at home enjoyable?","qko":"많은 사람들은 그들의 휴가 때 여행하기를 원합니다. 당신은 왜 집에 머무르는 것을 선호하는지 말해주세요. 무엇이 집에서 휴가를 즐기게 하나요?","source":"pdf","topic":"집휴가","type":"선호·의견","sourceLabel":"오픽만수르 IM2–IH · p.42 · M042_2","family":"stay","cue":"늦은 아침 → 음악·요리 → 민 방문 → 쉬는 속도","lines":[{"en":"During a vacation at home, I slow down and avoid making a tight schedule.","ko":"집에서 휴가를 보내면 여유를 갖고 빡빡한 계획을 세우지 않아요.","shared":true},{"en":"I sleep a little later, make a simple breakfast, and listen to music.","ko":"조금 늦게 일어나 간단한 아침을 만들고 음악을 들어요.","shared":true},{"en":"In the afternoon, I watch a film or try cooking something new.","ko":"오후에는 영화를 보거나 새로운 요리를 해봐요.","shared":true},{"en":"My friend Min sometimes visits, and we cook lunch and talk for hours.","ko":"가끔 친구 민이가 와서 점심을 만들고 몇 시간씩 이야기해요.","shared":true},{"en":"I live alone, so having a friend over makes the day feel special.","ko":"혼자 살아서 친구가 오면 그날이 특별하게 느껴져요.","shared":true},{"en":"I prefer this for short breaks because I don't have to pack or pay for a hotel.","ko":"짐을 싸거나 호텔비를 낼 필요가 없어 짧은 휴가에는 이 방식이 좋아요.","shared":true},{"en":"I still enjoy traveling, but staying home lets me rest at my own pace.","ko":"여행도 좋아하지만 집에서는 제 속도로 쉴 수 있어요.","shared":true},{"en":"By the end of the break, I usually feel refreshed rather than tired from moving around.","ko":"휴가가 끝나면 이동하느라 지치기보다 기운을 되찾은 느낌이에요.","shared":true}],"note":"","sources":[{"id":"M042_2","label":"오픽만수르 IM2–IH · p.42 · M042_2"}],"correction":"","scope":"설문 중심","requirements":["많은 사람들은 그들의 휴가 때 여행하기를 원합니다.","당신은 왜 집에 머무르는 것을 선호하는지 말해주세요.","무엇이 집에서 휴가를 즐기게 하나요?"],"words":112,"representative":"M040_1","additional":0,"sharedCount":8,"related":["M040_1","H3_02","H5_14"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M044_3","page":44,"title":"집에서 겪은 과거 경험","q":"Tell me about a memorable vacation when you stay at home during your vacation. What did you do at home? Who were you wi th? Why was it so unforgettable? Give me many details.","qko":"집에서 보낸 기억에 남는 휴가를 말하세요. 무엇을 했고 누구와 함께했나요? 왜 잊을 수 없나요? 자세히 설명하세요.","source":"pdf","topic":"집휴가","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.44 · M044_3","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true}],"note":"","sources":[{"id":"M044_3","label":"오픽만수르 IM2–IH · p.44 · M044_3"}],"correction":"when you stay → when you stayed / wi th → with. 원문 추출 표기는 보존했습니다.","scope":"설문 중심","requirements":["집에서 보낸 기억에 남는 휴가를 말하세요.","무엇을 했고 누구와 함께했나요?","왜 잊을 수 없나요?","자세히 설명하세요."],"words":104,"representative":"M044_3","additional":0,"sharedCount":8,"related":["M123_2","M125_3","M276_13","H3_03","H3_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M046_1","page":46,"title":"공원 묘사","q":"You indicated in the survey that you enjoy going to a park. Which park do you like to go to? Where is it? What does it look like? Who do you usually go with? Please describe your favorite park in detail.","qko":"당신은 설문조사에서 공원에 가는 것을 좋아한다고 답했습니다. 어느 공원에 가 는 것을 좋아하시나요? 어디에 있나요? 그 공원은 어떤가요? 누구와 주로 가시나 요? 당신이 가장 좋아하는 공원에 대해 자세히 묘사해주세요.","source":"pdf","topic":"공원","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.46 · M046_1","family":"park","cue":"집 근처 → 산책로·벤치 → 민 또는 혼자 → 조용함","lines":[{"en":"My favorite park is a small neighborhood park about ten minutes from my apartment.","ko":"제가 좋아하는 공원은 아파트에서 10분 정도 거리의 작은 동네 공원이에요.","shared":true},{"en":"It has a wide walking path, tall trees, and benches around an open lawn.","ko":"넓은 산책로와 큰 나무가 있고 잔디밭 주변에는 벤치가 있어요.","shared":true},{"en":"There is a playground near the entrance and an exercise area farther inside.","ko":"입구 근처에는 놀이터, 안쪽에는 운동 공간이 있어요.","shared":true},{"en":"I usually go alone, but sometimes my friend Min joins me.","ko":"보통 혼자 가지만 가끔 친구 민이가 함께해요.","shared":true},{"en":"Children play on the swings while adults walk or use the exercise equipment.","ko":"아이들은 그네를 타고 어른들은 걷거나 운동 기구를 써요.","shared":true},{"en":"Both groups enjoy being outside, although the children are usually much more active.","ko":"둘 다 야외 활동을 즐기지만 아이들이 보통 훨씬 활발해요.","shared":true},{"en":"My favorite spot is a bench under a large tree because it is cool and quiet.","ko":"제가 좋아하는 자리는 시원하고 조용한 큰 나무 아래 벤치예요.","shared":true},{"en":"I like the park because I can get some fresh air without traveling far.","ko":"멀리 가지 않고도 바람을 쐴 수 있어 좋아요.","shared":true}],"note":"","sources":[{"id":"M046_1","label":"오픽만수르 IM2–IH · p.46 · M046_1"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 공원에 가는 것을 좋아한다고 답했습니다.","어느 공원에 가 는 것을 좋아하시나요?","어디에 있나요?","그 공원은 어떤가요?","누구와 주로 가시나 요?","당신이 가장 좋아하는 공원에 대해 자세히 묘사해주세요."],"words":108,"representative":"M046_1","additional":0,"sharedCount":8,"related":["H5_03"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M048_2","page":48,"title":"공원에서 하는 것, 행동 습관","q":"How often do you go to a park? What things do you usually do at a park? Describe your typical day at a park from the moment you arrive at the park to the time you leave the park.","qko":"얼마나 자주 공원에 가시나요? 공원에서 주로 무엇을 하시나요? 당신이 공원에 도착해서 떠날 때까지 하는 일상적인 하루에 대해 설명해주세요.","source":"pdf","topic":"공원","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.48 · M048_2","family":"walk","cue":"주 2회 저녁 → 가벼운 산책 → 벤치 → 귀가","lines":[{"en":"I go for a light walk in my neighborhood park about twice a week.","ko":"일주일에 두 번 정도 동네 공원에서 가볍게 산책해요.","shared":true},{"en":"I normally go in the early evening when the weather is pleasant.","ko":"날씨가 좋은 날 이른 저녁에 주로 가요.","shared":true},{"en":"I prefer going alone because I can choose my own pace, but Min sometimes joins me.","ko":"제 속도로 걸을 수 있어 혼자가 좋지만 가끔 민이가 함께해요.","shared":true},{"en":"When I arrive, I stretch a little and follow the path around the lawn.","ko":"도착하면 he path around the lawn.","ko":"도착하면 가볍게 몸을 풀고 잔디밭 주변 길을 따라 걸어요.","shared":true},{"en":"I walk for about twenty minutes, then sit on a bench and drink some water.","ko":"20분 정도 걷고 나서 벤치에 앉아 물을 마셔요.","shared":true},{"en":"I watch people passing by before walking back home.","ko":"지나가는 사람들을 구경하다가 집으로 걸어 돌아와요.","shared":true},{"en":"I don't do regular sports or hard workouts; this is mainly a relaxing walk.","ko":"정기적으로 스포츠나 격한 운동을 하는 건 아니고 주로 편하게 산책하는 거예요.","shared":true},{"en":"It clears my head and helps me sleep better at night.","ko":"머리가 맑아지고 밤에 잠도 더 잘 와요.","shared":true}],"note":"걷기 원문입니다. 조깅 답변으로 자동 치환하지 않습니다. 현재는 가벼운 산책, 조깅 사건은 과거의 시도로 구분합니다.","sources":[{"id":"M052_1","label":"오픽만수르 IM2–IH · p.52 · M052_1"}],"correction":"","scope":"설문 중심","requirements":["당신의 설문조사에서, 당신은 조깅/걷기를 좋아한다고 응답했습니다.","얼마나 자주 조깅/걷기를 하십니까?","일반적으로 언제 어디로 조깅/걷기를 하러 가시나요?","당 신이 조깅/걷기를 할 때의 루틴을 설명해주세요."],"words":105,"representative":"M048_2","additional":0,"sharedCount":8,"related":["M048_2","H5_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M054_2","page":54,"title":"조깅, 걷기 안전 예방","q":"Safety is important. What items do you bring or wear when you go jogging? What do you take to avoid injury? Tell me about your items for safety in detail","qko":"안전은 중요합니다. 조깅할 때 어떤 물건을 가져가거나 착용하나요? 부상을 피하려고 무엇을 챙기나요? 안전용품을 자세히 설명하세요.","source":"pdf","topic":"조깅·걷기","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.54 · M054_2","family":"jog-safety","cue":"과거 가벼운 조깅 → 신발·밝은 옷·물 → 길 확인","lines":[{"en":"When I occasionally try jogging, I keep it short and pay attention to safety.","ko":"가끔 조깅을 시도할 때는 짧게 하고 안전에 신경 써요.","shared":false},{"en":"I wear comfortable running shoes with a good grip so I don't slip.","ko":"미끄러지지 않도록 바닥이 잘 잡히는 편한 운동화를 신어요.","shared":false},{"en":"I also wear a bright top so other people can see me easily.","ko":"다른 사람들이 잘 볼 수 있게 밝은 상의도 입어요.","shared":false},{"en":"I bring a small bottle of water and my phone in case I need help.","ko":"물 한 병과 도움이 필요할 때 쓸 휴대폰을 챙겨요.","shared":false},{"en":"Before starting, I warm up by walking and moving my ankles gently.","ko":"시작 전에 걷고 발목을 부드럽게 움직여 몸을 풀어요.","shared":false},{"en":"I choose a flat path and avoid running when it is dark or slippery.","ko":"평평한 길을 고르고 어둡거나 미끄러우면 뛰지 않아요.","shared":false},{"en":"I don't push myself to run fast; I stop and walk if I feel uncomfortable.","ko":"빨리 뛰려고 무리하지 않고 불편하면 멈춰서 걸어요.","shared":false},{"en":"These days I mostly walk, but I follow the same basic precautions.","ko":"요즘은 주로 걷지만 기본적인 주의사항은 똑같이 지켜요.","shared":false}],"note":"","sources":[{"id":"M054_2","label":"오픽만수르 IM2–IH · p.54 · M054_2"}],"correction":"","scope":"설문 중심","requirements":["안전은 중요합니다.","조깅할 때 어떤 물건을 가져가거나 착용하나요?","부상을 피하려고 무엇을 챙기나요?","안전용품을 자세히 설명하세요."],"words":108,"representative":"M054_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M056_3","page":56,"title":"조깅/걷기 과거 경험, 계기","q":"Now, tell me why you started walking at first. When did you start walking regularly? Explain how you first become interested in walking.","qko":"이제 당신이 처음에 왜 조깅/걷기를 시작했는지 말해주세요. 언제 규칙적으로 조 깅/걷기를 하기 시작했나요? 어떻게 처음 조깅/걷기에 관심을 가지게 되었는지 설명해주세요.","source":"pdf","topic":"조깅·걷기","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.56 · M056_3","family":"walk-start","cue":"작년 봄 → 집에만 있음 → 민 권유 → 10분부터","lines":[{"en":"I started taking regular walks last spring because I was spending too much time indoors.","ko":"집 안에 있는 시간이 너무 많아서 작년 봄에 규칙적으로 산책하기 시작했어요.","shared":true},{"en":"I often felt tired even though I wasn't doing much.","ko":"많이 움직이지 않았는데도 자주 피곤했어요.","shared":true},{"en":"My friend Min suggested a short walk in the park near my apartment.","ko":"친구 민이가 집 근처 공원에서 짧게 걷자고 했어요.","shared":true},{"en":"The first time, we walked for just ten minutes and talked the whole way.","ko":"처음에는 10분만 걸었고 내내 이야기를 했어요.","shared":true},{"en":"I was surprised that such a small activity made me feel more awake.","ko":"작은 활동만으로 정신이 맑아져서 놀랐어요.","shared":true},{"en":"After that, I began going about twice a week and slowly made the walks longer.","ko":"그 후 일주일에 두 번 정도 가며 조금씩 더 오래 걸었어요.","shared":true},{"en":"I still don't follow a sports program, but this simple habit fits my daily life.","ko":"지금도 운동 프로그램을 따르진 않지만 이 간단한 습관은 생활에 잘 맞아요.","shared":true},{"en":"After a few weeks, I slept better and felt less tired during the day.","ko":"몇 주 뒤에는 잠이 더 잘 오고 낮에 덜 피곤했어요.","shared":true}],"note":"","sources":[{"id":"M056_3","label":"오픽만수르 IM2–IH · p.56 · M056_3"}],"correction":"how you first become → how you first became","scope":"설문 중심","requirements":["이제 당신이 처음에 왜 조깅/걷기를 시작했는지 말해주세요.","언제 규칙적으로 조 깅/걷기를 하기 시작했나요?","어떻게 처음 조깅/걷기에 관심을 가지게 되었는지 설명해주세요."],"words":109,"representative":"M056_3","additional":0,"sharedCount":8,"related":["M166_3"],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"M058_4","page":58,"title":"조깅, 걷기 과거 경험","q":"Have you ever had a particularly memorable experience while jogging? What was it? When and where did you go jogging? Who did you go with? What happened, and how did you feel? Tell me about the experience from beginning to end.","qko":"조깅/걷기를 하는 동안 겪은 특별히 기억에 남는 경험이 있나요? 무엇인가요? 언 제 어디서 조깅/걷기를 하셨나요? 누구와 함께였나요? 무슨 일이 있었고 어떻게 느끼셨나요? 그 경험에 대해 처음부터 끝까지 다 말해주세요.","source":"pdf","topic":"조깅·걷기","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.58 · M058_4","family":"jog-event","cue":"작년 봄 조깅 시도 → 무리 → 쉬기 → 걷기로","lines":[{"en":"I remember trying to jog with Min in our neighborhood park last spring.","ko":"작년 봄에 민이와 동네 공원에서 조깅을 시도한 게 기억나요.","shared":false},{"en":"I wasn't used to running, but I tried to keep up with him.","ko":"뛰는 게 익숙하지 않았지만 친구 속도를 따라가려고 했어요.","shared":false},{"en":"After a few minutes, I was out of breath and had to stop.","ko":"몇 분 만에 숨이 차서 멈춰야 했어요.","shared":false},{"en":"I felt embarrassed because I had said it would be easy.","ko":"쉽게 할 수 있다고 말했어서 민망했어요.","shared":false},{"en":"Min told me to slow down, and we rested on a bench until I felt better.","ko":"민이가 천천히 하라고 해서 괜찮아질 때까지 벤치에서 쉬었어요.","shared":false},{"en":"Then we walked the rest of the route instead of running.","ko":"그 후 남은 길은 뛰지 않고 걸었어요.","shared":false},{"en":"We still had a good time, and I was glad I hadn't forced myself to continue.","ko":"그래도 즐거웠고 무리해서 계속하지 않아 다행이었어요.","shared":false},{"en":"Since then, I have mostly chosen gentle walks rather than regular jogging.","ko":"그 이후에는 규칙적인 조깅보다는 가벼운 산책을 주로 해요.","shared":false}],"note":"","sources":[{"id":"M058_4","label":"오픽만수르 IM2–IH · p.58 · M058_4"}],"correction":"","scope":"설문 중심","requirements":["조깅/걷기를 하는 동안 겪은 특별히 기억에 남는 경험이 있나요?","무엇인가요?","언 제 어디서 조깅/걷기를 하셨나요?","누구와 함께였나요?","무슨 일이 있었고 어떻게 느끼셨나요?","그 경험에 대해 처음부터 끝까지 다 말해주세요."],"words":105,"representative":"M058_4","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M060_1","page":60,"title":"쇼핑 장소 설명","q":"You indicated in the survey that you enjoy shopping. Tell me about stores or shopping centers in your country. What are they like? Where are they located? What items do they sell? Is there a particular store that you regularly visit for shopping?","qko":"당신은 설문조사에서 쇼핑을 좋아한다고 답했습니다. 당신의 나라에 있는 가게나 쇼핑 센터에 대해 말해주세요. 그들은 어떤가요? 그들을 어디에 있나요? 그들은 어떤 아이템들을 판매하나요? 당신이 정기적으로 쇼핑하러 가는 특정한 가게가 있나요?","source":"pdf","topic":"쇼핑","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.60 · M060_1","family":"shopping","cue":"역 근처 몰 → 옷·생활용품 → 주말 민","lines":[{"en":"In Korea, I see both large shopping malls and smaller local stores.","ko":"한국에서는 큰 쇼핑몰과 작은 동네 가게를 모두 볼 수 있어요.","shared":true},{"en":"Malls are often near stations and have clothing shops, electronics stores, and restaurants in one building.","ko":"쇼핑몰은 보통 역 근처에 있고 한 건물에 옷 가게, 전자제품점, 식당이 있어요.","shared":true},{"en":"Local stores are smaller and are useful for groceries or simple household items.","ko":"동네 가게는 더 작고 식료품이나 간단한 생활용품을 사기 좋아요.","shared":true},{"en":"I usually use a mall near my station when I need clothes, although I don't shop very often.","ko":"쇼핑을 자주 하진 않지만 옷이 필요하면 역 근처 몰을 이용해요.","shared":true},{"en":"I go on a weekend afternoon, sometimes with Min, and look for plain shirts or comfortable shoes.","ko":"주말 오후에 가끔 민이와 가서 무지 셔츠나 편한 신발을 찾아요.","shared":true},{"en":"I compare a few prices and try things on rather than buying the first item I see.","ko":"처음 본 걸 사기보다 가격을 몇 개 비교하고 입어봐요.","shared":true},{"en":"I like being able to finish several small errands in one place.","ko":"작은 볼일 여러 개를 한곳에서 끝낼 수 있어 좋아요.","shared":true}],"note":"설문 미선택 보충 자료. 기본 암기 범위에서는 제외합니다.","sources":[{"id":"M060_1","label":"오픽만수르 IM2–IH · p.60 · M060_1"}],"correction":"","scope":"선택 외 참고","requirements":["당신은 설문조사에서 쇼핑을 좋아한다고 답했습니다.","당신의 나라에 있는 가게나 쇼핑 센터에 대해 말해주세요.","그들은 어떤가요?","그들을 어디에 있나요?","그들은 어떤 아이템들을 판매하나요?","당신이 정기적으로 쇼핑하러 가는 특정한 가게가 있나요?"],"words":105,"representative":"M060_1","additional":0,"sharedCount":7,"related":["M062_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M062_2","page":62,"title":"쇼핑 장소, 활동 설명","q":"Shopping is a popular activity. Tell me where you usually go shopping. When do you go there? Who do you go with? What do you usually buy? Describe as many details as possible.","qko":"쇼핑은 인기있는 활동입니다. 주로 쇼핑하는 곳을 이야기해주세요. 언제 거기에 가고 누구와 같이 갑니까? 무엇을 주로 구매합니까?","source":"pdf","topic":"쇼핑","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.62 · M062_2","family":"shopping","cue":"역 근처 몰 → 옷·생활용품 → 주말 민","lines":[{"en":"In Korea, I see both large shopping malls and smaller local stores.","ko":"한국에서는 큰 쇼핑몰과 작은 동네 가게를 모두 볼 수 있어요.","shared":true},{"en":"Malls are often near stations and have clothing shops, electronics stores, and restaurants in one building.","ko":"쇼핑몰은 보통 역 근처에 있고 한 건물에 옷 가게, 전자제품점, 식당이 있어요.","shared":true},{"en":"Local stores are smaller and are useful for groceries or simple household items.","ko":"동네 가게는 더 작고 식료품이나 간단한 생활용품을 사기 좋아요.","shared":true},{"en":"I usually use a mall near my station when I need clothes, although I don't shop very often.","ko":"쇼핑을 자주 하진 않지만 옷이 필요하면 역 근처 몰을 이용해요.","shared":true},{"en":"I go on a weekend afternoon, sometimes with Min, and look for plain shirts or comfortable shoes.","ko":"주말 오후에 가끔 민이와 가서 무지 셔츠나 편한 신발을 찾아요.","shared":true},{"en":"I compare a few prices and try things on rather than buying the first item I see.","ko":"처음 본 걸 사기보다 가격을 몇 개 비교하고 입어봐요.","shared":true},{"en":"I like being able to finish several small errands in one place.","ko":"작은 볼일 여러 개를 한곳에서 끝낼 수 있어 좋아요.","shared":true}],"note":"설문 미선택 보충 자료. 기본 암기 범위에서는 제외합니다.","sources":[{"id":"M062_2","label":"오픽만수르 IM2–IH · p.62 · M062_2"}],"correction":"","scope":"선택 외 참고","requirements":["쇼핑은 인기있는 활동입니다.","주로 쇼핑하는 곳을 이야기해주세요.","언제 거기에 가고 누구와 같이 갑니까?","무엇을 주로 구매합니까?"],"words":105,"representative":"M060_1","additional":0,"sharedCount":7,"related":["M060_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M064_3","page":64,"title":"쇼핑 과거 경험","q":"Describe one memorable or unforgettable experience you had when you were shopping. What happened? What did you buy? What made this experience so unforgettable?","qko":"쇼핑을 할 때 겪은 기억에 남거나 잊을 수 없는 경험 하나를 말해주세요. 무슨 일이 있었나요? 무엇을 구매하셨나요? 무엇이 그 경험을 잊을 수 없게 했나요?","source":"pdf","topic":"쇼핑","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.64 · M064_3","family":"clothes","cue":"지난달 몰 → 민 → 재킷·셔츠 → 영수증 할인 오류","lines":[{"en":"Last month, I went to a clothing store in a nearby shopping mall with Min.","ko":"지난달 민이와 근처 쇼핑몰의 옷 가게에 갔어요.","shared":true},{"en":"I needed a light jacket and a plain T-shirt for cooler evenings.","ko":"선선한 저녁에 입을 가벼운 재킷과 무지 티셔츠가 필요했어요.","shared":true},{"en":"We tried a few sizes, and Min helped me choose a jacket that fitted comfortably.","ko":"몇 가지 사이즈를 입어보고 민이가 편하게 맞는 재킷을 고르도록 도와줬어요.","shared":true},{"en":"I bought both items, but I noticed a mistake on the receipt before leaving the mall.","ko":"둘 다 샀는데 몰을 나가기 전에 영수증의 오류를 발견했어요.","shared":true},{"en":"The jacket was marked down on the shelf, but I had paid the full price.","ko":"매장에서는 할인 표시가 있었지만 원래 가격으로 결제됐어요.","shared":true},{"en":"I went back with the receipt, and the employee checked the price label.","ko":"영수증을 갖고 돌아가니 직원이 가격표를 확인했어요.","shared":true},{"en":"She apologized and refunded the difference to my card.","ko":"직원이 사과하고 차액을 카드로 환불해 줬어요.","shared":true},{"en":"I liked the clothes, and the experience reminded me to check receipts carefully.","ko":"옷은 마음에 들었고 영수증을 잘 확인해야겠다고 느꼈어요.","shared":true}],"note":"","sources":[{"id":"M064_3","label":"오픽만수르 IM2–IH · p.64 · M064_3"}],"correction":"","scope":"선택 외 참고","requirements":["쇼핑을 할 때 겪은 기억에 남거나 잊을 수 없는 경험 하나를 말해주세요.","무슨 일이 있었나요?","무엇을 구매하셨나요?","무엇이 그 경험을 잊을 수 없게 했나요?"],"words":108,"representative":"M200_2","additional":0,"sharedCount":8,"related":["M200_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M066_1","page":66,"title":"카페 묘사","q":"You indicated in the survey that you go to cafes or coffee shops. Tell me about the café you often go to. Where is the café located? What does it look like? Is there something special about that café?","qko":"당신은 설문조사에서 카페 또는 커피숍에 간다고 답변했습니다. 당신이 자주 가 는 카페에 대해 말해주세요. 그 카페는 어디에 있나요? 그 카페는 어떤가요? 그 카페에 대한 특별한 점이 있나요?","source":"pdf","topic":"카페","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.66 · M066_1","family":"cafe","cue":"집 근처 작은 카페 → 창가·식물 → 조용함","lines":[{"en":"I often visit a small cafe about five minutes from my apartment.","ko":"집에서 5분 정도 거리의 작은 카페에 자주 가요.","shared":false},{"en":"It is on a quiet side street, next to a bakery.","ko":"빵집 옆 조용한 골목에 있어요.","shared":false},{"en":"Inside, there are wooden tables, a long window seat, and a few green plants.","ko":"안에는 나무 테이블, 긴 창가 자리, 초록 식물 몇 개가 있어요.","shared":false},{"en":"The large windows make it bright without harsh lighting.","ko":"큰 창문 덕분에 강한 조명 없이도 밝아요.","shared":false},{"en":"What makes it special is that the music is quiet enough for a conversation.","ko":"음악이 대화할 수 있을 만큼 조용하다는 점이 특별해요.","shared":false},{"en":"I usually order an iced latte and sit near the window.","ko":"보통 아이스 라테를 주문하고 창가에 앉아요.","shared":false},{"en":"The owner remembers my order, which makes the place feel welcoming.","ko":"주인이 제 주문을 기억해 줘서 환영받는 기분이에요.","shared":false},{"en":"It is a comfortable place to spend an hour when I want to get out of the house.","ko":"집 밖에 나가고 싶을 때 한 시간쯤 편하게 보내기 좋은 곳이에요.","shared":false}],"note":"","sources":[{"id":"M066_1","label":"오픽만수르 IM2–IH · p.66 · M066_1"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 카페 또는 커피숍에 간다고 답변했습니다.","당신이 자주 가 는 카페에 대해 말해주세요.","그 카페는 어디에 있나요?","그 카페는 어떤가요?","그 카페에 대한 특별한 점이 있나요?"],"words":100,"representative":"M066_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M068_2","page":68,"title":"카페에서 하는 일, 행동, 습관","q":"What do you normally do when you go to a café? Do you read or eat something? Or do you have meetings or gatherings? Please tell me what you ’d like to do at the café in detail.","qko":"당신께서는 카페에 갈 때 일반적으로 무엇을 하시나요? 당신은 무언가를 읽거나 먹거나 미팅을 가지거나 모임을 하시나요? 당신께서 카페에서 무엇을 하기를 좋 아하는 지 자세히 말해주세요.","source":"pdf","topic":"카페","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.68 · M068_2","family":"cafe-routine","cue":"주문 → 창가 → 책·민과 대화 → 정리","lines":[{"en":"At a cafe, I usually order an iced latte and look for a seat near the window.","ko":"카페에서는 보통 아이스 라테를 주문하고 창가 자리를 찾아요.","shared":false},{"en":"If I am alone, I read a few pages of a book or plan my week.","ko":"혼자면 책을 몇 쪽 읽거나 한 주 계획을 세워요.","shared":false},{"en":"I sometimes have a piece of cake, but I don't usually eat a full meal there.","ko":"가끔 케이크 한 조각을 먹지만 식사를 하지는 않아요.","shared":false},{"en":"When Min joins me, we put our phones away and talk about our plans.","ko":"민이가 오면 휴대폰을 내려놓고 계획에 대해 이야기해요.","shared":false},{"en":"We might choose a place for our next walk or short trip.","ko":"다음 산책이나 짧은 여행을 갈 장소를 정하기도 해요.","shared":false},{"en":"I normally stay for about an hour and return my cup before leaving.","ko":"보통 한 시간 정도 머물고 나가기 전에 컵을 반납해요.","shared":false},{"en":"I like that small break because it helps me feel ready for the rest of the day.","ko":"그 짧은 휴식 덕분에 남은 하루를 보낼 기운이 나서 좋아요.","shared":false}],"note":"","sources":[{"id":"M068_2","label":"오픽만수르 IM2–IH · p.68 · M068_2"}],"correction":"","scope":"설문 중심","requirements":["당신께서는 카페에 갈 때 일반적으로 무엇을 하시나요?","당신은 무언가를 읽거나 먹거나 미팅을 가지거나 모임을 하시나요?","당신께서 카페에서 무엇을 하기를 좋 아하는 지 자세히 말해주세요."],"words":105,"representative":"M068_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M070_3","page":70,"title":"카페에서 발생한 일, 과거 경험","q":"Sometimes, unexpected things can occur when you are at a café. Have you experienced something incident that happened at a café? What happened? Who was involved? And how did you deal with the situation? Tell me as many details as possible.","qko":"가끔 카페에 있을 때 예상치 못한 일어나기도 합니다. 당신이 겪은 카페에서의 어떤 사건이 있나요? 무슨 일인가요? 누가 연관되어 있나요? 그리고 어떻게 그 상황을 해결하셨나요? 가능한 자세히 말해주세요.","source":"pdf","topic":"카페","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.70 · M070_3","family":"cafe-mistake","cue":"지난달 민과 카페 → 뜨거운 음료 → 영수증 → 교체","lines":[{"en":"Last month, I went to my usual cafe with Min and ordered an iced latte.","ko":"지난달 민이와 단골 카페에 가서 아이스 라테를 주문했어요.","shared":false},{"en":"When the drink arrived, it was hot instead of iced.","ko":"음료가 나왔는데 아이스 대신 뜨거운 음료였어요.","shared":false},{"en":"I first checked my receipt because I wasn't sure whether I had ordered correctly.","ko":"제가 제대로 주문했는지 확신이 없어서 먼저 영수증을 확인했어요.","shared":false},{"en":"The receipt said iced latte, so I politely showed it to the employee.","ko":"영수증에 아이스 라테라고 적혀 있어 직원에게 정중하게 보여줬어요.","shared":false},{"en":"She apologized and offered to make a new drink right away.","ko":"직원이 사과하고 바로 새로 만들어 주겠다고 했어요.","shared":false},{"en":"I told her there was no rush, and Min and I kept talking while we waited.","ko":"급하지 않다고 말하고 기다리는 동안 민이와 계속 이야기했어요.","shared":false},{"en":"A few minutes later, I received the right drink and thanked her.","ko":"몇 분 뒤 제대로 된 음료를 받고 감사 인사를 했어요.","shared":false},{"en":"It reminded me that a calm explanation can solve a small problem very easily.","ko":"차분히 설명하면 작은 문제를 쉽게 해결할 수 있다는 걸 느꼈어요.","shared":false}],"note":"","sources":[{"id":"M070_3","label":"오픽만수르 IM2–IH · p.70 · M070_3"}],"correction":"Have you experienced something incident … → Have you experienced an incident …","scope":"설문 중심","requirements":["가끔 카페에 있을 때 예상치 못한 일어나기도 합니다.","당신이 겪은 카페에서의 어떤 사건이 있나요?","무슨 일인가요?","누가 연관되어 있나요?","그리고 어떻게 그 상황을 해결하셨나요?","가능한 자세히 말해주세요."],"words":105,"representative":"M070_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M072_1","page":72,"title":"술집, 바 묘사","q":"I'd like to know about the bar you often go to. Where is your favorite bar? What does it look like? Please describe everything about that bar in detail.","qko":"당신이 자주 가는 술집에 대해 알고 싶습니다. 당신이 가장 좋아하는 술집은 어 디에 있나요? 그 곳은 어떤가요? 그 술집에 대해 모든 것을 자세히 말해주세요.","source":"pdf","topic":"술집","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.72 · M072_1","family":"bar","cue":"가끔 작은 바 → 조용한 음악 → 민·간식","lines":[{"en":"The bar I like is a small place on a side street near my neighborhood.","ko":"제가 좋아하는 바는 동네 근처 골목의 작은 곳이에요.","shared":true},{"en":"I don't go often, but it is convenient when a friend suggests meeting there.","ko":"자주 가진 않지만 친구가 만나자고 하면 편하게 갈 수 있어요.","shared":true},{"en":"It has warm lights, wooden tables, and a counter along one wall.","ko":"따뜻한 조명과 나무 테이블, 한쪽 벽의 카운터가 있어요.","shared":true},{"en":"The music is quiet enough for conversation, which matters more to me than a fancy menu.","ko":"음악이 대화할 수 있을 정도로 조용해서 화려한 메뉴보다 좋아요.","shared":true},{"en":"I usually go with Min and order a non-alcoholic drink and some fries to share.","ko":"보통 민이와 가서 무알코올 음료와 나눠 먹을 감자튀김을 주문해요.","shared":true},{"en":"We talk about travel plans or something funny that happened during the week.","ko":"여행 계획이나 그 주의 재미있는 일을 이야기해요.","shared":true},{"en":"After about an hour, we pay and walk home.","ko":"한 시간쯤 뒤 계산하고 걸어서 집에 가요.","shared":true},{"en":"It is simply a comfortable place to catch up.","ko":"편하게 근황을 나누는 장소예요.","shared":true}],"note":"설문 미선택 보충 자료. 기본 암기 범위에서는 제외합니다.","sources":[{"id":"M072_1","label":"오픽만수르 IM2–IH · p.72 · M072_1"}],"correction":"","scope":"선택 외 참고","requirements":["당신이 자주 가는 술집에 대해 알고 싶습니다.","당신이 가장 좋아하는 술집은 어 디에 있나요?","그 곳은 어떤가요?","그 술집에 대해 모든 것을 자세히 말해주세요."],"words":103,"representative":"M072_1","additional":0,"sharedCount":8,"related":["M076_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M076_2","page":76,"title":"술집, 바에서 하는 행동, 습관","q":"What do you typically do at the bar? Who do you usually go with? What menu do you like to order? Let me know what you do at the bar in detail.","qko":"당신은 술집에서 일반적으로 무엇을 하시나요? 누구와 주로 가시나요? 어떤 메뉴 를 주문하시나요? 당신이 술집에서 하는 것들을 자세히 알려주세요.","source":"pdf","topic":"술집","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.76 · M076_2","family":"bar","cue":"가끔 작은 바 → 조용한 음악 → 민·간식","lines":[{"en":"The bar I like is a small place on a side street near my neighborhood.","ko":"제가 좋아하는 바는 동네 근처 골목의 작은 곳이에요.","shared":true},{"en":"I don't go often, but it is convenient when a friend suggests meeting there.","ko":"자주 가진 않지만 친구가 만나자고 하면 편하게 갈 수 있어요.","shared":true},{"en":"It has warm lights, wooden tables, and a counter along one wall.","ko":"따뜻한 조명과 나무 테이블, 한쪽 벽의 카운터가 있어요.","shared":true},{"en":"The music is quiet enough for conversation, which matters more to me than a fancy menu.","ko":"음악이 대화할 수 있을 정도로 조용해서 화려한 메뉴보다 좋아요.","shared":true},{"en":"I usually go with Min and order a non-alcoholic drink and some fries to share.","ko":"보통 민이와 가서 무알코올 음료와 나눠 먹을 감자튀김을 주문해요.","shared":true},{"en":"We talk about travel plans or something funny that happened during the week.","ko":"여행 계획이나 그 주의 재미있는 일을 이야기해요.","shared":true},{"en":"After about an hour, we pay and walk home.","ko":"한 시간쯤 뒤 계산하고 걸어서 집에 가요.","shared":true},{"en":"It is simply a comfortable place to catch up.","ko":"편하게 근황을 나누는 장소예요.","shared":true}],"note":"설문 미선택 보충 자료. 기본 암기 범위에서는 제외합니다.","sources":[{"id":"M076_2","label":"오픽만수르 IM2–IH · p.76 · M076_2"}],"correction":"","scope":"선택 외 참고","requirements":["당신은 술집에서 일반적으로 무엇을 하시나요?","누구와 주로 가시나요?","어떤 메뉴 를 주문하시나요?","당신이 술집에서 하는 것들을 자세히 알려주세요."],"words":103,"representative":"M072_1","additional":0,"sharedCount":8,"related":["M072_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M078_3","page":78,"title":"술집, 바에서 발생한 일, 과거 경험","q":"Have you ever had a memorable experience at a bar? What made this experience unforgettable? Was there a special event like a birthday, or did something unexpected happen? Describe how you spent your time in detail.","qko":"술집에서 겪은 기억에 남는 경험이 있으신가요? 무엇이 그 경험을 잊을 수 없게 했나요? 생일파티나 기대치 못한 일이 발생한 것 같은 특별한 일이 있었나요? 그 시간을 어떻게 보내셨는지 자세히 묘사해주세요.","source":"pdf","topic":"술집","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.78 · M078_3","family":"bar-memory","cue":"민 생일 → 작은 바 → 깜짝 케이크 → 대화","lines":[{"en":"Last year, I met Min at a small neighborhood bar for his birthday.","ko":"작년에 민이 생일에 동네 작은 바에서 만났어요.","shared":false},{"en":"We ordered drinks and a plate of fries, expecting a quiet evening.","ko":"조용히 보내려고 음료와 감자튀김을 주문했어요.","shared":false},{"en":"I had secretly asked our friend Jisoo to join us with a small cake.","ko":"지수에게 작은 케이크를 들고 와 달라고 미리 부탁했어요.","shared":false},{"en":"When she arrived, Min looked completely surprised because he thought she was busy.","ko":"민이는 지수가 바쁜 줄 알아서 오자 정말 놀랐어요.","shared":false},{"en":"The staff kindly gave us extra plates, and we sang very quietly so we wouldn't disturb anyone.","ko":"직원은 접시를 더 줬고 우리는 방해되지 않도록 아주 조용히 노래했어요.","shared":false},{"en":"We spent the next hour sharing old memories and laughing.","ko":"그다음 한 시간 동안 옛 추억을 나누며 웃었어요.","shared":false},{"en":"It was memorable because a simple meeting became a small surprise that made our friend happy.","ko":"소박한 만남이 친구를 기쁘게 하는 작은 깜짝 행사가 돼 기억에 남아요.","shared":false}],"note":"","sources":[{"id":"M078_3","label":"오픽만수르 IM2–IH · p.78 · M078_3"}],"correction":"","scope":"선택 외 참고","requirements":["술집에서 겪은 기억에 남는 경험이 있으신가요?","무엇이 그 경험을 잊을 수 없게 했나요?","생일파티나 기대치 못한 일이 발생한 것 같은 특별한 일이 있었나요?","그 시간을 어떻게 보내셨는지 자세히 묘사해주세요."],"words":95,"representative":"M078_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M080_1","page":80,"title":"좋아하는 영화 묘사","q":"You indicated in the survey that you like to watch movies. What kinds of movies do you like? What is your favorite genre of movies? Why do you like that types of movies? Tell me about it in detail.","qko":"당신은 설문조사에서 영화 보는 것을 좋아한다고 답했습니다. 어떤 영화를 좋아 하시나요? 당신이 가장 좋아하는 영화 장르는 무엇인가요? 왜 그런 영화를 좋아 하시나요? 자세히 말해주세요.","source":"pdf","topic":"영화","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.80 · M080_1","family":"movie","cue":"따뜻한 코미디 → 가상 영화 작은 실수 → 웃음","lines":[{"en":"I like warm comedies about ordinary people rather than complicated action stories.","ko":"복잡한 액션물보다 평범한 사람들의 따뜻한 코미디를 좋아해요.","shared":true},{"en":"My favorite example is a film called Small Mistakes, starring Alex Kim.","ko":"좋아하는 예는 알렉스 김이 주연인 ‘스몰 미스테이크스’라는 영화예요.","shared":true},{"en":"It follows two friends who try to open a tiny restaurant but keep getting things wrong.","ko":"작은 식당을 열려다 계속 실수하는 두 친구 이야기예요.","shared":true},{"en":"One mixes up the orders while the other tries to keep the customers happy.","ko":"한 명은 주문을 헷갈리고 다른 한 명은 손님 기분을 맞추려고 해요.","shared":true},{"en":"The humor comes from their reactions, so I don't need to understand complicated jokes.","ko":"반응에서 웃음이 나와 복잡한 농담을 이해할 필요가 없어요.","shared":true},{"en":"I laughed a lot, but I also liked how they helped each other instead of giving up.","ko":"많이 웃었지만 포기하지 않고 서로 돕는 점도 좋았어요.","shared":true},{"en":"That mix of humor and kindness leaves me feeling relaxed and positive.","ko":"웃음과 친절이 어우러져 편안하고 긍정적인 기분이 들어요.","shared":true}],"note":"설문 제외 주제의 보충 카드. 영화·배우는 연습용 가상 설정이며 해커스 원본 세트에 포함되어 유지합니다.","sources":[{"id":"M080_1","label":"오픽만수르 IM2–IH · p.80 · M080_1"}],"correction":"that types of movies → those types of movies","scope":"선택 외 참고","requirements":["당신은 설문조사에서 영화 보는 것을 좋아한다고 답했습니다.","어떤 영화를 좋아 하시나요?","당신이 가장 좋아하는 영화 장르는 무엇인가요?","왜 그런 영화를 좋아 하시나요?","자세히 말해주세요."],"words":97,"representative":"H2_02","additional":0,"sharedCount":7,"related":["M086_4","H2_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M082_2","page":82,"title":"가장 좋아하는 극장 묘사하기","q":"You indicated in the survey that you enjoy going to the movies. Which theater or auditorium do you like the most? Where is it? What does it look like? Why do you like that place? Tell me about the movie you watched at this venue.","qko":"당신은 설문조사에서 영화 보는 것을 즐긴다고 답했습니다. 어떤 영화관이나 극 장을 자주 가시나요? 어디에 있나요? 그 곳은 어떤가요? 왜 그 장소를 좋아하시 나요? 이 곳에서 당신이 본 영화에 대해서 말해주세요.","source":"pdf","topic":"영화","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.82 · M082_2","family":"movie-venue","cue":"역 근처 극장 → 넓은 의자 → 스몰 미스테이크스","lines":[{"en":"The movie theater I use most is inside a shopping mall near my local station.","ko":"가장 자주 가는 영화관은 동네 역 근처 쇼핑몰 안에 있어요.","shared":true},{"en":"I only go occasionally, but it is easy to reach by subway.","ko":"가끔 가지만 지하철로 가기 편해요.","shared":true},{"en":"The lobby is bright, with ticket machines on one side and a snack counter on the other.","ko":"밝은 로비 한쪽에는 발권기, 다른 쪽에는 매점이 있어요.","shared":true},{"en":"Inside the screening rooms, the seats are wide and there is enough space for my legs.","ko":"상영관 안에는 좌석이 넓고 다리를 놓을 공간도 충분해요.","shared":true},{"en":"I like it because I can see the screen comfortably without sitting too close.","ko":"너무 가까이 앉지 않아도 화면을 편하게 볼 수 있어 좋아요.","shared":true},{"en":"The last film I saw there was Small Mistakes, a comedy about two friends opening a restaurant.","ko":"마지막으로 거기서 본 건 두 친구가 식당을 여는 코미디 ‘스몰 미스테이크스’예요.","shared":true},{"en":"Min and I enjoyed it and talked about the funny scenes on the way home.","ko":"민이와 즐겁게 보고 집에 가며 웃긴 장면을 이야기했어요.","shared":true}],"note":"","sources":[{"id":"M082_2","label":"오픽만수르 IM2–IH · p.82 · M082_2"}],"correction":"","scope":"선택 외 참고","requirements":["당신은 설문조사에서 영화 보는 것을 즐긴다고 답했습니다.","어떤 영화관이나 극 장을 자주 가시나요?","어디에 있나요?","그 곳은 어떤가요?","왜 그 장소를 좋아하시 나요?","이 곳에서 당신이 본 영화에 대해서 말해주세요."],"words":106,"representative":"H4_05","additional":0,"sharedCount":7,"related":["H4_05"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M084_3","page":84,"title":"영화관에서 하는 일","q":"When you go to the movies, who do you usually go with? Are there any reasons you go to the movies with that person? What do you do with that person before going to a movie theater and after watching the movie?","qko":"당신이 영화를 보러 갈 때, 누구와 주로 가시나요? 그 사람과 가는 특별한 이유 가 있나요? 그 사람과 영화 보기 전, 후에 무엇을 하시나요?","source":"pdf","topic":"영화","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.84 · M084_3","family":"movie-routine","cue":"민과 예매 → 간식 → 무음 → 카페","lines":[{"en":"I usually watch movies with Min because we both enjoy light comedies.","ko":"민이와 가벼운 코미디를 좋아해서 보통 같이 영화를 봐요.","shared":true},{"en":"Before going, we check the running time and book seats online.","ko":"가기 전에 상영 시간을 확인하고 온라인으로 좌석을 예매해요.","shared":true},{"en":"We meet near the theater and have a quick meal if we are hungry.","ko":"영화관 근처에서 만나 배가 고프면 간단히 먹어요.","shared":true},{"en":"Then we collect the tickets, buy a small snack, and find our seats.","ko":"표를 받고 간식을 조금 산 뒤 자리를 찾아요.","shared":true},{"en":"I silence my phone so I can focus on the film and avoid disturbing others.","ko":"집중하고 다른 사람을 방해하지 않도록 폰을 무음으로 해요.","shared":true},{"en":"After the movie, we go to a cafe and discuss our favorite scenes.","ko":"영화 후에는 카페에서 좋았던 장면을 이야기해요.","shared":true},{"en":"We don't always agree, which makes the conversation interesting.","ko":"항상 의견이 같지는 않아서 대화가 재미있어요.","shared":true},{"en":"Finally, we take the subway home.","ko":"마지막으로 지하철을 타고 집에 가요.","shared":true}],"note":"","sources":[{"id":"M084_3","label":"오픽만수르 IM2–IH · p.84 · M084_3"}],"correction":"","scope":"선택 외 참고","requirements":["당신이 영화를 보러 갈 때, 누구와 주로 가시나요?","그 사람과 가는 특별한 이유 가 있나요?","그 사람과 영화 보기 전, 후에 무엇을 하시나요?"],"words":93,"representative":"H4_06","additional":0,"sharedCount":8,"related":["H4_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M086_4","page":86,"title":"기억에 남는 영화, 과거 경험","q":"Can you tell me about a memorable movie you have seen? What was the movie about? Who was the main actor or actress? How did you feel when you watched it? Explain all the details.","qko":"당신이 본 기억에 남는 영화에 대해 말해 주시겠어요? 어떤 영화였나요? 누가 메 인 주인공이었나요? 그것을 볼 때 어떤 기분이었나요? 자세히 말해주세요.","source":"pdf","topic":"영화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.86 · M086_4","family":"movie","cue":"따뜻한 코미디 → 가상 영화 작은 실수 → 웃음","lines":[{"en":"I like warm comedies about ordinary people rather than complicated action stories.","ko":"복잡한 액션물보다 평범한 사람들의 따뜻한 코미디를 좋아해요.","shared":true},{"en":"My favorite example is a film called Small Mistakes, starring Alex Kim.","ko":"좋아하는 예는 알렉스 김이 주연인 ‘스몰 미스테이크스’라는 영화예요.","shared":true},{"en":"It follows two friends who try to open a tiny restaurant but keep getting things wrong.","ko":"작은 식당을 열려다 계속 실수하는 두 친구 이야기예요.","shared":true},{"en":"One mixes up the orders while the other tries to keep the customers happy.","ko":"한 명은 주문을 헷갈리고 다른 한 명은 손님 기분을 맞추려고 해요.","shared":true},{"en":"The humor comes from their reactions, so I don't need to understand complicated jokes.","ko":"반응에서 웃음이 나와 복잡한 농담을 이해할 필요가 없어요.","shared":true},{"en":"I laughed a lot, but I also liked how they helped each other instead of giving up.","ko":"많이 웃었지만 포기하지 않고 서로 돕는 점도 좋았어요.","shared":true},{"en":"That mix of humor and kindness leaves me feeling relaxed and positive.","ko":"웃음과 친절이 어우러져 편안하고 긍정적인 기분이 들어요.","shared":true}],"note":"설문 제외 주제의 보충 카드. 영화·배우는 연습용 가상 설정이며 해커스 원본 세트에 포함되어 유지합니다.","sources":[{"id":"M086_4","label":"오픽만수르 IM2–IH · p.86 · M086_4"}],"correction":"","scope":"선택 외 참고","requirements":["당신이 본 기억에 남는 영화에 대해 말해 주시겠어요?","어떤 영화였나요?","누가 메 인 주인공이었나요?","그것을 볼 때 어떤 기분이었나요?","자세히 말해주세요."],"words":97,"representative":"H2_02","additional":0,"sharedCount":7,"related":["M080_1","H2_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M086_5","page":86,"title":"영화 취향 변화 비교","q":"Talk about one of the movies you watched as a child. What was it? How has your taste in movies changed over the years? How are the movies you enjoy now different from those in the past?","qko":"당신이 어릴 적 봤던 영화에 대해 말해주세요. 무슨 영화였나요? 당신의 영화 취 향은 어떻게 변해왔나요? 지금 즐기는 영화가 과거의 것들과 어떤 차이가 있나요?","source":"pdf","topic":"영화","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.86 · M086_5","family":"movie-taste","cue":"어린 시절 만화 → 지금 코미디 → 이야기 공감","lines":[{"en":"As a child, I loved animated adventure films, especially Toy Story.","ko":"어릴 때는 애니메이션 모험물, 특히 ‘토이 스토리’를 좋아했어요.","shared":false},{"en":"I enjoyed the colorful characters and the idea that toys could have their own lives.","ko":"다채로운 캐릭터와 장난감이 자기 삶을 산다는 생각이 좋았어요.","shared":false},{"en":"At that age, exciting scenes mattered more to me than realistic relationships.","ko":"그때는 현실적인 관계보다 신나는 장면이 중요했어요.","shared":false},{"en":"Now I prefer comedies about ordinary adults dealing with small problems.","ko":"지금은 평범한 어른들이 작은 문제를 다루는 코미디를 선호해요.","shared":false},{"en":"For example, a story about cooking or living alone is easy for me to relate to.","ko":"요리나 혼자 사는 이야기는 공감하기 쉬워요.","shared":false},{"en":"I still enjoy animation, but I pay more attention to dialogue and character choices.","ko":"애니메이션도 여전히 좋지만 대사와 인물의 선택에 더 집중해요.","shared":false},{"en":"The main change is that I want to recognize something from my own life in the story.","ko":"가장 큰 변화는 이야기에서 제 삶의 일부를 발견하고 싶다는 거예요.","shared":false}],"note":"","sources":[{"id":"M086_5","label":"오픽만수르 IM2–IH · p.86 · M086_5"}],"correction":"","scope":"선택 외 참고","requirements":["당신이 어릴 적 봤던 영화에 대해 말해주세요.","무슨 영화였나요?","당신의 영화 취 향은 어떻게 변해왔나요?","지금 즐기는 영화가 과거의 것들과 어떤 차이가 있나요?"],"words":96,"representative":"M086_5","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M088_1","page":88,"title":"좋아하는 공연 묘사","q":"You indicated in the survey that you enjoy watching plays. What kinds of plays do you like the most? Who is your favorite performer? What play has this actor or actress starred in?","qko":"설문에서 연극 보기를 즐긴다고 했습니다. 어떤 종류의 연극을 가장 좋아하나요? 좋아하는 공연자는 누구이며 그 배우는 어떤 연극에 출연했나요?","source":"pdf","topic":"공연","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.88 · M088_1","family":"play","cue":"코미디 연극 → 가상 배우 Alex → The Dinner","lines":[{"en":"I enjoy small comedy plays about everyday life.","ko":"저는 일상생활을 다룬 작은 코미디 연극을 좋아해요.","shared":false},{"en":"The stories are easy to follow, and I like watching actors react to each other on stage.","ko":"이야기를 이해하기 쉽고 배우들이 무대에서 서로 반응하는 걸 보는 게 좋아요.","shared":false},{"en":"My favorite performer is Alex Kim, who starred in a play called The Dinner.","ko":"제가 좋아하는 배우는 ‘더 디너’라는 연극에 출연한 알렉스 김이에요.","shared":false},{"en":"It is about two friends who try to prepare a special dinner but keep making mistakes.","ko":"특별한 저녁을 준비하려다 계속 실수하는 두 친구 이야기예요.","shared":false},{"en":"Alex plays the nervous host, and his facial expressions make the awkward moments funny.","ko":"알렉스는 긴장한 집주인을 연기하는데 표정 때문에 어색한 순간이 재미있어져요.","shared":false},{"en":"He can make the audience laugh without shouting or using complicated jokes.","ko":"소리 지르거나 복잡한 농담을 하지 않고도 관객을 웃겨요.","shared":false},{"en":"I like that warm style because I leave the theater feeling relaxed.","ko":"공연장을 나올 때 편안해져서 그런 따뜻한 스타일을 좋아해요.","shared":false}],"note":"play는 연극입니다. 콘서트 답변으로 바꾸지 않습니다. 작품·배우 이름은 연습용 가상 설정입니다.","sources":[{"id":"M088_1","label":"오픽만수르 IM2–IH · p.88 · M088_1"}],"correction":"","scope":"설문 중심","requirements":["설문에서 연극 보기를 즐긴다고 했습니다.","어떤 종류의 연극을 가장 좋아하나요?","좋아하는 공연자는 누구이며 그 배우는 어떤 연극에 출연했나요?"],"words":93,"representative":"M088_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M090_2","page":90,"title":"가장 좋아하는 공연장 묘사하기","q":"You indicated in the survey that you enjoy watching plays. Which theater or auditorium do you like the most? Where is it located? What does it look like? How often do you go there? What performances are often held in that theater? Give me many details.","qko":"당신은 설문조사에서 공연 보는 것을 좋아한다고 했습니다. 어떤 영화관이나 극 장을 자주 가시나요? 어디에 있나요? 어떻게 생겼나요? 얼마나 자주 거기에 가나 요? 어떤 공연이 거기서 자주 개최되나요? 많은 세부사항을 알려주세요.","source":"pdf","topic":"공연","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.90 · M090_2","family":"play-venue","cue":"서울 작은 극장 → 무대 가까움 → 반년마다","lines":[{"en":"My favorite theater is a small place in Seoul near a subway station.","ko":"제가 좋아하는 극장은 서울의 지하철역 근처 작은 극장이에요.","shared":false},{"en":"I go there about twice a year, usually with Min.","ko":"보통 민이와 일 년에 두 번 정도 가요.","shared":false},{"en":"The entrance is simple, with posters beside the ticket desk.","ko":"입구는 단순하고 매표소 옆에 포스터들이 있어요.","shared":false},{"en":"Inside, there are several rows of dark seats facing a low stage.","ko":"안에는 낮은 무대를 향해 어두운 색 좌석들이 여러 줄 놓여 있어요.","shared":false},{"en":"The theater mainly puts on comedies and small plays about everyday relationships.","ko":"주로 코미디와 일상적인 관계를 다룬 작은 연극을 올려요.","shared":false},{"en":"I like sitting close enough to see the actors' faces clearly.","ko":"배우들의 얼굴을 뚜렷하게 볼 만큼 가까이 앉는 게 좋아요.","shared":false},{"en":"Unlike a huge hall, the room makes even a quiet conversation on stage feel personal.","ko":"큰 공연장과 달리 무대의 조용한 대화도 가까이서 느껴져요.","shared":false},{"en":"That is why I keep choosing this place for a relaxed evening out.","ko":"그래서 편안하게 저녁 외출을 하고 싶을 때 계속 이곳을 골라요.","shared":false}],"note":"","sources":[{"id":"M090_2","label":"오픽만수르 IM2–IH · p.90 · M090_2"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 공연 보는 것을 좋아한다고 했습니다.","어떤 영화관이나 극 장을 자주 가시나요?","어디에 있나요?","어떻게 생겼나요?","얼마나 자주 거기에 가나 요?","어떤 공연이 거기서 자주 개최되나요?","많은 세부사항을 알려주세요."],"words":96,"representative":"M090_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M092_3","page":92,"title":"공연장에서 하는 일","q":"What is your typical day when you go to the auditorium? What do you do before you watch a play? What about after? Please describe your routine in detail.","qko":"공연장에 갈 때 당신의 일반적인 하루는 어떤가요? 공연을 보기 전에 무엇을 하시나요? 공연 후에는 어떤가요? 당신의 일과(루틴)에 대해 자세히 말해주세요.","source":"pdf","topic":"공연","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.92 · M092_3","family":"play-routine","cue":"예매 → 민과 식사 → 일찍 입장 → 감상 대화","lines":[{"en":"Before seeing a play, I book the tickets online and check the theater's location.","ko":"연극을 보기 전에 온라인으로 예매하고 극장 위치를 확인해요.","shared":false},{"en":"I usually go with Min because we enjoy the same kind of comedy.","ko":"같은 종류의 코미디를 좋아해서 보통 민이와 가요.","shared":false},{"en":"We have a light meal nearby and arrive about thirty minutes early.","ko":"근처에서 가볍게 먹고 30분쯤 일찍 도착해요.","shared":false},{"en":"I collect the tickets, use the restroom, and check our seat numbers.","ko":"표를 받고 화장실에 간 뒤 좌석 번호를 확인해요.","shared":false},{"en":"Before the play starts, I silence my phone and put my bag under my seat.","ko":"연극 시작 전에 휴대폰을 무음으로 하고 가방을 좌석 아래에 둬요.","shared":false},{"en":"Afterward, we stop at a cafe and talk about the funniest scene.","ko":"끝난 뒤에는 카페에 들러 가장 웃겼던 장면을 이야기해요.","shared":false},{"en":"Then we take the subway home before it gets too late.","ko":"그리고 너무 늦기 전에 지하철을 타고 집에 가요.","shared":true},{"en":"The conversation afterward is almost as enjoyable as the play itself.","ko":"공연 후의 대화도 연극 자체만큼 즐거워요.","shared":false}],"note":"","sources":[{"id":"M092_3","label":"오픽만수르 IM2–IH · p.92 · M092_3"}],"correction":"","scope":"설문 중심","requirements":["공연장에 갈 때 당신의 일반적인 하루는 어떤가요?","공연을 보기 전에 무엇을 하시나요?","공연 후에는 어떤가요?","당신의 일과(루틴)에 대해 자세히 말해주세요."],"words":100,"representative":"M092_3","additional":0,"sharedCount":1,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M094_4","page":94,"title":"기억에 남는 공연, 과거 경험","q":"Can you tell me about the most memorable play you have seen? What play did you see? What do you remember about that play? Who was the main performer? What made it so special? How did it feel when you were watching it? Give as many details as you can.","qko":"가장 기억에 남는 연극을 말하세요. 어떤 연극을 봤고 무엇이 기억나나요? 주연은 누구였나요? 무엇이 특별했고 볼 때 어떤 기분이었나요? 자세히 설명하세요.","source":"pdf","topic":"공연","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.94 · M094_4","family":"play-memory","cue":"지난가을 → 민 → 더 디너 → 식탁 실수 → 웃음","lines":[{"en":"The most memorable play I saw was The Dinner at a small theater in Seoul last fall.","ko":"가장 기억에 남는 연극은 지난가을 서울의 작은 극장에서 본 ‘더 디너’예요.","shared":false},{"en":"I went with Min, and we sat only a few rows from the stage.","ko":"민이와 갔고 무대에서 몇 줄 떨어진 곳에 앉았어요.","shared":false},{"en":"Alex Kim played a host trying to hide all the mistakes he had made while cooking.","ko":"알렉스 김은 요리 중 실수를 감추려는 집주인을 연기했어요.","shared":false},{"en":"In one scene, he put an empty pot on the table and pretended dinner was ready.","ko":"한 장면에서는 빈 냄비를 식탁에 올리고 저녁이 준비된 척했어요.","shared":false},{"en":"The other actor slowly looked inside, and the whole audience burst out laughing.","ko":"다른 배우가 천천히 안을 들여다보자 관객 모두가 웃음을 터뜨렸어요.","shared":false},{"en":"I could clearly see their expressions, which made the scene even better.","ko":"표정이 잘 보여서 그 장면이 더 재미있었어요.","shared":false},{"en":"I felt completely absorbed and forgot about my worries for a while.","ko":"완전히 몰입해서 걱정을 잠시 잊었어요.","shared":false},{"en":"Min and I still laugh about that empty pot, so the memory has stayed with me.","ko":"민이와 아직도 그 빈 냄비 이야기를 하며 웃어서 기억에 남아요.","shared":false}],"note":"작품과 배우는 연습용 가상 설정. 연극의 장면·배우·감정을 유지합니다.","sources":[{"id":"M094_4","label":"오픽만수르 IM2–IH · p.94 · M094_4"}],"correction":"같은 페이지에 경험 질문과 취향 변화 질문이 함께 있지만 요구가 달라 카드 두 개로 분리했습니다.","scope":"설문 중심","requirements":["가장 기억에 남는 연극을 말하세요.","어떤 연극을 봤고 무엇이 기억나나요?","주연은 누구였나요?","무엇이 특별했고 볼 때 어떤 기분이었나요?","자세히 설명하세요."],"words":116,"representative":"M094_4","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M094_5","page":94,"title":"공연 취향 변화 비교","q":"How has your interest in plays changed over the last few years? What kind of play did you like in the past? What about now?","qko":"최근 몇 년간 당신의 공연 취향은 어떻게 변화했나요? 과거에는 어떤 종류의 공 연을 좋아하셨나요? 지금은 어떤가요?","source":"pdf","topic":"공연","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.94 · M094_5","family":"play-change","cue":"과거 동화극 → 현재 일상 코미디 → 공감","lines":[{"en":"My taste in plays has changed from simple fantasy stories to everyday comedies.","ko":"연극 취향이 단순한 판타지 이야기에서 일상 코미디로 바뀌었어요.","shared":false},{"en":"When I was younger, I liked colorful costumes and clear heroes and villains.","ko":"어릴 때는 화려한 의상과 뚜렷한 영웅·악당 구도가 좋았어요.","shared":false},{"en":"I mainly watched family shows with my parents.","ko":"주로 부모님과 가족용 공연을 봤어요.","shared":false},{"en":"Over the last few years, I have become more interested in realistic characters.","ko":"최근 몇 년 동안은 현실적인 인물에 더 관심이 생겼어요.","shared":false},{"en":"Now I enjoy small plays about friendship, cooking, or living alone.","ko":"지금은 우정이나 요리, 혼자 사는 생활을 다룬 작은 연극이 좋아요.","shared":false},{"en":"For example, The Dinner made me laugh because I have made similar mistakes in my kitchen.","ko":"예를 들어 ‘더 디너’는 저도 부엌에서 비슷한 실수를 해서 재미있었어요.","shared":false},{"en":"I still like an entertaining story, but being able to relate to it matters more now.","ko":"재미있는 이야기는 여전히 좋지만 지금은 공감할 수 있는지가 더 중요해요.","shared":false}],"note":"","sources":[{"id":"M094_5","label":"오픽만수르 IM2–IH · p.94 · M094_5"}],"correction":"","scope":"설문 중심","requirements":["최근 몇 년간 당신의 공연 취향은 어떻게 변화했나요?","과거에는 어떤 종류의 공 연을 좋아하셨나요?","지금은 어떤가요?"],"words":90,"representative":"M094_5","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M096_1","page":96,"title":"좋아하는 콘서트 묘사","q":"You indicated in the survey that you would like to go to a concert. What kind of concert do you like the most? Why do you like that concert? Please tell me about it in detail.","qko":"당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다. 어떤 콘서트를 가장 좋아하시나요? 그 콘서트를 왜 좋아하나요? 자세히 말씀해주세요.","source":"pdf","topic":"콘서트","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.96 · M096_1","family":"concert","cue":"팝 콘서트 → 가상 가수 June → 함께 노래","lines":[{"en":"I like small pop concerts where I can hear the singer clearly.","ko":"가수의 목소리를 뚜렷하게 들을 수 있는 작은 팝 콘서트를 좋아해요.","shared":false},{"en":"My favorite singer is June, whose songs have simple melodies and warm lyrics.","ko":"제가 좋아하는 가수는 단순한 멜로디와 따뜻한 가사의 노래를 부르는 준이에요.","shared":false},{"en":"Her concerts usually include a few quiet songs and some lively ones.","ko":"준이의 콘서트에는 보통 잔잔한 노래와 신나는 노래가 모두 있어요.","shared":false},{"en":"I enjoy hearing familiar songs performed a little differently from the recordings.","ko":"익숙한 노래를 음원과 조금 다르게 부르는 걸 듣는 게 좋아요.","shared":false},{"en":"Between songs, she tells short stories, so the show feels friendly.","ko":"곡 사이에는 짧은 이야기를 해서 친근하게 느껴져요.","shared":false},{"en":"The best part is when the audience sings the chorus together.","ko":"가장 좋은 순간은 관객이 후렴을 함께 부를 때예요.","shared":false},{"en":"I feel connected to the people around me even though I don't know them.","ko":"주변 사람들을 모르는데도 함께한다는 느낌이 들어요.","shared":false},{"en":"That shared feeling is something I can't get from listening alone at home.","ko":"혼자 집에서 들을 때는 얻기 어려운 느낌이에요.","shared":false}],"note":"June은 연습용 가상 가수입니다. 음악·콘서트 소재에서 일관되게 사용합니다.","sources":[{"id":"M096_1","label":"오픽만수르 IM2–IH · p.96 · M096_1"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다.","어떤 콘서트를 가장 좋아하시나요?","그 콘서트를 왜 좋아하나요?","자세히 말씀해주세요."],"words":98,"representative":"M096_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M097_2","page":97,"title":"가장 좋아하는 콘서트장 묘사하기","q":"You indicated in the survey that you like going to concerts. Tell me about a theater or auditorium you often go to. Where is it located? What do you like about that place? Tell me about the concert you watched at this venue in detail.","qko":"당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다. 자주 가는 극장이나 공연장에 대해 말해주세요. 위치가 어디인가요? 그 장소의 무엇을 좋아하시나요? 이 장소에서 본 콘서트에 대해 말해주세요.","source":"pdf","topic":"콘서트","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.97 · M097_2","family":"concert-memory","cue":"작년 가을 → 서울 홀 → 민 → June → 후렴","lines":[{"en":"Last fall, I went to June's pop concert with Min at a small concert hall in Seoul.","ko":"지난가을 민이와 서울의 작은 공연장에서 준이의 팝 콘서트를 봤어요.","shared":true},{"en":"The hall was near a subway station, and the stage was easy to see from our seats.","ko":"공연장은 지하철역 근처였고 우리 자리에서 무대가 잘 보였어요.","shared":true},{"en":"I don't attend concerts often, but this one was worth the trip.","ko":"콘서트에 자주 가진 않지만 이 공연은 갈 만했어요.","shared":true},{"en":"My favorite moment was during her song, A Quiet Day.","ko":"가장 좋았던 순간은 ‘어 콰이어트 데이’라는 노래를 부를 때였어요.","shared":true},{"en":"She lowered her microphone, and the audience sang the chorus together.","ko":"가수가 마이크를 내리자 관객이 후렴을 함께 불렀어요.","shared":true},{"en":"Min and I joined in, and I felt a little emotional hearing so many voices.","ko":"민이와 저도 함께 불렀고 많은 목소리를 들으니 조금 뭉클했어요.","shared":true},{"en":"The song sounded warmer and more powerful than it did through my earphones.","ko":"이어폰으로 들을 때보다 더 따뜻하고 힘 있게 들렸어요.","shared":true},{"en":"I still remember that feeling whenever I hear the song at home.","ko":"집에서 그 노래를 들을 때마다 그 느낌이 떠올라요.","shared":true}],"note":"공연장 질문에는 위치·시야와 그곳에서 본 콘서트, 경험 질문에는 시점·동행·사건이 핵심입니다.","sources":[{"id":"M097_2","label":"오픽만수르 IM2–IH · p.97 · M097_2"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 콘서트 보기를 좋아한다고 했습니다.","자주 가는 극장이나 공연장에 대해 말해주세요.","위치가 어디인가요?","그 장소의 무엇을 좋아하시나요?","이 장소에서 본 콘서트에 대해 말해주세요."],"words":107,"representative":"M097_2","additional":0,"sharedCount":8,"related":["M099_4","M105_4","H6_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M098_3","page":98,"title":"콘서트장에서 하는 일","q":"What is your routine when you go to the auditorium? What do you do before the concert and after? Please describe your routine in as much detail as possible.","qko":"공연장에 가면 어떤 활동을 하시나요? 콘서트 전과 후에 무엇을 하시나요? 당신의 활동 순서를 최대한 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.98 · M098_3","family":"concert-routine","cue":"예매 → 식사 → 좌석 → 공연 후 카페","lines":[{"en":"Before a concert, I book the tickets online and check the route to the hall.","ko":"콘서트 전에 온라인으로 표를 사고 공연장까지의 경로를 확인해요.","shared":false},{"en":"I usually go with Min, and we have a light meal nearby.","ko":"보통 민이와 가고 근처에서 가볍게 식사해요.","shared":false},{"en":"We arrive about thirty minutes early so we don't have to rush.","ko":"서두르지 않도록 30분 정도 일찍 도착해요.","shared":false},{"en":"I show my ticket, find my seat, and put my phone on silent.","ko":"표를 보여주고 자리를 찾은 뒤 휴대폰을 무음으로 바꿔요.","shared":false},{"en":"During the show, I listen carefully and sing along when the singer invites us to.","ko":"공연 중에는 집중해서 듣고 가수가 함께 부르자고 하면 따라 불러요.","shared":false},{"en":"Afterward, we stop at a cafe and talk about our favorite songs.","ko":"끝난 뒤 카페에 들러 가장 좋았던 노래를 이야기해요.","shared":false},{"en":"Then we take the subway home before it gets too late.","ko":"그리고 너무 늦기 전에 지하철을 타고 집에 가요.","shared":true},{"en":"Planning the simple things in advance lets me enjoy the show more.","ko":"간단한 것을 미리 준비해 두면 공연을 더 즐길 수 있어요.","shared":false}],"note":"","sources":[{"id":"M098_3","label":"오픽만수르 IM2–IH · p.98 · M098_3"}],"correction":"","scope":"설문 중심","requirements":["공연장에 가면 어떤 활동을 하시나요?","콘서트 전과 후에 무엇을 하시나요?","당신의 활동 순서를 최대한 자세히 말해주세요."],"words":102,"representative":"M098_3","additional":0,"sharedCount":1,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M099_4","page":99,"title":"기억에 남는 콘서트, 과거 경험","q":"Tell me about the most memorable concert you have seen. When was it, and where was it held? Who was the singer? How did you feel when you were watching the concert? Provide as many details as possible.","qko":"가장 기억에 남는 콘서트에 대해 말해주세요. 언제, 어디서였나요? 가수는 누구였 나요? 그 콘서트를 볼 때 어떤 기분이었나요? 최대한 자세히 말해주세요.","source":"pdf","topic":"콘서트","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.99 · M099_4","family":"concert-memory","cue":"작년 가을 → 서울 홀 → 민 → June → 후렴","lines":[{"en":"Last fall, I went to June's pop concert with Min at a small concert hall in Seoul.","ko":"지난가을 민이와 서울의 작은 공연장에서 준이의 팝 콘서트를 봤어요.","shared":true},{"en":"The hall was near a subway station, and the stage was easy to see from our seats.","ko":"공연장은 지하철역 근처였고 우리 자리에서 무대가 잘 보였어요.","shared":true},{"en":"I don't attend concerts often, but this one was worth the trip.","ko":"콘서트에 자주 가진 않지만 이 공연은 갈 만했어요.","shared":true},{"en":"My favorite moment was during her song, A Quiet Day.","ko":"가장 좋았던 순간은 ‘어 콰이어트 데이’라는 노래를 부를 때였어요.","shared":true},{"en":"She lowered her microphone, and the audience sang the chorus together.","ko":"가수가 마이크를 내리자 관객이 후렴을 함께 불렀어요.","shared":true},{"en":"Min and I joined in, and I felt a little emotional hearing so many voices.","ko":"민이와 저도 함께 불렀고 많은 목소리를 들으니 조금 뭉클했어요.","shared":true},{"en":"The song sounded warmer and more powerful than it did through my earphones.","ko":"이어폰으로 들을 때보다 더 따뜻하고 힘 있게 들렸어요.","shared":true},{"en":"I still remember that feeling whenever I hear the song at home.","ko":"집에서 그 노래를 들을 때마다 그 느낌이 떠올라요.","shared":true}],"note":"공연장 질문에는 위치·시야와 그곳에서 본 콘서트, 경험 질문에는 시점·동행·사건이 핵심입니다.","sources":[{"id":"M099_4","label":"오픽만수르 IM2–IH · p.99 · M099_4"}],"correction":"","scope":"설문 중심","requirements":["가장 기억에 남는 콘서트에 대해 말해주세요.","언제, 어디서였나요?","가수는 누구였 나요?","그 콘서트를 볼 때 어떤 기분이었나요?","최대한 자세히 말해주세요."],"words":107,"representative":"M097_2","additional":0,"sharedCount":8,"related":["M097_2","M105_4","H6_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M100_5","page":100,"title":"콘서트 취향 변화 비교","q":"How has your interest in concerts changed over the last few years? What kind of play did you like in the past? What about now?","qko":"최근 몇 년간 콘서트에 대한 관심이 어떻게 변했나요? 예전에는 어떤 종류의 연극(play)을 좋아했나요? 지금은 어떤가요? ※ 원문에서 concerts와 play를 혼용합니다.","source":"pdf","topic":"콘서트","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.100 · M100_5","family":"concert-change","cue":"예전 큰 무대 → 지금 작은 팝 공연 → 목소리","lines":[{"en":"My interest in concerts has shifted from big, flashy shows to smaller pop performances.","ko":"콘서트 관심이 크고 화려한 쇼에서 작은 팝 공연으로 바뀌었어요.","shared":false},{"en":"In the past, I mainly cared about dancing, bright lights, and the size of the stage.","ko":"예전에는 주로 춤, 밝은 조명, 무대 크기에 관심이 있었어요.","shared":false},{"en":"I also enjoyed simple comedy plays when I went to a theater.","ko":"극장에 갈 때는 단순한 코미디 연극도 좋아했어요.","shared":false},{"en":"These days, I pay more attention to the singer's voice and the meaning of the songs.","ko":"요즘에는 가수의 목소리와 가사의 의미에 더 집중해요.","shared":false},{"en":"A small hall lets me hear the details and feel closer to the performer.","ko":"작은 공연장에서는 세세한 소리를 듣고 공연자를 가깝게 느낄 수 있어요.","shared":false},{"en":"June's concert last fall helped change my preference because the quiet songs moved me most.","ko":"지난가을 준이 콘서트의 잔잔한 곡들이 가장 감동적이어서 취향이 바뀌는 계기가 됐어요.","shared":false},{"en":"I still enjoy an exciting show, but I don't need a huge stage to have a good time.","ko":"신나는 공연도 좋지만 즐기기 위해 큰 무대가 꼭 필요한 건 아니에요.","shared":false}],"note":"원문은 concerts와 play를 혼용합니다. 원문을 보존하고 답변에 예전 연극 취향도 한 문장 포함했습니다. 교정 제안: kind of play → kind of concert.","sources":[{"id":"M100_5","label":"오픽만수르 IM2–IH · p.100 · M100_5"}],"correction":"원문은 concerts와 play를 혼용합니다. 문맥상 kind of concert를 의도했을 가능성이 있지만 질문은 바꾸지 않았습니다.","scope":"설문 중심","requirements":["최근 몇 년간 콘서트에 대한 관심이 어떻게 변했나요?","예전에는 어떤 종류의 연극(play)을 좋아했나요?","지금은 어떤가요?"],"words":105,"representative":"M100_5","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M101_1","page":101,"title":"좋아하는 가수 묘사","q":"You indicated in the survey that you like listening to music. What types of music do you like? Who is your favorite singer or composer? Why do you like him or her? (singer = musician = performer)","qko":"당신은 설문조사에서 음악감상을 즐긴다고 답했습니다. 어떤 음악을 좋아하나요? 당신이 가장 좋아하는 가수는 누구입니까? 왜 그 또는 그녀를 좋아하시나요?","source":"pdf","topic":"음악","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.101 · M101_1","family":"music","cue":"팝·어쿠스틱 → June·Alex → 멜로디·기분","lines":[{"en":"I mostly listen to pop and acoustic music because I like clear melodies.","ko":"뚜렷한 멜로디가 좋아서 주로 팝과 어쿠스틱 음악을 들어요.","shared":true},{"en":"My favorite singer is June, and I especially like her song A Quiet Day.","ko":"좋아하는 가수는 준이고 특히 ‘어 콰이어트 데이’라는 노래가 좋아요.","shared":true},{"en":"Her voice is warm, and the lyrics describe ordinary feelings in a simple way.","ko":"목소리가 따뜻하고 가사는 평범한 감정을 단순하게 표현해요.","shared":true},{"en":"Another artist I enjoy is Alex, who sings with an acoustic guitar.","ko":"또 좋아하는 아티스트는 어쿠스틱 기타를 치며 노래하는 알렉스예요.","shared":true},{"en":"June's lively songs give me energy, while Alex's quieter songs help me relax.","ko":"준이의 경쾌한 노래는 힘이 나고 알렉스의 잔잔한 노래는 긴장을 풀어줘요.","shared":true},{"en":"I usually listen in the evening or while taking a bus.","ko":"보통 저녁이나 버스를 탈 때 들어요.","shared":true},{"en":"I don't need complicated music; I want songs that match my mood and are easy to remember.","ko":"복잡한 음악보다 기분에 맞고 기억하기 쉬운 노래가 좋아요.","shared":true}],"note":"June·Alex·곡명은 연습용 설정. 실제 가수의 이력이나 최신 사실을 주장하지 않습니다.","sources":[{"id":"M101_1","label":"오픽만수르 IM2–IH · p.101 · M101_1"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 음악감상을 즐긴다고 답했습니다.","어떤 음악을 좋아하나요?","당신이 가장 좋아하는 가수는 누구입니까?","왜 그 또는 그녀를 좋아하시나요?"],"words":94,"representative":"M101_1","additional":0,"sharedCount":7,"related":["H6_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M103_2","page":103,"title":"노래, 음악 듣는 방법 설명","q":"You indicated in the survey that you like listening to music. What kind of device do you use when you listen to music? Which gadget do you usually use? Please explain the devices in detail.","qko":"당신은 설문조사에서 음악 감상을 좋아한다고 답했습니다. 음악을 들을 때 어떤 기기를 사용하시나요? 어떤 기기를 주로 사용하시나요? 당신이 사용하는 장비에 대해 자세히 말해주세요.","source":"pdf","topic":"음악","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.103 · M103_2","family":"music-device","cue":"폰·이어폰 → 다운로드 → 스피커·MP3 비교","lines":[{"en":"I usually listen to music on my smartphone with wireless earphones.","ko":"저는 보통 스마트폰과 무선 이어폰으로 음악을 들어요.","shared":true},{"en":"The phone fits in my pocket, and I can choose songs or make playlists in an app.","ko":"휴대폰은 주머니에 들어가고 앱에서 노래를 고르거나 재생목록을 만들 수 있어요.","shared":true},{"en":"I download some songs before a trip so I can listen without a connection.","ko":"여행 전에는 인터넷 없이 들으려고 노래를 내려받아요.","shared":true},{"en":"The earphones are light, and their case charges them when I am not using them.","ko":"이어폰은 가볍고 사용하지 않을 때 케이스가 충전해 줘요.","shared":true},{"en":"At home, I sometimes use a small wireless speaker because it fills the room with sound.","ko":"집에서는 방 안에 소리가 퍼지도록 작은 무선 스피커를 쓰기도 해요.","shared":true},{"en":"People can also use computers or separate MP3 players, but a phone is more convenient for me.","ko":"컴퓨터나 별도 MP3도 쓸 수 있지만 저에게는 휴대폰이 더 편해요.","shared":true},{"en":"Among the people I know in Korea, phones and wireless earphones seem to be the most popular combination.","ko":"제가 아는 한국 사람들 사이에서는 폰과 무선 이어폰 조합이 가장 인기 있어 보여요.","shared":true},{"en":"I keep the volume comfortable so I can enjoy the music without feeling tired.","ko":"피곤해지지 않도록 편안한 음량으로 들어요.","shared":true}],"note":"","sources":[{"id":"M103_2","label":"오픽만수르 IM2–IH · p.103 · M103_2"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 음악 감상을 좋아한다고 답했습니다.","음악을 들을 때 어떤 기기를 사용하시나요?","어떤 기기를 주로 사용하시나요?","당신이 사용하는 장비에 대해 자세히 말해주세요."],"words":122,"representative":"M103_2","additional":0,"sharedCount":8,"related":["M303_15","H1_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M105_3","page":105,"title":"처음 음악 흥미를 가진 계기, 과거 경험","q":"How did you first become interested in listening to music? What kind of music did you listen to when you were young? What was your favorite song? And how has your taste in music changed over time?","qko":"어떻게 처음 음악 감상에 흥미를 가지셨나요? 어릴 때 어떤 음악을 들으셨나요? 가장 좋아하는 노래는 무엇인가요? 당신의 음악 취향은 어떻게 변화했나요?","source":"pdf","topic":"음악","type":"처음·계기 + 변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.105 · M105_3","family":"music-start","cue":"중학생 → 가족 컴퓨터 → 댄스 → 현재 어쿠스틱","lines":[{"en":"I first became interested in music when I was in middle school.","ko":"중학생 때 처음 음악에 관심이 생겼어요.","shared":true},{"en":"Min played a lively pop song called Bright Morning on our family computer.","ko":"민이가 저희 가족 컴퓨터로 ‘브라이트 모닝’이라는 신나는 팝송을 들려줬어요.","shared":true},{"en":"I liked the chorus so much that I listened to it again and again.","ko":"후렴이 너무 좋아서 계속 반복해서 들었어요.","shared":true},{"en":"At that time, I mostly enjoyed fast dance music because it made me feel excited.","ko":"그때는 신이 나서 주로 빠른 댄스 음악을 좋아했어요.","shared":true},{"en":"I later started listening on my own phone with earphones.","ko":"나중에는 제 휴대폰에 이어폰을 연결해 듣기 시작했어요.","shared":true},{"en":"Now I still like pop, but I also enjoy quiet acoustic songs in the evening.","ko":"지금도 팝을 좋아하지만 저녁에는 조용한 어쿠스틱 곡도 즐겨요.","shared":true},{"en":"For example, June's A Quiet Day helps me relax instead of making me want to dance.","ko":"예를 들어 준이의 ‘어 콰이어트 데이’는 춤추고 싶게 하기보다 편안하게 해줘요.","shared":true},{"en":"My taste has become wider because I choose different music for different moods.","ko":"기분에 따라 다른 음악을 골라서 취향이 넓어졌어요.","shared":true}],"note":"","sources":[{"id":"M105_3","label":"오픽만수르 IM2–IH · p.105 · M105_3"}],"correction":"","scope":"설문 중심","requirements":["어떻게 처음 음악 감상에 흥미를 가지셨나요?","어릴 때 어떤 음악을 들으셨나요?","가장 좋아하는 노래는 무엇인가요?","당신의 음악 취향은 어떻게 변화했나요?"],"words":108,"representative":"M105_3","additional":0,"sharedCount":8,"related":["H6_09"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M105_4","page":105,"title":"가장 좋아하는 노래 설명, 과거 경험","q":"Tell me about a memorable experience you have had while listening to music. Did you listen to your favorite song? When was it, and w
