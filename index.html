tle":"자주 가는 영화관의 위치, 특별한 점, 좋아하는 이유를 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q05","family":"movie-venue","cue":"역 근처 극장 → 넓은 의자 → 스몰 미스테이크스","lines":[{"en":"The movie theater I use most is inside a shopping mall near my local station.","ko":"가장 자주 가는 영화관은 동네 역 근처 쇼핑몰 안에 있어요.","shared":true},{"en":"I only go occasionally, but it is easy to reach by subway.","ko":"가끔 가지만 지하철로 가기 편해요.","shared":true},{"en":"The lobby is bright, with ticket machines on one side and a snack counter on the other.","ko":"밝은 로비 한쪽에는 발권기, 다른 쪽에는 매점이 있어요.","shared":true},{"en":"Inside the screening rooms, the seats are wide and there is enough space for my legs.","ko":"상영관 안에는 좌석이 넓고 다리를 놓을 공간도 충분해요.","shared":true},{"en":"I like it because I can see the screen comfortably without sitting too close.","ko":"너무 가까이 앉지 않아도 화면을 편하게 볼 수 있어 좋아요.","shared":true},{"en":"The last film I saw there was Small Mistakes, a comedy about two friends opening a restaurant.","ko":"마지막으로 거기서 본 건 두 친구가 식당을 여는 코미디 ‘스몰 미스테이크스’예요.","shared":true},{"en":"Min and I enjoyed it and talked about the funny scenes on the way home.","ko":"민이와 즐겁게 보고 집에 가며 웃긴 장면을 이야기했어요.","shared":true}],"note":"","sources":[{"id":"H4_05","label":"해커스 오픽 매뉴얼 · 사진 4 · Q05"}],"correction":"","scope":"돌발·확장","requirements":["자주 가는 영화관의 위치, 특별한 점, 좋아하는 이유를 말하세요."],"words":106,"representative":"H4_05","additional":0,"sharedCount":7,"related":["M082_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_06","source":"photo","set":4,"number":6,"topic":"영화","q":"Describe your usual routine when you go to watch a movie. What do you do before and after the film? Describe a typical day when you visit a movie theater from start to finish.","qko":"영화 전후 활동을 포함해 영화관 방문의 처음부터 끝까지 보통의 과정을 설명하세요.","title":"영화 전후 활동을 포함해 영화관 방문의 처음부터 끝까지 보통의 과정을 설명하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q06","family":"movie-routine","cue":"민과 예매 → 간식 → 무음 → 카페","lines":[{"en":"I usually watch movies with Min because we both enjoy light comedies.","ko":"민이와 가벼운 코미디를 좋아해서 보통 같이 영화를 봐요.","shared":true},{"en":"Before going, we check the running time and book seats online.","ko":"가기 전에 상영 시간을 확인하고 온라인으로 좌석을 예매해요.","shared":true},{"en":"We meet near the theater and have a quick meal if we are hungry.","ko":"영화관 근처에서 만나 배가 고프면 간단히 먹어요.","shared":true},{"en":"Then we collect the tickets, buy a small snack, and find our seats.","ko":"표를 받고 간식을 조금 산 뒤 자리를 찾아요.","shared":true},{"en":"I silence my phone so I can focus on the film and avoid disturbing others.","ko":"집중하고 다른 사람을 방해하지 않도록 폰을 무음으로 해요.","shared":true},{"en":"After the movie, we go to a cafe and discuss our favorite scenes.","ko":"영화 후에는 카페에서 좋았던 장면을 이야기해요.","shared":true},{"en":"We don't always agree, which makes the conversation interesting.","ko":"항상 의견이 같지는 않아서 대화가 재미있어요.","shared":true},{"en":"Finally, we take the subway home.","ko":"마지막으로 지하철을 타고 집에 가요.","shared":true}],"note":"","sources":[{"id":"H4_06","label":"해커스 오픽 매뉴얼 · 사진 4 · Q06"}],"correction":"","scope":"돌발·확장","requirements":["영화 전후 활동을 포함해 영화관 방문의 처음부터 끝까지 보통의 과정을 설명하세요."],"words":93,"representative":"H4_06","additional":0,"sharedCount":8,"related":["M084_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_07","source":"photo","set":4,"number":7,"topic":"영화","q":"Tell me about something memorable that happened to you at the theater. Please describe the incident and tell me why it was special.","qko":"극장에서 겪은 기억에 남는 사건과 특별했던 이유를 말하세요.","title":"극장에서 겪은 기억에 남는 사건과 특별했던 이유를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q07","family":"movie-last","cue":"지난달 민 → 코미디 → 관객 웃음 → 카페","lines":[{"en":"The last movie I went to see was Small Mistakes, a comedy, last month.","ko":"최근 보러 간 영화는 지난달의 코미디 ‘스몰 미스테이크스’예요.","shared":true},{"en":"I went with Min to the theater near my local station.","ko":"민이와 동네 역 근처 영화관에 갔어요.","shared":true},{"en":"Before the movie, we had noodles and picked up our tickets.","ko":"영화 전에 국수를 먹고 표를 받았어요.","shared":true},{"en":"The film was about two friends struggling to open a restaurant.","ko":"영화는 식당을 열려고 애쓰는 두 친구 이야기였어요.","shared":true},{"en":"During one scene, a waiter carried an empty plate to a customer, and everyone laughed.","ko":"한 장면에서 종업원이 빈 접시를 손님에게 가져가 모두 웃었어요.","shared":true},{"en":"Hearing the whole room laugh together made the scene more enjoyable than watching alone.","ko":"혼자 볼 때보다 상영관 전체가 함께 웃으니 더 즐거웠어요.","shared":true},{"en":"Afterward, Min and I went to a cafe and talked about our own cooking mistakes.","ko":"끝난 뒤 민이와 카페에 가서 우리 요리 실수들을 이야기했어요.","shared":true},{"en":"It was a simple outing, but I went home in a much better mood.","ko":"소박한 외출이었지만 훨씬 좋은 기분으로 집에 갔어요.","shared":true}],"note":"","sources":[{"id":"H4_07","label":"해커스 오픽 매뉴얼 · 사진 4 · Q07"}],"correction":"","scope":"돌발·확장","requirements":["극장에서 겪은 기억에 남는 사건과 특별했던 이유를 말하세요."],"words":105,"representative":"H2_03","additional":0,"sharedCount":8,"related":["H2_03"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_09","source":"photo","set":4,"number":9,"topic":"국내여행","q":"People must prepare before they travel. What do you do to prepare for travel? Do you do research in advance or make reservations? What special things do you do? Please describe your preparations in detail.","qko":"여행 전 조사, 예약과 특별히 하는 준비를 포함해 준비 과정을 자세히 말하세요.","title":"여행 전 조사, 예약과 특별히 하는 준비를 포함해 준비 과정을 자세히 말하세요.","type":"절차·준비","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q09","family":"travel-pack","cue":"예산·날씨 → 교통·숙소 → 옷·충전기 → 저장","lines":[{"en":"Before a trip, I first choose the dates and decide how much I can spend.","ko":"여행 전에 먼저 날짜와 예산을 정해요.","shared":true},{"en":"Then I check the weather and read a few recent reviews of the area.","ko":"그다음 날씨와 여행지의 최근 후기 몇 개를 확인해요.","shared":true},{"en":"I book transportation and accommodation early so I know where I will sleep.","ko":"어디서 잘지 정해지도록 교통편과 숙소를 일찍 예약해요.","shared":true},{"en":"I make a short list of places to visit, but I leave some free time.","ko":"방문할 장소를 짧게 정리하되 자유 시간도 남겨둬요.","shared":true},{"en":"In my bag, I put comfortable clothes, basic toiletries, a charger, and a small umbrella.","ko":"가방에는 편한 옷, 기본 세면도구, 충전기, 작은 우산을 넣어요.","shared":true},{"en":"I also save my tickets and the hotel address on my phone for offline use.","ko":"인터넷 없이 볼 수 있도록 표와 호텔 주소를 휴대폰에 저장해요.","shared":true},{"en":"The night before leaving, I check everything against a simple packing list.","ko":"출발 전날 밤에는 간단한 준비물 목록으로 빠진 게 없는지 확인해요.","shared":true},{"en":"This routine helps me avoid small problems without planning every minute.","ko":"이렇게 하면 매분 계획하지 않아도 작은 문제들을 피할 수 있어요.","shared":true}],"note":"","sources":[{"id":"H4_09","label":"해커스 오픽 매뉴얼 · 사진 4 · Q09"}],"correction":"","scope":"설문 중심","requirements":["여행 전 조사, 예약과 특별히 하는 준비를 포함해 준비 과정을 자세히 말하세요."],"words":110,"representative":"M111_2","additional":0,"sharedCount":8,"related":["M111_2","M119_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_11","source":"photo","set":4,"number":11,"topic":"MP3","q":"You want to purchase an MP3 player. One of your friends knows a lot about them. Call this person and ask three or four questions in order to get more information about buying this device.","qko":"MP3 플레이어 구매를 위해 잘 아는 친구에게 전화해 질문 3~4개를 하세요.","title":"MP3 플레이어 구매를 위해 잘 아는 친구에게 전화해 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q11","family":"rp-mp3","cue":"구매 의도 → 모델·용량·배터리·가격","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am thinking about buying an MP3 player because I want to listen to music without using my phone.","ko":"휴대폰을 쓰지 않고 음악을 듣고 싶어서 MP3를 살까 생각 중이에요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which model would you recommend for someone who mainly listens while traveling?","ko":"주로 여행 중 듣는 사람에게 어떤 모델을 추천하나요?","shared":true},{"en":"How much music can it store?","ko":"음악을 얼마나 저장할 수 있나요?","shared":true},{"en":"How long does the battery last on one charge?","ko":"한 번 충전하면 배터리가 얼마나 가나요?","shared":true},{"en":"How much did yours cost, including any accessories you needed?","ko":"필요한 액세서리를 포함해 얼마에 샀나요?","shared":true},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H4_11","label":"해커스 오픽 매뉴얼 · 사진 4 · Q11"}],"correction":"","scope":"역할극","requirements":["MP3 플레이어 구매를 위해 잘 아는 친구에게 전화해 질문 3~4개를 하세요."],"words":84,"representative":"M244_11","additional":0,"sharedCount":8,"related":["M244_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H4_12","source":"photo","set":4,"number":12,"topic":"MP3","q":"Please suggest some solutions for a problem. You broke your friend's MP3 player by accident while borrowing it. Call this friend, and explain the situation. Then, give two or three solutions for how to solve this issue.","qko":"빌린 친구의 MP3를 실수로 고장 냈습니다. 전화해 상황을 설명하고 해결책 2~3개를 제시하세요.","title":"빌린 친구의 MP3를 실수로 고장 냈습니다. 전화해 상황을 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q12","family":"rp-broken","cue":"떨어뜨림 → 화면 고장 → 오늘 수리·대체 기기·구매","lines":[{"en":"Hi Min, I am really sorry, but I accidentally dropped your MP3 player while taking it out of my bag.","ko":"민아, 정말 미안한데 가방에서 꺼내다가 네 MP3를 실수로 떨어뜨렸어.","shared":true},{"en":"The screen is cracked, and it won't turn on now.","ko":"화면에 금이 갔고 지금 켜지지 않아.","shared":true},{"en":"I know you need it soon, so I want to get this sorted out quickly.","ko":"곧 필요한 걸 알아서 빨리 해결하고 싶어.","shared":true},{"en":"First, I can take it to a repair shop today and pay for an urgent repair.","ko":"첫째로 오늘 수리점에 가져가 빠른 수리 비용을 낼 수 있어.","shared":true},{"en":"While it is being repaired, you could use a spare music player I can arrange for you.","ko":"수리하는 동안 내가 마련할 수 있는 여분 기기를 써도 돼.","shared":true},{"en":"If it cannot be fixed quickly, I can buy you the same model or another one you choose.","ko":"빨리 고칠 수 없다면 같은 모델이나 네가 고른 다른 모델을 사줄게.","shared":true},{"en":"Please tell me which option you prefer, and I will handle the cost.","ko":"어떤 방법이 좋은지 알려줘. 비용은 내가 부담할게.","shared":true},{"en":"Again, I am sorry for not being more careful.","ko":"더 조심하지 못해서 다시 한번 미안해.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H4_12","label":"해커스 오픽 매뉴얼 · 사진 4 · Q12"}],"correction":"","scope":"역할극","requirements":["빌린 친구의 MP3를 실수로 고장 냈습니다.","전화해 상황을 설명하고 해결책 2~3개를 제시하세요."],"words":118,"representative":"M245_12","additional":0,"sharedCount":8,"related":["M245_12","M248_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H4_13","source":"photo","set":4,"number":13,"topic":"MP3","q":"Think of a time when something went wrong with an electronic device you had borrowed. What happened? What was the problem? How did you deal with this?","qko":"빌린 전자기기에 문제가 생겼던 경험과 문제, 대처를 설명하세요.","title":"빌린 전자기기에 문제가 생겼던 경험과 문제, 대처를 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q13","family":"device-problem","cue":"빌린 MP3 → 떨어뜨림 → 연락 → 수리·비용","lines":[{"en":"Last year, I borrowed Min's MP3 player for a short trip because my phone battery was unreliable.","ko":"작년에 휴대폰 배터리가 불안정해서 짧은 여행용으로 민이의 MP3를 빌렸어요.","shared":true},{"en":"While taking it out of my bag, I accidentally dropped it on the floor.","ko":"가방에서 꺼내다가 실수로 바닥에 떨어뜨렸어요.","shared":true},{"en":"The screen cracked, and the player wouldn't turn on.","ko":"화면에 금이 가고 켜지지 않았어요.","shared":true},{"en":"I felt terrible because it belonged to a friend who had trusted me.","ko":"저를 믿고 빌려준 친구 물건이라 정말 미안했어요.","shared":true},{"en":"I called Min immediately, explained what happened, and offered to pay for the repair.","ko":"바로 전화해 설명하고 수리비를 내겠다고 했어요.","shared":true},{"en":"The repair shop replaced the screen and checked the battery the next day.","ko":"수리점에서 다음 날 화면을 바꾸고 배터리를 확인했어요.","shared":true},{"en":"I tested it, returned it to Min, and apologized again.","ko":"작동을 확인하고 돌려주며 다시 사과했어요.","shared":true},{"en":"He appreciated my honesty, and I learned to use a protective case for borrowed devices.","ko":"친구는 솔직히 말해줘서 고맙다고 했고 저는 빌린 기기에 보호 케이스를 쓰게 됐어요.","shared":true}],"note":"","sources":[{"id":"H4_13","label":"해커스 오픽 매뉴얼 · 사진 4 · Q13"}],"correction":"","scope":"돌발·확장","requirements":["빌린 전자기기에 문제가 생겼던 경험과 문제, 대처를 설명하세요."],"words":105,"representative":"M246_13","additional":0,"sharedCount":8,"related":["M246_13","M249_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_14","source":"photo","set":4,"number":14,"topic":"명절","q":"Describe a major holiday or event that is celebrated in your country. Have they changed in any way since you were a child? Please tell me about it in detail.","qko":"국내 주요 명절이나 행사를 설명하고 어린 시절 이후 달라진 점을 자세히 말하세요.","title":"국내 주요 명절이나 행사를 설명하고 어린 시절 이후 달라진 점을 자세히 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q14","family":"holiday","cue":"설·추석 → 가족·음식 → 우리 집 모임","lines":[{"en":"Two important holidays in Korea are Seollal and Chuseok.","ko":"한국의 중요한 명절 두 가지는 설날과 추석이에요.","shared":true},{"en":"Seollal is the Lunar New Year, and Chuseok is associated with the autumn harvest.","ko":"설날은 음력 새해이고 추석은 가을 수확과 관련된 명절이에요.","shared":true},{"en":"Many families get together, share food, and spend time with relatives.","ko":"많은 가족이 모여 음식을 나누고 친척들과 시간을 보내요.","shared":true},{"en":"For Seollal, my family usually has rice-cake soup and greets the older relatives.","ko":"설날에 저희 가족은 보통 떡국을 먹고 어른들께 인사해요.","shared":true},{"en":"For Chuseok, we share a meal and sometimes eat songpyeon, a type of rice cake.","ko":"추석에는 함께 식사하고 송편이라는 떡을 먹기도 해요.","shared":true},{"en":"I live alone now, so I visit my parents and help set the table.","ko":"지금은 혼자 살아서 부모님을 찾아뵙고 상 차리는 걸 도와요.","shared":true},{"en":"Not every family celebrates in the same way, but seeing each other matters most to us.","ko":"모든 가족이 똑같이 보내진 않지만 저희는 서로 만나는 게 가장 중요해요.","shared":true},{"en":"For me, these holidays are a chance to slow down and reconnect.","ko":"저에게 명절은 여유를 갖고 다시 가까워질 기회예요.","shared":true},{"en":"When I was a child, we stayed at my grandparents' home for most of the day and cooked everything there.","ko":"어릴 때는 조부모님 댁에서 하루 대부분을 보내고 음식을 모두 거기서 만들었어요.","shared":false},{"en":"Now we sometimes meet for a shorter meal and share the preparation, so one person has less work.","ko":"지금은 짧게 식사하고 준비를 나눠서 한 사람의 일이 줄기도 해요.","shared":false}],"note":"","sources":[{"id":"H4_14","label":"해커스 오픽 매뉴얼 · 사진 4 · Q14"}],"correction":"","scope":"돌발·확장","requirements":["국내 주요 명절이나 행사를 설명하고 어린 시절 이후 달라진 점을 자세히 말하세요."],"words":142,"representative":"M168_1","additional":2,"sharedCount":8,"related":["M168_1","M170_2","M314_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H4_15","source":"photo","set":4,"number":15,"topic":"명절","q":"Are there any problems or issues regarding holidays? How are those issues being addressed?","qko":"명절과 관련한 문제들과 그에 대한 대응을 말하세요.","title":"명절과 관련한 문제들과 그에 대한 대응을 말하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q15","family":"holiday-issue","cue":"교통·가사 부담 → 출발 조절·분담 → 휴식","lines":[{"en":"During major holidays, people often worry about traffic and the amount of preparation.","ko":"큰 명절에는 교통과 준비량을 걱정하는 경우가 많아요.","shared":true},{"en":"Many families travel at similar times, so roads and stations can become crowded.","ko":"많은 가족이 비슷한 시간에 이동해서 도로와 역이 붐빌 수 있어요.","shared":true},{"en":"Preparing a large meal can also put too much work on just one or two people.","ko":"큰 식사를 준비하면 한두 사람에게 일이 몰릴 수도 있어요.","shared":true},{"en":"That can turn a relaxing holiday into a stressful schedule.","ko":"편안해야 할 명절이 부담스러운 일정으로 바뀔 수 있어요.","shared":true},{"en":"Some families leave earlier or later to avoid the busiest travel hours.","ko":"어떤 가족은 붐비는 시간을 피해 일찍 또는 늦게 출발해요.","shared":true},{"en":"Others reduce the menu, share cooking tasks, or eat out together.","ko":"메뉴를 줄이거나 요리를 나누거나 외식하는 가족도 있어요.","shared":true},{"en":"My family tries to divide the preparation and leave time to rest.","ko":"저희 가족은 준비를 나누고 쉴 시간을 남기려고 해요.","shared":true},{"en":"I think the point of a holiday is spending time together, not making everything perfect.","ko":"명절의 목적은 완벽한 준비보다 함께 시간을 보내는 거라고 생각해요.","shared":true}],"note":"","sources":[{"id":"H4_15","label":"해커스 오픽 매뉴얼 · 사진 4 · Q15"}],"correction":"","scope":"돌발·확장","requirements":["명절과 관련한 문제들과 그에 대한 대응을 말하세요."],"words":102,"representative":"M315_15","additional":0,"sharedCount":8,"related":["M315_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_02","source":"photo","set":5,"number":2,"topic":"공원","q":"What activities do you enjoy doing while at the park? For example, do you like to walk or exercise while there? Do you like to go with other people to the park, or do you prefer going alone? Tell me about a normal day at the park for you.","qko":"공원에서 즐기는 활동, 혼자 또는 동행 선호를 포함해 보통의 공원 방문을 설명하세요.","title":"공원에서 즐기는 활동, 혼자 또는 동행 선호를 포함해 보통의 공원 방문을 설명하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q02","family":"walk","cue":"주 2회 저녁 → 가벼운 산책 → 벤치 → 귀가","lines":[{"en":"I go for a light walk in my neighborhood park about twice a week.","ko":"일주일에 두 번 정도 동네 공원에서 가볍게 산책해요.","shared":true},{"en":"I normally go in the early evening when the weather is pleasant.","ko":"날씨가 좋은 날 이른 저녁에 주로 가요.","shared":true},{"en":"I prefer going alone because I can choose my own pace, but Min sometimes joins me.","ko":"제 속도로 걸을 수 있어 혼자가 좋지만 가끔 민이가 함께해요.","shared":true},{"en":"When I arrive, I stretch a little and follow the path around the lawn.","ko":"도착하면 가볍게 몸을 풀고 잔디밭 주변 길을 따라 걸어요.","shared":true},{"en":"I walk for about twenty minutes, then sit on a bench and drink some water.","ko":"20분 정도 걷고 나서 벤치에 앉아 물을 마셔요.","shared":true},{"en":"I watch people passing by before walking back home.","ko":"지나가는 사람들을 구경하다가 집으로 걸어 돌아와요.","shared":true},{"en":"I don't do regular sports or hard workouts; this is mainly a relaxing walk.","ko":"정기적으로 스포츠나 격한 운동을 하는 건 아니고 주로 편하게 산책하는 거예요.","shared":true},{"en":"It clears my head and helps me sleep better at night.","ko":"머리가 맑아지고 밤에 잠도 더 잘 와요.","shared":true}],"note":"걷기 원문입니다. 조깅 답변으로 자동 치환하지 않습니다. 현재는 가벼운 산책, 조깅 사건은 과거의 시도로 구분합니다.","sources":[{"id":"H5_02","label":"해커스 오픽 매뉴얼 · 사진 5 · Q02"}],"correction":"","scope":"설문 중심","requirements":["공원에서 즐기는 활동, 혼자 또는 동행 선호를 포함해 보통의 공원 방문을 설명하세요."],"words":105,"representative":"M048_2","additional":0,"sharedCount":8,"related":["M048_2","M052_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_03","source":"photo","set":5,"number":3,"topic":"공원","q":"Describe a park that you visit frequently and the activities that people do there. What do children do at the park? What do the adults do? Do they do similar or different things? Please tell me about all the details.","qko":"자주 가는 공원과 사람들의 활동을 설명하고 아이와 어른의 활동이 비슷한지 다른지 비교하세요.","title":"자주 가는 공원과 사람들의 활동을 설명하고 아이와 어른의 활동이 비슷한지 다른지 비교하세요.","type":"묘사 + 두 대상 비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q03","family":"park","cue":"집 근처 → 산책로·벤치 → 민 또는 혼자 → 조용함","lines":[{"en":"My favorite park is a small neighborhood park about ten minutes from my apartment.","ko":"제가 좋아하는 공원은 아파트에서 10분 정도 거리의 작은 동네 공원이에요.","shared":true},{"en":"It has a wide walking path, tall trees, and benches around an open lawn.","ko":"넓은 산책로와 큰 나무가 있고 잔디밭 주변에는 벤치가 있어요.","shared":true},{"en":"There is a playground near the entrance and an exercise area farther inside.","ko":"입구 근처에는 놀이터, 안쪽에는 운동 공간이 있어요.","shared":true},{"en":"I usually go alone, but sometimes my friend Min joins me.","ko":"보통 혼자 가지만 가끔 친구 민이가 함께해요.","shared":true},{"en":"Children play on the swings while adults walk or use the exercise equipment.","ko":"아이들은 그네를 타고 어른들은 걷거나 운동 기구를 써요.","shared":true},{"en":"Both groups enjoy being outside, although the children are usually much more active.","ko":"둘 다 야외 활동을 즐기지만 아이들이 보통 훨씬 활발해요.","shared":true},{"en":"My favorite spot is a bench under a large tree because it is cool and quiet.","ko":"제가 좋아하는 자리는 시원하고 조용한 큰 나무 아래 벤치예요.","shared":true},{"en":"I like the park because I can get some fresh air without traveling far.","ko":"멀리 가지 않고도 바람을 쐴 수 있어 좋아요.","shared":true}],"note":"","sources":[{"id":"H5_03","label":"해커스 오픽 매뉴얼 · 사진 5 · Q03"}],"correction":"","scope":"설문 중심","requirements":["자주 가는 공원과 사람들의 활동을 설명하고 아이와 어른의 활동이 비슷한지 다른지 비교하세요."],"words":108,"representative":"M046_1","additional":0,"sharedCount":8,"related":["M046_1"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H5_04","source":"photo","set":5,"number":4,"topic":"공원","q":"Tell me about the last time you went to a park. Which park did you go to? What did you do and who did you go with? Did anything special happen while you were there?","qko":"최근 공원 방문의 장소·활동·동행과 특별한 사건 여부를 말하세요.","title":"최근 공원 방문의 장소·활동·동행과 특별한 사건 여부를 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q04","family":"park-rain","cue":"지난 일요일 → 민 → 갑작스러운 비 → 카페","lines":[{"en":"Last Sunday afternoon, I went to my neighborhood park with Min.","ko":"지난 일요일 오후에 민이와 동네 공원에 갔어요.","shared":true},{"en":"We planned to walk around the lawn and sit outside for a while.","ko":"잔디밭 주변을 걷고 잠시 밖에 앉아 있을 계획이었어요.","shared":true},{"en":"About twenty minutes later, dark clouds appeared and heavy rain started.","ko":"20분쯤 지나 먹구름이 끼고 비가 많이 내렸어요.","shared":true},{"en":"Neither of us had an umbrella, so we quickly went into a cafe near the entrance.","ko":"둘 다 우산이 없어서 입구 근처 카페로 급히 들어갔어요.","shared":true},{"en":"We dried our bags with paper towels and ordered hot drinks.","ko":"종이 타월로 가방을 닦고 따뜻한 음료를 주문했어요.","shared":true},{"en":"While we waited, we laughed about how confidently we had ignored the forecast.","ko":"기다리면서 일기예보를 무시한 걸 두고 웃었어요.","shared":true},{"en":"The rain stopped after half an hour, and we walked home together.","ko":"30분쯤 뒤 비가 그쳐 함께 걸어서 집에 갔어요.","shared":true},{"en":"It was memorable because the unexpected change gave us time for a really good conversation.","ko":"뜻밖의 계획 변경 덕분에 좋은 대화를 나눠 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H5_04","label":"해커스 오픽 매뉴얼 · 사진 5 · Q04"}],"correction":"","scope":"설문 중심","requirements":["최근 공원 방문의 장소·활동·동행과 특별한 사건 여부를 말하세요."],"words":102,"representative":"M036_3","additional":0,"sharedCount":8,"related":["M036_3","M050_3","M258_13"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H5_05","source":"photo","set":5,"number":5,"topic":"날씨","q":"What are the seasons like in your country? How many are there? How are they different from one another? Talk about the weather in each one.","qko":"국내 계절의 수와 각 계절의 날씨, 계절 간 차이를 설명하세요.","title":"국내 계절의 수와 각 계절의 날씨, 계절 간 차이를 설명하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q05","family":"weather","cue":"사계절 → 여름 습함·겨울 추움 → 가을 산책","lines":[{"en":"Korea has four seasons: spring, summer, autumn, and winter.","ko":"한국에는 봄, 여름, 가을, 겨울의 사계절이 있어요.","shared":true},{"en":"Spring is mild, and flowers start appearing in parks and along the streets.","ko":"봄은 온화하고 공원과 거리에 꽃이 피기 시작해요.","shared":true},{"en":"Summer is hot and humid, with periods of heavy rain.","ko":"여름은 덥고 습하며 비가 많이 오는 기간이 있어요.","shared":true},{"en":"Autumn is generally cooler and drier, and the leaves change color.","ko":"가을은 대체로 더 서늘하고 건조하며 단풍이 들어요.","shared":true},{"en":"Winter is cold, so people wear thick coats, and we sometimes get snow.","ko":"겨울은 추워서 두꺼운 외투를 입고 가끔 눈도 와요.","shared":true},{"en":"The difference between a humid summer day and a freezing winter morning is very clear.","ko":"습한 여름날과 몹시 추운 겨울 아침의 차이는 분명해요.","shared":true},{"en":"My favorite season is autumn because I can spend time outside without getting too hot.","ko":"너무 덥지 않게 밖에서 지낼 수 있어 가을이 가장 좋아요.","shared":true},{"en":"Many people go hiking or enjoy the fall colors, while I prefer a gentle walk in the park.","ko":"많은 사람이 등산이나 단풍 구경을 하고 저는 공원에서 가볍게 걷는 게 좋아요.","shared":true}],"note":"","sources":[{"id":"H5_05","label":"해커스 오픽 매뉴얼 · 사진 5 · Q05"}],"correction":"","scope":"돌발·확장","requirements":["국내 계절의 수와 각 계절의 날씨, 계절 간 차이를 설명하세요."],"words":104,"representative":"M204_1","additional":0,"sharedCount":8,"related":["M204_1","H5_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_06","source":"photo","set":5,"number":6,"topic":"날씨","q":"What is your favorite season? Tell me about some popular activities people do during that season in your country. What do you like to do during this season?","qko":"좋아하는 계절과 그 계절의 국내 인기 활동, 본인이 좋아하는 활동을 말하세요.","title":"좋아하는 계절과 그 계절의 국내 인기 활동, 본인이 좋아하는 활동을 말하세요.","type":"선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q06","family":"weather","cue":"사계절 → 여름 습함·겨울 추움 → 가을 산책","lines":[{"en":"Korea has four seasons: spring, summer, autumn, and winter.","ko":"한국에는 봄, 여름, 가을, 겨울의 사계절이 있어요.","shared":true},{"en":"Spring is mild, and flowers start appearing in parks and along the streets.","ko":"봄은 온화하고 공원과 거리에 꽃이 피기 시작해요.","shared":true},{"en":"Summer is hot and humid, with periods of heavy rain.","ko":"여름은 덥고 습하며 비가 많이 오는 기간이 있어요.","shared":true},{"en":"Autumn is generally cooler and drier, and the leaves change color.","ko":"가을은 대체로 더 서늘하고 건조하며 단풍이 들어요.","shared":true},{"en":"Winter is cold, so people wear thick coats, and we sometimes get snow.","ko":"겨울은 추워서 두꺼운 외투를 입고 가끔 눈도 와요.","shared":true},{"en":"The difference between a humid summer day and a freezing winter morning is very clear.","ko":"습한 여름날과 몹시 추운 겨울 아침의 차이는 분명해요.","shared":true},{"en":"My favorite season is autumn because I can spend time outside without getting too hot.","ko":"너무 덥지 않게 밖에서 지낼 수 있어 가을이 가장 좋아요.","shared":true},{"en":"Many people go hiking or enjoy the fall colors, while I prefer a gentle walk in the park.","ko":"많은 사람이 등산이나 단풍 구경을 하고 저는 공원에서 가볍게 걷는 게 좋아요.","shared":true}],"note":"","sources":[{"id":"H5_06","label":"해커스 오픽 매뉴얼 · 사진 5 · Q06"}],"correction":"","scope":"돌발·확장","requirements":["좋아하는 계절과 그 계절의 국내 인기 활동, 본인이 좋아하는 활동을 말하세요."],"words":104,"representative":"M204_1","additional":0,"sharedCount":8,"related":["M204_1","H5_05"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_07","source":"photo","set":5,"number":7,"topic":"날씨","q":"Tell me about a time when unexpected weather caused an issue for you. What was the problem, and how did you deal with it? Was anyone with you? Describe the situation and outcome.","qko":"예상 밖 날씨로 생긴 문제, 대처, 동행과 결과를 말하세요.","title":"예상 밖 날씨로 생긴 문제, 대처, 동행과 결과를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q07","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H5_07","label":"해커스 오픽 매뉴얼 · 사진 5 · Q07"}],"correction":"","scope":"돌발·확장","requirements":["예상 밖 날씨로 생긴 문제, 대처, 동행과 결과를 말하세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","M216_3","H1_07","H3_06","H3_07","H6_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_08","source":"photo","set":5,"number":8,"topic":"재활용","q":"What has your experience with recycling been like? Do you recycle daily? Where do you put your recycling? Do you have to follow any rules? Give examples from your recycling experiences.","qko":"재활용 경험, 매일 하는지, 배출 장소와 지켜야 할 규칙을 예와 함께 말하세요.","title":"재활용 경험, 매일 하는지, 배출 장소와 지켜야 할 규칙을 예와 함께 말하세요.","type":"절차·준비","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q08","family":"recycle","cue":"종이·플라스틱·캔 → 비우고 분류 → 일요일 배출","lines":[{"en":"At home, I separate paper, plastic containers, cans, and glass from ordinary trash.","ko":"집에서 종이, 플라스틱 용기, 캔, 유리를 일반 쓰레기와 나눠요.","shared":true},{"en":"I empty the containers and clean off food before putting them in separate bags.","ko":"용기를 비우고 음식물을 씻어낸 뒤 각각의 봉투에 넣어요.","shared":true},{"en":"I flatten cardboard boxes so they take up less space.","ko":"종이 상자는 납작하게 접어 부피를 줄여요.","shared":true},{"en":"In my building, I take the bags to the marked collection area on Sunday.","ko":"저희 건물에서는 일요일에 표시된 배출장에 봉투를 가져가요.","shared":true},{"en":"I sort things as I use them, but I don't carry them outside every day.","ko":"쓸 때마다 분류하지만 매일 밖에 내놓지는 않아요.","shared":true},{"en":"For confusing items, I check the building's notice instead of guessing.","ko":"헷갈리는 물건은 짐작하지 않고 건물 안내문을 확인해요.","shared":true},{"en":"Rules can differ by area, but separating materials and keeping them clean are important parts of the process.","ko":"지역별 규칙은 다를 수 있지만 재질을 나누고 깨끗하게 하는 건 중요한 과정이에요.","shared":true},{"en":"For example, rinsing a yogurt cup takes only a moment and makes the collection area less messy.","ko":"예를 들어 요구르트 용기를 헹구는 데는 잠깐이면 되고 배출장도 덜 지저분해져요.","shared":true}],"note":"","sources":[{"id":"H5_08","label":"해커스 오픽 매뉴얼 · 사진 5 · Q08"}],"correction":"","scope":"돌발·확장","requirements":["재활용 경험, 매일 하는지, 배출 장소와 지켜야 할 규칙을 예와 함께 말하세요."],"words":112,"representative":"M224_1","additional":0,"sharedCount":8,"related":["M224_1","M226_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_09","source":"photo","set":5,"number":9,"topic":"재활용","q":"The process of recycling has changed over time. Describe what it was like in the past. How has recycling evolved? Give as many details as you can.","qko":"과거 재활용 방식과 지금까지의 변화를 자세히 설명하세요.","title":"과거 재활용 방식과 지금까지의 변화를 자세히 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q09","family":"recycle-change","cue":"예전 적은 분류 → 현재 표시·재질 → 포장 증가","lines":[{"en":"Recycling in my daily life is more organized now than when I was a child.","ko":"제 일상에서 재활용은 어릴 때보다 더 체계적이에요.","shared":true},{"en":"At our old home, we mainly put paper and bottles aside, and the collection signs were simple.","ko":"예전 집에서는 주로 종이와 병을 따로 모았고 배출 안내가 단순했어요.","shared":true},{"en":"Now my apartment has clearly marked areas for several different materials.","ko":"지금 아파트에는 여러 재질별로 표시된 배출장이 있어요.","shared":true},{"en":"We also deal with more delivery boxes and mixed packaging in everyday life.","ko":"일상에서 택배 상자와 복합 포장재도 더 많이 다뤄요.","shared":true},{"en":"I pay more attention to separating parts and removing food from containers.","ko":"부품을 나누고 용기에서 음식물을 제거하는 데 더 신경 써요.","shared":true},{"en":"Information is easier to find online, although some items are still confusing.","ko":"온라인에서 정보를 찾기 쉬워졌지만 여전히 헷갈리는 물건도 있어요.","shared":true},{"en":"For me, the change is both better guidance and more materials to think about.","ko":"저에게 변화란 안내가 좋아진 동시에 생각해야 할 재료도 많아진 거예요.","shared":true}],"note":"","sources":[{"id":"H5_09","label":"해커스 오픽 매뉴얼 · 사진 5 · Q09"}],"correction":"","scope":"돌발·확장","requirements":["과거 재활용 방식과 지금까지의 변화를 자세히 설명하세요."],"words":94,"representative":"M304_14","additional":0,"sharedCount":7,"related":["M304_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H5_10","source":"photo","set":5,"number":10,"topic":"재활용","q":"What is a memorable experience you've had while recycling? Have you ever had a problem while recycling? Or have you been shocked by something while doing it? Describe the experience in detail.","qko":"재활용 중 문제나 놀랐던 일 등 기억에 남는 경험을 자세히 설명하세요.","title":"재활용 중 문제나 놀랐던 일 등 기억에 남는 경험을 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q10","family":"recycle-memory","cue":"지난달 → 상자 속 열쇠 → 배출장 → 발견","lines":[{"en":"Last month, I accidentally took my spare keys out with the recycling.","ko":"지난달 실수로 여분 열쇠를 재활용품과 함께 내놨어요.","shared":true},{"en":"I had left them in a small cardboard box while cleaning my desk.","ko":"책상을 청소하면서 작은 종이 상자에 넣어뒀던 거예요.","shared":true},{"en":"After taking the boxes downstairs, I noticed the keys were missing.","ko":"상자들을 아래층에 내놓은 뒤 열쇠가 없는 걸 알아챘어요.","shared":true},{"en":"I checked my pockets first and then remembered the box.","ko":"먼저 주머니를 확인하다가 상자가 생각났어요.","shared":true},{"en":"I hurried back to the collection area before the boxes were picked up.","ko":"상자가 수거되기 전에 배출장으로 급히 돌아갔어요.","shared":true},{"en":"Fortunately, the small box was still on top, and the keys were inside.","ko":"다행히 작은 상자가 아직 위에 있었고 열쇠도 안에 있었어요.","shared":true},{"en":"I felt relieved because replacing them would have been a hassle.","ko":"다시 만들려면 번거로웠을 텐데 안심이 됐어요.","shared":true},{"en":"Now I open every box before flattening it, so that small mistake changed my routine.","ko":"이제 접기 전에 모든 상자를 열어보니 작은 실수가 습관을 바꾼 셈이에요.","shared":true}],"note":"","sources":[{"id":"H5_10","label":"해커스 오픽 매뉴얼 · 사진 5 · Q10"}],"correction":"","scope":"돌발·확장","requirements":["재활용 중 문제나 놀랐던 일 등 기억에 남는 경험을 자세히 설명하세요."],"words":98,"representative":"M228_3","additional":0,"sharedCount":8,"related":["M228_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_11","source":"photo","set":5,"number":11,"topic":"영화","q":"I'd like to give you a situation to act out. Your friend told you about a new movie that they think is good. You wonder if you should watch it, too. Ask your friend some questions about the movie to decide if you should see it.","qko":"친구가 추천한 새 영화를 볼지 결정하도록 친구에게 영화에 관한 질문을 하세요.","title":"친구가 추천한 새 영화를 볼지 결정하도록 친구에게 영화에 관한 질문을 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q11","family":"rp-movie-friend","cue":"친구 추천 → 내용·속도·배우·추천 이유","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"You mentioned a new movie you enjoyed, and I am trying to decide whether I should see it too.","ko":"네가 재미있게 본 새 영화를 말했는데 나도 볼지 고민 중이야.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"What is the story about, without giving away the ending?","ko":"결말은 말하지 말고 어떤 이야기인지 알려줄래?","shared":false},{"en":"Is it a fast comedy or a slower drama?","ko":"빠른 코미디야, 아니면 느린 드라마야?","shared":false},{"en":"Who plays the main character?","ko":"주인공은 누가 연기해?","shared":false},{"en":"What did you like most about it?","ko":"어떤 점이 가장 좋았어?","shared":false},{"en":"I usually prefer something light, so that information will help. Thanks for the recommendation.","ko":"나는 보통 가벼운 걸 좋아해서 그 정보가 도움이 될 거야. 추천해 줘서 고마워.","shared":false}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H5_11","label":"해커스 오픽 매뉴얼 · 사진 5 · Q11"}],"correction":"","scope":"역할극","requirements":["친구가 추천한 새 영화를 볼지 결정하도록 친구에게 영화에 관한 질문을 하세요."],"words":82,"representative":"H5_11","additional":0,"sharedCount":2,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H5_12","source":"photo","set":5,"number":12,"topic":"영화","q":"I need you to resolve a problem. You are at the movie theater with a friend. However, you want to leave because the movie is boring. Let your friend know and make a few suggestions about what to do.","qko":"친구와 영화관에 있는데 영화가 지루해 나가고 싶습니다. 친구에게 말하고 할 일을 몇 가지 제안하세요.","title":"친구와 영화관에 있는데 영화가 지루해 나가고 싶습니다. 친구에게 말하고 할 일을 몇 가지 제안하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q12","family":"rp-boring","cue":"친구에게 조용히 → 함께 나가기·혼자 먼저","lines":[{"en":"Hey Min, I'll keep my voice down, but I am finding this movie hard to enjoy.","ko":"민아, 조용히 말할게. 그런데 이 영화가 별로 재미있지 않아.","shared":false},{"en":"It is much slower than I expected, and I would honestly like to leave.","ko":"예상보다 훨씬 느리고 솔직히 나가고 싶어.","shared":false},{"en":"I don't want to spoil it for you if you are enjoying it, though.","ko":"하지만 네가 즐기고 있다면 방해하고 싶진 않아.","shared":false},{"en":"If you feel the same way, we could both leave quietly and get something to eat.","ko":"너도 같은 생각이면 둘 다 조용히 나가서 뭘 먹을 수 있어.","shared":false},{"en":"We could talk at the cafe downstairs instead of spending the rest of the evening here.","ko":"남은 저녁을 여기서 보내기보다 아래층 카페에서 이야기해도 돼.","shared":false},{"en":"If you want to see the ending, I can wait outside and meet you after the film.","ko":"결말을 보고 싶다면 내가 밖에서 기다렸다가 끝나고 만나도 돼.","shared":false},{"en":"Tell me which you prefer; I am happy to let you finish it.","ko":"뭐가 좋은지 말해줘. 네가 끝까지 보는 것도 괜찮아.","shared":false},{"en":"Sorry for the change of plan.","ko":"계획을 바꾸게 돼 미안해.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H5_12","label":"해커스 오픽 매뉴얼 · 사진 5 · Q12"}],"correction":"","scope":"역할극","requirements":["친구와 영화관에 있는데 영화가 지루해 나가고 싶습니다.","친구에게 말하고 할 일을 몇 가지 제안하세요."],"words":112,"representative":"H5_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H5_13","source":"photo","set":5,"number":13,"topic":"영화","q":"That is the end of the issue. Do you remember the last time you watched a boring movie? Were you able to watch until the end? Describe the experience for me in detail.","qko":"최근 지루한 영화를 봤던 경험과 끝까지 봤는지를 자세히 말하세요.","title":"최근 지루한 영화를 봤던 경험과 끝까지 봤는지를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q13","family":"boring-movie","cue":"지난겨울 → 느린 드라마 → 끝까지 → 취향 확인","lines":[{"en":"The last boring movie I watched was a slow drama with Min last winter.","ko":"최근 지루하게 본 영화는 지난겨울 민이와 본 느린 드라마였어요.","shared":false},{"en":"The trailer looked exciting, so we expected a lot to happen.","ko":"예고편이 재미있어 보여 많은 일이 벌어질 줄 알았어요.","shared":false},{"en":"However, most scenes were long conversations, and I had trouble staying interested.","ko":"하지만 대부분 긴 대화 장면이라 흥미를 유지하기 어려웠어요.","shared":false},{"en":"I thought about leaving, but Min wanted to see how the story ended.","ko":"나갈까 생각했지만 민이는 결말을 보고 싶어 했어요.","shared":false},{"en":"I decided to stay quietly rather than interrupt his experience.","ko":"친구의 감상을 방해하지 않고 조용히 끝까지 보기로 했어요.","shared":false},{"en":"We did watch the whole film, although I checked the time once or twice.","ko":"시간을 한두 번 확인하긴 했지만 전부 봤어요.","shared":false},{"en":"Afterward, we laughed about having very different reactions to the same movie.","ko":"끝나고 같은 영화에 반응이 아주 다른 걸 두고 웃었어요.","shared":false},{"en":"Now I read a short description of the pace and genre before choosing a film.","ko":"이제 영화를 고르기 전에 전개 속도와 장르에 관한 짧은 설명을 읽어요.","shared":false}],"note":"","sources":[{"id":"H5_13","label":"해커스 오픽 매뉴얼 · 사진 5 · Q13"}],"correction":"","scope":"돌발·확장","requirements":["최근 지루한 영화를 봤던 경험과 끝까지 봤는지를 자세히 말하세요."],"words":101,"representative":"H5_13","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_14","source":"photo","set":5,"number":14,"topic":"집휴가","q":"You mentioned in your background survey that you like staying at home more than traveling during your vacations. Why do you prefer being at home? What do you do during this time at home? Give as many details as you can.","qko":"여행보다 집 휴가를 선호하는 이유와 집에서 하는 활동을 자세히 설명하세요.","title":"여행보다 집 휴가를 선호하는 이유와 집에서 하는 활동을 자세히 설명하세요.","type":"선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q14","family":"stay","cue":"늦은 아침 → 음악·요리 → 민 방문 → 쉬는 속도","lines":[{"en":"During a vacation at home, I slow down and avoid making a tight schedule.","ko":"집에서 휴가를 보내면 여유를 갖고 빡빡한 계획을 세우지 않아요.","shared":true},{"en":"I sleep a little later, make a simple breakfast, and listen to music.","ko":"조금 늦게 일어나 간단한 아침을 만들고 음악을 들어요.","shared":true},{"en":"In the afternoon, I watch a film or try cooking something new.","ko":"오후에는 영화를 보거나 새로운 요리를 해봐요.","shared":true},{"en":"My friend Min sometimes visits, and we cook lunch and talk for hours.","ko":"가끔 친구 민이가 와서 점심을 만들고 몇 시간씩 이야기해요.","shared":true},{"en":"I live alone, so having a friend over makes the day feel special.","ko":"혼자 살아서 친구가 오면 그날이 특별하게 느껴져요.","shared":true},{"en":"I prefer this for short breaks because I don't have to pack or pay for a hotel.","ko":"짐을 싸거나 호텔비를 낼 필요가 없어 짧은 휴가에는 이 방식이 좋아요.","shared":true},{"en":"I still enjoy traveling, but staying home lets me rest at my own pace.","ko":"여행도 좋아하지만 집에서는 제 속도로 쉴 수 있어요.","shared":true},{"en":"By the end of the break, I usually feel refreshed rather than tired from moving around.","ko":"휴가가 끝나면 이동하느라 지치기보다 기운을 되찾은 느낌이에요.","shared":true}],"note":"","sources":[{"id":"H5_14","label":"해커스 오픽 매뉴얼 · 사진 5 · Q14"}],"correction":"","scope":"설문 중심","requirements":["여행보다 집 휴가를 선호하는 이유와 집에서 하는 활동을 자세히 설명하세요."],"words":112,"representative":"M040_1","additional":0,"sharedCount":8,"related":["M040_1","M042_2","H3_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H5_15","source":"photo","set":5,"number":15,"topic":"집휴가","q":"Why do people need to take a vacation? Do you think a vacation means something different depending on the person? In what different ways do people take vacations?","qko":"휴가가 필요한 이유, 사람마다 다른 휴가의 의미와 다양한 휴가 방식을 설명하세요.","title":"휴가가 필요한 이유, 사람마다 다른 휴가의 의미와 다양한 휴가 방식을 설명하세요.","type":"일반 경향","sourceLabel":"해커스 오픽 매뉴얼 · 사진 5 · Q15","family":"vacation-meaning","cue":"휴식 필요 → 사람마다 다른 쉼 → 여행·집·가족","lines":[{"en":"People need vacations to step away from daily responsibilities and recover their energy.","ko":"사람들은 일상 책임에서 잠시 벗어나 기운을 회복하려고 휴가가 필요해요.","shared":false},{"en":"Doing the same things every day can make life feel tiring, even when nothing serious is wrong.","ko":"큰 문제가 없어도 매일 같은 일을 하면 지칠 수 있어요.","shared":false},{"en":"However, a good vacation means different things to different people.","ko":"하지만 좋은 휴가의 의미는 사람마다 달라요.","shared":false},{"en":"Someone who spends a lot of time indoors may want an active trip or a new city.","ko":"실내에 오래 있는 사람은 활동적인 여행이나 새로운 도시를 원할 수 있어요.","shared":false},{"en":"Someone with a busy schedule may prefer sleeping late and doing very little at home.","ko":"일정이 바쁜 사람은 집에서 늦잠 자고 거의 아무것도 안 하는 걸 선호할 수 있어요.","shared":false},{"en":"Other people use the time to visit family or enjoy a hobby with friends.","ko":"가족을 만나거나 친구와 취미를 즐기는 사람도 있어요.","shared":false},{"en":"For me, short breaks at home and occasional trips both work, depending on how I feel.","ko":"저는 기분에 따라 짧은 집 휴가와 가끔의 여행이 모두 좋아요.","shared":false},{"en":"The important thing is returning with more energy, not copying someone else's idea of a perfect holiday.","ko":"중요한 건 남의 완벽한 휴가를 따라 하는 게 아니라 기운을 되찾는 거예요.","shared":false}],"note":"","sources":[{"id":"H5_15","label":"해커스 오픽 매뉴얼 · 사진 5 · Q15"}],"correction":"","scope":"설문 중심","requirements":["휴가가 필요한 이유, 사람마다 다른 휴가의 의미와 다양한 휴가 방식을 설명하세요."],"words":119,"representative":"H5_15","additional":0,"sharedCount":0,"related":[],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"H6_02","source":"photo","set":6,"number":2,"topic":"집","q":"Please tell me about your house. What's your favorite room? What does it look like? Why do you like that room?","qko":"집을 소개하고 가장 좋아하는 방의 모습과 좋아하는 이유를 말하세요.","title":"집을 소개하고 가장 좋아하는 방의 모습과 좋아하는 이유를 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q02","family":"home","cue":"혼자 사는 아파트 → 방 두 개 → 침실","lines":[{"en":"I live alone in a small apartment in Seoul.","ko":"저는 서울의 작은 아파트에 혼자 살아요.","shared":true},{"en":"It has two rooms, a living room, a kitchen, and one bathroom.","ko":"방 두 개와 거실, 부엌, 화장실 한 개가 있어요.","shared":true},{"en":"The walls are white, and the wooden floor makes the place feel warm.","ko":"벽은 흰색이고 나무 바닥 때문에 따뜻한 느낌이 나요.","shared":true},{"en":"My favorite room is the bedroom because it is quiet and gets plenty of sunlight.","ko":"가장 좋아하는 방은 조용하고 햇빛이 잘 드는 침실이에요.","shared":true},{"en":"There is a bed beside the window and a small desk against the wall.","ko":"창문 옆에는 침대가 있고 벽 쪽에는 작은 책상이 있어요.","shared":true},{"en":"I keep my books on the desk and my clothes in a small closet.","ko":"책은 책상에, 옷은 작은 옷장에 둬요.","shared":true},{"en":"In the evening, I listen to music there and take a break from my phone.","ko":"저녁에는 거기서 음악을 들으며 휴대폰을 잠시 내려놓아요.","shared":true},{"en":"It isn't a big place, but it is easy to clean and comfortable enough for me.","ko":"넓지는 않지만 청소하기 쉽고 혼자 지내기에 편안해요.","shared":true}],"note":"","sources":[{"id":"H6_02","label":"해커스 오픽 매뉴얼 · 사진 6 · Q02"}],"correction":"","scope":"설문 중심","requirements":["집을 소개하고 가장 좋아하는 방의 모습과 좋아하는 이유를 말하세요."],"words":108,"representative":"M022_1","additional":0,"sharedCount":8,"related":["M022_1","M024_2","H1_02"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H6_03","source":"photo","set":6,"number":3,"topic":"집","q":"How is the home you lived in before different from the one you live in now? Compare the two places. Give as many details as possible.","qko":"이전 집과 현재 집을 자세히 비교하세요.","title":"이전 집과 현재 집을 자세히 비교하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q03","family":"home-compare","cue":"예전 가족 집 넓음 → 현재 작지만 편리 → 독립","lines":[{"en":"My previous home was a larger apartment where I lived with my parents.","ko":"이전 집은 부모님과 함께 살던 더 큰 아파트였어요.","shared":true},{"en":"It had three bedrooms, and we shared a large living room.","ko":"침실 세 개가 있었고 넓은 거실을 함께 썼어요.","shared":true},{"en":"Now I live alone in a smaller apartment with two rooms.","ko":"지금은 방 두 개가 있는 더 작은 아파트에 혼자 살아요.","shared":true},{"en":"The old place was farther from shops, but my current home is close to a station and a park.","ko":"이전 집은 가게들과 멀었지만 지금 집은 역과 공원이 가까워요.","shared":true},{"en":"Both places get good sunlight, which is something I really like.","ko":"두 집 모두 햇빛이 잘 들어서 그 점이 좋아요.","shared":true},{"en":"I moved last year because I wanted to live independently and manage my own routine.","ko":"독립해서 제 생활을 관리하고 싶어 작년에 이사했어요.","shared":true},{"en":"I miss having dinner with my parents, but I enjoy the privacy here.","ko":"부모님과 저녁 먹던 건 그립지만 여기서는 사생활이 보장돼 좋아요.","shared":true},{"en":"The smaller size also means I spend less time cleaning.","ko":"집이 작아서 청소 시간도 줄었어요.","shared":true}],"note":"","sources":[{"id":"H6_03","label":"해커스 오픽 매뉴얼 · 사진 6 · Q03"}],"correction":"","scope":"설문 중심","requirements":["이전 집과 현재 집을 자세히 비교하세요."],"words":103,"representative":"M030_6","additional":0,"sharedCount":8,"related":["M030_6"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H6_04","source":"photo","set":6,"number":4,"topic":"집","q":"What did your house look like when you first moved in? What changes have you made to your house since then?","qko":"처음 이사 왔을 때 집의 모습과 이후 바꾼 점을 말하세요.","title":"처음 이사 왔을 때 집의 모습과 이후 바꾼 점을 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q04","family":"desk-change","cue":"빈 침실 → 작은 책상 → 창가 → 만족","lines":[{"en":"When I first moved in last year, my bedroom had a bed but almost no other furniture.","ko":"작년에 처음 이사 왔을 때 침실에는 침대 외에 가구가 거의 없었어요.","shared":true},{"en":"I used to put my books on the floor, so the room always looked messy.","ko":"책을 바닥에 놓곤 해서 방이 늘 어수선해 보였어요.","shared":true},{"en":"Two months ago, I bought a small wooden desk from an online furniture store.","ko":"두 달 전에 온라인 가구점에서 작은 나무 책상을 샀어요.","shared":true},{"en":"I measured the space beside the window before choosing it.","ko":"고르기 전에 창문 옆 공간을 재 봤어요.","shared":true},{"en":"The desk has two drawers, so I can keep my books and cables out of sight.","ko":"서랍 두 개가 있어서 책과 케이블을 깔끔하게 넣어둘 수 있어요.","shared":true},{"en":"I put a warm lamp on top and moved the desk against the wall.","ko":"위에는 따뜻한 빛의 조명을 놓고 벽 쪽으로 책상을 옮겼어요.","shared":true},{"en":"The room looks much tidier now, and I have a proper place to study.","ko":"지금은 방이 훨씬 정돈됐고 제대로 공부할 공간이 생겼어요.","shared":true},{"en":"I'm happy with the change because it made a small room more useful.","ko":"작은 방을 더 잘 활용하게 돼서 만족해요.","shared":true}],"note":"","sources":[{"id":"H6_04","label":"해커스 오픽 매뉴얼 · 사진 6 · Q04"}],"correction":"","scope":"설문 중심","requirements":["처음 이사 왔을 때 집의 모습과 이후 바꾼 점을 말하세요."],"words":113,"representative":"M028_5","additional":0,"sharedCount":8,"related":["M028_5","M232_2","H2_06"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H6_05","source":"photo","set":6,"number":5,"topic":"지형","q":"What are some of your country's geographic features? How do they compare to the geographic features of other countries? Describe them with as many details as you can.","qko":"국내 지형의 특징을 설명하고 다른 나라의 지형과 비교하세요.","title":"국내 지형의 특징을 설명하고 다른 나라의 지형과 비교하세요.","type":"묘사 + 두 대상 비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q05","family":"geography","cue":"한반도 → 산·강·해안 → 일본 섬과 비교","lines":[{"en":"South Korea is in the southern part of the Korean Peninsula.","ko":"한국은 한반도 남쪽에 있어요.","shared":true},{"en":"There are many mountains inland, along with rivers and flatter areas where cities and farms are located.","ko":"내륙에는 산이 많고 강과 도시·농지가 있는 평지도 있어요.","shared":true},{"en":"The country has coastlines to the east, west, and south.","ko":"동쪽, 서쪽, 남쪽에 해안이 있어요.","shared":true},{"en":"That means people can often reach either a mountain or the sea without a very long trip.","ko":"그래서 아주 멀리 가지 않고 산이나 바다에 갈 수 있는 경우가 많아요.","shared":true},{"en":"Japan also has mountains and long coastlines, but it is made up of islands rather than being part of this peninsula.","ko":"일본도 산과 긴 해안이 있지만 이 반도의 일부가 아니라 섬들로 이루어져 있어요.","shared":true},{"en":"I especially enjoy the east coast of Korea because of its open sea views.","ko":"저는 탁 트인 바다 풍경 때문에 한국 동해안을 특히 좋아해요.","shared":true},{"en":"The variety of landscapes gives us many choices for short trips.","ko":"다양한 풍경 덕분에 짧은 여행의 선택지가 많아요.","shared":true}],"note":"","sources":[{"id":"H6_05","label":"해커스 오픽 매뉴얼 · 사진 6 · Q05"}],"correction":"","scope":"돌발·확장","requirements":["국내 지형의 특징을 설명하고 다른 나라의 지형과 비교하세요."],"words":101,"representative":"M212_1","additional":0,"sharedCount":7,"related":["M212_1"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H6_06","source":"photo","set":6,"number":6,"topic":"지형","q":"Which do you like, lakes, mountains, beaches, or something else? Is there a geographical feature that is your favorite? Describe it for me.","qko":"호수·산·해변 등 좋아하는 지형을 골라 설명하세요.","title":"호수·산·해변 등 좋아하는 지형을 골라 설명하세요.","type":"선호·의견","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q06","family":"travel-place","cue":"강릉 경포 → 모래·소나무 → 바다 선호 → 휴식","lines":[{"en":"My favorite domestic destination is Gangneung on Korea's east coast.","ko":"제가 좋아하는 국내 여행지는 한국 동해안의 강릉이에요.","shared":true},{"en":"I especially like Gyeongpo Beach, with its long sandy shore and pine trees nearby.","ko":"특히 긴 모래 해변과 근처 소나무가 있는 경포해변을 좋아해요.","shared":true},{"en":"The water looks bright blue on a clear day, and the open view feels refreshing.","ko":"맑은 날에는 바다가 밝은 파란색이고 탁 트인 풍경이 시원해요.","shared":true},{"en":"I prefer beaches to mountains because I can walk slowly without a difficult climb.","ko":"힘들게 오르지 않고 천천히 걸을 수 있어 산보다 해변이 좋아요.","shared":true},{"en":"I also enjoy visiting small cafes and trying local food in the city.","ko":"시내의 작은 카페에 가고 지역 음식을 먹는 것도 좋아해요.","shared":true},{"en":"Domestic trips are convenient because I can travel by train and communicate easily.","ko":"기차로 갈 수 있고 말도 편하게 통하니 국내여행은 편리해요.","shared":true},{"en":"Even a short visit gives me a clear break from my usual surroundings.","ko":"잠깐 다녀와도 평소 환경에서 확실히 벗어난 기분이 들어요.","shared":true},{"en":"That is why I keep choosing the coast when I need to recharge.","ko":"그래서 기운을 되찾고 싶을 때 바닷가를 계속 골라요.","shared":true}],"note":"","sources":[{"id":"H6_06","label":"해커스 오픽 매뉴얼 · 사진 6 · Q06"}],"correction":"","scope":"돌발·확장","requirements":["호수·산·해변 등 좋아하는 지형을 골라 설명하세요."],"words":105,"representative":"M107_1","additional":0,"sharedCount":8,"related":["M107_1","H1_05","H3_05"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H6_07","source":"photo","set":6,"number":7,"topic":"지형","q":"Describe the most memorable outdoor experience you've had. What happened? Where and when was it? Give as many details as you can.","qko":"가장 기억에 남는 야외 경험의 사건·장소·시점을 자세히 설명하세요.","title":"가장 기억에 남는 야외 경험의 사건·장소·시점을 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q07","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H6_07","label":"해커스 오픽 매뉴얼 · 사진 6 · Q07"}],"correction":"","scope":"돌발·확장","requirements":["가장 기억에 남는 야외 경험의 사건·장소·시점을 자세히 설명하세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","M216_3","H1_07","H3_06","H3_07","H5_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H6_08","source":"photo","set":6,"number":8,"topic":"음악","q":"What kinds of music do you like? Tell me about some of your favorite musicians and artists.","qko":"좋아하는 음악 종류와 좋아하는 음악가·아티스트들을 말하세요.","title":"좋아하는 음악 종류와 좋아하는 음악가·아티스트들을 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q08","family":"music","cue":"팝·어쿠스틱 → June·Alex → 멜로디·기분","lines":[{"en":"I mostly listen to pop and acoustic music because I like clear melodies.","ko":"뚜렷한 멜로디가 좋아서 주로 팝과 어쿠스틱 음악을 들어요.","shared":true},{"en":"My favorite singer is June, and I especially like her song A Quiet Day.","ko":"좋아하는 가수는 준이고 특히 ‘어 콰이어트 데이’라는 노래가 좋아요.","shared":true},{"en":"Her voice is warm, and the lyrics describe ordinary feelings in a simple way.","ko":"목소리가 따뜻하고 가사는 평범한 감정을 단순하게 표현해요.","shared":true},{"en":"Another artist I enjoy is Alex, who sings with an acoustic guitar.","ko":"또 좋아하는 아티스트는 어쿠스틱 기타를 치며 노래하는 알렉스예요.","shared":true},{"en":"June's lively songs give me energy, while Alex's quieter songs help me relax.","ko":"준이의 경쾌한 노래는 힘이 나고 알렉스의 잔잔한 노래는 긴장을 풀어줘요.","shared":true},{"en":"I usually listen in the evening or while taking a bus.","ko":"보통 저녁이나 버스를 탈 때 들어요.","shared":true},{"en":"I don't need complicated music; I want songs that match my mood and are easy to remember.","ko":"복잡한 음악보다 기분에 맞고 기억하기 쉬운 노래가 좋아요.","shared":true}],"note":"June·Alex·곡명은 연습용 설정. 실제 가수의 이력이나 최신 사실을 주장하지 않습니다.","sources":[{"id":"H6_08","label":"해커스 오픽 매뉴얼 · 사진 6 · Q08"}],"correction":"","scope":"설문 중심","requirements":["좋아하는 음악 종류와 좋아하는 음악가·아티스트들을 말하세요."],"words":94,"representative":"M101_1","additional":0,"sharedCount":7,"related":["M101_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H6_09","source":"photo","set":6,"number":9,"topic":"음악","q":"You indicated in your background survey that you enjoy listening to music. When did you first begin listening to music? How did you listen to it at first? What was your favorite type of music in the past, and how has it changed? Describe how your tastes have evolved.","qko":"음악을 처음 들은 시점과 당시 감상 방법, 과거 음악 취향과 이후 변화를 설명하세요.","title":"음악을 처음 들은 시점과 당시 감상 방법, 과거 음악 취향과 이후 변화를 설명하세요.","type":"처음·계기 + 변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q09","family":"music-start","cue":"중학생 → 가족 컴퓨터 → 댄스 → 현재 어쿠스틱","lines":[{"en":"I first became interested in music when I was in middle school.","ko":"중학생 때 처음 음악에 관심이 생겼어요.","shared":true},{"en":"Min played a lively pop song called Bright Morning on our family computer.","ko":"민이가 저희 가족 컴퓨터로 ‘브라이트 모닝’이라는 신나는 팝송을 들려줬어요.","shared":true},{"en":"I liked the chorus so much that I listened to it again and again.","ko":"후렴이 너무 좋아서 계속 반복해서 들었어요.","shared":true},{"en":"At that time, I mostly enjoyed fast dance music because it made me feel excited.","ko":"그때는 신이 나서 주로 빠른 댄스 음악을 좋아했어요.","shared":true},{"en":"I later started listening on my own phone with earphones.","ko":"나중에는 제 휴대폰에 이어폰을 연결해 듣기 시작했어요.","shared":true},{"en":"Now I still like pop, but I also enjoy quiet acoustic songs in the evening.","ko":"지금도 팝을 좋아하지만 저녁에는 조용한 어쿠스틱 곡도 즐겨요.","shared":true},{"en":"For example, June's A Quiet Day helps me relax instead of making me want to dance.","ko":"예를 들어 준이의 ‘어 콰이어트 데이’는 춤추고 싶게 하기보다 편안하게 해줘요.","shared":true},{"en":"My taste has become wider because I choose different music for different moods.","ko":"기분에 따라 다른 음악을 골라서 취향이 넓어졌어요.","shared":true}],"note":"","sources":[{"id":"H6_09","label":"해커스 오픽 매뉴얼 · 사진 6 · Q09"}],"correction":"","scope":"설문 중심","requirements":["음악을 처음 들은 시점과 당시 감상 방법, 과거 음악 취향과 이후 변화를 설명하세요."],"words":108,"representative":"M105_3","additional":0,"sharedCount":8,"related":["M105_3"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H6_10","source":"photo","set":6,"number":10,"topic":"음악","q":"Reflect on a memorable experience when you were listening to live music. What happened? When and where was it? Were you with anyone? What band or artist was performing? Why was it so unforgettable?","qko":"라이브 음악을 들은 기억에 남는 경험의 사건·시점·장소·동행·공연자와 잊지 못하는 이유를 말하세요.","title":"라이브 음악을 들은 기억에 남는 경험의 사건·시점·장소·동행·공연자와 잊지 못하는 이유를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q10","family":"concert-memory","cue":"작년 가을 → 서울 홀 → 민 → June → 후렴","lines":[{"en":"Last fall, I went to June's pop concert with Min at a small concert hall in Seoul.","ko":"지난가을 민이와 서울의 작은 공연장에서 준이의 팝 콘서트를 봤어요.","shared":true},{"en":"The hall was near a subway station, and the stage was easy to see from our seats.","ko":"공연장은 지하철역 근처였고 우리 자리에서 무대가 잘 보였어요.","shared":true},{"en":"I don't attend concerts often, but this one was worth the trip.","ko":"콘서트에 자주 가진 않지만 이 공연은 갈 만했어요.","shared":true},{"en":"My favorite moment was during her song, A Quiet Day.","ko":"가장 좋았던 순간은 ‘어 콰이어트 데이’라는 노래를 부를 때였어요.","shared":true},{"en":"She lowered her microphone, and the audience sang the chorus together.","ko":"가수가 마이크를 내리자 관객이 후렴을 함께 불렀어요.","shared":true},{"en":"Min and I joined in, and I felt a little emotional hearing so many voices.","ko":"민이와 저도 함께 불렀고 많은 목소리를 들으니 조금 뭉클했어요.","shared":true},{"en":"The song sounded warmer and more powerful than it did through my earphones.","ko":"이어폰으로 들을 때보다 더 따뜻하고 힘 있게 들렸어요.","shared":true},{"en":"I still remember that feeling whenever I hear the song at home.","ko":"집에서 그 노래를 들을 때마다 그 느낌이 떠올라요.","shared":true}],"note":"공연장 질문에는 위치·시야와 그곳에서 본 콘서트, 경험 질문에는 시점·동행·사건이 핵심입니다.","sources":[{"id":"H6_10","label":"해커스 오픽 매뉴얼 · 사진 6 · Q10"}],"correction":"","scope":"설문 중심","requirements":["라이브 음악을 들은 기억에 남는 경험의 사건·시점·장소·동행·공연자와 잊지 못하는 이유를 말하세요."],"words":107,"representative":"M097_2","additional":0,"sharedCount":8,"related":["M097_2","M099_4","M105_4"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H6_11","source":"photo","set":6,"number":11,"topic":"여행","q":"I'd like you to act out the following situation. You are currently planning a vacation. Call a travel agent and ask three or four questions about possible places to visit.","qko":"휴가를 계획 중입니다. 여행사에 전화해 방문 가능한 여행지에 관해 질문 3~4개를 하세요.","title":"휴가를 계획 중입니다. 여행사에 전화해 방문 가능한 여행지에 관해 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q11","family":"rp-travel","cue":"민과 짧은 휴가 → 여행지·비용·활동·취소","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am planning a short vacation with a friend, and we would like somewhere relaxing near the coast.","ko":"친구와 짧은 휴가를 계획하고 있고 해안 근처 편안한 곳을 원해요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which destinations would you recommend for a three-day trip?","ko":"사흘 여행으로 어느 여행지를 추천하시나요?","shared":true},{"en":"What is included in the total price?","ko":"총가격에 무엇이 포함되나요?","shared":true},{"en":"Are there any easy outdoor activities available during our visit?","ko":"방문 기간에 할 만한 가벼운 야외 활동이 있나요?","shared":true},{"en":"What happens if we need to change the dates?","ko":"날짜를 바꿔야 하면 어떻게 되나요?","shared":true},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H6_11","label":"해커스 오픽 매뉴얼 · 사진 6 · Q11"}],"correction":"","scope":"역할극","requirements":["휴가를 계획 중입니다.","여행사에 전화해 방문 가능한 여행지에 관해 질문 3~4개를 하세요."],"words":81,"representative":"M268_11","additional":0,"sharedCount":8,"related":["M268_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H6_12","source":"photo","set":6,"number":12,"topic":"여행","q":"Your travel agent has explained that an activity you wanted to participate in won't be available during your trip dates. Call your friend, describe the situation, and provide two or three alternatives in a message.","qko":"여행 기간에 원하는 활동이 불가능하다는 연락을 받았습니다. 친구에게 전화해 상황과 대안 2~3개를 메시지로 남기세요.","title":"여행 기간에 원하는 활동이 불가능하다는 연락을 받았습니다. 친구에게 전화해 상황과 대안 2~3개를 메시지로 남기세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q12","family":"rp-activity","cue":"해변 보트 불가 → 해안 산책·실내 → 연락","lines":[{"en":"Hi Min, I am leaving a message about the activity on our vacation.","ko":"민아, 휴가 중 활동에 대해 메시지를 남겨.","shared":false},{"en":"The travel agent said the boat tour we wanted won't be available during our trip dates.","ko":"여행사에서 우리가 원한 보트 투어가 여행 기간에 운영되지 않는대.","shared":false},{"en":"Our trip itself can still go ahead, but we need another plan for that afternoon.","ko":"여행 자체는 갈 수 있지만 그날 오후 계획을 바꿔야 해.","shared":false},{"en":"One option is to take an easy coastal walk and stop at a cafe with a sea view.","ko":"한 가지는 해안길을 가볍게 걷고 바다가 보이는 카페에 들르는 거야.","shared":false},{"en":"If you prefer an indoor activity, we could visit the local museum instead.","ko":"실내 활동이 좋으면 대신 지역 박물관에 가도 돼.","shared":false},{"en":"I can ask the agent about the opening hours and any extra costs for both options.","ko":"두 방법의 운영 시간과 추가 비용을 여행사에 물어볼게.","shared":false},{"en":"Call me back when you can, and we can choose together.","ko":"가능할 때 전화해 줘. 같이 고르자.","shared":false},{"en":"I am sure we can still enjoy the afternoon.","ko":"그래도 오후를 즐겁게 보낼 수 있을 거야.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H6_12","label":"해커스 오픽 매뉴얼 · 사진 6 · Q12"}],"correction":"","scope":"역할극","requirements":["여행 기간에 원하는 활동이 불가능하다는 연락을 받았습니다.","친구에게 전화해 상황과 대안 2~3개를 메시지로 남기세요."],"words":111,"representative":"H6_12","additional":0,"sharedCount":0,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H6_14","source":"photo","set":6,"number":14,"topic":"산업","q":"Talk about an industry or company that has changed a lot in your country. What is it like now? How has it changed? Talk about specific examples that show how the industry or company has evolved.","qko":"국내에서 많이 달라진 산업이나 기업의 현재 모습과 변화를 구체적인 예로 설명하세요.","title":"국내에서 많이 달라진 산업이나 기업의 현재 모습과 변화를 구체적인 예로 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q14","family":"industry","cue":"휴대폰 산업 → 통화에서 다기능 → 경쟁·연결","lines":[{"en":"One industry people around me often discuss is the smartphone industry.","ko":"제 주변에서 자주 이야기하는 산업은 스마트폰 산업이에요.","shared":true},{"en":"It involves designing phones and the services that people use on them.","ko":"휴대폰과 그 안에서 이용하는 서비스를 만드는 산업이에요.","shared":true},{"en":"When I was younger, phones were mainly for calls and short messages.","ko":"어릴 때 폰은 주로 통화와 짧은 문자용이었어요.","shared":true},{"en":"Now the devices combine cameras, maps, entertainment, and payment tools.","ko":"이제는 카메라, 지도, 오락, 결제 도구를 합친 기기예요.","shared":true},{"en":"For example, I can plan an entire trip on the same device I use to contact my parents.","ko":"예를 들어 부모님께 연락하는 기기로 여행 전체를 계획할 수 있어요.","shared":true},{"en":"Companies also compete on battery life and how easily their devices connect with other products.","ko":"기업은 배터리 수명과 다른 제품과의 연결 편의성으로도 경쟁해요.","shared":true},{"en":"To me, the industry has grown from selling a communication tool to supporting many parts of daily life.","ko":"통신 도구 판매에서 일상의 여러 부분을 지원하는 산업으로 성장한 것 같아요.","shared":true},{"en":"I am most interested in useful improvements, not just a new model name.","ko":"저는 새 모델 이름보다 유용한 개선에 가장 관심이 있어요.","shared":true}],"note":"","sources":[{"id":"H6_14","label":"해커스 오픽 매뉴얼 · 사진 6 · Q14"}],"correction":"","scope":"돌발·확장","requirements":["국내에서 많이 달라진 산업이나 기업의 현재 모습과 변화를 구체적인 예로 설명하세요."],"words":109,"representative":"M310_14","additional":0,"sharedCount":8,"related":["M310_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H6_15","source":"photo","set":6,"number":15,"topic":"산업","q":"Tell me about a time when a product failed to meet the expectations of the public. What was the problem? How did the public and the industry react to this issue? Describe the problem in detail.","qko":"제품이 대중의 기대에 미치지 못했던 사례의 문제, 대중과 업계의 반응을 자세히 설명하세요.","title":"제품이 대중의 기대에 미치지 못했던 사례의 문제, 대중과 업계의 반응을 자세히 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 6 · Q15","family":"product-failure","cue":"가상폰 배터리 → 후기 불만 → 업데이트·교환","lines":[{"en":"I remember a phone release that disappointed people because its battery performance didn't match their expectations.","ko":"배터리 성능이 기대에 못 미쳐 사람들을 실망시킨 휴대폰 출시 사례가 기억나요.","shared":true},{"en":"The product was promoted as convenient for watching videos and taking photos throughout the day.","ko":"하루 종일 영상과 사진을 즐기기 편한 제품으로 홍보됐어요.","shared":true},{"en":"However, some users found that they had to charge it again before evening.","ko":"하지만 일부 사용자는 저녁 전에 다시 충전해야 한다는 걸 알았어요.","shared":true},{"en":"They posted negative reviews and asked the company to explain the difference.","ko":"부정적인 후기를 올리고 회사에 차이를 설명해 달라고 했어요.","shared":true},{"en":"The company released a software update and offered checks or replacements for affected devices.","ko":"회사는 소프트웨어 업데이트와 해당 기기의 점검 또는 교환을 제공했어요.","shared":true},{"en":"Other companies emphasized battery testing and clearer usage information in response.","ko":"다른 회사들도 배터리 시험과 더 명확한 사용 정보를 강조했어요.","shared":true},{"en":"The case reminded me that impressive advertising isn't enough if ordinary use feels different.","ko":"일상 사용이 다르면 인상적인 광고만으로는 부족하다는 걸 느꼈어요.","shared":true},{"en":"I now read practical user reviews before buying a device.","ko":"이제 기기를 사기 전에 실제 사용 후기를 읽어요.","shared":true}],"note":"특정 기업·실제품의 결함을 주장하지 않는 연습용 가상 사례입니다.","sources":[{"id":"H6_15","label":"해커스 오픽 매뉴얼 · 사진 6 · Q15"}],"correction":"","scope":"돌발·확장","requirements":["제품이 대중의 기대에 미치지 못했던 사례의 문제, 대중과 업계의 반응을 자세히 설명하세요."],"words":105,"representative":"M311_15","additional":0,"sharedCount":8,"related":["M311_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."}],"aliases":{"M022_1":"M022_1","M024_2":"M024_2","M026_3":"M026_3","M028_4":"M028_4","M028_5":"M028_5","M030_6":"M030_6","M032_1":"M032_1","M034_2":"M034_2","M036_3":"M036_3","M038_4":"M038_4","M040_1":"M040_1","M 반적인 생활 루틴을 말해주세요.","source":"pdf","topic":"집","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.26 · M026_3"},{"id":"M028_4","page":28,"title":"집에서 발생한 문제 housing problem","q":"Have you ever had any problems with your home? What was the problem? How did you deal with it? How did the problem turn out? Use as many details as possible to describe it.","qko":"집에서 어떤 문제를 겪은 적이 있습니까? 문제가 무엇이었나요? 어떻게 해결했나 요? 그 문제가 어떻게 되었나요? 이것을 설명하기 위해 가능한 많은 세부 사항을 말해주세요.","source":"pdf","topic":"집","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.28 · M028_4"},{"id":"M028_5","page":28,"title":"집에 준 변화","q":"Please tell me about one change you made to your house. Did you get new furniture or do painting or decorating? Are you happy or unhappy with the changes? Why did you decide to make that change? What did your home look like afterward? Tell me everything you did in detail.","qko":"당신의 집에 준 변화 한 가지를 말해주세요. 새 가구를 샀거나 페인트 칠을 했거 나 인테리어를 새로 하셨나요? 그 변화에 행복했나요? 행복하지 않았나요? 왜 그 변화를 주려고 결정하셨나요? 그 후에 집이 어떻게 보였나요? 모든 것을 자세히 말해주세요.","source":"pdf","topic":"집","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.28 · M028_5"},{"id":"M030_6","page":30,"title":"집 비교","q":"Please compare the house you lived in before to the house you live in now. Is there something different between those two houses? Why did you move? Tell me about it in detail.","qko":"이전에 살던 집과 지금 사는 집을 비교해주세요. 그 두 집 사이에 어떤 차이점이 있나요? 왜 이사를 하셨나요? 자세히 말해주세요.","source":"pdf","topic":"집","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.30 · M030_6"},{"id":"M032_1","page":32,"title":"동네 묘사하기","q":"Let's talk about where you live. What does your neighborhood look like? Where is it located? What kinds of amenities are there in your neighborhood? Tell me about a place around your house.","qko":"당신의 사는 곳에 대해 이야기합시다. 당신의 동네는 어떤가요? 어디에 위치해 있나요? 당신의 동네에는 어떤 편의시설이 있습니까? 당신의 집 근처 장소에 대 해 말해주세요","source":"pdf","topic":"동네","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.32 · M032_1"},{"id":"M034_2","page":34,"title":"이웃 묘사하기","q":"Can you tell me about your neighbors? Who are they, and what are they like? Are you close to your neighbors? What do you typically do when you meet them?","qko":"당신의 이웃에 대해 말해주세요. 그들은 누구이고, 어떤 사람들인가요? 당신은 이 웃들과 친한가요? 그들을 만날 때 당신은 일반적으로 어떤 것을 하나요?","source":"pdf","topic":"동네","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.34 · M034_2"},{"id":"M036_3","page":36,"title":"동네 과거 경험","q":"Now, talk about an interesting or memorable experience in your neighborhood. When and where did it occur? Why was it interesting or memorable?","qko":"이제, 당신의 동네에서의 흥미롭거나 기억에 남는 경험에 대해 말해주세요. 언제 어디서 발생한 일인가요? 왜 그것이 흥미롭거나 기억에 남는 가요?","source":"pdf","topic":"동네","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.36 · M036_3"},{"id":"M038_4","page":38,"title":"동네 비교하기","q":"How has the place where you live changed or developed over the past ten years? What was the city like, and what about now? Please tell me in as much detail as possible.","qko":"당신이 사는 지역은 지난 10년간 어떻게 변화되고 발전되었나요? 그 도시는 어땠 고, 지금은 어떤가요? 가능한 자세히 말해주세요.","source":"pdf","topic":"동네","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.38 · M038_4"},{"id":"M040_1","page":40,"title":"집에서 보내는 휴가","q":"You indicated in the survey that you prefer to stay home during vacations. How do you spend your vacations at home? What do you usually do, and why do you like to stay at home? Who usually visits you when your vacation? Use as many details as possible to describe it.","qko":"설문에서 집에서 휴가 보내기를 선호한다고 했습니다. 집 휴가를 어떻게 보내나요? 보통 무엇을 하고 왜 집에 있는 것을 좋아하나요? 휴가 때 누가 주로 방문하나요? 자세히 설명하세요.","source":"pdf","topic":"집휴가","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.40 · M040_1"},{"id":"M042_2","page":42,"title":"집에서 휴가 보내는 이유","q":"Most people want to travel during their vacations. Can you tell me why you prefer to stay at home during your vacation? What makes a vacation at home enjoyable?","qko":"많은 사람들은 그들의 휴가 때 여행하기를 원합니다. 당신은 왜 집에 머무르는 것을 선호하는지 말해주세요. 무엇이 집에서 휴가를 즐기게 하나요?","source":"pdf","topic":"집휴가","type":"선호·의견","sourceLabel":"오픽만수르 IM2–IH · p.42 · M042_2"},{"id":"M044_3","page":44,"title":"집에서 겪은 과거 경험","q":"Tell me about a memorable vacation when you stay at home during your vacation. What did you do at home? Who were you wi th? Why was it so unforgettable? Give me many details.","qko":"집에서 보낸 기억에 남는 휴가를 말하세요. 무엇을 했고 누구와 함께했나요? 왜 잊을 수 없나요? 자세히 설명하세요.","source":"pdf","topic":"집휴가","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.44 · M044_3"},{"id":"M046_1","page":46,"title":"공원 묘사","q":"You indicated in the survey that you enjoy going to a park. Which park do you like to go to? Where is it? What does it look like? Who do you usually go with? Please describe your favorite park in detail.","qko":"당신은 설문조사에서 공원에 가는 것을 좋아한다고 답했습니다. 어느 공원에 가 는 것을 좋아하시나요? 어디에 있나요? 그 공원은 어떤가요? 누구와 주로 가시나 요? 당신이 가장 좋아하는 공원에 대해 자세히 묘사해주세요.","source":"pdf","topic":"공원","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.46 · M046_1"},{"id":"M048_2","page":48,"title":"공원에서 하는 것, 행동 습관","q":"How often do you go to a park? What things do you usually do at a park? Describe your typical day at a park from the moment you arrive at the park to the time you leave the park.","qko":"얼마나 자주 공원에 가시나요? 공원에서 주로 무엇을 하시나요? 당신이 공원에 도착해서 떠날 때까지 하는 일상적인 하루에 대해 설명해주세요.","source":"pdf","topic":"공원","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.48 · M048_2"},{"id":"M050_3","page":50,"title":"공원에서 발생한 문제, 과거 경험","q":"Tell me one memorable or unforgettable experience you had at a park. Who were you with, and what did you do there? Was there a special event, or did something unexpected happen? Please explain what happened in detail.","qko":"공원에서 겪은 기억에 남거나 잊을 수 없는 경험 하나를 말해주세요. 누구와 함 께 있었고 무엇을 하셨나요? 특별한 이벤트가 있었거나 기대하지 않은 어떤 일이 있었나요? 어떤 일이 있었는지 자세히 말해주세요","source":"pdf","topic":"공원","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.50 · M050_3"},{"id":"M052_1","page":52,"title":"조깅, 걷기 설명 묘사 + 루틴","q":"You indicated in the survey that you like to go walking. How often do you go walking? When and where do you normally go walking? Please describe your routine when you are walking.","qko":"당신의 설문조사에서, 당신은 조깅/걷기를 좋아한다고 응답했습니다. 얼마나 자주 조깅/걷기를 하십니까? 일반적으로 언제 어디로 조깅/걷기를 하러 가시나요? 당 신이 조깅/걷기를 할 때의 루틴을 설명해주세요.","source":"pdf","topic":"조깅·걷기","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.52 · M052_1"},{"id":"M054_2","page":54,"title":"조깅, 걷기 안전 예방","q":"Safety is important. What items do you bring or wear when you go jogging? What do you take to avoid injury? Tell me about your items for safety in detail","qko":"안전은 중요합니다. 조깅할 때 어떤 물건을 가져가거나 착용하나요? 부상을 피하려고 무엇을 챙기나요? 안전용품을 자세히 설명하세요.","source":"pdf","topic":"조깅·걷기","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.54 · M054_2"},{"id":"M056_3","page":56,"title":"조깅/걷기 과거 경험, 계기","q":"Now, tell me why you started walking at first. When did you start walking regularly? Explain how you first become interested in walking.","qko":"이제 당신이 처음에 왜 조깅/걷기를 시작했는지 말해주세요. 언제 규칙적으로 조 깅/걷기를 하기 시작했나요? 어떻게 처음 조깅/걷기에 관심을 가지게 되었는지 설명해주세요.","source":"pdf","topic":"조깅·걷기","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.56 · M056_3"},{"id":"M058_4","page":58,"title":"조깅, 걷기 과거 경험","q":"Have you ever had a particularly memorable experience while jogging? What was it? When and where did you go jogging? Who did you go with? What happened, and how did you feel? Tell me about the experience from beginning to end.","qko":"조깅/걷기를 하는 동안 겪은 특별히 기억에 남는 경험이 있나요? 무엇인가요? 언 제 어디서 조깅/걷기를 하셨나요? 누구와 함께였나요? 무슨 일이 있었고 어떻게 느끼셨나요? 그 경험에 대해 처음부터 끝까지 다 말해주세요.","source":"pdf","topic":"조깅·걷기","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.58 · M058_4"},{"id":"M060_1","page":60,"title":"쇼핑 장소 설명","q":"You indicated in the survey that you enjoy shopping. Tell me about stores or shopping centers in your country. What are they like? Where are they located? What items do they sell? Is there a particular store that you regularly visit for shopping?","qko":"당신은 설문조사에서 쇼핑을 좋아한다고 답했습니다. 당신의 나라에 있는 가게나 쇼핑 센터에 대해 말해주세요. 그들은 어떤가요? 그들을 어디에 있나요? 그들은 어떤 아이템들을 판매하나요? 당신이 정기적으로 쇼핑하러 가는 특정한 가게가 있나요?","source":"pdf","topic":"쇼핑","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.60 · M060_1"},{"id":"M062_2","page":62,"title":"쇼핑 장소, 활동 설명","q":"Shopping is a popular activity. Tell me where you usually go shopping. When do you go there? Who do you go with? What do you usually buy? Describe as many details as possible.","qko":"쇼핑은 인기있는 활동입니다. 주로 쇼핑하는 곳을 이야기해주세요. 언제 거기에 가고 누구와 같이 갑니까? 무엇을 주로 구매합니까?","source":"pdf","topic":"쇼핑","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.62 · M062_2"},{"id":"M064_3","page":64,"title":"쇼핑 과거 경험","q":"Describe one memorable or unforgettable experience you had when you were shopping. What happened? What did you buy? What made this experience so unforgettable?","qko":"쇼핑을 할 때 겪은 기억에 남거나 잊을 수 없는 경험 하나를 말해주세요. 무슨 일이 있었나요? 무엇을 구매하셨나요? 무엇이 그 경험을 잊을 수 없게 했나요?","source":"pdf","topic":"쇼핑","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.64 · M064_3"},{"id":"M066_1","page":66,"title":"카페 묘사","q":"You indicated in the survey that you go to cafes or coffee shops. Tell me about the café you often go to. Where is the café located? What does it look like? Is there something special about that café?","qko":"당신은 설문조사에서 카페 또는 커피숍에 간다고 답변했습니다. 당신이 자주 가 는 카페에 대해 말해주세요. 그 카페는 어디에 있나요? 그 카페는 어떤가요? 그 카페에 대한 특별한 점이 있나요?","source":"pdf","topic":"카페","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.66 · M066_1"},{"id":"M068_2","page":68,"title":"카페에서 하는 일, 행동, 습관","q":"What do you normally do when you go to a café? Do you read or eat something? Or do you have meetings or gatherings? Please tell me what you ’d like to do at the café in detail.","qko":"당신께서는 카페에 갈 때 일반적으로 무엇을 하시나요? 당신은 무언가를 읽거나 먹거나 미팅을 가지거나 모임을 하시나요? 당신께서 카페에서 무엇을 하기를 좋 아하는 지 자세히 말해주세요.","source":"pdf","topic":"카페","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.68 · M068_2"},{"id":"M070_3","page":70,"title":"카페에서 발생한 일, 과거 경험","q":"Sometimes, unexpected things can occur when you are at a café. Have you experienced something incident that happened at a café? What happened? Who was involved? And how did you deal with the situation? Tell me as many details as possible.","qko":"가끔 카페에 있을 때 예상치 못한 일어나기도 합니다. 당신이 겪은 카페에서의 어떤 사건이 있나요? 무슨 일인가요? 누가 연관되어 있나요? 그리고 어떻게 그 상황을 해결하셨나요? 가능한 자세히 말해주세요.","source":"pdf","topic":"카페","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.70 · M070_3"},{"id":"M072_1","page":72,"title":"술집, 바 묘사","q":"I'd like to know about the bar you often go to. Where is your favorite bar? What does it look like? Please describe everything about that bar in detail.","qko":"당신이 자주 가는 술집에 대해 알고 싶습니다. 당신이 가장 좋아하는 술집은 어 디에 있나요? 그 곳은 어떤가요? 그 술집에 대해 모든 것을 자세히 말해주세요.","source":"pdf","topic":"술집","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.72 · M072_1"},{"id":"M076_2","page":76,"title":"술집, 바에서 하는 행동, 습관","q":"What do you typically do at the bar? Who do you usually go with? What menu do you like to order? Let me know what you do at the bar in detail.","qko":"당신은 술집에서 일반적으로 무엇을 하시나요? 누구와 주로 가시나요? 어떤 메뉴 를 주문하시나요? 당신이 술집에서 하는 것들을 자세히 알려주세요.","source":"pdf","topic":"술집","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.76 · M076_2"},{"id":"M078_3","page":78,"title":"술집, 바에서 발생한 일, 과거 경험","q":"Have you ever had a memorable experience at a bar? What made this experience unforgettable? Was there a special event like a birthday, or did something unexpected happen? Describe how you spent your time in detail.","qko":"술집에서 겪은 기억에 남는 경험이 있으신가요? 무엇이 그 경험을 잊을 수 없게 했나요? 생일파티나 기대치 못한 일이 발생한 것 같은 특별한 일이 있었나요? 그 시간을 어떻게 보내셨는지 자세히 묘사해주세요.","source":"pdf","topic":"술집","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.78 · M078_3"},{"id":"M080_1","page":80,"title":"좋아하는 영화 묘사","q":"You indicated in the survey that you like to watch movies. What kinds of movies do you like? What is your favorite genre of movies? Why do you like that types of movies? Tell me about it in detail.","qko":"당신은 설문조사에서 영화 보는 것을 좋아한다고 답했습니다. 어떤 영화를 좋아 하시나요? 당신이 가장 좋아하는 영화 장르는 무엇인가요? 왜 그런 영화를 좋아 하시나요? 자세히 말해주세요.","source":"pdf","topic":"영화","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.80 · M080_1"},{"id":"M082_2","page":82,"title":"가장 좋아하는 극장 묘사하기","q":"You indicated in the survey that you enjoy going
