here did it happen? What makes this experience so memorable?","qko":"음악을 듣다가 겪은 기억에 남는 경험을 말하세요. 좋아하는 노래를 들었나요? 언제 어디에서 있었고 왜 기억에 남나요?","source":"pdf","topic":"음악","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.105 · M105_4","family":"concert-memory","cue":"작년 가을 → 서울 홀 → 민 → June → 후렴","lines":[{"en":"Last fall, I went to June's pop concert with Min at a small concert hall in Seoul.","ko":"지난가을 민이와 서울의 작은 공연장에서 준이의 팝 콘서트를 봤어요.","shared":true},{"en":"The hall was near a subway station, and the stage was easy to see from our seats.","ko":"공연장은 지하철역 근처였고 우리 자리에서 무대가 잘 보였어요.","shared":true},{"en":"I don't attend concerts often, but this one was worth the trip.","ko":"콘서트에 자주 가진 않지만 이 공연은 갈 만했어요.","shared":true},{"en":"My favorite moment was during her song, A Quiet Day.","ko":"가장 좋았던 순간은 ‘어 콰이어트 데이’라는 노래를 부를 때였어요.","shared":true},{"en":"She lowered her microphone, and the audience sang the chorus together.","ko":"가수가 마이크를 내리자 관객이 후렴을 함께 불렀어요.","shared":true},{"en":"Min and I joined in, and I felt a little emotional hearing so many voices.","ko":"민이와 저도 함께 불렀고 많은 목소리를 들으니 조금 뭉클했어요.","shared":true},{"en":"The song sounded warmer and more powerful than it did through my earphones.","ko":"이어폰으로 들을 때보다 더 따뜻하고 힘 있게 들렸어요.","shared":true},{"en":"I still remember that feeling whenever I hear the song at home.","ko":"집에서 그 노래를 들을 때마다 그 느낌이 떠올라요.","shared":true}],"note":"공연장 질문에는 위치·시야와 그곳에서 본 콘서트, 경험 질문에는 시점·동행·사건이 핵심입니다.","sources":[{"id":"M105_4","label":"오픽만수르 IM2–IH · p.105 · M105_4"}],"correction":"","scope":"설문 중심","requirements":["음악을 듣다가 겪은 기억에 남는 경험을 말하세요.","좋아하는 노래를 들었나요?","언제 어디에서 있었고 왜 기억에 남나요?"],"words":107,"representative":"M097_2","additional":0,"sharedCount":8,"related":["M097_2","M099_4","H6_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M107_1","page":107,"title":"국내 여행 설명 묘사_나 중심","q":"You indicated in the survey that you like to take traveling domestically. Why do you like to take trips to your home country? Tell me about some places that you like to travel to. What is your favorite location? Why do you like going there?","qko":"당신은 국내 여행을 좋아한다고 답했습니다. 왜 국내 여행을 좋아하시나요? 당신 이 여행하기 좋아하는 장소 몇 군데를 말해주세요. 가장 좋아하는 장소는 어디인 가요? 왜 거기 가는 것을 좋아하시나요?","source":"pdf","topic":"국내여행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.107 · M107_1","family":"travel-place","cue":"강릉 경포 → 모래·소나무 → 바다 선호 → 휴식","lines":[{"en":"My favorite domestic destination is Gangneung on Korea's east coast.","ko":"제가 좋아하는 국내 여행지는 한국 동해안의 강릉이에요.","shared":true},{"en":"I especially like Gyeongpo Beach, with its long sandy shore and pine trees nearby.","ko":"특히 긴 모래 해변과 근처 소나무가 있는 경포해변을 좋아해요.","shared":true},{"en":"The water looks bright blue on a clear day, and the open view feels refreshing.","ko":"맑은 날에는 바다가 밝은 파란색이고 탁 트인 풍경이 시원해요.","shared":true},{"en":"I prefer beaches to mountains because I can walk slowly without a difficult climb.","ko":"힘들게 오르지 않고 천천히 걸을 수 있어 산보다 해변이 좋아요.","shared":true},{"en":"I also enjoy visiting small cafes and trying local food in the city.","ko":"시내의 작은 카페에 가고 지역 음식을 먹는 것도 좋아해요.","shared":true},{"en":"Domestic trips are convenient because I can travel by train and communicate easily.","ko":"기차로 갈 수 있고 말도 편하게 통하니 국내여행은 편리해요.","shared":true},{"en":"Even a short visit gives me a clear break from my usual surroundings.","ko":"잠깐 다녀와도 평소 환경에서 확실히 벗어난 기분이 들어요.","shared":true},{"en":"That is why I keep choosing the coast when I need to recharge.","ko":"그래서 기운을 되찾고 싶을 때 바닷가를 계속 골라요.","shared":true}],"note":"","sources":[{"id":"M107_1","label":"오픽만수르 IM2–IH · p.107 · M107_1"}],"correction":"take traveling domestically → travel domestically. 원문은 그대로 표시합니다.","scope":"설문 중심","requirements":["당신은 국내 여행을 좋아한다고 답했습니다.","왜 국내 여행을 좋아하시나요?","당신 이 여행하기 좋아하는 장소 몇 군데를 말해주세요.","가장 좋아하는 장소는 어디인 가요?","왜 거기 가는 것을 좋아하시나요?"],"words":105,"representative":"M107_1","additional":0,"sharedCount":8,"related":["H1_05","H3_05","H6_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M109_1-2","page":109,"title":"국내 여행 설명 묘사_사람들 중심","q":"I'd like to know about places people like to travel to for their vacations. Please tell me where people in your country go for vacations these days.","qko":"사람들이 휴가를 위해 가는 장소를 알고 싶습니다. 요즘 당신의 나라의 사람들이 휴가를 위해 어디로 가는지 말해주세요.","source":"pdf","topic":"국내여행","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.109 · M109_1-2","family":"domestic-people","cue":"사람마다 바다·산·도시 → 교통·시간","lines":[{"en":"People I know choose quite different places for domestic vacations.","ko":"제가 아는 사람들은 국내 휴가지로 꽤 다양한 곳을 골라요.","shared":false},{"en":"Some prefer coastal cities such as Gangneung because they want sea views and fresh air.","ko":"어떤 사람은 바다 풍경과 바람을 즐기려고 강릉 같은 해안 도시를 선호해요.","shared":false},{"en":"Others choose mountain areas for hiking or a quieter place to stay.","ko":"다른 사람은 등산이나 조용한 숙소를 위해 산을 골라요.","shared":false},{"en":"City trips are also attractive for people who enjoy food, museums, or shopping.","ko":"음식, 박물관, 쇼핑을 즐기는 사람에게는 도시 여행도 매력적이에요.","shared":false},{"en":"For a short break, my friends usually consider how easily they can get there by train or bus.","ko":"짧은 휴가에는 친구들이 보통 기차나 버스로 얼마나 쉽게 가는지 생각해요.","shared":false},{"en":"Families may choose a place with activities that both children and adults can enjoy.","ko":"가족은 아이와 어른이 모두 즐길 활동이 있는 곳을 고를 수 있어요.","shared":false},{"en":"So I don't think there is one destination for everyone; the time available and purpose of the trip matter a lot.","ko":"모두를 위한 여행지 하나가 있다기보다 시간과 여행 목적이 중요하다고 생각해요.","shared":false}],"note":"","sources":[{"id":"M109_1-2","label":"오픽만수르 IM2–IH · p.109 · M109_1-2"}],"correction":"","scope":"설문 중심","requirements":["사람들이 휴가를 위해 가는 장소를 알고 싶습니다.","요즘 당신의 나라의 사람들이 휴가를 위해 어디로 가는지 말해주세요."],"words":103,"representative":"M109_1-2","additional":0,"sharedCount":0,"related":[],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"M111_2","page":111,"title":"국내 여행 준비 습관","q":"What do you usually prepare before you take a trip? What things do you take in your luggage? What items do you bring with you? Describe each step you take to prepare for your trip in detail.","qko":"당신은 여행을 가기 전 주로 어떤 준비를 하시나요? 당신의 짐에 무엇을 넣으시 나요? 어떤 아이템들을 가져 가시나요? 당신이 여행을 준비하며 챙기는 각 단계 를 자세히 말해주세요.","source":"pdf","topic":"국내여행","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.111 · M111_2","family":"travel-pack","cue":"예산·날씨 → 교통·숙소 → 옷·충전기 → 저장","lines":[{"en":"Before a trip, I first choose the dates and decide how much I can spend.","ko":"여행 전에 먼저 날짜와 예산을 정해요.","shared":true},{"en":"Then I check the weather and read a few recent reviews of the area.","ko":"그다음 날씨와 여행지의 최근 후기 몇 개를 확인해요.","shared":true},{"en":"I book transportation and accommodation early so I know where I will sleep.","ko":"어디서 잘지 정해지도록 교통편과 숙소를 일찍 예약해요.","shared":true},{"en":"I make a short list of places to visit, but I leave some free time.","ko":"방문할 장소를 짧게 정리하되 자유 시간도 남겨둬요.","shared":true},{"en":"In my bag, I put comfortable clothes, basic toiletries, a charger, and a small umbrella.","ko":"가방에는 편한 옷, 기본 세면도구, 충전기, 작은 우산을 넣어요.","shared":true},{"en":"I also save my tickets and the hotel address on my phone for offline use.","ko":"인터넷 없이 볼 수 있도록 표와 호텔 주소를 휴대폰에 저장해요.","shared":true},{"en":"The night before leaving, I check everything against a simple packing list.","ko":"출발 전날 밤에는 간단한 준비물 목록으로 빠진 게 없는지 확인해요.","shared":true},{"en":"This routine helps me avoid small problems without planning every minute.","ko":"이렇게 하면 매분 계획하지 않아도 작은 문제들을 피할 수 있어요.","shared":true}],"note":"","sources":[{"id":"M111_2","label":"오픽만수르 IM2–IH · p.111 · M111_2"}],"correction":"","scope":"설문 중심","requirements":["당신은 여행을 가기 전 주로 어떤 준비를 하시나요?","당신의 짐에 무엇을 넣으시 나요?","어떤 아이템들을 가져 가시나요?","당신이 여행을 준비하며 챙기는 각 단계 를 자세히 말해주세요."],"words":110,"representative":"M111_2","additional":0,"sharedCount":8,"related":["M119_2","H4_09"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M113_3","page":113,"title":"국내 여행 과거 경험","q":"Tell me about the most memorable travel experience you had. When and where did you go? What did you see? What happened? Why was this experience unforgettable to you?","qko":"가장 기억에 남는 여행 경험을 말해주세요. 언제 어디로 갔나요? 무엇을 보았나 요? 무슨 일이 있었나요? 왜 그 경험을 잊을 수 없나요?","source":"pdf","topic":"국내여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.113 · M113_3","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"M113_3","label":"오픽만수르 IM2–IH · p.113 · M113_3"}],"correction":"","scope":"설문 중심","requirements":["가장 기억에 남는 여행 경험을 말해주세요.","언제 어디로 갔나요?","무엇을 보았나 요?","무슨 일이 있었나요?","왜 그 경험을 잊을 수 없나요?"],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M208_3","M216_3","H1_07","H3_06","H3_07","H5_07","H6_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M116_1","page":116,"title":"해외 여행 설명 묘사_나 중심","q":"You indicated in the survey that you like to take vacations internationally. Tell me about a city or a country you have visited. Where was it? What did the place look like? What kind of impression did you get at the location?","qko":"당신은 설문조사에서 해외여행을 좋아한다고 했습니다. 당신이 방문했던 도시나 나라에 대해 말해주세요. 어디였나요? 그 장소는 어땠나요? 거기서 어떤 인상을 받았나요?","source":"pdf","topic":"해외여행","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.116 · M116_1","family":"abroad","cue":"작년 가을 오사카 → 민 → 시장·강 → 길 도움","lines":[{"en":"My most recent overseas trip was to Osaka in Japan last fall with Min.","ko":"최근 해외여행은 지난가을 민이와 일본 오사카에 간 거예요.","shared":true},{"en":"We stayed for three days in a small hotel near a train station.","ko":"기차역 근처 작은 호텔에서 사흘간 머물렀어요.","shared":true},{"en":"The city had busy shopping streets, bright signs, and quieter streets along the river.","ko":"도시에는 번화한 상점가와 밝은 간판, 강변의 조용한 길이 있었어요.","shared":true},{"en":"We visited a market, tried local noodles, and walked around after dinner.","ko":"시장에 가고 현지 국수를 먹고 저녁 후에는 산책했어요.","shared":true},{"en":"One shop owner patiently showed us the way when we couldn't find the right street.","ko":"길을 못 찾았을 때 한 가게 주인이 차분히 알려줬어요.","shared":true},{"en":"That kindness made the unfamiliar place feel much more welcoming.","ko":"그 친절 덕분에 낯선 곳이 훨씬 편안하게 느껴졌어요.","shared":true},{"en":"I especially liked how lively areas and peaceful corners were so close together.","ko":"활기찬 곳과 조용한 곳이 가까이 있다는 점이 특히 좋았어요.","shared":true},{"en":"I came home with the impression that exploring on foot was the best part of the trip.","ko":"걸어서 둘러보는 게 여행에서 가장 좋았다는 생각을 하며 돌아왔어요.","shared":true}],"note":"","sources":[{"id":"M116_1","label":"오픽만수르 IM2–IH · p.116 · M116_1"}],"correction":"","scope":"설문 중심","requirements":["당신은 설문조사에서 해외여행을 좋아한다고 했습니다.","당신이 방문했던 도시나 나라에 대해 말해주세요.","어디였나요?","그 장소는 어땠나요?","거기서 어떤 인상을 받았나요?"],"words":108,"representative":"M116_1","additional":0,"sharedCount":8,"related":["M184_3","M273_13","H2_08","H2_09","H2_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M117_1-2","page":117,"title":"해외 여행 설명 묘사_사람들 중심","q":"Where do people in your country like to visit when they travel abroad? Why do they like visiting those locations? What are the special reasons they like to go to those areas? Tell me about it in detail.","qko":"당신의 나라 사람들은 해외여행을 갈 때 어디로 가는 것을 좋아하나요? 왜 그 장소들을 좋아하나요? 그 지역에 가는 특별한 이유가 있나요? 자세히 말해주세요.","source":"pdf","topic":"해외여행","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.117 · M117_1-2","family":"abroad-people","cue":"일본·태국 → 가까움·음식·휴식 → 관심 차이","lines":[{"en":"Among people I know in Korea, Japan and Thailand are common choices for overseas trips.","ko":"제가 아는 한국 사람들 사이에서는 일본과 태국을 해외여행지로 자주 골라요.","shared":false},{"en":"Friends who choose Japan often want a relatively short flight and a chance to try local food.","ko":"일본을 고르는 친구들은 비교적 짧은 비행과 현지 음식을 원하는 경우가 많아요.","shared":false},{"en":"They may visit a city such as Osaka to walk through markets and explore different neighborhoods.","ko":"오사카 같은 도시에서 시장을 걷고 여러 동네를 둘러보기도 해요.","shared":false},{"en":"People who choose Thailand sometimes want warm weather, a relaxing hotel stay, or time near the sea.","ko":"태국을 고르는 사람은 따뜻한 날씨와 편한 호텔 휴식, 바다 근처 시간을 원하기도 해요.","shared":false},{"en":"The special attraction is often a change from their normal daily surroundings.","ko":"일상 환경에서 벗어나는 것이 특별한 매력인 경우가 많아요.","shared":false},{"en":"Of course, budget and available time affect the decision too.","ko":"물론 예산과 가능한 시간도 결정에 영향을 줘요.","shared":false},{"en":"I think people choose the experience they want first and then look for a country that suits it.","ko":"원하는 경험을 먼저 정하고 맞는 나라를 찾는 것 같아요.","shared":false}],"note":"","sources":[{"id":"M117_1-2","label":"오픽만수르 IM2–IH · p.117 · M117_1-2"}],"correction":"","scope":"설문 중심","requirements":["당신의 나라 사람들은 해외여행을 갈 때 어디로 가는 것을 좋아하나요?","왜 그 장소들을 좋아하나요?","그 지역에 가는 특별한 이유가 있나요?","자세히 말해주세요."],"words":105,"representative":"M117_1-2","additional":0,"sharedCount":0,"related":[],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"M118_1-3","page":118,"title":"해외 여행 설명 묘사_미래 중심","q":"You indicated in the survey that you like to travel internationally. Which place do you want to travel to in the future? What activities do you want to do in that place? Why do you want to go there?","qko":"설문에서 해외여행을 좋아한다고 했습니다. 앞으로 어느 곳을 여행하고 싶나요? 그곳에서 무엇을 하고 싶으며 왜 가고 싶나요?","source":"pdf","topic":"해외여행","type":"미래 계획","sourceLabel":"오픽만수르 IM2–IH · p.118 · M118_1-3","family":"future-trip","cue":"미래 후쿠오카 → 음식·산책 → 느긋한 계획","lines":[{"en":"In the future, I would like to visit Fukuoka in Japan.","ko":"앞으로 일본 후쿠오카를 방문하고 싶어요.","shared":false},{"en":"I enjoyed my trip to Osaka, so I want to experience another Japanese city.","ko":"오사카 여행이 좋아서 다른 일본 도시도 경험하고 싶어요.","shared":false},{"en":"I would like to try local noodles, visit a few small cafes, and walk around different neighborhoods.","ko":"현지 국수를 먹고 작은 카페에 가고 여러 동네를 걷고 싶어요.","shared":false},{"en":"I would also set aside an afternoon for a park or a quiet waterfront area.","ko":"공원이나 조용한 물가에서 오후를 보낼 시간도 남기고 싶어요.","shared":false},{"en":"Rather than rushing between famous attractions, I want to notice ordinary daily life.","ko":"유명 명소를 급히 다니기보다 평범한 일상을 보고 싶어요.","shared":false},{"en":"Min would probably come with me because we both enjoy food and relaxed walks.","ko":"음식과 편한 산책을 둘 다 좋아해서 아마 민이와 갈 거예요.","shared":false},{"en":"I haven't booked anything yet, but I would aim for a short trip with a flexible schedule.","ko":"아직 예약하지 않았지만 유연한 일정의 짧은 여행을 생각하고 있어요.","shared":false}],"note":"","sources":[{"id":"M118_1-3","label":"오픽만수르 IM2–IH · p.118 · M118_1-3"}],"correction":"","scope":"설문 중심","requirements":["설문에서 해외여행을 좋아한다고 했습니다.","앞으로 어느 곳을 여행하고 싶나요?","그곳에서 무엇을 하고 싶으며 왜 가고 싶나요?"],"words":101,"representative":"M118_1-3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M119_2","page":119,"title":"해외 여행 준비물, 행동 습관","q":"What do you typically prepare before you travel internationally? What do you do before the trip? What things do you usually bring in your luggage? Please tell me what you do before going on a trip in detail.","qko":"해외여행을 가기 전에 일반적으로 어떤 준비를 하시나요? 여행 전에 무엇을 하시 나요? 짐가방에 주로 어떤 것들을 넣어 가시나요? 여행을 가기 전에 하시는 것에 대해 자세히 말해주세요.","source":"pdf","topic":"해외여행","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.119 · M119_2","family":"travel-pack","cue":"예산·날씨 → 교통·숙소 → 옷·충전기 → 저장","lines":[{"en":"Before a trip, I first choose the dates and decide how much I can spend.","ko":"여행 전에 먼저 날짜와 예산을 정해요.","shared":true},{"en":"Then I check the weather and read a few recent reviews of the area.","ko":"그다음 날씨와 여행지의 최근 후기 몇 개를 확인해요.","shared":true},{"en":"I book transportation and accommodation early so I know where I will sleep.","ko":"어디서 잘지 정해지도록 교통편과 숙소를 일찍 예약해요.","shared":true},{"en":"I make a short list of places to visit, but I leave some free time.","ko":"방문할 장소를 짧게 정리하되 자유 시간도 남겨둬요.","shared":true},{"en":"In my bag, I put comfortable clothes, basic toiletries, a charger, and a small umbrella.","ko":"가방에는 편한 옷, 기본 세면도구, 충전기, 작은 우산을 넣어요.","shared":true},{"en":"I also save my tickets and the hotel address on my phone for offline use.","ko":"인터넷 없이 볼 수 있도록 표와 호텔 주소를 휴대폰에 저장해요.","shared":true},{"en":"The night before leaving, I check everything against a simple packing list.","ko":"출발 전날 밤에는 간단한 준비물 목록으로 빠진 게 없는지 확인해요.","shared":true},{"en":"This routine helps me avoid small problems without planning every minute.","ko":"이렇게 하면 매분 계획하지 않아도 작은 문제들을 피할 수 있어요.","shared":true},{"en":"For an overseas trip, I also check my passport, entry requirements, insurance, and payment options.","ko":"해외여행 때는 여권, 입국 요건, 보험, 결제 수단도 확인해요.","shared":false},{"en":"I arrange mobile data and save a few useful phrases so I can ask for help abroad.","ko":"해외에서 도움을 구할 수 있게 데이터 이용을 준비하고 유용한 표현을 저장해요.","shared":false}],"note":"","sources":[{"id":"M119_2","label":"오픽만수르 IM2–IH · p.119 · M119_2"}],"correction":"","scope":"설문 중심","requirements":["해외여행을 가기 전에 일반적으로 어떤 준비를 하시나요?","여행 전에 무엇을 하시 나요?","짐가방에 주로 어떤 것들을 넣어 가시나요?","여행을 가기 전에 하시는 것에 대해 자세히 말해주세요."],"words":142,"representative":"M111_2","additional":2,"sharedCount":8,"related":["M111_2","H4_09"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M120_3","page":120,"title":"해외 여행 과거 경험","q":"Tell me about a memorable or unforgettable experience you had when you took a trip abroad. Maybe something happened that was funny, unexpected, challenging, or embarrassing. What happened, and how did you deal with it? What made this experience so memorable? Use as many details as possible to explain the whole story.","qko":"해외여행을 하면서 겪은 기억에 남거나 잊을 수 없는 경험에 대해 말해주세요. 웃기거나 예상치 못했거나, 어려웠거나 또는 당황스러웠던 경험이 있었을지도 모 릅니다. 무슨 일을 겪었고 어떻게 대처하셨나요? 무엇이 이 경험을 기억에 남게 했나요? 전체 이야기를 최대한 자세하게 말해주세요.","source":"pdf","topic":"해외여행","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.120 · M120_3","family":"abroad-problem","cue":"오사카 역 → 반대 열차 → 직원 도움 → 복귀","lines":[{"en":"During my trip to Osaka last fall, Min and I got on a train going the wrong way.","ko":"지난가을 오사카 여행에서 민이와 반대 방향 열차를 탔어요.","shared":false},{"en":"We were trying to reach a market, but the station names didn't match our map.","ko":"시장에 가려 했는데 역 이름이 지도와 맞지 않았어요.","shared":false},{"en":"I felt embarrassed because I had confidently chosen the platform.","ko":"제가 자신 있게 승강장을 골랐어서 민망했어요.","shared":false},{"en":"We got off at the next station and showed our destination to a staff member.","ko":"다음 역에 내려 직원에게 목적지를 보여줬어요.","shared":false},{"en":"He pointed out the correct platform and wrote down where we should change trains.","ko":"직원이 맞는 승강장을 알려주고 갈아탈 곳을 적어줬어요.","shared":false},{"en":"We checked the signs carefully and reached the market about thirty minutes late.","ko":"표지판을 꼼꼼히 확인해 30분쯤 늦게 시장에 도착했어요.","shared":false},{"en":"Fortunately, we had no fixed reservation, so we could still enjoy lunch there.","ko":"다행히 정해진 예약은 없어서 점심을 즐길 수 있었어요.","shared":false},{"en":"It was memorable because asking for help turned a stressful mistake into a friendly interaction.","ko":"도움을 구하니 당황스러운 실수가 친절한 만남으로 바뀌어 기억에 남아요.","shared":false}],"note":"","sources":[{"id":"M120_3","label":"오픽만수르 IM2–IH · p.120 · M120_3"}],"correction":"","scope":"설문 중심","requirements":["해외여행을 하면서 겪은 기억에 남거나 잊을 수 없는 경험에 대해 말해주세요.","웃기거나 예상치 못했거나, 어려웠거나 또는 당황스러웠던 경험이 있었을지도 모 릅니다.","무슨 일을 겪었고 어떻게 대처하셨나요?","무엇이 이 경험을 기억에 남게 했나요?","전체 이야기를 최대한 자세하게 말해주세요."],"words":113,"representative":"M120_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M121_1","page":121,"title":"좋아하는 요리 설명하기","q":"You indicated that you like to cook. What kind of food do you like to cook? Do you have any special recipes? When and where do you usually cook? Why do you like to cook? Please describe your whole process of cooking from beginning to end.","qko":"당신은 요리를 좋아한다고 답했습니다. 어떤 요리를 좋아하시나요? 특별한 레시 피가 있나요? 언제 어디서 주로 요리하나요? 왜 요리를 좋아하나요? 당신의 요리 과정을 처음부터 끝까지 말해주세요.","source":"pdf","topic":"요리","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.121 · M121_1","family":"cooking","cue":"주말 파스타 → 물·면 → 마늘·토마토 → 섞기","lines":[{"en":"I like cooking simple tomato pasta in my apartment, usually on weekends.","ko":"주말에 집에서 간단한 토마토 파스타를 만드는 걸 좋아해요.","shared":false},{"en":"My recipe isn't special, but I add extra garlic and some mushrooms for flavor.","ko":"특별한 조리법은 아니지만 풍미를 위해 마늘과 버섯을 더 넣어요.","shared":false},{"en":"First, I wash and cut the ingredients and boil water for the pasta.","ko":"먼저 재료를 씻고 자르고 면 삶을 물을 끓여요.","shared":false},{"en":"While the pasta cooks, I gently heat the garlic and mushrooms in a pan.","ko":"면이 익는 동안 팬에서 마늘과 버섯을 약하게 익혀요.","shared":false},{"en":"Then I add tomato sauce and let it warm through.","ko":"그다음 토마토소스를 넣고 데워요.","shared":false},{"en":"I mix in the drained pasta and a little cooking water so the sauce coats it well.","ko":"물 뺀 면과 면수를 조금 섞어 소스가 잘 묻게 해요.","shared":false},{"en":"Finally, I put it on a plate and clean the kitchen before sitting down.","ko":"마지막으로 접시에 담고 주방을 정리한 뒤 앉아요.","shared":false},{"en":"I enjoy cooking because making something myself feels satisfying and helps me spend less on delivery.","ko":"직접 만들면 뿌듯하고 배달비도 줄어 요리가 좋아요.","shared":false}],"note":"","sources":[{"id":"M121_1","label":"오픽만수르 IM2–IH · p.121 · M121_1"}],"correction":"","scope":"선택 외 참고","requirements":["당신은 요리를 좋아한다고 답했습니다.","어떤 요리를 좋아하시나요?","특별한 레시 피가 있나요?","언제 어디서 주로 요리하나요?","왜 요리를 좋아하나요?","당신의 요리 과정을 처음부터 끝까지 말해주세요."],"words":110,"representative":"M121_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M123_2","page":123,"title":"요리하며 겪은 기억에 남는 경험","q":"Tell me about an interesting or memorable experience you have had while cooking. What did you cook? What made this experience so memorable? Please tell me everything.","qko":"요리하며 겪은 흥미롭거나 기억에 남는 경험을 말해주세요. 무엇을 요리했나요? 무엇이 그 경험을 기억에 남게 했나요? 모두 다 말해주세요.","source":"pdf","topic":"요리","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.123 · M123_2","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true}],"note":"","sources":[{"id":"M123_2","label":"오픽만수르 IM2–IH · p.123 · M123_2"}],"correction":"","scope":"선택 외 참고","requirements":["요리하며 겪은 흥미롭거나 기억에 남는 경험을 말해주세요.","무엇을 요리했나요?","무엇이 그 경험을 기억에 남게 했나요?","모두 다 말해주세요."],"words":104,"representative":"M044_3","additional":0,"sharedCount":8,"related":["M044_3","M125_3","M276_13","H3_03","H3_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M125_3","page":125,"title":"요리하며 겪은 문제","q":"Unexpected difficulties can occur while you are cooking. What was the problem you recently experienced while you were cooking? How did you solve the problem? Tell me in detail.","qko":"요리를 할 때 예상치 못한 어려움이 발생할 수 있습니다. 최근에 당신이 요리하 며 겪은 문제가 무엇인가요? 어떻게 그것을 해결했나요? 자세히 말해주세요.","source":"pdf","topic":"요리","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.125 · M125_3","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true}],"note":"","sources":[{"id":"M125_3","label":"오픽만수르 IM2–IH · p.125 · M125_3"}],"correction":"","scope":"선택 외 참고","requirements":["요리를 할 때 예상치 못한 어려움이 발생할 수 있습니다.","최근에 당신이 요리하 며 겪은 문제가 무엇인가요?","어떻게 그것을 해결했나요?","자세히 말해주세요."],"words":104,"representative":"M044_3","additional":0,"sharedCount":8,"related":["M044_3","M123_2","M276_13","H3_03","H3_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M127_4","page":127,"title":"다른 나라와 요리 비교","q":"Compare the food in your country with the food in another country. What are the differences? Is it the recipes or the ingredients that mainly differ? Tell me in detail.","qko":"당신의 나라와 다른 나라의 음식에 대해 비교해주세요. 무엇이 다른가요? 레시피 나 재료가 주로 다른가요? 자세히 말해주세요.","source":"pdf","topic":"요리","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.127 · M127_4","family":"food-compare","cue":"한국 밥·반찬 → 이탈리아 파스타 → 재료·순서","lines":[{"en":"I will compare everyday Korean meals with the Italian food I have tried.","ko":"일상적인 한국 식사와 제가 먹어본 이탈리아 음식을 비교할게요.","shared":false},{"en":"A Korean meal often includes rice, soup, and several side dishes served together.","ko":"한국 식사는 밥, 국, 여러 반찬이 함께 나오는 경우가 많아요.","shared":false},{"en":"The Italian meals I know often center on a dish such as pasta, with other courses served separately.","ko":"제가 아는 이탈리아 식사는 파스타 같은 한 요리를 중심으로 다른 코스가 따로 나오곤 해요.","shared":false},{"en":"Some ingredients overlap, like vegetables and garlic, but sauces and seasonings create different flavors.","ko":"채소와 마늘처럼 겹치는 재료도 있지만 소스와 양념이 맛을 다르게 해요.","shared":false},{"en":"For example, tomato and olive oil are common in the pasta I cook, while my Korean meals often use soy sauce or chili paste.","ko":"제가 만드는 파스타에는 토마토와 올리브유를 쓰고 한국식 식사에는 간장이나 고추장을 자주 써요.","shared":false},{"en":"Both the recipes and the way the food is served make a difference.","ko":"조리법과 음식을 내는 방식 모두 차이를 만들어요.","shared":false},{"en":"These are just familiar examples, though, because both countries have a much wider range of food.","ko":"다만 두 나라 음식은 훨씬 다양해서 이건 익숙한 예일 뿐이에요.","shared":false}],"note":"","sources":[{"id":"M127_4","label":"오픽만수르 IM2–IH · p.127 · M127_4"}],"correction":"","scope":"선택 외 참고","requirements":["당신의 나라와 다른 나라의 음식에 대해 비교해주세요.","무엇이 다른가요?","레시피 나 재료가 주로 다른가요?","자세히 말해주세요."],"words":111,"representative":"M127_4","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M129_5","page":129,"title":"요리에 흥미를 갖게 된 계기","q":"How did you first become interested in cooking? How did you learn to cook? Did someone teach you cooking? Who did you cook with? Please tell me everything about it in detail.","qko":"당신의 어떻게 처음 요리에 관심을 가지게 되었나요? 어떻게 요리를 배웠나요? 누군가 당신에게 요리를 가르쳤나요? 누구와 같이 요리했나요? 모든 것을 자세히 말해주세요.","source":"pdf","topic":"요리","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.129 · M129_5","family":"cooking-start","cue":"독립 → 배달비 → 민·영상 → 파스타","lines":[{"en":"I became interested in cooking after I moved into my own apartment last year.","ko":"작년에 독립한 뒤 요리에 관심이 생겼어요.","shared":false},{"en":"At first, I ordered delivery too often and noticed how much it cost.","ko":"처음에는 배달을 너무 자주 시켜 비용이 많이 드는 걸 알았어요.","shared":false},{"en":"Min suggested learning one easy dish instead of trying a difficult recipe.","ko":"민이가 어려운 조리법보다 쉬운 요리 하나를 배우자고 했어요.","shared":false},{"en":"He came over, and we followed a short video about tomato pasta.","ko":"친구가 와서 토마토 파스타의 짧은 영상을 따라 했어요.","shared":false},{"en":"He showed me how to prepare the ingredients before turning on the heat.","ko":"불을 켜기 전에 재료를 준비하는 방법을 알려줬어요.","shared":false},{"en":"The first result was simple, but eating something I had made felt surprisingly good.","ko":"첫 결과는 단순했지만 직접 만든 걸 먹으니 생각보다 기분이 좋았어요.","shared":false},{"en":"Since then, I have practiced the same recipe and changed small things when I feel confident.","ko":"그 뒤 같은 조리법을 연습하고 자신이 생기면 조금씩 바꿔요.","shared":false}],"note":"","sources":[{"id":"M129_5","label":"오픽만수르 IM2–IH · p.129 · M129_5"}],"correction":"","scope":"선택 외 참고","requirements":["당신의 어떻게 처음 요리에 관심을 가지게 되었나요?","어떻게 요리를 배웠나요?","누군가 당신에게 요리를 가르쳤나요?","누구와 같이 요리했나요?","모든 것을 자세히 말해주세요."],"words":94,"representative":"M129_5","additional":0,"sharedCount":0,"related":[],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"M132_1","page":132,"title":"주로 하는 약속/예약 설명, 묘사","q":"People make many different kinds of appointments. What kinds of appointments do you usually make with people around you? How do you make appointments? Tell me in detail.","qko":"사람들은 많은 여러 약속을 만듭니다. 당신은 사람들과 주로 어떤 종류의 약속을 합니까? 어떻게 약속을 만드나요? 자세히 말해주세요.","source":"pdf","topic":"약속","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.132 · M132_1","family":"appointment","cue":"친구·병원 → 일정 확인 → 달력 → 재확인","lines":[{"en":"I usually make appointments to see a doctor or meet a friend for lunch.","ko":"보통 병원 진료나 친구와의 점심 약속을 잡아요.","shared":true},{"en":"For a clinic, I call the reception desk or use its booking service.","ko":"병원은 접수처에 전화하거나 예약 서비스를 이용해요.","shared":true},{"en":"With a friend, I send a message and suggest two possible times.","ko":"친구에게는 메시지를 보내 가능한 시간 두 개를 제안해요.","shared":true},{"en":"Before confirming anything, I check my calendar and allow enough travel time.","ko":"확정하기 전에 달력을 보고 이동 시간을 충분히 잡아요.","shared":true},{"en":"I also consider the location and cost, especially if we plan to eat out.","ko":"특히 외식할 때는 장소와 비용도 생각해요.","shared":true},{"en":"Once we agree, I save the time, address, and contact number on my phone.","ko":"합의하면 시간, 주소, 연락처를 휴대폰에 저장해요.","shared":true},{"en":"I set a reminder and check the details again the day before.","ko":"알림을 설정하고 전날 내용을 다시 확인해요.","shared":true},{"en":"It takes only a minute, but it helps me avoid forgetting or arriving late.","ko":"잠깐이면 되지만 잊거나 늦는 걸 예방해 줘요.","shared":true}],"note":"","sources":[{"id":"M132_1","label":"오픽만수르 IM2–IH · p.132 · M132_1"}],"cor words":105,"representative":"M132_1","additional":0,"sharedCount":8,"related":["M132_1"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M136_3","page":136,"title":"약속/예약 취소 과거 경험","q":"Tell me about one experience when you had to cancel an appointment you made. What happened? Why did you have to cancel the appointment and how did you deal with it? Give as many details as you can.","qko":"약속을 했으나 취소했어야 했던 경험을 말해주세요. 무슨 일이었나요? 왜 약속을 취소해야 했고 어떻게 해결했나요? 가능한 많은 세부사항을 말해주세요.","source":"pdf","topic":"약속","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.136 · M136_3","family":"cancel","cue":"지난달 민과 점심 → 감기 → 전화 → 다음 주","lines":[{"en":"Last month, I had to cancel a lunch appointment with Min at the last minute.","ko":"지난달 민이와의 점심 약속을 직전에 취소해야 했어요.","shared":true},{"en":"We had planned to meet at a cafe near my apartment on Saturday.","ko":"토요일에 집 근처 카페에서 만나기로 했어요.","shared":true},{"en":"That morning, I woke up with a fever and a sore throat.","ko":"그날 아침 열이 나고 목이 아팠어요.","shared":true},{"en":"I didn't want to make him wait or risk passing on my cold.","ko":"친구를 기다리게 하거나 감기를 옮기고 싶지 않았어요.","shared":true},{"en":"I called him immediately, explained what had happened, and apologized.","ko":"바로 전화해서 상황을 설명하고 사과했어요.","shared":true},{"en":"I suggested meeting the following Saturday or having a short video call instead.","ko":"다음 토요일에 만나거나 대신 짧게 영상 통화를 하자고 했어요.","shared":true},{"en":"He understood, and we moved the lunch to the next week.","ko":"친구가 이해해 줘서 점심 약속을 다음 주로 옮겼어요.","shared":true},{"en":"I was disappointed, but letting him know early made the situation much easier.","ko":"아쉬웠지만 일찍 알려서 상황이 훨씬 수월해졌어요.","shared":true}],"note":"","sources":[{"id":"M136_3","label":"오픽만수르 IM2–IH · p.136 · M136_3"}],"correction":"","scope":"돌발·확장","requirements":["약속을 했으나 취소했어야 했던 경험을 말해주세요.","무슨 일이었나요?","왜 약속을 취소해야 했고 어떻게 해결했나요?","가능한 많은 세부사항을 말해주세요."],"words":100,"representative":"M136_3","additional":0,"sharedCount":8,"related":["M255_13","M267_13","M279_1 nteresting? What made it so special? Give me many details.","qko":"기억에 남는 전화를 말해주세요. 언제입니까? 누구와 전화를 했습니까? 어떤 흥 미로운 일이 있었나요? 왜 그것이 기억에 남습니까? 자세히 말해주세요.","source":"pdf","topic":"전화","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.142 · M142_3","family":"phone-memory","cue":"작년 생일 → 부모님 영상 전화 → 케이크 → 감동","lines":[{"en":"One phone conversation I remember clearly happened on my birthday last year.","ko":"작년 생일에 나눈 통화가 또렷이 기억나요.","shared":false},{"en":"I was at home alone when my parents called me in the evening.","ko":"저녁에 집에 혼자 있는데 부모님이 전화하셨어요.","shared":false},{"en":"I expected a normal conversation, but they asked me to turn on the camera.","ko":"평범한 통화일 줄 알았는데 카메라를 켜라고 하셨어요.","shared":false},{"en":"They were holding a small cake and started singing happy birthday.","ko":"작은 케이크를 들고 생일 축하 노래를 부르기 시작하셨어요.","shared":false},{"en":"The sound was slightly delayed, so we all laughed because the singing was out of time.","ko":"소리가 조금 늦게 전달돼 노래 박자가 안 맞아서 모두 웃었어요.","shared":false},{"en":"We talked for about half an hour about old family birthdays.","ko":"예전 가족 생일에 대해 30분 정도 이야기했어요.","shared":false},{"en":"I felt much less lonely even though we weren't in the same room.","ko":"같은 방에 있지 않았지만 훨씬 덜 외로웠어요.","shared":false},{"en":"That call showed me how a simple conversation can change someone's whole evening.","ko":"간단한 대화로 저녁 기분 전체가 바뀔 수 있다는 걸 느꼈어요.","shared":false}],"note":"","sources":[{"id":"M142_3","label":"오픽만수르 IM2–IH · p.142 · M142_3"},{"id":"M148_3","label":"오픽만수르 IM2–IH · p.148 · M148_3"}],"correction":"","scope":"돌발·확장","requirements":["기억에 남는 전화를 말해주세요.","언제입니까?","누구와 전화를 했습니까?","어떤 흥 미로운 일이 있었나요?","왜 그것이 기억에 남습니까?","자세히 말해주세요."],"words":103,"representative":"M142_3","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M144_1","page":144,"title":"휴대폰 처음 산 경험, 과거, 계기","q":"Do you remember the first time that you bought a cell phone? What was it like? Please describe your first cell phone in a ,"type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.146 · M146_2","family":"first-phone","cue":"중학생 → 부모님과 구매 → 버튼폰 → 현재 스마트폰","lines":[{"en":"I bought my first phone with my parents when I was in middle school.","ko":"중학생 때 부모님과 첫 휴대폰을 샀어요.","shared":true},{"en":"It was a small silver phone with physical buttons and a tiny screen.","ko":"물리 버튼과 작은 화면이 있는 은색 휴대폰이었어요.","shared":true},{"en":"We chose it because it was affordable and easy to use.","ko":"가격이 적당하고 쓰기 쉬워서 골랐어요.","shared":true},{"en":"I mainly used it to call my parents and send short text messages.","ko":"주로 부모님께 전화하고 짧은 문자를 보내는 데 썼어요.","shared":true},{"en":"Compared with that phone, my current smartphone has a much larger touch screen.","ko":"그 폰에 비해 지금 스마트폰은 터치 화면이 훨씬 커요.","shared":true},{"en":"I can take clear photos, use maps, and listen to music on one device.","ko":"한 기기로 선명한 사진을 찍고 지도를 보고 음악을 들어요.","shared":true},{"en":"The old phone was less distracting, though, and its battery lasted longer.","ko":"하지만 예전 폰은 주의가 덜 분산되고 배터리가 더 오래갔어요.","shared":true},{"en":"I like today's convenience, but sometimes I miss how simple my first phone was.","ko":"지금의 편리함도 좋지만 첫 폰의 단순함이 가끔 그리워요.","shared":true}],"note":"","sources":[{"id":"M146_2","label":"오픽만수르 IM2–IH · p.146 · M146_2"}],"correction":"","scope":"돌발·확장","requirements":["당신의 첫 휴대폰을 말하고 지금의 휴대폰과 비교해주세요.","과거에 사용한 휴대 폰과 지금의 휴대폰과 어떤 차이가 있나요?","가능한 많은 세부사항을 말해주세요."],"words":104,"representative":"M144_1","additional":0,"sharedCount":8,"related":["M144_1"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M150_1","page":150,"title":"테크놀로지, 기술 설명","q":"What kinds of technology do you use most often? Is it your computer or cell phone? Or any other handheld device? What is it, and why do you use it? Provide as many details as possible.","qko":"어떤 기술을 자주 사용하나요? 컴퓨터나 휴대폰인가요? 또는 다른 모바일 기기 인가요? 그것이 무엇이고 왜 그것을 사용하나요? 가능한 자세히 말해주세요.","source":"pdf","topic":"기술","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.150 · M150_1","family":"technology","cue":"스마트폰·노트북 → 지도·영상 → 연결·시간절약","lines":[{"en":"The technology I use most is my smartphone, followed by my laptop.","ko":"제가 가장 많이 쓰는 기술 기기는 스마트폰이고 그다음은 노트북이에요.","shared":true},{"en":"I use the phone to check maps, contact my family, and listen to music.","ko":"휴대폰으로 지도를 보고 가족에게 연락하고 음악을 들어요.","shared":true},{"en":"For example, a map app helps me find the right bus when I visit a new place.","ko":"예를 들어 지도 앱은 낯선 곳에서 맞는 버스를 찾도록 도와줘요.","shared":true},{"en":"At home, I prefer my laptop for planning trips because the larger screen is easier to read.","ko":"집에서 여행을 계획할 때는 큰 화면을 읽기 편해서 노트북이 좋아요.","shared":true},{"en":"I can compare hotels and save all the details in one document.","ko":"호텔을 비교하고 세부 내용을 문서 하나에 저장할 수 있어요.","shared":true},{"en":"Both devices save time and help me stay connected without leaving home.","ko":"두 기기 모두 시간을 아끼고 외출하지 않고도 연락하게 해줘요.","shared":true},{"en":"However, I put them away during meals because checking them constantly can be tiring.","ko":"하지만 계속 확인하면 피곤해서 식사 중에는 치워둬요.","shared":true},{"en":"They are useful tools as long as I decide when to stop using them.","ko":"언제 멈출지 정해두면 유용한 도구예요.","shared":true}],"note":"","sources":[{"id":"M150_1","label":"오픽만수르 IM2–IH · p.150 · M150_1"}],"correction":"","scope":"돌발·확장","requirements":["어떤 기술을 자주 사용하나요?","컴퓨터나 휴대폰인가요?","또는 다른 모바일 기기 인가요?","그것이 무엇이고 왜 그것을 사용하나요?","가능한 자세히 말해주세요."],"words":112,"representative":"M150_1","additional":0,"sharedCount":8,"related":["M152_2","M158_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M152_2","page":152,"title":"최근 사용 테크놀로지 설명","q":"Can you explain all the technologies such as a cell phone or computer that you enjoy using most these days? What is it? Why do you use this?","qko":"스마트폰이나 컴퓨터 같은 요즘 당신이 가장 많이 사용한 기술에 대해 모두 설명 해주세요. 무엇인가요? 왜 그것을 사용하나요?","source":"pdf","topic":"기술","type":"최근 경험","sourceLabel":"오픽만수르 IM2–IH · p.152 · M152_2","family":"technology","cue":"스마트폰·노트북 → 지도·영상 → 연결·시간절약","lines":[{"en":"The technology I use most is my smartphone, followed by my laptop.","ko":"제가 가장 많이 쓰는 기술 기기는 스마트폰이고 그다음은 노트북이에요.","shared":true},{"en":"I use the phone to check maps, contact my family, and listen to music.","ko":"휴대폰으로 지도를 보고 가족에게 연락하고 음악을 들어요.","shared":true},{"en":"For example, a map app helps me find the right bus when I visit a new place.","ko":"예를 들어 지도 앱은 낯선 곳에서 맞는 버스를 찾도록 도와줘요.","shared":true},{"en":"At home, I prefer my laptop for planning trips because the larger screen is easier to read.","ko":"집에서 여행을 계획할 때는 큰 화면을 읽기 편해서 노트북이 좋아요.","shared":true},{"en":"I can compare hotels and save all the details in one document.","ko":"호텔을 비교하고 세부 내용을 문서 하나에 저장할 수 있어요.","shared":true},{"en":"Both devices save time and help me stay connected without leaving home.","ko":"두 기기 모두 시간을 아끼고 외출하지 않고도 연락하게 해줘요.","shared":true},{"en":"However, I put them away during meals because checking them constantly can be tiring.","ko":"하지만 계속 확인하면 피곤해서 식사 중에는 치워둬요.","shared":true},{"en":"They are useful tools as long as I decide when to stop using them.","ko":"언제 멈출지 정해두면 유용한 도구예요.","shared":true}],"note":"","sources":[{"id":"M152_2","label":"오픽만수르 IM2–IH · p.152 · M152_2"}],"correction":"","scope":"돌발·확장","requirements":["스마트폰이나 컴퓨터 같은 요즘 당신이 가장 많이 사용한 기술에 대해 모두 설명 해주세요.","무엇인가요?","왜 그것을 사용하나요?"],"words":112,"representative":"M150_1","additional":0,"sharedCount":8,"related":["M150_1","M158_2"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"M154_3","page":154,"title":"테크놀로지 과거 현재 비교","q":"Please compare the present technology with past technology. What are the differences between them, and how have they affected? How has technology changed over time?","qko":"현재와 과거의 기술을 비교해주세요. 그들 사이에 어떤 차이점이 있고 어떻게 영 향을 미쳤나요? 기술을 시간이 지나며 어떻게 변화했나요?","source":"pdf","topic":"기술","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.154 · M154_3","family":"tech-change","cue":"예전 컴퓨터·문자 → 스마트폰·영상 → 편리·주의분산","lines":[{"en":"The biggest change I notice is that many separate tools now fit into one phone.","ko":"가장 크게 느끼는 변화는 여러 도구가 이제 휴대폰 하나에 들어간다는 거예요.","shared":true},{"en":"When I was younger, I used a desktop computer for the Internet and a basic phone for calls.","ko":"어릴 때는 인터넷은 데스크톱, 통화는 기본 휴대폰으로 했어요.","shared":true},{"en":"Websites mainly showed text and small pictures, and some pages loaded slowly.","ko":"웹사이트에는 주로 글과 작은 사진이 있었고 느리게 열리는 페이지도 있었어요.","shared":true},{"en":"Now I can watch videos, book a room, and join a video call while I am outside.","ko":"이제는 밖에서도 영상을 보고 숙소를 예약하고 영상 통화를 해요.","shared":true},{"en":"Websites also work on smaller screens and offer more interactive services.","ko":"웹사이트는 작은 화면에서도 작동하고 상호작용하는 서비스도 늘었어요.","shared":true},{"en":"This makes daily tasks faster, especially when I need directions right away.","ko":"특히 바로 길 안내가 필요할 때 일상적인 일을 더 빨리 할 수 있어요.","shared":true},{"en":"On the other hand, constant notifications can interrupt whatever I am doing.","ko":"반면 계속 오는 알림은 하던 일을 방해할 수 있어요.","shared":true},{"en":"I appreciate the convenience, but I try to control the time I spend online.","ko":"편리함은 좋지만 온라인에서 보내는 시간을 조절하려 해요.","shared":true}],"note":"","sources":[{"id":"M154_3","label":"오픽만수르 IM2–IH · p.154 · M154_3"}],"correction":"how have they affected?는 목적어가 빠져 있습니다. 제안: how have they affected people?","scope":"돌발·확장","requirements":["현재와 과거의 기술을 비교해주세요.","그들 사이에 어떤 차이점이 있고 어떻게 영 향을 미쳤나요?","기술을 시간이 지나며 어떻게 변화했나요?"],"words":111,"representative":"M154_3","additional":0,"sharedCount":8,"related":["H3_09"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M156_1","page":156,"title":"주로 사용하는 인터넷 웹사이트","q":"People use the internet. Which website do you usually visit? How often do you visit that website? What services does the website offer? Why do you like it?","qko":"사람들은 인터넷을 사용합니다. 어떤 웹사이트를 주로 방문하시나요? 얼마나 자 주 그 웹사이트를 방문하시나요? 그 웹사이트는 어떤 서비스를 제공하나요? 당신 은 왜 그것을 사용하나요?","source":"pdf","topic":"인터넷","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.156 · M156_1","family":"website","cue":"유튜브 → 매일 → 요리·영어 → 친구 추천","lines":[{"en":"The website I use most often is YouTube, usually once a day.","ko":"가장 자주 쓰는 웹사이트는 유튜브이고 보통 하루 한 번 봐요.","shared":true},{"en":"People use it for entertainment, music, news, and learning new skills.","ko":"사람들은 오락, 음악, 뉴스, 새로운 기술 학습에 이용해요.","shared":true},{"en":"I mainly watch simple cooking videos and short English lessons.","ko":"저는 주로 간단한 요리 영상과 짧은 영어 강의를 봐요.","shared":true},{"en":"I first started using it regularly when Min sent me a pasta recipe.","ko":"민이가 파스타 조리법을 보내줘서 처음 규칙적으로 이용하기 시작했어요.","shared":true},{"en":"It was much easier to understand the steps when I could actually see them.","ko":"과정을 실제로 볼 수 있어서 훨씬 이해하기 쉬웠어요.","shared":true},{"en":"Now I save useful videos in playlists so I can find them again.","ko":"지금은 유용한 영상을 재생목록에 저장해서 다시 찾아봐요.","shared":true},{"en":"I like being able to pause or replay a part instead of keeping up with a live lesson.","ko":"실시간 수업을 따라가기보다 멈추거나 다시 볼 수 있어서 좋아요.","shared":true},{"en":"I set a rough time limit, though, because one video can easily lead to ten more.","ko":"다만 영상 하나가 열 개로 이어지기 쉬워 대략적인 시간 제한을 둬요.","shared":true}],"note":"","sources":[{"id":"M156_1","label":"오픽만수르 IM2–IH · p.156 · M156_1"}],"correction":"","scope":"돌발·확장","requirements":["사람들은 인터넷을 사용합니다.","어떤 웹사이트를 주로 방문하시나요?","얼마나 자 주 그 웹사이트를 방문하시나요?","그 웹사이트는 어떤 서비스를 제공하나요?","당신 은 왜 그것을 사용하나요?"],"words":107,"representative":"M156_1","additional":0,"sharedCount":8,"related":["H3_08"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M158_2","page":158,"title":"인터넷을 위해 쓰는 장비, 소프트웨어","q":"What kinds of devices do you usually use to surf the Internet? Which gadget or software do you typically use? Describe it in detail.","qko":"인터넷을 하기 위해 어떤 장비를 사용하나요? 어떤 기기 또는 소프트웨어를 일반 적으로 사용하시나요? 자세히 말해주세요.","source":"pdf","topic":"인터넷","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.158 · M158_2","family":"technology","cue":"스마트폰·노트북 → 지도·영상 → 연결·시간절약","lines":[{"en":"The technology I use most is my smartphone, followed by my laptop.","ko":"제가 가장 많이 쓰는 기술 기기는 스마트폰이고 그다음은 노트북이에요.","shared":true},{"en":"I use the phone to check maps, contact my family, and listen to music.","ko":"휴대폰으로 지도를 보고 가족에게 연락하고 음악을 들어요.","shared":true},{"en":"For example, a map app helps me find the right bus when I visit a new place.","ko":"예를 들어 지도 앱은 낯선 곳에서 맞는 버스를 찾도록 도와줘요.","shared":true},{"en":"At home, I prefer my laptop for planning trips because the larger screen is easier to read.","ko":"집에서 여행을 계획할 때는 큰 화면을 읽기 편해서 노트북이 좋아요.","shared":true},{"en":"I can compare hotels and save all the details in one document.","ko":"호텔을 비교하고 세부 내용을 문서 하나에 저장할 수 있어요.","shared":true},{"en":"Both devices save time and help me stay connected without leaving home.","ko":"두 기기 모두 시간을 아끼고 외출하지 않고도 연락하게 해줘요.","shared":true},{"en":"However, I put them away during meals because checking them constantly can be tiring.","ko":"하지만 계속 확인하면 피곤해서 식사 중에는 치워둬요.","shared":true},{"en":"They are useful tools as long as I decide when to stop using them.","ko":"언제 멈출지 정해두면 유용한 도구예요.","shared":true},{"en":"I usually browse with Chrome, using tabs to compare information and bookmarks to save useful pages.","ko":"주로 크롬으로 인터넷을 보며 탭으로 정보를 비교하고 북마크에 유용한 페이지를 저장해요.","shared":false}],"note":"","sources":[{"id":"M158_2","label":"오픽만수르 IM2–IH · p.158 · M158_2"}],"correction":"","scope":"돌발·확장","requirements":["인터넷을 하기 위해 어떤 장비를 사용하나요?","어떤 기기 또는 소프트웨어를 일반 적으로 사용하시나요?","자세히 말해주세요."],"words":128,"representative":"M150_1","additional":1,"sharedCount":8,"related":["M150_1","M152_2"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M160_3","page":160,"title":"인터넷 사용 과거 경험, 계기","q":"Tell me about your first internet surfing experience. When was it? What did you do? What things do you remember about that experience? How did you access the internet? What was your first impression while surfing the internet?","qko":"당신의 첫 인터넷 경험을 말해주세요. 언제인가요? 무엇을 하셨나요? 그 경험에 대해 어떤 것들이 기억나나요? 인터넷을 어떻게 접속했나요? 인터넷을 할 때 첫 인상이 어땠나요?","source":"pdf","topic":"인터넷","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.160 · M160_3","family":"internet-first","cue":"초등학생 → 집 컴퓨터 → 동물 검색 → 신기함","lines":[{"en":"My first clear memory of using the Internet is from elementary school.","ko":"인터넷을 처음 쓴 뚜렷한 기억은 초등학생 때예요.","shared":false},{"en":"My father helped me open a browser on our family computer at home.","ko":"아버지가 집의 가족용 컴퓨터에서 브라우저를 여는 걸 도와주셨어요.","shared":false},{"en":"We used our home Internet connection and searched for pictures of animals.","ko":"집의 인터넷 연결로 동물 사진을 검색했어요.","shared":false},{"en":"I remember typing very slowly because I couldn't find the letters on the keyboard.","ko":"키보드에서 글자를 못 찾아 아주 천천히 입력한 게 기억나요.","shared":false},{"en":"When the pictures appeared, I was amazed that I could learn about animals from faraway places.","ko":"사진이 나타나자 먼 곳의 동물에 대해 알 수 있다는 게 놀라웠어요.","shared":false},{"en":"Some pages took time to load, but waiting felt exciting rather than annoying.","ko":"어떤 페이지는 늦게 열렸지만 기다리는 게 짜증나기보다 신났어요.","shared":false},{"en":"After that, I wanted to search for places we might visit on family trips.","ko":"그 후 가족 여행으로 갈 만한 곳을 검색하고 싶어졌어요.","shared":false},{"en":"That experience made the Internet feel like a huge library I could explore.","ko":"그 경험으로 인터넷이 탐험할 수 있는 거대한 도서관처럼 느껴졌어요.","shared":false}],"note":"","sources":[{"id":"M160_3","label":"오픽만수르 IM2–IH · p.160 · M160_3"}],"correction":"","scope":"돌발·확장","requirements":["당신의 첫 인터넷 경험을 말해주세요.","언제인가요?","무엇을 하셨나요?","그 경험에 대해 어떤 것들이 기억나나요?","인터넷을 어떻게 접속했나요?","인터넷을 할 때 첫 인상이 어땠나요?"],"words":107,"representative":"M160_3","additional":0,"sharedCount":0,"related":[],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"M162_1","page":162,"title":"건강한 사람 설명 묘사","q":"Tell me about a healthy person you know. Who is it? What does he or she look like? What do they typically do to stay healthy? What makes that person healthy? Why do you think that person is healthy?","qko":"당신이 아는 건강한 사람에 대해 말해주세요. 누구인가요? 그 또는 그녀는 어떤 가요? 그들은 건강을 위해 일반적으로 무엇을 하나요? 무엇이 그들을 건강하게 하나요? 왜 그들이 건강하다고 생각하시나요?","source":"pdf","topic":"건강","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.162 · M162_1","family":"healthy-person","cue":"민 → 활기 → 산책·잠·식사 → 꾸준함","lines":[{"en":"The healthiest person I know is my friend Min.","ko":"제가 아는 가장 건강한 사람은 친구 민이에요.","shared":false},{"en":"He looks fit and energetic, and he rarely seems exhausted during the day.","ko":"탄탄하고 활기차 보여서 낮에 지친 모습이 드물어요.","shared":false},{"en":"He takes regular walks and sometimes goes jogging, but he doesn't overdo it.","ko":"규칙적으로 걷고 가끔 조깅하지만 무리하지 않아요.","shared":false},{"en":"He also tries to sleep at a regular time and drinks water instead of sugary drinks.","ko":"일정한 시간에 자고 단 음료 대신 물을 마시려고 해요.","shared":false},{"en":"For meals, he usually includes vegetables and doesn't skip breakfast.","ko":"식사에는 보통 채소를 넣고 아침을 거르지 않아요.","shared":false},{"en":"What impresses me is his consistency rather than any special exercise routine.","ko":"특별한 운동 방식보다 꾸준함이 인상적이에요.","shared":false},{"en":"Even when he is busy, he makes time for a short walk and a proper meal.","ko":"바빠도 짧게 걷고 제대로 식사할 시간을 만들어요.","shared":false},{"en":"I think that balanced routine is why he has so much energy.","ko":"그런 균형 잡힌 일상 덕분에 활력이 넘치는 것 같아요.","shared":false}],"note":"","sources":[{"id":"M162_1","label":"오픽만수르 IM2–IH · p.162 · M162_1"}],"correction":"","scope":"돌발·확장","requirements":["당신이 아는 건강한 사람에 대해 말해주세요.","누구인가요?","그 또는 그녀는 어떤 가요?","그들은 건강을 위해 일반적으로 무엇을 하나요?","무엇이 그들을 건강하게 하나요?","왜 그들이 건강하다고 생각하시나요?"],"words":101,"representative":"M162_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M164_2","page":164,"title":"건강 유지 활동, 운동","q":"What kinds of things do you usually do to stay healthy? What healthy food do you eat? Do you regularly work out? Please tell me what activities you do to stay healthy in detail.","qko":"건강을 위해 어떤 것을 주로 하시나요? 어떤 건강 음식을 드시나요? 운동을 정기 적으로 하시나요? 당신이 건강을 위해 하는 활동들을 자세히 말해주세요.","source":"pdf","topic":"건강","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.164 · M164_2","family":"health-routine","cue":"격한 운동 없음 → 산책·식사·잠","lines":[{"en":"I don't follow a regular workout program, so I focus on small daily habits.","ko":"정기적인 운동 프로그램은 하지 않아서 작은 일상 습관에 집중해요.","shared":false},{"en":"I take a light walk in the park about twice a week and try not to sit all day.","ko":"일주일에 두 번쯤 공원에서 가볍게 걷고 종일 앉아 있지 않으려 해요.","shared":false},{"en":"At home, I stand up and stretch when I have been using my phone for too long.","ko":"집에서는 휴대폰을 너무 오래 썼으면 일어나 몸을 풀어요.","shared":false},{"en":"For meals, I try to eat vegetables, eggs, and rice rather than only instant food.","ko":"식사는 즉석식품만 먹기보다 채소, 달걀, 밥을 먹으려고 해요.","shared":false},{"en":"I drink more water and avoid having coffee late at night.","ko":"물을 더 마시고 늦은 밤에는 커피를 피하려 해요.","shared":false},{"en":"I also keep a fairly regular bedtime because I feel much better after enough sleep.","ko":"충분히 자면 훨씬 몸이 좋아서 취침 시간도 일정하게 유지해요.","shared":false},{"en":"These aren't dramatic changes, but they are habits I can actually keep.","ko":"큰 변화는 아니지만 실제로 유지할 수 있는 습관이에요.","shared":false}],"note":"","sources":[{"id":"M164_2","label":"오픽만수르 IM2–IH · p.164 · M164_2"}],"correction":"","scope":"돌발·확장","requirements":["건강을 위해 어떤 것을 주로 하시나요?","어떤 건강 음식을 드시나요?","운동을 정기 적으로 하시나요?","당신이 건강을 위해 하는 활동들을 자세히 말해주세요."],"words":103,"representative":"M164_2","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M166_3","page":166,"title":"건강 과거 경험","q":"Tell me about one thing that you try to be healthy. Were your health improved? Did you join a new exercise program, play a sport, or eat new healthy food? Give as many details as you can.","qko":"건강해지려고 시도한 일 하나를 말하세요. 건강이 좋아졌나요? 새 운동 프로그램, 스포츠, 건강한 음식 등을 시도했나요? 자세히 설명하세요.","source":"pdf","topic":"건강","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.166 · M166_3","family":"walk-start","cue":"작년 봄 → 집에만 있음 → 민 권유 → 10분부터","lines":[{"en":"I started taking regular walks last spring because I was spending too much time indoors.","ko":"집 안에 있는 시간이 너무 많아서 작년 봄에 규칙적으로 산책하기 시작했어요.","shared":true},{"en":"I often felt tired even though I wasn't doing much.","ko":"많이 움직이지 않았는데도 자주 피곤했어요.","shared":true},{"en":"My friend Min suggested a short walk in the park near my apartment.","ko":"친구 민이가 집 근처 공원에서 짧게 걷자고 했어요.","shared":true},{"en":"The first time, we walked for just ten minutes and talked the whole way.","ko":"처음에는 10분만 걸었고 내내 이야기를 했어요.","shared":true},{"en":"I was surprised that such a small activity made me feel more awake.","ko":"작은 활동만으로 정신이 맑아져서 놀랐어요.","shared":true},{"en":"After that, I began going about twice a week and slowly made the walks longer.","ko":"그 후 일주일에 두 번 정도 가며 조금씩 더 오래 걸었어요.","shared":true},{"en":"I still don't follow a sports program, but this simple habit fits my daily life.","ko":"지금도 운동 프로그램을 따르진 않지만 이 간단한 습관은 생활에 잘 맞아요.","shared":true},{"en":"After a few weeks, I slept better and felt less tired during the day.","ko":"몇 주 뒤에는 잠이 더 잘 오고 낮에 덜 피곤했어요.","shared":true}],"note":"","sources":[{"id":"M166_3","label":"오픽만수르 IM2–IH · p.166 · M166_3"}],"correction":"Were your health improved? → Did your health improve?","scope":"돌발·확장","requirements":["건강해지려고 시도한 일 하나를 말하세요.","건강이 좋아졌나요?","새 운동 프로그램, 스포츠, 건강한 음식 등을 시도했나요?","자세히 설명하세요."],"words":109,"representative":"M056_3","additional":0,"sharedCount":8,"related":["M056_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M168_1","page":168,"title":"휴일, 명절 설명","q":"Let's talk about holidays in your country. What kinds of holidays are there? What holidays are popular? How do people typically celebrate the holidays? Please tell me a detailed description of holidays in your country.","qko":"당신의 나라에 있는 명절에 대해 이야기합시다. 어떤 명절이 있나요? 어떤 명절 이 유명한가요? 사람들이 그 명절을 일반적으로 어떻게 기념하나요? 당신의 나라 의 그 명절에 대해 자세한 설명을 말해주세요.","source":"pdf","topic":"명절","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.168 · M168_1","family":"holiday","cue":"설·추석 → 가족·음식 → 우리 집 모임","lines":[{"en":"Two important holidays in Korea are Seollal and Chuseok.","ko":"한국의 중요한 명절 두 가지는 설날과 추석이에요.","shared":true},{"en":"Seollal is the Lunar New Year, and Chuseok is associated with the autumn harvest.","ko":"설날은 음력 새해이고 추석은 가을 수확과 관련된 명절이에요.","shared":true},{"en":"Many families get together, share food, and spend time with relatives.","ko":"많은 가족이 모여 음식을 나누고 친척들과 시간을 보내요.","shared":true},{"en":"For Seollal, my family usually has rice-cake soup and greets the older relatives.","ko":"설날에 저희 가족은 보통 떡국을 먹고 어른들께 인사해요.","shared":true},{"en":"For Chuseok, we share a meal and sometimes eat songpyeon, a type of rice cake.","ko":"추석에는 함께 식사하고 송편이라는 떡을 먹기도 해요.","shared":true},{"en":"I live alone now, so I visit my parents and help set the table.","ko":"지금은 혼자 살아서 부모님을 찾아뵙고 상 차리는 걸 도와요.","shared":true},{"en":"Not every family celebrates in the same way, but seeing each other matters most to us.","ko":"모든 가족이 똑같이 보내진 않지만 저희는 서로 만나는 게 가장 중요해요.","shared":true},{"en":"For me, these holidays are a chance to slow down and reconnect.","ko":"저에게 명절은 여유를 갖고 다시 가까워질 기회예요.","shared":true},{"en":"In my family, Seollal is the biggest gathering because more relatives come than at any other time.","ko":"저희 가족은 다른 때보다 친척이 많이 오는 설날에 가장 크게 모여요.","shared":true}],"note":"","sources":[{"id":"M168_1","label":"오픽만수르 IM2–IH · p.168 · M168_1"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에 있는 명절에 대해 이야기합시다.","어떤 명절이 있나요?","어떤 명절 이 유명한가요?","사람들이 그 명절을 일반적으로 어떻게 기념하나요?","당신의 나라 의 그 명절에 대해 자세한 설명을 말해주세요."],"words":121,"representative":"M168_1","additional":0,"sharedCount":9,"related":["M170_2","M314_14","H4_14"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M170_2","page":170,"title":"휴일, 명절 행동 습관 / 하는 일","q":"What is the biggest holiday in your country? How do people celebrate it? What kinds of activities do people usually do during that holiday? Please tell me about all the details.","qko":"당신의 나라에서 가장 큰 명절은 무엇인가요? 사람들은 그것을 어떻게 기념하나 요? 그 명절에 사람들은 주로 어떤 활동을 하나요? 모든 세부사항을 말해주세요.","source":"pdf",
