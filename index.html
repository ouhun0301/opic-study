하고 있나요?"],"words":125,"representative":"M299_15","additional":0,"sharedCount":8,"related":["M299_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M302_14","page":302,"title":"","q":"Please pick two different kinds of music or musician you like. Compare those two, and what are their differences and similarities? Give as many details as you can.","qko":"당신이 좋아하는 서로 다른 두 음악이나 두 음악가를 선택해 주세요. 그 둘을 비 교해 주세요. 그리고 그들의 차이점과 비슷한 점은 무엇인가요? 가능한 많은 세 부 내용을 알려주세요.","source":"pdf","topic":"음악","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.302 · M302_14","family":"music-compare","cue":"팝·어쿠스틱 → 공통 멜로디 → 악기·감정 차이","lines":[{"en":"Two kinds of music I enjoy are pop and acoustic folk.","ko":"제가 즐기는 두 종류의 음악은 팝과 어쿠스틱 포크예요.","shared":true},{"en":"Both often have clear melodies and lyrics about everyday feelings.","ko":"둘 다 뚜렷한 멜로디와 일상적인 감정에 관한 가사가 있는 경우가 많아요.","shared":true},{"en":"However, the pop songs I like usually have a strong beat and several electronic sounds.","ko":"하지만 제가 좋아하는 팝송은 보통 강한 박자와 여러 전자음이 있어요.","shared":true},{"en":"The acoustic songs are simpler, often using just a voice and a guitar.","ko":"어쿠스틱 곡은 더 단순해서 목소리와 기타만 쓰기도 해요.","shared":true},{"en":"Pop makes me feel energetic, so I choose it when I need a lift.","ko":"팝은 활력이 나서 기운이 필요할 때 골라요.","shared":true},{"en":"Acoustic folk makes me feel calm, so I listen to it before going to bed.","ko":"어쿠스틱 포크는 차분해져서 자기 전에 들어요.","shared":true},{"en":"June's lively songs and Alex's quiet songs are good examples of that difference.","ko":"준이의 경쾌한 노래와 알렉스의 조용한 노래가 그 차이의 좋은 예예요.","shared":true},{"en":"I like both because they help me in different ways.","ko":"서로 다른 방식으로 도움이 돼서 둘 다 좋아해요.","shared":true}],"note":"","sources":[{"id":"M302_14","label":"오픽만수르 IM2–IH · p.302 · M302_14"}],"correction":"two different kinds of music or musician → two different kinds of music or two musicians","scope":"설문 중심","requirements":["당신이 좋아하는 서로 다른 두 음악이나 두 음악가를 선택해 주세요.","그 둘을 비 교해 주세요.","그리고 그들의 차이점과 비슷한 점은 무엇인가요?","가능한 많은 세 부 내용을 알려주세요."],"words":101,"representative":"M302_14","additional":0,"sharedCount":8,"related":["H1_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M303_15","page":303,"title":"","q":"I'd like to know what gadgets or electronic equipment people are interested in these days. Why do people in your country like those music gadgets or equipment? What new products excite them and why? Tell me what people talk about it.","qko":"요즘 사람들이 관심 가지는 기기나 전자 장비에 대해 알고 싶습니다. 당신의 나 라 사람들은 왜 그 음악 기기나 장비를 좋아하나요? 어떤 신제품이 그들을 흥분 시키고 이유는 무엇인가요? 사람들이 그것에 대해 무엇을 이야기하는지 말해주세요.","source":"pdf","topic":"음악","type":"일반 경향","sourceLabel":"오픽만수르 IM2–IH · p.303 · M303_15","family":"music-device","cue":"폰·이어폰 → 다운로드 → 스피커·MP3 비교","lines":[{"en":"I usually listen to music on my smartphone with wireless earphones.","ko":"저는 보통 스마트폰과 무선 이어폰으로 음악을 들어요.","shared":true},{"en":"The phone fits in my pocket, and I can choose songs or make playlists in an app.","ko":"휴대폰은 주머니에 들어가고 앱에서 노래를 고르거나 재생목록을 만들 수 있어요.","shared":true},{"en":"I download some songs before a trip so I can listen without a connection.","ko":"여행 전에는 인터넷 없이 들으려고 노래를 내려받아요.","shared":true},{"en":"The earphones are light, and their case charges them when I am not using them.","ko":"이어폰은 가볍고 사용하지 않을 때 케이스가 충전해 줘요.","shared":true},{"en":"At home, I sometimes use a small wireless speaker because it fills the room with sound.","ko":"집에서는 방 안에 소리가 퍼지도록 작은 무선 스피커를 쓰기도 해요.","shared":true},{"en":"People can also use computers or separate MP3 players, but a phone is more convenient for me.","ko":"컴퓨터나 별도 MP3도 쓸 수 있지만 저에게는 휴대폰이 더 편해요.","shared":true},{"en":"Among the people I know in Korea, phones and wireless earphones seem to be the most popular combination.","ko":"제가 아는 한국 사람들 사이에서는 폰과 무선 이어폰 조합이 가장 인기 있어 보여요.","shared":true},{"en":"I keep the volume comfortable so I can enjoy the music without feeling tired.","ko":"피곤해지지 않도록 편안한 음량으로 들어요.","shared":true},{"en":"Among my friends, newer noise-reducing earphones attract attention because they make music easier to hear on a bus.","ko":"친구들 사이에서는 버스에서 음악을 듣기 쉬워지는 소음 감소 이어폰에 관심이 있어요.","shared":false},{"en":"They usually compare battery life, comfort, and price rather than just the brand name.","ko":"보통 브랜드 이름만 보기보다 배터리, 착용감, 가격을 비교해요.","shared":false}],"note":"","sources":[{"id":"M303_15","label":"오픽만수르 IM2–IH · p.303 · M303_15"}],"correction":"","scope":"설문 중심","requirements":["요즘 사람들이 관심 가지는 기기나 전자 장비에 대해 알고 싶습니다.","당신의 나 라 사람들은 왜 그 음악 기기나 장비를 좋아하나요?","어떤 신제품이 그들을 흥분 시키고 이유는 무엇인가요?","사람들이 그것에 대해 무엇을 이야기하는지 말해주세요."],"words":154,"representative":"M103_2","additional":2,"sharedCount":8,"related":["M103_2","H1_15"],"contrast":"내 취향만 설명하지 말고 사람들이 보통 선택하거나 관심 갖는 대상을 말하세요."},{"id":"M304_14","page":304,"title":"","q":"How has the recycling practice changed over the years? Did the recycling materials change compared to in the past? Tell me all the changes regarding the recycling system in your country.","qko":"수년간 재활용 관행은 어떻게 변화 했나요? 예전과 비교해서 재활용 대상 물품이 변화 했나요? 당신의 나라의 재활용 시스템에 대한 모든 변화를 말해주세요.","source":"pdf","topic":"재활용","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.304 · M304_14","family":"recycle-change","cue":"예전 적은 분류 → 현재 표시·재질 → 포장 증가","lines":[{"en":"Recycling in my daily life is more organized now than when I was a child.","ko":"제 일상에서 재활용은 어릴 때보다 더 체계적이에요.","shared":true},{"en":"At our old home, we mainly put paper and bottles aside, and the collection signs were simple.","ko":"예전 집에서는 주로 종이와 병을 따로 모았고 배출 안내가 단순했어요.","shared":true},{"en":"Now my apartment has clearly marked areas for several different materials.","ko":"지금 아파트에는 여러 재질별로 표시된 배출장이 있어요.","shared":true},{"en":"We also deal with more delivery boxes and mixed packaging in everyday life.","ko":"일상에서 택배 상자와 복합 포장재도 더 많이 다뤄요.","shared":true},{"en":"I pay more attention to separating parts and removing food from containers.","ko":"부품을 나누고 용기에서 음식물을 제거하는 데 더 신경 써요.","shared":true},{"en":"Information is easier to find online, although some items are still confusing.","ko":"온라인에서 정보를 찾기 쉬워졌지만 여전히 헷갈리는 물건도 있어요.","shared":true},{"en":"For me, the change is both better guidance and more materials to think about.","ko":"저에게 변화란 안내가 좋아진 동시에 생각해야 할 재료도 많아진 거예요.","shared":true}],"note":"","sources":[{"id":"M304_14","label":"오픽만수르 IM2–IH · p.304 · M304_14"}],"correction":"","scope":"돌발·확장","requirements":["수년간 재활용 관행은 어떻게 변화 했나요?","예전과 비교해서 재활용 대상 물품이 변화 했나요?","당신의 나라의 재활용 시스템에 대한 모든 변화를 말해주세요."],"words":94,"representative":"M304_14","additional":0,"sharedCount":7,"related":["H5_09"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M305_15","page":305,"title":"","q":"Please tell me about some recent issues related to recycling in your country. What was the news about? What does the media say about this problem? What do you think about this matter? How does this matter affect the environment?","qko":"당신의 나라의 재활용에 관련한 최근 문제에 대해 말해주세요. 그 뉴스는 무엇에 관한 것인가요? 언론은 이 문제에 대해 어떻게 이야기 하나요? 이 문제에 대해 당신은 어떻게 생각하나요? 이 문제가 환경에 어떤 영향을 주나요?","source":"pdf","topic":"재활용","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.305 · M305_15","family":"recycle-news","cue":"오염된 포장 기사 → 선별 어려움 → 낭비 → 줄이기","lines":[{"en":"I recently read an article about food-stained packaging causing problems for recycling.","ko":"최근 음식물이 묻은 포장재가 재활용에 문제를 일으킨다는 기사를 읽었어요.","shared":false},{"en":"It explained that collecting an item separately doesn't always mean it can be processed easily.","ko":"따로 모았다고 항상 쉽게 처리할 수 있는 건 아니라고 설명했어요.","shared":false},{"en":"The report used dirty takeaway containers as an example of materials that require extra sorting.","ko":"기사는 추가 분류가 필요한 예로 더러운 포장 용기를 들었어요.","shared":false},{"en":"I found the point useful because I used to focus only on putting things in the right bin.","ko":"저는 맞는 통에 넣는 데만 집중하곤 해서 유용했어요.","shared":false},{"en":"If materials cannot be used again, more resources may be wasted and more rubbish has to be handled.","ko":"재료를 다시 쓰지 못하면 자원을 더 낭비하고 처리할 쓰레기도 늘 수 있어요.","shared":false},{"en":"I think clearer labels and less unnecessary packaging would make the task easier for households.","ko":"표시가 명확하고 불필요한 포장이 줄면 가정에서 처리하기 쉬울 것 같아요.","shared":false},{"en":"Personally, I now empty and rinse containers and try to buy fewer disposable items.","ko":"저는 용기를 비우고 헹구며 일회용품을 덜 사려고 해요.","shared":false}],"note":"실제 특정 보도를 확인한 인용이 아닌 연습용 기사 설정입니다.","sources":[{"id":"M305_15","label":"오픽만수르 IM2–IH · p.305 · M305_15"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라의 재활용에 관련한 최근 문제에 대해 말해주세요.","그 뉴스는 무엇에 관한 것인가요?","언론은 이 문제에 대해 어떻게 이야기 하나요?","이 문제에 대해 당신은 어떻게 생각하나요?","이 문제가 환경에 어떤 영향을 주나요?"],"words":107,"representative":"M305_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M306_14","page":306,"title":"","q":"Tell me about a country that is geographically similar or neighboring to your country. What geographical features does this country have? What changes has this country had in recent years? Provide as many details as possible.","qko":"당신의 나라와 지형적으로 비슷하거나 가까운 나라에 대해 말해주세요. 이 나라 는 어떤 지형적 특징이 있나요? 최근 몇 년 동안 이 나라에는 어떤 변화가 있었 나요? 가능한 많은 세부 사항을 말해주세요.","source":"pdf","topic":"지형","type":"묘사 + 변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.306 · M306_14","family":"japan-geo","cue":"이웃 일본 → 섬·산·강 → 개인 방문 변화","lines":[{"en":"Japan is a neighboring country with geographical features that remind me of Korea.","ko":"일본은 한국을 떠올리게 하는 지형적 특징이 있는 이웃 나라예요.","shared":false},{"en":"Both countries have mountains, rivers, and long stretches of coastline.","ko":"두 나라 모두 산과 강, 길게 이어진 해안이 있어요.","shared":false},{"en":"However, Japan consists of islands, while South Korea is part of a peninsula.","ko":"하지만 일본은 섬들로 구성되고 한국은 반도의 일부예요.","shared":false},{"en":"During my visit to Osaka, I noticed rivers running through busy urban areas.","ko":"오사카를 방문했을 때 번화한 도시 사이로 강이 흐르는 것을 봤어요.","shared":false},{"en":"In recent years, the changes I have noticed as a visitor are mainly in developed areas rather than the natural landforms.","ko":"최근 방문객으로서 느낀 변화는 자연 지형보다 개발된 지역 쪽이에요.","shared":false},{"en":"For example, some areas I saw in older travel photos now have newer buildings and improved riverside paths.","ko":"예전 여행 사진에서 봤던 일부 지역에는 이제 새 건물과 개선된 강변 길이 있어요.","shared":false},{"en":"I wouldn't say the mountains or coastline changed quickly; it is the way people use the space that looks different.","ko":"산이나 해안이 빨리 변했다기보다 공간을 쓰는 방식이 달라 보여요.","shared":false}],"note":"개인 여행 관찰을 가정한 예시입니다. 최근 국가 지형 변화에 대한 통계적 주장으로 사용하지 않습니다.","sources":[{"id":"M306_14","label":"오픽만수르 IM2–IH · p.306 · M306_14"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라와 지형적으로 비슷하거나 가까운 나라에 대해 말해주세요.","이 나라 는 어떤 지형적 특징이 있나요?","최근 몇 년 동안 이 나라에는 어떤 변화가 있었 나요?","가능한 많은 세부 사항을 말해주세요."],"words":108,"representative":"M306_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M307_15","page":307,"title":"","q":"Have you read or seen some articles about the country you just mentioned about? What do you think about these articles? What was the news? Was it economic, or political relationships news?","qko":"당신이 방금 언급한 나라의 뉴스 기사를 읽거나 본 적이 있나요? 이 뉴스 기사들 에 대해 어떻게 생각하시나요? 뉴스가 무엇이었나요? 경제 뉴스인가요 아니면 정 치적 관계에 대한 뉴스인가요?","source":"pdf","topic":"지형","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.307 · M307_15","family":"japan-news","cue":"일본 관광 기사 → 경제·혼잡 → 주민 균형","lines":[{"en":"I read an article about tourism in Japan, the country I just mentioned.","ko":"방금 말한 일본의 관광에 관한 기사를 읽었어요.","shared":false},{"en":"It was mainly economic news about visitors spending money in local shops and hotels.","ko":"방문객이 지역 가게와 호텔에서 돈을 쓰는 경제 뉴스가 중심이었어요.","shared":false},{"en":"The article also described crowded streets near popular attractions.","ko":"인기 관광지 근처의 붐비는 거리도 다뤘어요.","shared":false},{"en":"Some businesses welcomed the extra customers, while residents worried about noise and queues.","ko":"일부 가게는 손님 증가를 반겼지만 주민들은 소음과 대기를 걱정했어요.","shared":false},{"en":"I thought both reactions were understandable because the benefits and inconvenience are shared differently.","ko":"혜택과 불편을 다르게 겪기 때문에 두 반응 모두 이해됐어요.","shared":false},{"en":"Clear visitor guidance and better crowd management seemed more useful than blaming tourists as a group.","ko":"관광객 전체를 탓하기보다 명확한 안내와 혼잡 관리가 더 유용해 보였어요.","shared":false},{"en":"The story made me think more carefully about being considerate when I travel.","ko":"그 기사를 보고 여행할 때 배려해야겠다고 더 생각했어요.","shared":false}],"note":"연습용 기사 설정이며 특정 최신 기사를 확인하거나 인용한 답변은 아닙니다.","sources":[{"id":"M307_15","label":"오픽만수르 IM2–IH · p.307 · M307_15"}],"correction":"","scope":"돌발·확장","requirements":["당신이 방금 언급한 나라의 뉴스 기사를 읽거나 본 적이 있나요?","이 뉴스 기사들 에 대해 어떻게 생각하시나요?","뉴스가 무엇이었나요?","경제 뉴스인가요 아니면 정 치적 관계에 대한 뉴스인가요?"],"words":92,"representative":"M307_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M308_14","page":308,"title":"","q":"I'd like to know how different the ways are to solve problems at home between you and your parents. How do you solve problems when they occur in your home and how do your parents solve problems in their house? Tell me the differences and the similarities.","qko":"당신과 당신의 부모님이 집에서 발생한 문제를 해결하는 방법이 어떻게 다른 지 알고 싶습니다. 당신의 집에서 문제가 발생했을 때 당신은 어떻게 해결하고 당신의 부모님은 그들의 집에서 문제가 생겼을 때 어떻게 해결하나요? 차이점과 비슷 한 점을 말해주세요.","source":"pdf","topic":"집","type":"두 대상 비교","sourceLabel":"오픽만수르 IM2–IH · p.308 · M308_14","family":"repair-compare","cue":"나 검색·사진 → 부모님 단골 전화 → 전문가는 공통","lines":[{"en":"My parents and I solve problems at home in slightly different ways.","ko":"부모님과 저는 집 문제를 조금 다르게 해결해요.","shared":false},{"en":"I usually start by checking the manual or looking up a simple troubleshooting guide.","ko":"저는 보통 설명서나 간단한 문제 해결 안내를 먼저 봐요.","shared":false},{"en":"I take photos so I can explain the problem clearly to a service center.","ko":"서비스센터에 명확히 설명하려고 사진을 찍어요.","shared":false},{"en":"My parents are more likely to call a repair person they already know and trust.","ko":"부모님은 이미 알고 믿는 수리 기사에게 전화하는 편이에요.","shared":false},{"en":"They value a familiar person's experience, while I like comparing information first.","ko":"부모님은 아는 사람의 경험을 중시하고 저는 먼저 정보를 비교하는 게 좋아요.","shared":false},{"en":"However, we all avoid attempting repairs that we don't understand.","ko":"하지만 모두 잘 모르는 수리를 직접 시도하진 않아요.","shared":false},{"en":"When my air conditioner leaked, I turned it off and called a professional, just as they would.","ko":"에어컨이 샜을 때 저도 부모님처럼 끄고 전문가에게 전화했어요.","shared":false},{"en":"So our first steps differ, but we share the same goal of fixing things properly.","ko":"첫 단계는 다르지만 제대로 고치려는 목표는 같아요.","shared":false}],"note":"","sources":[{"id":"M308_14","label":"오픽만수르 IM2–IH · p.308 · M308_14"}],"correction":"","scope":"설문 중심","requirements":["당신과 당신의 부모님이 집에서 발생한 문제를 해결하는 방법이 어떻게 다른 지 알고 싶습니다.","당신의 집에서 문제가 발생했을 때 당신은 어떻게 해결하고 당신의 부모님은 그들의 집에서 문제가 생겼을 때 어떻게 해결하나요?","차이점과 비슷 한 점을 말해주세요."],"words":109,"representative":"M308_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M309_15","page":309,"title":"","q":"Talk about some issues most people have when they rent a house or an apartment. What are the things people are concerned about? How do these problems affect people's lives? How do they deal with these issues?","qko":"대부분의 사람들이 주택이나 아파트 세를 얻을 때 어떤 문제를 겪는지 말해주세요. 사람들이 우려하는 것은 무엇인가요? 이런 문제들이 사람들의 삶에 어떻게 영향을 미치나요? 그들은 이 문제들을 어떻게 해결하나요?","source":"pdf","topic":"집","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.309 · M309_15","family":"housing-issue","cue":"비용·수리 → 생활 부담 → 계약 확인·사진·연락","lines":[{"en":"Two common concerns when renting a home are the cost and the condition of the property.","ko":"집을 빌릴 때 흔한 걱정 두 가지는 비용과 집 상태예요.","shared":false},{"en":"People worry about paying the rent and deposit while still having money for daily life.","ko":"월세와 보증금을 내면서 생활비가 남을지 걱정해요.","shared":false},{"en":"They also wonder whether the heating, plumbing, and appliances will work properly.","ko":"난방, 배관, 가전이 제대로 작동할지도 생각해요.","shared":false},{"en":"If something breaks and responsibility is unclear, repairs can take longer and cause stress.","ko":"고장이 나고 책임이 불분명하면 수리가 늦어지고 스트레스를 줄 수 있어요.","shared":false},{"en":"I think renters should inspect the place carefully and ask about repair arrangements before agreeing.","ko":"계약하기 전에 집을 잘 보고 수리 방식도 물어야 한다고 생각해요.","shared":false},{"en":"Keeping photos and communicating problems early can also prevent misunderstandings.","ko":"사진을 남기고 문제를 일찍 알리는 것도 오해를 막을 수 있어요.","shared":false},{"en":"For me, an affordable and well-maintained home matters more than impressive decoration.","ko":"저에게는 멋진 장식보다 감당할 수 있는 비용과 잘 관리된 집이 중요해요.","shared":false}],"note":"","sources":[{"id":"M309_15","label":"오픽만수르 IM2–IH · p.309 · M309_15"}],"correction":"","scope":"설문 중심","requirements":["대부분의 사람들이 주택이나 아파트 세를 얻을 때 어떤 문제를 겪는지 말해주세요.","사람들이 우려하는 것은 무엇인가요?","이런 문제들이 사람들의 삶에 어떻게 영향을 미치나요?","그들은 이 문제들을 어떻게 해결하나요?"],"words":94,"representative":"M309_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M310_14","page":310,"title":"","q":"I'd like to know about the rising industries in your country. What industries do people talk about these days? What is this industry about? How has that industry changed over the years? How was it different compared to the industry now?","qko":"당신의 나라에서 떠오르는 산업에 대해 알고 싶습니다. 요즘 사람들은 어떤 산업 에 대해 이야기하나요? 이 산업은 무엇에 대한 것인가요? 지난 몇 년간 그 산업 은 어떻게 변화했나요? 이 산업은 지금의 산업과 비교했을 때 어떻게 달랐나요?","source":"pdf","topic":"산업","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.310 · M310_14","family":"industry","cue":"휴대폰 산업 → 통화에서 다기능 → 경쟁·연결","lines":[{"en":"One industry people around me often discuss is the smartphone industry.","ko":"제 주변에서 자주 이야기하는 산업은 스마트폰 산업이에요.","shared":true},{"en":"It involves designing phones and the services that people use on them.","ko":"휴대폰과 그 안에서 이용하는 서비스를 만드는 산업이에요.","shared":true},{"en":"When I was younger, phones were mainly for calls and short messages.","ko":"어릴 때 폰은 주로 통화와 짧은 문자용이었어요.","shared":true},{"en":"Now the devices combine cameras, maps, entertainment, and payment tools.","ko":"이제는 카메라, 지도, 오락, 결제 도구를 합친 기기예요.","shared":true},{"en":"For example, I can plan an entire trip on the same device I use to contact my parents.","ko":"예를 들어 부모님께 연락하는 기기로 여행 전체를 계획할 수 있어요.","shared":true},{"en":"Companies also compete on battery life and how easily their devices connect with other products.","ko":"기업은 배터리 수명과 다른 제품과의 연결 편의성으로도 경쟁해요.","shared":true},{"en":"To me, the industry has grown from selling a communication tool to supporting many parts of daily life.","ko":"통신 도구 판매에서 일상의 여러 부분을 지원하는 산업으로 성장한 것 같아요.","shared":true},{"en":"I am most interested in useful improvements, not just a new model name.","ko":"저는 새 모델 이름보다 유용한 개선에 가장 관심이 있어요.","shared":true}],"note":"","sources":[{"id":"M310_14","label":"오픽만수르 IM2–IH · p.310 · M310_14"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에서 떠오르는 산업에 대해 알고 싶습니다.","요즘 사람들은 어떤 산업 에 대해 이야기하나요?","이 산업은 무엇에 대한 것인가요?","지난 몇 년간 그 산업 은 어떻게 변화했나요?","이 산업은 지금의 산업과 비교했을 때 어떻게 달랐나요?"],"words":109,"representative":"M310_14","additional":0,"sharedCount":8,"related":["H6_14"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M311_15","page":311,"title":"","q":"Have the industry you just mentioned ever released a new product that couldn't meet people's expectations? What was the product about? Why were people disappointed about it? How did people react to this issue?","qko":"방금 말씀하신 산업에서 사람들의 기대에 못 미친 신제품을 출시한 적이 있나요? 그 제품은 무엇에 관한 것이었나요? 왜 사람들이 이것에 대해 실망했나요? 사람 들은 이 문제에 어떻게 반응 했었나요?","source":"pdf","topic":"산업","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.311 · M311_15","family":"product-failure","cue":"가상폰 배터리 → 후기 불만 → 업데이트·교환","lines":[{"en":"I remember a phone release that disappointed people because its battery performance didn't match their expectations.","ko":"배터리 성능이 기대에 못 미쳐 사람들을 실망시킨 휴대폰 출시 사례가 기억나요.","shared":true},{"en":"The product was promoted as convenient for watching videos and taking photos throughout the day.","ko":"하루 종일 영상과 사진을 즐기기 편한 제품으로 홍보됐어요.","shared":true},{"en":"However, some users found that they had to charge it again before evening.","ko":"하지만 일부 사용자는 저녁 전에 다시 충전해야 한다는 걸 알았어요.","shared":true},{"en":"They posted negative reviews and asked the company to explain the difference.","ko":"부정적인 후기를 올리고 회사에 차이를 설명해 달라고 했어요.","shared":true},{"en":"The company released a software update and offered checks or replacements for affected devices.","ko":"회사는 소프트웨어 업데이트와 해당 기기의 점검 또는 교환을 제공했어요.","shared":true},{"en":"Other companies emphasized battery testing and clearer usage information in response.","ko":"다른 회사들도 배터리 시험과 더 명확한 사용 정보를 강조했어요.","shared":true},{"en":"The case reminded me that impressive advertising isn't enough if ordinary use feels different.","ko":"일상 사용이 다르면 인상적인 광고만으로는 부족하다는 걸 느꼈어요.","shared":true},{"en":"I now read practical user reviews before buying a device.","ko":"이제 기기를 사기 전에 실제 사용 후기를 읽어요.","shared":true}],"note":"특정 기업·실제품의 결함을 주장하지 않는 연습용 가상 사례입니다.","sources":[{"id":"M311_15","label":"오픽만수르 IM2–IH · p.311 · M311_15"}],"correction":"Have the industry … ever released → Has the industry … ever released","scope":"돌발·확장","requirements":["방금 말씀하신 산업에서 사람들의 기대에 못 미친 신제품을 출시한 적이 있나요?","그 제품은 무엇에 관한 것이었나요?","왜 사람들이 이것에 대해 실망했나요?","사람 들은 이 문제에 어떻게 반응 했었나요?"],"words":105,"representative":"M311_15","additional":0,"sharedCount":8,"related":["H6_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M312_14","page":312,"title":"","q":"People have gatherings and celebrations for particular reasons. How were gatherings and celebrations when you were a child? How were they different from now? How do people get together nowadays? Tell me how gatherings have changed over the years.","qko":"사람들은 특별한 이유로 모임과 기념을 합니다. 당신이 어릴 때 모임과 기념은 어땠나요? 그것은 지금과 어떻게 달랐나요? 요즘 사람들은 어떻게 모임을 하나 요? 몇 년 동안 모임이 어떻게 변화 했는지 말해주세요.","source":"pdf","topic":"모임","type":"변화·비교","sourceLabel":"오픽만수르 IM2–IH · p.312 · M312_14","family":"gathering-change","cue":"예전 집·종일 준비 → 지금 식당·메시지 → 연결","lines":[{"en":"When I was a child, family gatherings usually took place at my grandparents' home.","ko":"어릴 때 가족 모임은 보통 조부모님 댁에서 했어요.","shared":false},{"en":"Relatives arrived early, and several people spent hours preparing food.","ko":"친척들이 일찍 와서 여러 사람이 몇 시간씩 음식을 준비했어요.","shared":false},{"en":"We contacted each other by phone and often stayed for most of the day.","ko":"전화로 연락하고 하루 대부분을 함께 보내곤 했어요.","shared":false},{"en":"Now our gatherings are often smaller, and we sometimes meet at a restaurant.","ko":"지금은 모임이 더 작고 식당에서 만나기도 해요.","shared":false},{"en":"We choose the time through a group message and share photos afterward.","ko":"단체 메시지로 시간을 정하고 나중에 사진을 공유해요.","shared":false},{"en":"That makes organizing easier and reduces the work for one household.","ko":"준비가 쉬워지고 한 집에 몰리는 일이 줄어요.","shared":false},{"en":"I miss the relaxed feeling of a whole day together, but I like the fairer workload now.","ko":"종일 함께하던 여유는 그립지만 지금 더 공평한 일 분담은 좋아요.","shared":false},{"en":"The way we meet has changed, while the reason for meeting is still to stay close.","ko":"만나는 방식은 달라도 가까이 지내려는 이유는 같아요.","shared":false}],"note":"","sources":[{"id":"M312_14","label":"오픽만수르 IM2–IH · p.312 · M312_14"}],"correction":"","scope":"돌발·확장","requirements":["사람들은 특별한 이유로 모임과 기념을 합니다.","당신이 어릴 때 모임과 기념은 어땠나요?","그것은 지금과 어떻게 달랐나요?","요즘 사람들은 어떻게 모임을 하나 요?","몇 년 동안 모임이 어떻게 변화 했는지 말해주세요."],"words":107,"representative":"M312_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"M313_15","page":313,"title":"","q":"Sometimes people can complain about the gatherings and celebrations. What concerns do people in your community have about gatherings and celebrations? Perhaps they complain about traffic or noise. What do people concern about such gatherings?","qko":"때때로 사람들은 모임과 기념식에 불평을 할 수 있습니다. 당신의 지역 사회 사 람들은 모임과 기념 행사에 대해 어떤 우려를 가지고 있나요? 아마도, 그들은 교 통체증이나 소음에 불만을 가질 수 있을 것입니다. 사람들은 그런 모임에 대해 무엇을 걱정하나요?","source":"pdf","topic":"모임","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.313 · M313_15","family":"community-issue","cue":"모임 소음·주차 → 주민 불편 → 시간·교통 안내","lines":[{"en":"Two issues in my neighborhood are noise and parking when there are large gatherings.","ko":"우리 동네 문제 두 가지는 큰 모임이 있을 때의 소음과 주차예요.","shared":true},{"en":"Visitors sometimes arrive at the same time and fill the spaces near apartment entrances.","ko":"방문객이 동시에 와서 아파트 입구 근처 공간을 채우기도 해요.","shared":true},{"en":"Music or conversations can also continue late into the evening.","ko":"음악이나 대화가 늦은 저녁까지 이어지기도 해요.","shared":true},{"en":"This makes it harder for residents to rest or get through narrow streets.","ko":"주민이 쉬거나 좁은 길을 통과하기 어려워져요.","shared":true},{"en":"Families with young children or early morning plans may feel the disturbance most.","ko":"어린아이를 키우거나 아침 일찍 일정이 있는 가정은 더 불편할 수 있어요.","shared":true},{"en":"Organizers could set a clear finishing time and tell guests where to park or how to use public transport.","ko":"주최자는 종료 시간을 정하고 주차 장소나 대중교통 이용법을 알릴 수 있어요.","shared":true},{"en":"I don't think people should stop celebrating; they just need to consider the people who live nearby.","ko":"축하를 멈추기보다 근처에 사는 사람을 배려하면 된다고 생각해요.","shared":true}],"note":"","sources":[{"id":"M313_15","label":"오픽만수르 IM2–IH · p.313 · M313_15"}],"correction":"","scope":"돌발·확장","requirements":["때때로 사람들은 모임과 기념식에 불평을 할 수 있습니다.","당신의 지역 사회 사 람들은 모임과 기념 행사에 대해 어떤 우려를 가지고 있나요?","아마도, 그들은 교 통체증이나 소음에 불만을 가질 수 있을 것입니다.","사람들은 그런 모임에 대해 무엇을 걱정하나요?"],"words":100,"representative":"M313_15","additional":0,"sharedCount":7,"related":["H2_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M314_14","page":314,"title":"","q":"Tell me about holidays in your country. What do people typically do during holidays? Describe what activities people do for the holidays in detail.","qko":"당신의 나라에 있는 명절/공휴일에 대해 말해주세요. 일반적으로 사람들은 명절/ 공휴일에 무엇을 하나요? 사람들이 명절/공휴일에 하는 활동을 자세히 설명해 주 세요.","source":"pdf","topic":"명절","type":"습관·활동","sourceLabel":"오픽만수르 IM2–IH · p.314 · M314_14","family":"holiday","cue":"설·추석 → 가족·음식 → 우리 집 모임","lines":[{"en":"Two important holidays in Korea are Seollal and Chuseok.","ko":"한국의 중요한 명절 두 가지는 설날과 추석이에요.","shared":true},{"en":"Seollal is the Lunar New Year, and Chuseok is associated with the autumn harvest.","ko":"설날은 음력 새해이고 추석은 가을 수확과 관련된 명절이에요.","shared":true},{"en":"Many families get together, share food, and spend time with relatives.","ko":"많은 가족이 모여 음식을 나누고 친척들과 시간을 보내요.","shared":true},{"en":"For Seollal, my family usually has rice-cake soup and greets the older relatives.","ko":"설날에 저희 가족은 보통 떡국을 먹고 어른들께 인사해요.","shared":true},{"en":"For Chuseok, we share a meal and sometimes eat songpyeon, a type of rice cake.","ko":"추석에는 함께 식사하고 송편이라는 떡을 먹기도 해요.","shared":true},{"en":"I live alone now, so I visit my parents and help set the table.","ko":"지금은 혼자 살아서 부모님을 찾아뵙고 상 차리는 걸 도와요.","shared":true},{"en":"Not every family celebrates in the same way, but seeing each other matters most to us.","ko":"모든 가족이 똑같이 보내진 않지만 저희는 서로 만나는 게 가장 중요해요.","shared":true},{"en":"For me, these holidays are a chance to slow down and reconnect.","ko":"저에게 명절은 여유를 갖고 다시 가까워질 기회예요.","shared":true},{"en":"In my family, Seollal is the biggest gathering because more relatives come than at any other time.","ko":"저희 가족은 다른 때보다 친척이 많이 오는 설날에 가장 크게 모여요.","shared":true}],"note":"","sources":[{"id":"M314_14","label":"오픽만수르 IM2–IH · p.314 · M314_14"}],"correction":"","scope":"돌발·확장","requirements":["당신의 나라에 있는 명절/공휴일에 대해 말해주세요.","일반적으로 사람들은 명절/ 공휴일에 무엇을 하나요?","사람들이 명절/공휴일에 하는 활동을 자세히 설명해 주 세요."],"words":121,"representative":"M168_1","additional":0,"sharedCount":9,"related":["M168_1","M170_2","H4_14"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M315_15","page":315,"title":"","q":"Sometimes problems can occur during holidays. What kinds of issues or concerns do people in your country have regarding holidays? What causes those problems? How do people handle those issues or concerns?","qko":"때때로 명절/공휴일 동안 문제가 발생할 수 있습니다. 당신의 나라 사람들은 명 절/공휴일에 관련하여 어떤 문제 또는 우려를 가지나요? 무엇이 그 문제를 발생 시키나요? 사람들은 이런 문제와 우려를 어떻게 다루나요?","source":"pdf","topic":"명절","type":"뉴스·이슈","sourceLabel":"오픽만수르 IM2–IH · p.315 · M315_15","family":"holiday-issue","cue":"교통·가사 부담 → 출발 조절·분담 → 휴식","lines":[{"en":"During major holidays, people often worry about traffic and the amount of preparation.","ko":"큰 명절에는 교통과 준비량을 걱정하는 경우가 많아요.","shared":true},{"en":"Many families travel at similar times, so roads and stations can become crowded.","ko":"많은 가족이 비슷한 시간에 이동해서 도로와 역이 붐빌 수 있어요.","shared":true},{"en":"Preparing a large meal can also put too much work on just one or two people.","ko":"큰 식사를 준비하면 한두 사람에게 일이 몰릴 수도 있어요.","shared":true},{"en":"That can turn a relaxing holiday into a stressful schedule.","ko":"편안해야 할 명절이 부담스러운 일정으로 바뀔 수 있어요.","shared":true},{"en":"Some families leave earlier or later to avoid the busiest travel hours.","ko":"어떤 가족은 붐비는 시간을 피해 일찍 또는 늦게 출발해요.","shared":true},{"en":"Others reduce the menu, share cooking tasks, or eat out together.","ko":"메뉴를 줄이거나 요리를 나누거나 외식하는 가족도 있어요.","shared":true},{"en":"My family tries to divide the preparation and leave time to rest.","ko":"저희 가족은 준비를 나누고 쉴 시간을 남기려고 해요.","shared":true},{"en":"I think the point of a holiday is spending time together, not making everything perfect.","ko":"명절의 목적은 완벽한 준비보다 함께 시간을 보내는 거라고 생각해요.","shared":true}],"note":"","sources":[{"id":"M315_15","label":"오픽만수르 IM2–IH · p.315 · M315_15"}],"correction":"","scope":"돌발·확장","requirements":["때때로 명절/공휴일 동안 문제가 발생할 수 있습니다.","당신의 나라 사람들은 명 절/공휴일에 관련하여 어떤 문제 또는 우려를 가지나요?","무엇이 그 문제를 발생 시키나요?","사람들은 이런 문제와 우려를 어떻게 다루나요?"],"words":102,"representative":"M315_15","additional":0,"sharedCount":8,"related":["H4_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M318_1","page":318,"title":"Hair Salon / Description / 자주 가는 미용실 묘사","q":"Let's talk about your favorite hair salon. Can you describe what it looks like? Why do you like that place? How often do you go there? Please provide as many details as possible.","qko":"당신이 자주 가는 미용실에 대해 이야기해봅시다. 그 미용실이 어떻게 생겼는지 묘사해 주실 수 있나요? 왜 그 장소에 자주 가시나요? 얼마나 자주 거기에 가시 나요? 가능한 많은 세부 내용들을 말해주세요.","source":"pdf","topic":"미용실","type":"묘사","sourceLabel":"오픽만수르 IM2–IH · p.318 · M318_1","family":"salon","cue":"집 근처 → 의자 세 개 → 조용함 → 두 달","lines":[{"en":"I go to a small hair salon about five minutes from my apartment.","ko":"집에서 5분 정도 거리의 작은 미용실에 가요.","shared":false},{"en":"It has three styling chairs, large mirrors, and a small sofa near the entrance.","ko":"미용 의자 세 개와 큰 거울, 입구 근처 작은 소파가 있어요.","shared":false},{"en":"The room is bright and tidy, and the music is usually quiet.","ko":"밝고 깔끔하며 음악도 보통 조용해요.","shared":false},{"en":"I visit about once every two months for a simple trim.","ko":"두 달에 한 번 정도 간단히 다듬으러 가요.","shared":false},{"en":"I like the stylist because she listens before starting and checks how much I want cut.","ko":"시작 전에 제 말을 듣고 얼마나 자를지 확인해 주는 디자이너가 좋아요.","shared":false},{"en":"She doesn't pressure me to buy extra services, which makes me comfortable.","ko":"추가 서비스를 강요하지 않아 편해요.","shared":false},{"en":"It isn't a fancy place, but the reliable service matters more to me than the decoration.","ko":"화려한 곳은 아니지만 장식보다 믿을 만한 서비스가 중요해요.","shared":false}],"note":"","sources":[{"id":"M318_1","label":"오픽만수르 IM2–IH · p.318 · M318_1"}],"correction":"","scope":"돌발·확장","requirements":["당신이 자주 가는 미용실에 대해 이야기해봅시다.","그 미용실이 어떻게 생겼는지 묘사해 주실 수 있나요?","왜 그 장소에 자주 가시나요?","얼마나 자주 거기에 가시 나요?","가능한 많은 세부 내용들을 말해주세요."],"words":94,"representative":"M318_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M319_1","page":319,"title":"Hair Salon / Routine / 미용실에서 하는 활동","q":"When you go to a hair salon, what do you usually do there? Can you describe the process in order? What services do you typically get, and how does the visit usually go? Please explain step-by-step.","qko":"미용실에 가면 보통 무엇을 하나요? 과정을 순서대로 설명할 수 있나요? 주로 어떤 서비스를 받고 방문은 어떻게 진행되나요? 단계별로 설명하세요.","source":"pdf","topic":"미용실","type":"절차·준비","sourceLabel":"오픽만수르 IM2–IH · p.319 · M319_1","family":"salon-routine","cue":"예약 → 길이 설명 → 커트·샴푸 → 확인·결제","lines":[{"en":"I usually book a haircut before visiting so I don't have to wait long.","ko":"오래 기다리지 않도록 보통 가기 전에 커트를 예약해요.","shared":false},{"en":"When I arrive, I give my name and sit down when the stylist is ready.","ko":"도착하면 이름을 말하고 디자이너가 준비되면 앉아요.","shared":false},{"en":"I explain that I want a simple trim and show how much length I want removed.","ko":"간단히 다듬고 싶다고 말하고 자를 길이를 보여줘요.","shared":false},{"en":"I don't normally get a perm or change my hair color.","ko":"보통 파마나 염색은 하지 않아요.","shared":false},{"en":"After cutting, the stylist washes and dries my hair.","ko":"커트 후 디자이너가 머리를 감기고 말려줘요.","shared":false},{"en":"I look in the mirror from both sides and ask for a small adjustment if needed.","ko":"거울로 양쪽을 보고 필요하면 조금 수정해 달라고 해요.","shared":false},{"en":"Then I pay, thank her, and walk home.","ko":"그다음 계산하고 감사 인사를 한 뒤 걸어 집에 가요.","shared":false},{"en":"The whole visit is usually short and relaxing because I know what to expect.","ko":"무엇을 할지 알아서 방문은 보통 짧고 편안해요.","shared":false}],"note":"","sources":[{"id":"M319_1","label":"오픽만수르 IM2–IH · p.319 · M319_1"}],"correction":"","scope":"돌발·확장","requirements":["미용실에 가면 보통 무엇을 하나요?","과정을 순서대로 설명할 수 있나요?","주로 어떤 서비스를 받고 방문은 어떻게 진행되나요?","단계별로 설명하세요."],"words":103,"representative":"M319_1","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M320_1","page":320,"title":"Hair Salon / Past Experience / 헤어 디자이너를 처음 만난 경험","q":"Tell me about the first time you met your favorite hair designer. How did you find the salon or the stylist ? What made you choose them? Please describe everything you remember about that experience in detail.","qko":"당신이 가장 좋아하는 헤어 디자이너를 처음 만났던 때에 대하여 말해주세요. 그 미용실 또는 디자이너를 어떻게 찾았나요? 무엇이 당신의 선택에 영향을 미쳤나 요? 그 경험에 대해 기억하시는 모든 것을 자세히 묘사해 주세요.","source":"pdf","topic":"미용실","type":"처음·계기","sourceLabel":"오픽만수르 IM2–IH · p.320 · M320_1","family":"salon-first","cue":"작년 이사 → 검색 → 후기 → 잘 들어줌","lines":[{"en":"I first met my regular stylist last year, soon after moving into my apartment.","ko":"작년에 아파트로 이사한 직후 단골 디자이너를 처음 만났어요.","shared":false},{"en":"I needed a haircut, so I searched for salons within walking distance.","ko":"커트가 필요해 걸어갈 수 있는 미용실을 검색했어요.","shared":false},{"en":"I chose a small one because several reviews said the stylist listened carefully.","ko":"디자이너가 잘 들어준다는 후기가 여러 개 있어 작은 곳을 골랐어요.","shared":false},{"en":"When I arrived, she asked what I liked and disliked about my current hair.","ko":"도착하자 현재 머리에서 좋은 점과 싫은 점을 물어봤어요.","shared":false},{"en":"She showed me the length she planned to cut before using the scissors.","ko":"가위를 대기 전에 자를 길이를 보여줬어요.","shared":false},{"en":"That small step made me feel involved instead of worried about the result.","ko":"그 작은 과정 덕분에 결과를 걱정하기보다 함께 결정하는 느낌이었어요.","shared":false},{"en":"The haircut was simple and neat, and the price was clear from the start.","ko":"커트는 단순하고 단정했으며 가격도 처음부터 명확했어요.","shared":false},{"en":"I decided to return because the whole experience felt comfortable and predictable.","ko":"전체 경험이 편안하고 예상 가능해서 다시 가기로 했어요.","shared":false}],"note":"","sources":[{"id":"M320_1","label":"오픽만수르 IM2–IH · p.320 · M320_1"}],"correction":"","scope":"돌발·확장","requirements":["당신이 가장 좋아하는 헤어 디자이너를 처음 만났던 때에 대하여 말해주세요.","그 미용실 또는 디자이너를 어떻게 찾았나요?","무엇이 당신의 선택에 영향을 미쳤나 요?","그 경험에 대해 기억하시는 모든 것을 자세히 묘사해 주세요."],"words":105,"representative":"M320_1","additional":0,"sharedCount":0,"related":[],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"M321_1","page":321,"title":"Hair Salon / Past Experience / 미용실에서 겪은 과거 경험","q":"Please describe a memorable experience you had when you went to get a haircut. When and where did it happen? What exactly happened that made it unforgettable? Tell me the whole story from beginning to end, with as much detail as possible.","qko":"머리를 하러 갔을 때 겪은 기억에 남는 경험을 묘사해 주세요. 언제 어디서 있었 던 일인가요? 정확히 어떤 일이 발생해서 이 기억을 잊지 못하나요? 전체 이야기 를 자세히 말해주세요.","source":"pdf","topic":"미용실","type":"문제·기억 경험","sourceLabel":"오픽만수르 IM2–IH · p.321 · M321_1","family":"salon-bad","cue":"작년 다른 미용실 → 양쪽 불균형 → 정중히 → 수정","lines":[{"en":"Last year, I tried a different salon because my usual one was closed that day.","ko":"작년에 단골 미용실이 닫아서 다른 곳에 갔어요.","shared":true},{"en":"I asked for a small trim before a family gathering.","ko":"가족 모임 전에 조금만 다듬어 달라고 했어요.","shared":true},{"en":"After drying my hair, I noticed one side looked longer than the other.","ko":"말린 뒤 한쪽이 다른 쪽보다 길어 보였어요.","shared":true},{"en":"I felt awkward complaining, but I explained the problem politely and pointed it out in the mirror.","ko":"불평하기가 어색했지만 정중하게 설명하고 거울에서 보여줬어요.","shared":true},{"en":"The stylist checked it and agreed that a small correction was needed.","ko":"디자이너가 확인하고 조금 수정해야겠다고 했어요.","shared":true},{"en":"She evened out the sides without charging more and checked again with me.","ko":"추가 비용 없이 양쪽을 맞추고 저와 다시 확인했어요.","shared":true},{"en":"I left with a neat haircut and was able to enjoy the gathering.","ko":"단정한 머리로 나와 모임을 즐길 수 있었어요.","shared":true},{"en":"I remember it because speaking up calmly worked better than staying unhappy in silence.","ko":"불만을 말없이 참기보다 차분히 말하는 게 나아서 기억나요.","shared":true}],"note":"","sources":[{"id":"M321_1","label":"오픽만수르 IM2–IH · p.321 · M321_1"}],"correction":"","scope":"돌발·확장","requirements":["머리를 하러 갔을 때 겪은 기억에 남는 경험을 묘사해 주세요.","언제 어디서 있었 던 일인가요?","정확히 어떤 일이 발생해서 이 기억을 잊지 못하나요?","전체 이야기 를 자세히 말해주세요."],"words":107,"representative":"M321_1","additional":0,"sharedCount":8,"related":["M325_13"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"M323_11","page":323,"title":"","q":"I'd like to give you a situation and ask you to act it out. You have a special event coming up, and you want to get your hair done for the occasion. Call a hair salon, explain your situation, and ask three or four questions about making an appointment and getting your hair styled.","qko":"상황을 드릴 테니 대처를 보여주세요. 곧 특별한 행사가 있을 예정이고, 그 행사를 위해 머리를 하려고 합니다. 미용실 에 전화하여 상황을 설명하고, 예약과 헤어 스타일에 대한 3, 4 가지 질문을 해보 세요.","source":"pdf","topic":"미용실","type":"역할극 질문","sourceLabel":"오픽만수르 IM2–IH · p.323 · M323_11","family":"rp-salon","cue":"가족 행사 → 시간·스타일·소요·가격","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I have a family celebration this weekend, and I would like a neat haircut before the event.","ko":"이번 주말 가족 행사가 있어 그 전에 머리를 단정하게 자르고 싶어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Do you have an appointment available on Friday afternoon?","ko":"금요일 오후에 예약 가능한 시간이 있나요?","shared":false},{"en":"Could your stylist help me choose a simple style that is easy to maintain?","ko":"관리하기 쉬운 단순한 스타일을 고르도록 도와주실 수 있나요?","shared":false},{"en":"How long would the cut and styling take?","ko":"커트와 스타일링에 얼마나 걸리나요?","shared":false},{"en":"What is the total price, including washing and drying?","ko":"샴푸와 드라이를 포함한 총가격은 얼마인가요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"M323_11","label":"오픽만수르 IM2–IH · p.323 · M323_11"}],"correction":"","scope":"역할극","requirements":["상황을 드릴 테니 대처를 보여주세요.","곧 특별한 행사가 있을 예정이고, 그 행사를 위해 머리를 하려고 합니다.","미용실 에 전화하여 상황을 설명하고, 예약과 헤어 스타일에 대한 3, 4 가지 질문을 해보 세요."],"words":85,"representative":"M323_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"M324_12","page":324,"title":"","q":"I'm sorry, but there is a problem that you need to resolve. You got your hair done at a salon, but you are not satisfied with the result. Call the salon, explain what you are unhappy with, and suggest two or three options to resolve the issue, such as fixing the style or getting a refund.","qko":"죄송하지만, 당신이 해결해야 할 문제가 있습니다. 당신은 미용실에서 머리를 했습니다. 그러나 결과가 마음에 들지 않습니다. 미용 실에 전화하여 무엇이 마음에 들지 않는지 설명하고, 머리를 다시 손보거나 환불 받는 것과 같이 문제를 해결하기 위한 대안을 2, 3가지 제안해 보세요.","source":"pdf","topic":"미용실","type":"역할극 해결","sourceLabel":"오픽만수르 IM2–IH · p.324 · M324_12","family":"rp-hair-bad","cue":"요청보다 짧고 불균형 → 무료 수정·환불","lines":[{"en":"Hello, I had my hair cut at your salon this morning, and I am unhappy with the result.","ko":"안녕하세요. 오늘 아침 미용실에서 머리를 잘랐는데 결과가 마음에 들지 않아요.","shared":false},{"en":"I asked for a small trim, but the sides are uneven and much shorter than we discussed.","ko":"조금만 다듬어 달랬는데 양옆이 고르지 않고 이야기한 것보다 훨씬 짧아요.","shared":false},{"en":"I have an event this weekend, so I would like to find a solution soon.","ko":"이번 주말에 행사가 있어 빨리 해결하고 싶어요.","shared":false},{"en":"Could an experienced stylist check it and make the sides even without charging me again?","ko":"경험 있는 디자이너가 추가 비용 없이 확인하고 양쪽을 맞춰줄 수 있나요?","shared":false},{"en":"If fixing it would mean cutting too much more, I would prefer a partial refund instead.","ko":"수정하려면 더 많이 잘라야 한다면 대신 일부 환불을 받고 싶어요.","shared":false},{"en":"I can come back this afternoon and show you the problem in person.","ko":"오늘 오후에 다시 가서 직접 보여드릴 수 있어요.","shared":false},{"en":"Please tell me which option you can offer.","ko":"어떤 방법이 가능한지 알려주세요.","shared":false},{"en":"I would appreciate your help in making this right.","ko":"잘 해결되도록 도와주시면 감사하겠어요.","shared":false}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"M324_12","label":"오픽만수르 IM2–IH · p.324 · M324_12"}],"correction":"","scope":"역할극","requirements":["죄송하지만, 당신이 해결해야 할 문제가 있습니다.","당신은 미용실에서 머리를 했습니다.","그러나 결과가 마음에 들지 않습니다.","미용 실에 전화하여 무엇이 마음에 들지 않는지 설명하고, 머리를 다시 손보거나 환불 받는 것과 같이 문제를 해결하기 위한 대안을 2, 3가지 제안해 보세요."],"words":111,"representative":"M324_12","additional":0,"sharedCount":0,"relat
