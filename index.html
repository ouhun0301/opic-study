이 있었어요.","shared":true},{"en":"We visited a market, tried local noodles, and walked around after dinner.","ko":"시장에 가고 현지 국수를 먹고 저녁 후에는 산책했어요.","shared":true},{"en":"One shop owner patiently showed us the way when we couldn't find the right street.","ko":"길을 못 찾았을 때 한 가게 주인이 차분히 알려줬어요.","shared":true},{"en":"That kindness made the unfamiliar place feel much more welcoming.","ko":"그 친절 덕분에 낯선 곳이 훨씬 편안하게 느껴졌어요.","shared":true},{"en":"I especially liked how lively areas and peaceful corners were so close together.","ko":"활기찬 곳과 조용한 곳이 가까이 있다는 점이 특히 좋았어요.","shared":true},{"en":"I came home with the impression that exploring on foot was the best part of the trip.","ko":"걸어서 둘러보는 게 여행에서 가장 좋았다는 생각을 하며 돌아왔어요.","shared":true},{"en":"I don't go abroad often, only once every few years, and I usually choose a nearby country.","ko":"해외에는 몇 년에 한 번 정도만 가고 보통 가까운 나라를 골라요.","shared":false},{"en":"On a typical trip, I travel with Min, try local food, and leave plenty of time for walking.","ko":"보통 민이와 여행하며 현지 음식을 먹고 산책할 시간을 넉넉히 남겨요.","shared":false}],"note":"","sources":[{"id":"H2_09","label":"해커스 오픽 매뉴얼 · 사진 2 · Q09"}],"correction":"","scope":"설문 중심","requirements":["해외여행 빈도, 여행지, 동행, 현지 활동을 포함해 보통의 해외여행을 설명하세요."],"words":143,"representative":"M116_1","additional":2,"sharedCount":8,"related":["M116_1","M184_3","M273_13","H2_08","H2_10"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_10","source":"photo","set":2,"number":10,"topic":"해외여행","q":"Tell me about your last trip overseas. When and where did you go? Who did you go with? Describe your most recent overseas trip in detail.","qko":"최근 해외여행의 시점·장소·동행을 포함해 자세히 설명하세요.","title":"최근 해외여행의 시점·장소·동행을 포함해 자세히 설명하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q10","family":"abroad","cue":"작년 가을 오사카 → 민 → 시장·강 → 길 도움","lines":[{"en":"My most recent overseas trip was to Osaka in Japan last fall with Min.","ko":"최근 해외여행은 지난가을 민이와 일본 오사카에 간 거예요.","shared":true},{"en":"We stayed for three days in a small hotel near a train station.","ko":"기차역 근처 작은 호텔에서 사흘간 머물렀어요.","shared":true},{"en":"The city had busy shopping streets, bright signs, and quieter streets along the river.","ko":"도시에는 번화한 상점가와 밝은 간판, 강변의 조용한 길이 있었어요.","shared":true},{"en":"We visited a market, tried local noodles, and walked around after dinner.","ko":"시장에 가고 현지 국수를 먹고 저녁 후에는 산책했어요.","shared":true},{"en":"One shop owner patiently showed us the way when we couldn't find the right street.","ko":"길을 못 찾았을 때 한 가게 주인이 차분히 알려줬어요.","shared":true},{"en":"That kindness made the unfamiliar place feel much more welcoming.","ko":"그 친절 덕분에 낯선 곳이 훨씬 편안하게 느껴졌어요.","shared":true},{"en":"I especially liked how lively areas and peaceful corners were so close together.","ko":"활기찬 곳과 조용한 곳이 가까이 있다는 점이 특히 좋았어요.","shared":true},{"en":"I came home with the impression that exploring on foot was the best part of the trip.","ko":"걸어서 둘러보는 게 여행에서 가장 좋았다는 생각을 하며 돌아왔어요.","shared":true}],"note":"","sources":[{"id":"H2_10","label":"해커스 오픽 매뉴얼 · 사진 2 · Q10"}],"correction":"","scope":"설문 중심","requirements":["최근 해외여행의 시점·장소·동행을 포함해 자세히 설명하세요."],"words":108,"representative":"M116_1","additional":0,"sharedCount":8,"related":["M116_1","M184_3","M273_13","H2_08","H2_09"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H2_11","source":"photo","set":2,"number":11,"topic":"병원","q":"Please act out the following situation. You want to make an appointment with a doctor. Call the clinic, and ask the receptionist three or four questions to find out more information about seeing the doctor. Then, schedule a time to visit.","qko":"병원에 전화해 접수 직원에게 진료에 관한 질문 3~4개를 하고 방문 시간을 예약하세요.","title":"병원에 전화해 접수 직원에게 진료에 관한 질문 3~4개를 하고 방문 시간을 예약하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q11","family":"rp-doctor","cue":"목 아픔 → 시간·의사·준비·비용 → 예약","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I have had a sore throat for two days, and I would like to see a doctor rather than wait longer.","ko":"이틀째 목이 아파 더 기다리지 않고 진료를 받고 싶어요.","shared":true},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Do you have an appointment available tomorrow afternoon?","ko":"내일 오후에 예약 가능한 시간이 있나요?","shared":true},{"en":"Which doctor could I see for these symptoms?","ko":"이 증상으로 어느 선생님께 진료받을 수 있나요?","shared":true},{"en":"What documents should I bring for my first visit?","ko":"첫 방문 때 어떤 서류를 가져가야 하나요?","shared":true},{"en":"How much is the consultation before any additional tests?","ko":"추가 검사 전 진료비는 얼마인가요?","shared":true},{"en":"Tomorrow at three works for me. Please book that appointment under the name Kim. I will arrive a little early. Thank you.","ko":"내일 3시면 괜찮아요. 김이라는 이름으로 예약해 주세요. 조금 일찍 도착할게요. 감사합니다.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H2_11","label":"해커스 오픽 매뉴얼 · 사진 2 · Q11"}],"correction":"","scope":"역할극","requirements":["병원에 전화해 접수 직원에게 진료에 관한 질문 3~4개를 하고 방문 시간을 예약하세요."],"words":95,"representative":"M265_11","additional":0,"sharedCount":8,"related":["M265_11","M326_11"],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H2_12","source":"photo","set":2,"number":12,"topic":"병원","q":"I'm sorry, but there is a situation that needs your attention. On the day of your doctor's appointment, something comes up that stops you from being able to go. Call the doctor, and describe the issue. Then, give two or three suggestions to resolve the issue.","qko":"진료 예약 당일 일이 생겨 갈 수 없습니다. 병원에 전화해 문제를 설명하고 해결책 2~3개를 제시하세요.","title":"진료 예약 당일 일이 생겨 갈 수 없습니다. 병원에 전화해 문제를 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q12","family":"rp-reschedule","cue":"오늘 못 감 → 내일·모레 → 변경비·확인","lines":[{"en":"Hello, I have an appointment today at three under the name Kim.","ko":"안녕하세요. 오늘 3시에 김이라는 이름으로 예약돼 있어요.","shared":true},{"en":"An urgent family matter has come up, so I won't be able to arrive on time.","ko":"급한 가족 일이 생겨 제시간에 갈 수 없어요.","shared":true},{"en":"I am sorry for the short notice, and I would like to reschedule rather than miss it without calling.","ko":"갑자기 알려드려 죄송하고 연락 없이 빠지기보다 예약을 바꾸고 싶어요.","shared":true},{"en":"Could I move the appointment to tomorrow afternoon instead?","ko":"내일 오후로 옮길 수 있을까요?","shared":true},{"en":"If tomorrow is full, would the morning after that be available?","ko":"내일이 다 찼다면 모레 아침은 가능할까요?","shared":true},{"en":"Is there a fee for changing it this late?","ko":"이렇게 늦게 변경하면 수수료가 있나요?","shared":true},{"en":"Please confirm the new date and time by text once it is arranged.","ko":"정해지면 새 날짜와 시간을 문자로 확인해 주세요.","shared":true},{"en":"Thank you for helping me find another time.","ko":"다른 시간을 잡도록 도와주셔서 감사합니다.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H2_12","label":"해커스 오픽 매뉴얼 · 사진 2 · Q12"}],"correction":"","scope":"역할극","requirements":["진료 예약 당일 일이 생겨 갈 수 없습니다.","병원에 전화해 문제를 설명하고 해결책 2~3개를 제시하세요."],"words":97,"representative":"M266_12","additional":0,"sharedCount":8,"related":["M266_12","M327_12"],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H2_13","source":"photo","set":2,"number":13,"topic":"약속","q":"This is the end of the situation. Have you ever missed or been late for an important meeting or appointment before? What caused this, and how did you handle it? Give as many details about the situation as possible.","qko":"중요한 모임이나 약속에 못 가거나 늦은 경험, 원인, 대처를 자세히 말하세요.","title":"중요한 모임이나 약속에 못 가거나 늦은 경험, 원인, 대처를 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q13","family":"late","cue":"지난달 약속 → 버스 지연 → 연락 → 지하철 → 사과","lines":[{"en":"Last month, I was late for an important lunch with Min because my bus got stuck in traffic.","ko":"지난달 버스가 교통 체증에 갇혀 민이와의 중요한 점심 약속에 늦었어요.","shared":true},{"en":"We were meeting to plan our next trip, and I had brought the information we needed.","ko":"다음 여행을 계획하는 자리여서 필요한 자료도 제가 가져가고 있었어요.","shared":true},{"en":"At first, I hoped the traffic would clear, but the bus barely moved.","ko":"처음에는 길이 뚫리길 바랐지만 버스가 거의 움직이지 않았어요.","shared":true},{"en":"I called Min, apologized, and gave him an updated arrival time.","ko":"민이에게 전화해 사과하고 바뀐 도착 시간을 알려줬어요.","shared":true},{"en":"At the next stop, I got off and changed to the subway.","ko":"다음 정류장에서 내려 지하철로 갈아탔어요.","shared":true},{"en":"I arrived about twenty minutes late, and he was waiting inside the cafe.","ko":"20분쯤 늦게 도착했고 친구는 카페 안에서 기다리고 있었어요.","shared":true},{"en":"I thanked him for waiting, and we still had enough time to finish our plan.","ko":"기다려줘서 고맙다고 했고 계획을 마칠 시간은 충분했어요.","shared":true},{"en":"Since then, I have allowed extra time when an appointment really matters.","ko":"그 뒤로 중요한 약속에는 여유 시간을 더 잡아요.","shared":true}],"note":"","sources":[{"id":"H2_13","label":"해커스 오픽 매뉴얼 · 사진 2 · Q13"}],"correction":"","scope":"돌발·확장","requirements":["중요한 모임이나 약속에 못 가거나 늦은 경험, 원인, 대처를 자세히 말하세요."],"words":110,"representative":"M178_3","additional":0,"sharedCount":8,"related":["M178_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H2_14","source":"photo","set":2,"number":14,"topic":"동네","q":"Tell me about where you live. Has the neighborhood changed since you were a child? Do the houses or apartments look different from then? Describe some changes that you have noticed in your neighborhood.","qko":"사는 동네와 어린 시절 이후의 변화를 말하세요. 집이나 아파트의 모습 등 관찰한 변화를 설명하세요.","title":"사는 동네와 어린 시절 이후의 변화를 말하세요. 집이나 아파트의 모습 등 관찰한 변화를 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q14","family":"neighborhood-change","cue":"10년 전 낮은 건물 → 아파트·역 → 편리하지만 혼잡","lines":[{"en":"My neighborhood has changed a lot over the past ten years.","ko":"우리 동네는 지난 10년 동안 많이 달라졌어요.","shared":true},{"en":"When I was younger, there were more small houses and only a few local shops.","ko":"제가 어렸을 때는 작은 주택이 더 많았고 동네 가게가 몇 개뿐이었어요.","shared":true},{"en":"Some of those houses have been replaced by taller apartment buildings.","ko":"그 주택 중 일부는 더 높은 아파트로 바뀌었어요.","shared":true},{"en":"The streets look brighter now because the sidewalks and streetlights have been improved.","ko":"보도와 가로등이 개선돼 지금은 거리가 더 밝아 보여요.","shared":true},{"en":"There are more cafes, and public transportation is easier to use.","ko":"카페가 늘었고 대중교통도 이용하기 편해졌어요.","shared":true},{"en":"I like being able to walk to most places instead of asking someone for a ride.","ko":"누군가에게 태워 달라고 하지 않고 대부분 걸어갈 수 있어서 좋아요.","shared":true},{"en":"However, there is more traffic around the main road, especially in the evening.","ko":"하지만 특히 저녁에는 큰길 주변 교통량이 늘었어요.","shared":true},{"en":"Overall, it is more convenient, although I miss how quiet it used to be.","ko":"전반적으로 편해졌지만 예전의 조용한 분위기는 그리워요.","shared":true}],"note":"","sources":[{"id":"H2_14","label":"해커스 오픽 매뉴얼 · 사진 2 · Q14"}],"correction":"","scope":"돌발·확장","requirements":["사는 동네와 어린 시절 이후의 변화를 말하세요.","집이나 아파트의 모습 등 관찰한 변화를 설명하세요."],"words":104,"representative":"M038_4","additional":0,"sharedCount":8,"related":["M038_4"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H2_15","source":"photo","set":2,"number":15,"topic":"동네","q":"What are some issues in your neighborhood? What caused them and what impact have they had on the community? Give as many details about the situation as you can.","qko":"동네의 문제들, 원인과 지역사회에 미친 영향을 자세히 설명하세요.","title":"동네의 문제들, 원인과 지역사회에 미친 영향을 자세히 설명하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 2 · Q15","family":"community-issue","cue":"모임 소음·주차 → 주민 불편 → 시간·교통 안내","lines":[{"en":"Two issues in my neighborhood are noise and parking when there are large gatherings.","ko":"우리 동네 문제 두 가지는 큰 모임이 있을 때의 소음과 주차예요.","shared":true},{"en":"Visitors sometimes arrive at the same time and fill the spaces near apartment entrances.","ko":"방문객이 동시에 와서 아파트 입구 근처 공간을 채우기도 해요.","shared":true},{"en":"Music or conversations can also continue late into the evening.","ko":"음악이나 대화가 늦은 저녁까지 이어지기도 해요.","shared":true},{"en":"This makes it harder for residents to rest or get through narrow streets.","ko":"주민이 쉬거나 좁은 길을 통과하기 어려워져요.","shared":true},{"en":"Families with young children or early morning plans may feel the disturbance most.","ko":"어린아이를 키우거나 아침 일찍 일정이 있는 가정은 더 불편할 수 있어요.","shared":true},{"en":"Organizers could set a clear finishing time and tell guests where to park or how to use public transport.","ko":"주최자는 종료 시간을 정하고 주차 장소나 대중교통 이용법을 알릴 수 있어요.","shared":true},{"en":"I don't think people should stop celebrating; they just need to consider the people who live nearby.","ko":"축하를 멈추기보다 근처에 사는 사람을 배려하면 된다고 생각해요.","shared":true}],"note":"","sources":[{"id":"H2_15","label":"해커스 오픽 매뉴얼 · 사진 2 · Q15"}],"correction":"","scope":"돌발·확장","requirements":["동네의 문제들, 원인과 지역사회에 미친 영향을 자세히 설명하세요."],"words":100,"representative":"M313_15","additional":0,"sharedCount":7,"related":["M313_15"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_02","source":"photo","set":3,"number":2,"topic":"집휴가","q":"Tell me about the people you like to see and spend time with on vacation. Who do you spend time with, and what do you do together? Give as many details as you can.","qko":"휴가 중 만나 함께 시간을 보내는 사람들과 함께 하는 활동을 자세히 말하세요.","title":"휴가 중 만나 함께 시간을 보내는 사람들과 함께 하는 활동을 자세히 말하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q02","family":"stay","cue":"늦은 아침 → 음악·요리 → 민 방문 → 쉬는 속도","lines":[{"en":"During a vacation at home, I slow down and avoid making a tight schedule.","ko":"집에서 휴가를 보내면 여유를 갖고 빡빡한 계획을 세우지 않아요.","shared":true},{"en":"I sleep a little later, make a simple breakfast, and listen to music.","ko":"조금 늦게 일어나 간단한 아침을 만들고 음악을 들어요.","shared":true},{"en":"In the afternoon, I watch a film or try cooking something new.","ko":"오후에는 영화를 보거나 새로운 요리를 해봐요.","shared":true},{"en":"My friend Min sometimes visits, and we cook lunch and talk for hours.","ko":"가끔 친구 민이가 와서 점심을 만들고 몇 시간씩 이야기해요.","shared":true},{"en":"I live alone, so having a friend over makes the day feel special.","ko":"혼자 살아서 친구가 오면 그날이 특별하게 느껴져요.","shared":true},{"en":"I prefer this for short breaks because I don't have to pack or pay for a hotel.","ko":"짐을 싸거나 호텔비를 낼 필요가 없어 짧은 휴가에는 이 방식이 좋아요.","shared":true},{"en":"I still enjoy traveling, but staying home lets me rest at my own pace.","ko":"여행도 좋아하지만 집에서는 제 속도로 쉴 수 있어요.","shared":true},{"en":"By the end of the break, I usually feel refreshed rather than tired from moving around.","ko":"휴가가 끝나면 이동하느라 지치기보다 기운을 되찾은 느낌이에요.","shared":true}],"note":"","sources":[{"id":"H3_02","label":"해커스 오픽 매뉴얼 · 사진 3 · Q02"}],"correction":"","scope":"설문 중심","requirements":["휴가 중 만나 함께 시간을 보내는 사람들과 함께 하는 활동을 자세히 말하세요."],"words":112,"representative":"M040_1","additional":0,"sharedCount":8,"related":["M040_1","M042_2","H5_14"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_03","source":"photo","set":3,"number":3,"topic":"집휴가","q":"Give specific examples of things you did while on your last vacation at home. Describe everything you did from the start to the end of the vacation. What activities did you do? Who did you see?","qko":"최근 집에서 보낸 휴가의 시작부터 끝까지 구체적 활동과 만난 사람을 설명하세요.","title":"최근 집에서 보낸 휴가의 시작부터 끝까지 구체적 활동과 만난 사람을 설명하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q03","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true}],"note":"","sources":[{"id":"H3_03","label":"해커스 오픽 매뉴얼 · 사진 3 · Q03"}],"correction":"","scope":"설문 중심","requirements":["최근 집에서 보낸 휴가의 시작부터 끝까지 구체적 활동과 만난 사람을 설명하세요."],"words":104,"representative":"M044_3","additional":0,"sharedCount":8,"related":["M044_3","M123_2","M125_3","M276_13","H3_04"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H3_04","source":"photo","set":3,"number":4,"topic":"집휴가","q":"Describe a memorable vacation you had at home. When was it? What did you do during it? Who did you see? Why was it special?","qko":"기억에 남는 집 휴가의 시점, 활동, 만난 사람, 특별한 이유를 말하세요.","title":"기억에 남는 집 휴가의 시점, 활동, 만난 사람, 특별한 이유를 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q04","family":"stay-event","cue":"지난여름 주말 → 민과 파스타 → 태움 → 함께 웃음","lines":[{"en":"My last vacation at home was a quiet weekend last summer.","ko":"최근 집에서 보낸 휴가는 지난여름의 조용한 주말이었어요.","shared":true},{"en":"On Saturday morning, I cleaned the apartment and bought ingredients for lunch.","ko":"토요일 아침에 집을 청소하고 점심 재료를 샀어요.","shared":true},{"en":"My friend Min came over, and we tried making pasta together.","ko":"친구 민이가 와서 함께 파스타를 만들었어요.","shared":true},{"en":"We were talking so much that we burned the garlic in the pan.","ko":"이야기에 빠져서 팬에 있던 마늘을 태웠어요.","shared":true},{"en":"At first, I was embarrassed, but Min laughed and helped me start again.","ko":"처음에는 민망했지만 민이가 웃으며 다시 만드는 걸 도와줬어요.","shared":true},{"en":"We cleaned the pan, lowered the heat, and made a much better sauce.","ko":"팬을 닦고 불을 낮춰 훨씬 맛있는 소스를 만들었어요.","shared":true},{"en":"After lunch, we watched a comedy, and I spent Sunday resting and listening to music.","ko":"점심 후 코미디를 봤고 일요일에는 쉬면서 음악을 들었어요.","shared":true},{"en":"The weekend was special because a small mistake turned into a funny memory with a friend.","ko":"작은 실수가 친구와의 재미있는 추억이 돼 특별한 주말이었어요.","shared":true}],"note":"","sources":[{"id":"H3_04","label":"해커스 오픽 매뉴얼 · 사진 3 · Q04"}],"correction":"","scope":"설문 중심","requirements":["기억에 남는 집 휴가의 시점, 활동, 만난 사람, 특별한 이유를 말하세요."],"words":104,"representative":"M044_3","additional":0,"sharedCount":8,"related":["M044_3","M123_2","M125_3","M276_13","H3_03"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_05","source":"photo","set":3,"number":5,"topic":"해변","q":"In your background survey, you mentioned that you enjoy visiting beaches. What is your favorite beach and why? Where is it? What does it look like? Give me as many details as possible.","qko":"좋아하는 해변의 이름, 이유, 위치와 모습을 자세히 말하세요.","title":"좋아하는 해변의 이름, 이유, 위치와 모습을 자세히 말하세요.","type":"묘사","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q05","family":"travel-place","cue":"강릉 경포 → 모래·소나무 → 바다 선호 → 휴식","lines":[{"en":"My favorite domestic destination is Gangneung on Korea's east coast.","ko":"제가 좋아하는 국내 여행지는 한국 동해안의 강릉이에요.","shared":true},{"en":"I especially like Gyeongpo Beach, with its long sandy shore and pine trees nearby.","ko":"특히 긴 모래 해변과 근처 소나무가 있는 경포해변을 좋아해요.","shared":true},{"en":"The water looks bright blue on a clear day, and the open view feels refreshing.","ko":"맑은 날에는 바다가 밝은 파란색이고 탁 트인 풍경이 시원해요.","shared":true},{"en":"I prefer beaches to mountains because I can walk slowly without a difficult climb.","ko":"힘들게 오르지 않고 천천히 걸을 수 있어 산보다 해변이 좋아요.","shared":true},{"en":"I also enjoy visiting small cafes and trying local food in the city.","ko":"시내의 작은 카페에 가고 지역 음식을 먹는 것도 좋아해요.","shared":true},{"en":"Domestic trips are convenient because I can travel by train and communicate easily.","ko":"기차로 갈 수 있고 말도 편하게 통하니 국내여행은 편리해요.","shared":true},{"en":"Even a short visit gives me a clear break from my usual surroundings.","ko":"잠깐 다녀와도 평소 환경에서 확실히 벗어난 기분이 들어요.","shared":true},{"en":"That is why I keep choosing the coast when I need to recharge.","ko":"그래서 기운을 되찾고 싶을 때 바닷가를 계속 골라요.","shared":true}],"note":"","sources":[{"id":"H3_05","label":"해커스 오픽 매뉴얼 · 사진 3 · Q05"}],"correction":"","scope":"설문 중심","requirements":["좋아하는 해변의 이름, 이유, 위치와 모습을 자세히 말하세요."],"words":105,"representative":"M107_1","additional":0,"sharedCount":8,"related":["M107_1","H1_05","H6_06"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_06","source":"photo","set":3,"number":6,"topic":"해변","q":"Tell me about your last trip to the beach. Which beach did you go to? Did you go by yourself or with someone else? What was your day like?","qko":"최근 해변 방문의 장소, 혼자였는지 동행이 있었는지, 하루 동안 한 일을 말하세요.","title":"최근 해변 방문의 장소, 혼자였는지 동행이 있었는지, 하루 동안 한 일을 말하세요.","type":"최근 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q06","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H3_06","label":"해커스 오픽 매뉴얼 · 사진 3 · Q06"}],"correction":"","scope":"설문 중심","requirements":["최근 해변 방문의 장소, 혼자였는지 동행이 있었는지, 하루 동안 한 일을 말하세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","M216_3","H1_07","H3_07","H5_07","H6_07"],"contrast":"평소 습관이나 가장 특별했던 과거 사건이 아니라 가장 최근의 한 번을 답합니다."},{"id":"H3_07","source":"photo","set":3,"number":7,"topic":"해변","q":"Have you ever had a scary or memorable experience while at the beach? For example, did you get stuck in bad weather or encounter something that stopped you from having fun? Tell me about the experience from beginning to end.","qko":"해변에서 무섭거나 기억에 남는 경험이 있나요? 악천후나 방해가 된 일 등을 처음부터 끝까지 말하세요.","title":"해변에서 무섭거나 기억에 남는 경험이 있나요? 악천후나 방해가 된 일 등을 처음부터 끝까지 말하세요.","type":"처음·계기","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q07","family":"beach-rain","cue":"지난여름 강릉 → 민 → 바다 산책 → 폭우 → 카페","lines":[{"en":"Last summer, Min and I took a short trip to Gyeongpo Beach in Gangneung.","ko":"지난여름 민이와 강릉 경포해변으로 짧게 여행을 갔어요.","shared":true},{"en":"We arrived by train, left our bags at the hotel, and walked along the beach.","ko":"기차로 도착해 호텔에 짐을 두고 해변을 걸었어요.","shared":true},{"en":"The sky was clear at first, and we took pictures of the sea and the pine trees.","ko":"처음에는 하늘이 맑아 바다와 소나무 사진을 찍었어요.","shared":true},{"en":"Then the wind suddenly became strong, and heavy rain started.","ko":"그러다 갑자기 바람이 강해지고 폭우가 쏟아졌어요.","shared":true},{"en":"I felt nervous, so we moved away from the water and went into a cafe across the road.","ko":"불안해서 물가에서 벗어나 길 건너 카페로 들어갔어요.","shared":true},{"en":"We checked the forecast and decided to cancel our beach picnic.","ko":"예보를 확인하고 해변 피크닉을 취소하기로 했어요.","shared":true},{"en":"Instead, we had warm drinks and watched the rain from inside.","ko":"대신 따뜻한 음료를 마시며 안에서 비를 구경했어요.","shared":true},{"en":"Later, we ate dinner near the hotel and returned safely without going back into the bad weather.","ko":"나중에는 호텔 근처에서 저녁을 먹고 악천후 속으로 다시 나가지 않고 안전하게 돌아갔어요.","shared":true},{"en":"The trip stayed with me because changing our plan kept us safe and still gave us a good day together.","ko":"계획을 바꿔 안전하게 함께 즐거운 하루를 보내서 기억에 남아요.","shared":true}],"note":"","sources":[{"id":"H3_07","label":"해커스 오픽 매뉴얼 · 사진 3 · Q07"}],"correction":"","scope":"설문 중심","requirements":["해변에서 무섭거나 기억에 남는 경험이 있나요?","악천후나 방해가 된 일 등을 처음부터 끝까지 말하세요."],"words":133,"representative":"M113_3","additional":0,"sharedCount":9,"related":["M113_3","M208_3","M216_3","H1_07","H3_06","H5_07","H6_07"],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"H3_08","source":"photo","set":3,"number":8,"topic":"인터넷","q":"What is a website you use often? What do people use it for, and what do you do on it? What made you begin visiting this site? Give details.","qko":"자주 쓰는 웹사이트, 사람들의 이용 목적, 본인의 활동과 이용 계기를 설명하세요.","title":"자주 쓰는 웹사이트, 사람들의 이용 목적, 본인의 활동과 이용 계기를 설명하세요.","type":"습관·활동 + 처음·계기","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q08","family":"website","cue":"유튜브 → 매일 → 요리·영어 → 친구 추천","lines":[{"en":"The website I use most often is YouTube, usually once a day.","ko":"가장 자주 쓰는 웹사이트는 유튜브이고 보통 하루 한 번 봐요.","shared":true},{"en":"People use it for entertainment, music, news, and learning new skills.","ko":"사람들은 오락, 음악, 뉴스, 새로운 기술 학습에 이용해요.","shared":true},{"en":"I mainly watch simple cooking videos and short English lessons.","ko":"저는 주로 간단한 요리 영상과 짧은 영어 강의를 봐요.","shared":true},{"en":"I first started using it regularly when Min sent me a pasta recipe.","ko":"민이가 파스타 조리법을 보내줘서 처음 규칙적으로 이용하기 시작했어요.","shared":true},{"en":"It was much easier to understand the steps when I could actually see them.","ko":"과정을 실제로 볼 수 있어서 훨씬 이해하기 쉬웠어요.","shared":true},{"en":"Now I save useful videos in playlists so I can find them again.","ko":"지금은 유용한 영상을 재생목록에 저장해서 다시 찾아봐요.","shared":true},{"en":"I like being able to pause or replay a part instead of keeping up with a live lesson.","ko":"실시간 수업을 따라가기보다 멈추거나 다시 볼 수 있어서 좋아요.","shared":true},{"en":"I set a rough time limit, though, because one video can easily lead to ten more.","ko":"다만 영상 하나가 열 개로 이어지기 쉬워 대략적인 시간 제한을 둬요.","shared":true}],"note":"","sources":[{"id":"H3_08","label":"해커스 오픽 매뉴얼 · 사진 3 · Q08"}],"correction":"","scope":"돌발·확장","requirements":["자주 쓰는 웹사이트, 사람들의 이용 목적, 본인의 활동과 이용 계기를 설명하세요."],"words":107,"representative":"M156_1","additional":0,"sharedCount":8,"related":["M156_1"],"contrast":"최근 경험과 구분해 시작 시점·계기·이후 변화를 연결합니다."},{"id":"H3_09","source":"photo","set":3,"number":9,"topic":"인터넷","q":"What are some changes to the Internet that you notice since you first started using it? How have websites changed? Tell me about the changes in detail.","qko":"인터넷을 처음 쓴 이후 인터넷과 웹사이트가 어떻게 달라졌는지 자세히 말하세요.","title":"인터넷을 처음 쓴 이후 인터넷과 웹사이트가 어떻게 달라졌는지 자세히 말하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q09","family":"tech-change","cue":"예전 컴퓨터·문자 → 스마트폰·영상 → 편리·주의분산","lines":[{"en":"The biggest change I notice is that many separate tools now fit into one phone.","ko":"가장 크게 느끼는 변화는 여러 도구가 이제 휴대폰 하나에 들어간다는 거예요.","shared":true},{"en":"When I was younger, I used a desktop computer for the Internet and a basic phone for calls.","ko":"어릴 때는 인터넷은 데스크톱, 통화는 기본 휴대폰으로 했어요.","shared":true},{"en":"Websites mainly showed text and small pictures, and some pages loaded slowly.","ko":"웹사이트에는 주로 글과 작은 사진이 있었고 느리게 열리는 페이지도 있었어요.","shared":true},{"en":"Now I can watch videos, book a room, and join a video call while I am outside.","ko":"이제는 밖에서도 영상을 보고 숙소를 예약하고 영상 통화를 해요.","shared":true},{"en":"Websites also work on smaller screens and offer more interactive services.","ko":"웹사이트는 작은 화면에서도 작동하고 상호작용하는 서비스도 늘었어요.","shared":true},{"en":"This makes daily tasks faster, especially when I need directions right away.","ko":"특히 바로 길 안내가 필요할 때 일상적인 일을 더 빨리 할 수 있어요.","shared":true},{"en":"On the other hand, constant notifications can interrupt whatever I am doing.","ko":"반면 계속 오는 알림은 하던 일을 방해할 수 있어요.","shared":true},{"en":"I appreciate the convenience, but I try to control the time I spend online.","ko":"편리함은 좋지만 온라인에서 보내는 시간을 조절하려 해요.","shared":true}],"note":"","sources":[{"id":"H3_09","label":"해커스 오픽 매뉴얼 · 사진 3 · Q09"}],"correction":"","scope":"돌발·확장","requirements":["인터넷을 처음 쓴 이후 인터넷과 웹사이트가 어떻게 달라졌는지 자세히 말하세요."],"words":111,"representative":"M154_3","additional":0,"sharedCount":8,"related":["M154_3"],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H3_10","source":"photo","set":3,"number":10,"topic":"인터넷","q":"Reflect on something you had to work on that required a lot of research on the Internet. What was the project? When did you work on it? How did you use the Internet to complete the project?","qko":"인터넷 조사가 많이 필요했던 작업의 내용·시점과 인터넷을 활용해 완성한 방법을 말하세요.","title":"인터넷 조사가 많이 필요했던 작업의 내용·시점과 인터넷을 활용해 완성한 방법을 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q10","family":"research","cue":"작년 오사카 일정 → 후기·지도 → 표 → 동선","lines":[{"en":"Last fall, I used the Internet to plan a three-day trip to Osaka with Min.","ko":"지난가을 인터넷으로 민이와 갈 사흘간의 오사카 여행을 계획했어요.","shared":false},{"en":"It was a personal project because I wanted to fit everything into a small budget.","ko":"적은 예산 안에서 준비하고 싶어서 개인적으로 진행한 작업이었어요.","shared":false},{"en":"First, I compared train routes and hotel locations on maps.","ko":"먼저 지도로 기차 경로와 호텔 위치를 비교했어요.","shared":false},{"en":"Then I read several reviews instead of trusting just one attractive photo.","ko":"그다음 멋진 사진 하나만 믿지 않고 여러 후기를 읽었어요.","shared":false},{"en":"I checked opening hours on the places' own websites and saved the addresses.","ko":"장소별 웹사이트에서 영업 시간을 확인하고 주소를 저장했어요.","shared":false},{"en":"I put the costs and travel times into a simple table.","ko":"비용과 이동 시간을 간단한 표에 정리했어요.","shared":false},{"en":"That helped us group nearby places together and avoid going back and forth.","ko":"덕분에 가까운 장소끼리 묶고 왔다 갔다 하는 일을 줄였어요.","shared":false},{"en":"By the time we left, we had a clear plan and a few backup options for rain.","ko":"출발할 때쯤에는 명확한 계획과 비가 올 때의 대안도 몇 개 준비됐어요.","shared":false}],"note":"","sources":[{"id":"H3_10","label":"해커스 오픽 매뉴얼 · 사진 3 · Q10"}],"correction":"","scope":"돌발·확장","requirements":["인터넷 조사가 많이 필요했던 작업의 내용·시점과 인터넷을 활용해 완성한 방법을 말하세요."],"words":106,"representative":"H3_10","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_11","source":"photo","set":3,"number":11,"topic":"휴대폰","q":"I'd like to give you a situation to act out. Pretend you are in a store shopping for a new cell phone. Ask the salesperson three or four questions in order to get more information about their products.","qko":"새 휴대폰을 사려는 매장 상황입니다. 판매원에게 제품 정보를 얻는 질문 3~4개를 하세요.","title":"새 휴대폰을 사려는 매장 상황입니다. 판매원에게 제품 정보를 얻는 질문 3~4개를 하세요.","type":"역할극 질문","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q11","family":"rp-phone-store","cue":"매장 새 폰 → 배터리·저장·가격·보증","lines":[{"en":"Hello, thanks for taking my call.","ko":"안녕하세요. 전화 받아주셔서 감사합니다.","shared":true},{"en":"I am looking for a new phone for photos, maps, and everyday calls, without spending too much.","ko":"너무 비싸지 않은 사진, 지도, 일상 통화용 새 휴대폰을 찾고 있어요.","shared":false},{"en":"I would like to check a few details before making a decision.","ko":"결정하기 전에 몇 가지를 확인하고 싶어요.","shared":true},{"en":"Which model has the best battery life in this price range?","ko":"이 가격대에서 어떤 모델의 배터리가 가장 오래가나요?","shared":false},{"en":"How much storage does this model have?","ko":"이 모델의 저장 용량은 얼마인가요?","shared":false},{"en":"What is the full price without a service contract?","ko":"통신 계약 없이 기기 전체 가격은 얼마인가요?","shared":false},{"en":"What does the warranty cover if something goes wrong?","ko":"문제가 생기면 보증은 무엇을 보장하나요?","shared":false},{"en":"Thank you. That helps me decide what to do next.","ko":"감사합니다. 다음에 어떻게 할지 결정하는 데 도움이 됐어요.","shared":true}],"note":"질문 4개를 실제 상대에게 말하는 연습입니다. 가상 상황 속 역할은 평소 인물 설정과 구분합니다.","sources":[{"id":"H3_11","label":"해커스 오픽 매뉴얼 · 사진 3 · Q11"}],"correction":"","scope":"역할극","requirements":["새 휴대폰을 사려는 매장 상황입니다.","판매원에게 제품 정보를 얻는 질문 3~4개를 하세요."],"words":81,"representative":"H3_11","additional":0,"sharedCount":3,"related":[],"contrast":"정보를 설명하는 독백이 아니라 상대에게 실제 질문을 합니다. 원문의 질문 수를 확인하세요."},{"id":"H3_12","source":"photo","set":3,"number":12,"topic":"휴대폰","q":"I'm sorry, but there is a problem I'd like you to solve. You received the phone that you purchased online but it is the wrong model. Call the store, tell them about the problem, and make two or three suggestions to solve the problem.","qko":"온라인으로 산 휴대폰이 다른 모델로 배송됐습니다. 매장에 전화해 설명하고 해결책 2~3개를 제시하세요.","title":"온라인으로 산 휴대폰이 다른 모델로 배송됐습니다. 매장에 전화해 설명하고 해결책 2~3개를 제시하세요.","type":"역할극 해결","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q12","family":"rp-wrongphone","cue":"모델 오류 → 미사용 증거 → 교환·환불","lines":[{"en":"Hello, I am calling about the phone delivered from your online store today.","ko":"안녕하세요. 오늘 온라인 매장에서 배송된 휴대폰 때문에 전화했어요.","shared":false},{"en":"The model on the box is different from the one on my order confirmation.","ko":"상자에 적힌 모델이 주문 확인서와 달라요.","shared":false},{"en":"I haven't activated it, and I have kept all the packaging.","ko":"개통하지 않았고 포장도 모두 보관했어요.","shared":false},{"en":"I can send photos and my order number so you can check the mistake.","ko":"오류를 확인하시도록 사진과 주문 번호를 보낼 수 있어요.","shared":false},{"en":"Could you collect this phone and send the correct model without an extra charge?","ko":"추가 비용 없이 이 폰을 수거하고 맞는 모델을 보내주실 수 있나요?","shared":false},{"en":"If it is out of stock, I would prefer a full refund so I can buy the phone elsewhere.","ko":"재고가 없다면 다른 곳에서 사도록 전액 환불을 받고 싶어요.","shared":false},{"en":"Please confirm the next steps and how long the process will take.","ko":"다음 절차와 소요 시간을 확인해 주세요.","shared":false},{"en":"Thank you for your help.","ko":"감사합니다.","shared":true}],"note":"문제·영향을 먼저 설명하고 실행 가능한 대안들을 제시합니다. 실제 상대에게 말하는 형태입니다.","sources":[{"id":"H3_12","label":"해커스 오픽 매뉴얼 · 사진 3 · Q12"}],"correction":"","scope":"역할극","requirements":["온라인으로 산 휴대폰이 다른 모델로 배송됐습니다.","매장에 전화해 설명하고 해결책 2~3개를 제시하세요."],"words":102,"representative":"H3_12","additional":0,"sharedCount":1,"related":[],"contrast":"과거 경험을 설명하지 말고 지금 상대에게 문제와 대안을 말합니다. 다음 13번 경험 질문과 구분하세요."},{"id":"H3_13","source":"photo","set":3,"number":13,"topic":"구매문제","q":"That's the end of the situation. Has something similar ever happened to you? Did you ever get the wrong product delivered? How did you resolve this issue? Please describe the experience in detail.","qko":"잘못된 제품이 배송된 유사 경험과 해결 과정을 자세히 말하세요.","title":"잘못된 제품이 배송된 유사 경험과 해결 과정을 자세히 말하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q13","family":"desk-problem","cue":"두 달 전 배송 → 다른 색·흔들림 → 사진 → 교환","lines":[{"en":"Two months ago, I ordered a small wooden desk online, but the wrong one arrived.","ko":"두 달 전에 작은 나무 책상을 온라인으로 주문했는데 다른 제품이 왔어요.","shared":true},{"en":"I had chosen a light brown desk, but the delivered one was dark and had a loose leg.","ko":"밝은 갈색을 골랐는데 온 것은 어둡고 다리도 헐거웠어요.","shared":true},{"en":"I stopped assembling it because I didn't want to make the problem worse.","ko":"문제를 키우고 싶지 않아 조립을 멈췄어요.","shared":true},{"en":"I took photos of the desk and the label and contacted the seller with my order number.","ko":"책상과 라벨 사진을 찍고 주문 번호와 함께 판매자에게 연락했어요.","shared":true},{"en":"The employee checked the details and confirmed a warehouse mistake.","ko":"직원이 확인하고 창고의 실수라고 했어요.","shared":true},{"en":"We arranged for them to collect it and deliver the correct desk three days later.","ko":"수거한 뒤 사흘 후 맞는 책상을 보내기로 했어요.","shared":true},{"en":"This time, I checked the color and tested the legs before putting my things on it.","ko":"이번에는 물건을 올리기 전에 색과 다리를 확인했어요.","shared":true},{"en":"The replacement was fine, and I was satisfied with how the seller handled the mistake.","ko":"교환품은 괜찮았고 판매자의 대응에도 만족했어요.","shared":true}],"note":"","sources":[{"id":"H3_13","label":"해커스 오픽 매뉴얼 · 사진 3 · Q13"}],"correction":"","scope":"돌발·확장","requirements":["잘못된 제품이 배송된 유사 경험과 해결 과정을 자세히 말하세요."],"words":119,"representative":"M234_3","additional":0,"sharedCount":8,"related":["M234_3","M252_13","M264_13","H2_07"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H3_14","source":"photo","set":3,"number":14,"topic":"영화","q":"Have movies changed from when you were younger? How are they different now? Please describe the differences in detail.","qko":"어릴 때와 비교해 영화가 어떻게 달라졌는지 자세히 설명하세요.","title":"어릴 때와 비교해 영화가 어떻게 달라졌는지 자세히 설명하세요.","type":"변화·비교","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q14","family":"movie-industry-change","cue":"예전 극장·물리효과 → 디지털·스트리밍 → 선택","lines":[{"en":"Movies seem more visually polished now than when I was younger.","ko":"어릴 때보다 지금 영화가 시각적으로 더 정교한 것 같아요.","shared":false},{"en":"I remember films relying more on physical sets and simpler effects.","ko":"예전에는 실제 세트와 단순한 효과에 더 의존했던 기억이 나요.","shared":false},{"en":"Now digital effects can create whole imaginary worlds with much more detail.","ko":"지금은 디지털 효과로 상상의 세계 전체를 더 세밀하게 만들 수 있어요.","shared":false},{"en":"The way we watch has changed too, because many films are available through streaming services.","ko":"스트리밍으로 볼 수 있는 영화가 많아져 감상 방식도 바뀌었어요.","shared":false},{"en":"In the past, my family mainly waited for a theater visit or a television broadcast.","ko":"예전에는 주로 극장에 가거나 TV에서 방영하길 기다렸어요.","shared":false},{"en":"Now I can choose a film at home and pause it if I need a break.","ko":"이제 집에서 영화를 고르고 쉬고 싶으면 멈출 수 있어요.","shared":false},{"en":"Still, better technology doesn't automatically create a better story.","ko":"그래도 기술이 좋아졌다고 이야기가 자동으로 좋아지는 건 아니에요.","shared":false},{"en":"I care most about characters I can understand, whatever tools the filmmakers use.","ko":"제작자가 어떤 도구를 쓰든 이해할 수 있는 인물이 가장 중요해요.","shared":false}],"note":"","sources":[{"id":"H3_14","label":"해커스 오픽 매뉴얼 · 사진 3 · Q14"}],"correction":"","scope":"돌발·확장","requirements":["어릴 때와 비교해 영화가 어떻게 달라졌는지 자세히 설명하세요."],"words":102,"representative":"H3_14","additional":0,"sharedCount":0,"related":[],"contrast":"대상을 하나만 설명하면 부족합니다. 두 대상 또는 과거·현재를 같은 기준으로 비교하세요."},{"id":"H3_15","source":"photo","set":3,"number":15,"topic":"영화","q":"I'd like to know about an issue or concern about the movie industry. In what ways does it impact people? What can be done about the problem?","qko":"영화 산업의 문제나 우려, 사람들에게 미치는 영향과 해결 방법을 말하세요.","title":"영화 산업의 문제나 우려, 사람들에게 미치는 영향과 해결 방법을 말하세요.","type":"뉴스·이슈","sourceLabel":"해커스 오픽 매뉴얼 · 사진 3 · Q15","family":"movie-issue","cue":"표값 부담 → 관객·작은 영화 → 할인·다양성","lines":[{"en":"One concern about the movie industry is the cost of going to a theater.","ko":"영화 산업과 관련한 우려 하나는 극장 관람 비용이에요.","shared":false},{"en":"When tickets and snacks feel expensive, people may save the visit for only a few big films.","ko":"표와 간식이 비싸게 느껴지면 큰 영화 몇 편만 보러 갈 수 있어요.","shared":false},{"en":"That can make it harder for smaller films to find an audience.","ko":"그러면 작은 영화가 관객을 만나기 어려워질 수 있어요.","shared":false},{"en":"Families may also choose to stay home because several tickets add up quickly.","ko":"가족은 표 여러 장의 비용이 금방 커져 집에서 보기로 할 수도 있어요.","shared":false},{"en":"Theaters could offer affordable weekday tickets and clear prices without confusing conditions.","ko":"극장은 평일의 저렴한 표와 복잡한 조건 없는 명확한 가격을 제공할 수 있어요.","shared":false},{"en":"They could also reserve some screenings for different kinds of smaller films.","ko":"다양한 작은 영화에도 일부 상영 시간을 배정할 수 있어요.","shared":false},{"en":"I think the goal should be making moviegoing accessible while still paying the people who make and show the films.","ko":"영화를 만들고 상영하는 사람에게 보상하면서도 관람을 쉽게 하는 게 목표여야 한다고 생각해요.","shared":false}],"note":"","sources":[{"id":"H3_15","label":"해커스 오픽 매뉴얼 · 사진 3 · Q15"}],"correction":"","scope":"돌발·확장","requirements":["영화 산업의 문제나 우려, 사람들에게 미치는 영향과 해결 방법을 말하세요."],"words":100,"representative":"H3_15","additional":0,"sharedCount":0,"related":[],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_02","source":"photo","set":4,"number":2,"topic":"집안일","q":"How are household tasks divided in your home now? What chores do you normally do? What tasks do your family members usually complete? How do you feel about this distribution? Is it fair?","qko":"현재 집안일 분담, 본인과 가족의 집안일, 분담에 대한 생각과 공정성을 말하세요.","title":"현재 집안일 분담, 본인과 가족의 집안일, 분담에 대한 생각과 공정성을 말하세요.","type":"습관·활동","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q02","family":"chores","cue":"현재 혼자 전부 → 예전 가족 분담 → 공정","lines":[{"en":"Since I live alone, I am responsible for all the chores in my apartment.","ko":"혼자 살아서 집안일을 모두 제가 맡아요.","shared":true},{"en":"I wash the dishes every day and do laundry and vacuuming on weekends.","ko":"매일 설거지하고 주말에 빨래와 청소기를 돌려요.","shared":true},{"en":"I also sort the recycling and take it to the collection area.","ko":"재활용품도 분류해 배출장에 가져가요.","shared":true},{"en":"When I lived with my parents, my mother usually cooked, my father cleaned the floors, and I washed the dishes.","ko":"부모님과 살 때는 보통 어머니가 요리하고 아버지가 바닥을 청소하고 저는 설거지했어요.","shared":true},{"en":"We changed jobs when someone was busy, so the division felt reasonably fair.","ko":"누군가 바쁘면 역할을 바꿔서 분담은 꽤 공정하다고 느꼈어요.","shared":true},{"en":"As a child, I only had to tidy my room, but now I manage the whole home.","ko":"어릴 때는 제 방만 정리하면 됐지만 지금은 집 전체를 관리해요.","shared":true},{"en":"It takes more effort, so I make a short weekly list instead of doing everything at once.","ko":"더 힘들어서 한꺼번에 하기보다 주간 목록을 짧게 만들어요.","shared":true},{"en":"Having my own place has made me appreciate how much work my parents used to do.","ko":"독립하고 나서 부모님이 얼마나 많은 일을 하셨는지 알게 됐어요.","shared":true}],"note":"가족 분담 질문에는 현재 혼자 산다는 점을 먼저 밝히고, 부모님과 살던 때의 분담을 구분합니다.","sources":[{"id":"H4_02","label":"해커스 오픽 매뉴얼 · 사진 4 · Q02"}],"correction":"","scope":"돌발·확장","requirements":["현재 집안일 분담, 본인과 가족의 집안일, 분담에 대한 생각과 공정성을 말하세요."],"words":122,"representative":"M218_1","additional":0,"sharedCount":8,"related":["M218_1","M220_2","H4_04"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_03","source":"photo","set":4,"number":3,"topic":"집안일","q":"Has something interesting or special ever happened while you were doing housework? When was it? What were you doing? Describe the experience in detail.","qko":"집안일 중 흥미롭거나 특별했던 경험의 시점과 당시 활동을 자세히 설명하세요.","title":"집안일 중 흥미롭거나 특별했던 경험의 시점과 당시 활동을 자세히 설명하세요.","type":"문제·기억 경험","sourceLabel":"해커스 오픽 매뉴얼 · 사진 4 · Q03","family":"chores-problem","cue":"지난달 빨래 → 세탁기 멈춤 → 기사 → 빨래방","lines":[{"en":"Last month, I couldn't finish my laundry because my washing machine stopped halfway through.","ko":"지난달 세탁기가 중간에 멈춰서 빨래를 끝내지 못했어요.","shared":true},{"en":"It was Saturday morning, and the clothes were still wet inside.","ko":"토요일 아침이었고 옷이 안에서 젖어 있었어요.","shared":true},{"en":"I felt frustrated because I needed some of them for the next day.","ko":"다음 날 필요한 옷도 있어서 답답했어요.","shared":true},{"en":"I checked the manual and called the service center rather than forcing the door open.","ko":"문을 억지로 열지 않고 설명서를 본 뒤 서비스센터에 전화했어요.","shared":true},{"en":"The staff explained how to drain the machine safely and arranged a repair visit.","ko":"직원이 안전하게 물을 빼는 방법을 알려주고 수리 방문을 잡아줬어요.","shared":true},{"en":"I took the wet clothes to a nearby laundry shop and finished washing them there.","ko":"젖은 옷은 근처 빨래방에서 마저 세탁했어요.","shared":true},{"en":"The machine was repaired the next day, and none of the clothes were damaged.","ko":"다음 날 세탁기를 고쳤고 옷은 상하지 않았어요.","shared":true},{"en":"It taught me to leave extra time for chores instead of always doing them at the last minute.","ko":"집안일을 늘 마지막에 하지 말고 여유를 두어야겠다고 느꼈어요.","shared":true}],"note":"","sources":[{"id":"H4_03","label":"해커스 오픽 매뉴얼 · 사진 4 · Q03"}],"correction":"","scope":"돌발·확장","requirements":["집안일 중 흥미롭거나 특별했던 경험의 시점과 당시 활동을 자세히 설명하세요."],"words":114,"representative":"M222_3","additional":0,"sharedCount":8,"related":["M222_3"],"contrast":"동일 소재라도 질문의 대상·시점·요구 행동을 확인하세요. 아래 관련 질문의 원문과 필수 요구를 비교할 수 있습니다."},{"id":"H4_04","source":"photo","set":4,"number":4,"topic":"집안일","q":"How have your duties at home changed from when you were little? What sort of things did you have to do then? What types of chores do you do now? Are they ver
